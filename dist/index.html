      <div style={{background:insufficientInput?(T.amberBg||"#fff7e6"):(allOK?T.greenBg:T.redBg),
        border:`2px solid ${insufficientInput?(T.amber||"#d97706"):(allOK?T.green:T.red)}`,
        borderRadius:14,padding:"14px 16px",marginBottom:12,display:"flex",alignItems:"center",
        justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,borderRadius:"50%",
            background:insufficientInput?(T.amber||"#d97706"):(allOK?T.green:T.red),
            color:T.white,display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:17,fontWeight:900,flexShrink:0}}>{insufficientInput?"!":(allOK?"✓":"✗")}</div>
          <div>
            <div style={{fontSize:14,fontWeight:900,
              color:insufficientInput?(T.amber||"#d97706"):(allOK?T.greenDk:T.redDk),fontFamily:font.sans}}>
              {insufficientInput
                ? `판정 보류 — 입력 부족(${(r.dataGaps||[]).join(", ")})으로 전체 적정성을 확정할 수 없습니다`
                : allOK
                ? "적정 — 이 사양은 API 520/521 기준을 모두 충족합니다"
                : `부적정 — 기준 미충족 항목이 있어 조치가 필요합니다 (${failCount}건)`}
            </div>
            <div style={{fontSize:10,color:T.sub,fontFamily:font.sans,marginTop:3}}>
              아래 "✅ PSM 체크" 탭에서 항목별 근거를 확인하세요
            </div>
          </div>
        </div>
        <button onClick={handleExportPDF}
          disabled={!pkgValid.ok || !pkgIdentityMatch}
          title={(!pkgValid.ok || !pkgIdentityMatch) ? "리포트 데이터 무결성 확인 중..." : "PDF 리포트 다운로드"}
          style={{padding:"10px 16px",background:(pkgValid.ok&&pkgIdentityMatch)?T.navy:T.gray,
            color:T.white,border:"none",borderRadius:10,fontSize:12,fontWeight:900,
            fontFamily:font.mono,cursor:(pkgValid.ok&&pkgIdentityMatch)?"pointer":"not-allowed",
            boxShadow:(pkgValid.ok&&pkgIdentityMatch)?`0 3px 0 ${T.navyMid}`:"none",
            whiteSpace:"nowrap"}}>
          📄 PDF 리포트 다운로드
        </button>
      </div>

      {/* 리포트 탭 */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {TAB("sim","📊 시뮬레이션")}
        {TAB("evidence","🧮 계산 근거")}
        {TAB("checklist","✅ PSM 체크")}
        {TAB("audit", (snap.workflow === "APPROVED" || snap.workflow === "CLOSED")
          ? "✓ 승인 기록" : "🔍 검토 근거")}
      </div>

      {reportTab === "sim" && (
        <div>
          <div style={{background:T.cardBg,borderRadius:14,padding:12,marginBottom:10,border:`1px solid ${T.border}`}}>
            <PipeFlowRenderer snap={snap} sim={sim}/>
          </div>
          <div style={{background:T.cardBg,borderRadius:14,padding:12,marginBottom:10,border:`1px solid ${T.border}`}}>
            <PressChartRenderer hist={hist} snap={snap}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            {simMode === "RUNNING"
              ? <button onClick={()=>setSimMode("IDLE")} style={{flex:1,padding:"11px",background:T.orange,color:T.white,border:"none",borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer",boxShadow:`0 4px 0 #CC7000`}}>⏸ 정지</button>
              : <button onClick={()=>setSimMode("RUNNING")} style={{flex:1,padding:"11px",background:T.blue,color:T.white,border:"none",borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer",boxShadow:`0 4px 0 ${T.blueDk}`}}>▶ 시뮬 시작</button>
            }
            <button onClick={resetSim} style={{padding:"11px 16px",background:T.bg,color:T.sub,border:`1px solid ${T.border}`,borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>↺ 초기화</button>
          </div>
        </div>
      )}

      {reportTab === "evidence" && (
        <div>
          {snap.evidence.map(step => <EvidenceCard key={step.id} step={step}/>)}
        </div>
      )}

      {reportTab === "checklist" && (
        <div style={{background:T.cardBg,borderRadius:14,padding:14,border:`1px solid ${T.border}`}}>
          <ChecklistRenderer checklist={snap.result.checklist} backpress={snap.result.stepData?.backpress} accumulation={snap.result.stepData?.accumulation} inletLoss={snap.result.stepData?.inletLoss} dataGaps={snap.result.dataGaps}/>
        </div>
      )}

      {reportTab === "audit" && (
        <AuditEvidence snapshot={snap} approvals={approvals} verifiedResults={verifiedResults} />
      )}

      {/* Workflow 전환 — REVIEW는 전자서명(ApprovalForm)을 거쳐야 함 */}
      {snap.workflow === "REVIEW" ? (
        <ApprovalForm snap={snap} onSubmit={onApprovalSubmit} />
      ) : (
        nextStates.length > 0 && (
          <WorkflowTransition
            currentState={snap.workflow}
            nextStates={nextStates}
            onAdvance={onWorkflowAdvance}
          />
        )
      )}

      <ApprovalHistory approvals={approvals} verifiedResults={verifiedResults} />

      {showUpgradeModal && (
        <div onClick={()=>setShowUpgradeModal(false)}
          style={{position:"fixed",inset:0,background:"rgba(15,23,42,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:T.white,borderRadius:14,maxWidth:420,width:"100%",padding:24}}>
            <h2 style={{margin:"0 0 12px",fontSize:16,fontWeight:900,color:T.navy,fontFamily:font.mono}}>🔒 PDF 리포트는 Pro 기능입니다</h2>
            <p style={{color:T.sub,fontSize:13,marginBottom:16,lineHeight:1.5}}>MOC 이력·전자서명 검증 결과가 포함된 정식 PDF 리포트는 Pro 플랜에서 제공됩니다. 아래 버튼으로 전환을 신청하시면 확인 후 안내드립니다.</p>
            <button onClick={requestUpgrade}
              style={{width:"100%",padding:12,border:"none",borderRadius:8,background:T.navyLight,color:T.white,fontWeight:700,fontSize:13,cursor:"pointer"}}>
              Pro 전환 신청하기
            </button>
            <p style={{marginTop:10,fontSize:11,color:T.sub}}>{upgradeStatus}</p>
          </div>
        </div>
      )}
    </div>
  );
}


// ── components/CaseView.jsx ──────────────────────────
//  CASE VIEW
// ════════════════════════════════════════════════════════════════

// ── RELIEF LOAD — MVP 대상 4개 시나리오 메타(라벨 + 계산 함수 매핑) ──
// C-4.9 범위: §5.1/§5.6/§5.7/§5.8만. §5.11/§5.12/§5.13은 governing
// 후보가 아니거나(§5.11/§5.13) UI 복잡도가 높아(§5.12) 이번 단계에서
// 제외 — relief_load.js의 계산 함수 자체는 이미 구현되어 있으나
// 이 UI에서 호출하지 않는다.
const RELIEF_LOAD_SCENARIO_META = {
  OUTLET_BLOCKED:     { label: "출구 차단",           section: "§5.1", calc: calculateOutletBlockedScenario },
  OVERFILLING:         { label: "과충전",               section: "§5.6", calc: calculateOverfillingScenario },
  CONTROL_VALVE_FAIL:  { label: "자동제어밸브 고장",    section: "§5.7", calc: calculateControlValveFailureScenario },
  ABNORMAL_HEAT_VAPOR: { label: "비정상 열/증기 유입",  section: "§5.8", calc: calculateAbnormalHeatVaporScenario },
};

function CaseView({ caseData, dischargeSystems, onBack, onSnapshotCreate, onApprovalUpdate }) {
  const equipment = caseData.equipment || null;

  // 매칭 DischargeSystem — connectedTags 또는 명시적 지정
  const dischargeSystem = caseData.dischargeSystemId
    ? (dischargeSystems || []).find(ds => ds.id === caseData.dischargeSystemId) || null
    : equipment
    ? (dischargeSystems || []).find(ds => ds.connectedTags?.includes(equipment.tag)) || null
    : null;

  // Equipment 값으로 inputs 초기화
  const initialInputs = {
    ...R201_DEFAULTS,
    ...(equipment ? {
      P1:   equipment.setPressure,
      mawp: equipment.mawp,
      // PRESSURE-001: overpressure는 Case 입력값이 아니라 Asset(Equipment)
      // 데이터. Equipment에 없으면 계산을 막아야 하므로 여기서 임의
      // 기본값을 몰래 대입하지 않는다 (누락 시 validateInputs에서 거부).
      OP:   equipment.overpressure,
      P2:   dischargeSystem?.headerPressure ?? R201_DEFAULTS.P2,
    } : {}),
  };

  const startScreen = caseData.latestSnap ? "report" : "input";
  const [screen,     setScreen]     = useState(startScreen);
  const [inputs,     setInputs]     = useState(initialInputs);
  const [deviceType, setDeviceType] = useState(
    equipment?.deviceType ?? "safetyValve"
  );
  const [snapshot, setSnapshot] = useState(caseData.latestSnap || null);
  const [approvals, setApprovals] = useState(caseData.approvals || []);

  // ── RELIEF-LOAD-UI-001: §5 시나리오 입력 상태 ──
  // reliefLoadScenarioType === null 이면 "미사용"(기존 Manual W 그대로).
  // reliefLoadScenarioInput은 "현재 선택된 시나리오 하나"만을 위한 원시
  // 입력 객체 — 시나리오를 바꾸면 반드시 빈 객체로 리셋한다(원칙: 이전
  // 시나리오의 입력이 새 시나리오 계산에 암묵적으로 섞이면 안 됨. state
  // collision 방지, RELIEF-LOAD-UI-001의 STATE_COLLISION 계약으로 고정).
  const [reliefLoadScenarioType,  setReliefLoadScenarioType]  = useState(null);
  const [reliefLoadScenarioInput, setReliefLoadScenarioInput] = useState({});

  const handleInputChange = (key, val) => setInputs(p => ({ ...p, [key]: val }));

  // 시나리오 전환 — 반드시 입력을 리셋한다(동일 타입 재클릭은 리셋하지
  // 않음: 입력 도중 실수로 같은 버튼을 다시 눌러도 작성 중이던 값이
  // 사라지지 않도록).
  const handleReliefLoadScenarioTypeChange = (type) => {
    if (type === reliefLoadScenarioType) return;
    setReliefLoadScenarioType(type);
    setReliefLoadScenarioInput({});
  };
  const handleReliefLoadScenarioInputChange = (key, val) =>
    setReliefLoadScenarioInput(p => ({ ...p, [key]: val }));

  // ── §5 scenario → selector → adapter 체인 (파생값, 매 렌더 재계산) ──
  // 이 세 함수(calculate*Scenario/selectGoverningReliefLoad/
  // buildReliefSizingInput)는 relief_load.js의 순수 함수다. api520Engine
  // (실제 sizing 계산)은 여기서 절대 호출하지 않는다 — Engine은
  // handleCalculate()에서 딱 한 번만 실행된다(Engine 이중 실행 금지).
  // 이미 CaseView가 매 렌더 computeWorkflowState()(engine 함수)를
  // 호출하는 기존 패턴과 동일한 층위의 파생 계산이다.
  const reliefLoadScenarioResult = reliefLoadScenarioType
    ? RELIEF_LOAD_SCENARIO_META[reliefLoadScenarioType].calc(reliefLoadScenarioInput)
    : null;
  const reliefLoadSelectorResult = reliefLoadScenarioResult
    ? selectGoverningReliefLoad([reliefLoadScenarioResult])
    : null;
  const reliefLoadAdapter = reliefLoadSelectorResult
    ? buildReliefSizingInput(reliefLoadSelectorResult)
    : null;

  // 실제 sizing에 쓰일 값이 무엇인지 — Engine의 wSource 결정 로직과
  // 정확히 동일한 조건(reliefLoadAdapter.valid)을 그대로 반영한 표시용
  // 파생값. 새로운 판단을 추가하는 게 아니라 Engine이 내릴 판단을
  // 미리 보여주는 것뿐이다(계산/판정 아님).
  const reliefLoadActive = reliefLoadScenarioType !== null;
  const effectiveWSource = (reliefLoadActive && reliefLoadAdapter?.valid) ? "GOVERNING_RELIEF_LOAD" : "MANUAL_INPUT";
  const effectiveW = effectiveWSource === "GOVERNING_RELIEF_LOAD" ? reliefLoadAdapter.W : inputs.W;

  const handleCalculate = () => {
    // 시나리오가 활성화됐는데 유효한 governing W가 없으면 즉시 중단—
    // manual W로 조용히 대체하지 않는다(자동 fallback 금지 원칙).
    // 이 가드는 InputView의 blockReason과 동일한 조건이라 정상 흐름에서는
    // 버튼 자체가 비활성화되어 여기 도달하지 않지만, 방어적으로 다시 확인.
    if (reliefLoadActive && !reliefLoadAdapter?.valid) {
      alert(`Relief Load 시나리오 입력이 완료되지 않았습니다 — ${reliefLoadAdapter?.reason || "INSUFFICIENT_INPUT"}`);
      return;
    }
    const adapterForEngine = reliefLoadActive ? reliefLoadAdapter : undefined;
    const engineResult = api520Engine(inputs, deviceType, equipment?.inletPiping || null, adapterForEngine);
    if (!engineResult.valid) {
      alert(`입력 오류: ${engineResult.error.field} — ${engineResult.error.reason}`);
      return;
    }
    // RELIEF-LOAD-UI-001: 시나리오가 활성화되어 있고 유효할 때만
    // Snapshot에 reliefLoad를 싣는다. 미사용 Case는 이 키 자체를 아예
    // 넘기지 않아(undefined) 기존 hash/스키마와 100% 동일하게 유지한다
    // (createSnapshot의 하위호환 계약, RELIEF-SIZING-ADAPTER-001 참고).
    const reliefLoadForSnapshot = (reliefLoadActive && reliefLoadAdapter.valid) ? {
      scenarios: reliefLoadSelectorResult.allScenarios,
      governing: reliefLoadSelectorResult.governingScenarioId,
      quantity: "MASS_FLOW",
      unit: "kg/h",
      provenance: reliefLoadAdapter.provenance,
    } : undefined;
    // Engine이 workflow 결정 — timestamp는 UI에서 주입 (Engine 순수성 유지)
    const wfDec = computeWorkflowState(null, equipment, dischargeSystem);
    const snap = createSnapshot({
      caseId:           caseData.id,
      valveTag:         caseData.valveTag,
      deviceType,
      inputs,
      engineResult,
      equipment,
      dischargeSystem,
      workflowDecision: { ...wfDec, state: "INSPECTION" },
      reliefLoad:       reliefLoadForSnapshot,
    });
    setSnapshot(snap);
    onSnapshotCreate(caseData.id, snap);
    setScreen("report");
  };

  // workflow 변경 = 새 Snapshot 생성 (patch 금지)
  // snapshotHash가 workflow를 포함해 계산되므로, workflow가 바뀌면
  // 반드시 새로운 identity(새 hash)를 가진 Snapshot이어야 한다.
  // inputs/engineResult는 재사용 — Engine을 다시 돌리는 게 아니라
  // "동일 계산 결과 + 새 workflow 결정"을 새 버전으로 기록하는 것.
  //
  // build/commit을 분리한 이유(중요): Approval은 "지금 보고 있는(REVIEW) 버전"이
  // 아니라 "승인 결과로 확정될 다음 버전(APPROVED/ACTION_REQUIRED)"의 hash에
  // 서명해야 한다. 순서를 반대로 하면(서명 먼저 → 전이 나중) 서명 직후
  // Snapshot이 교체되면서 approval.snapshotHash가 가리키는 버전이 case에서
  // 사라져 "승인은 됐는데 최종 상태에는 승인 기록이 없는" 상태가 된다.
  const _buildAdvancedSnapshot = (nextState, comment) => {
    const wfDec = computeWorkflowState(snapshot, equipment, dischargeSystem);
    // RELIEF-LOAD-UI-001 hash 정규화: snapshot.reliefLoad는 createSnapshot이
    // 항상 null(미사용) 또는 실제 객체로 반환한다(원본 undefined 여부는
    // 이 시점엔 이미 사라짐). 여기서 그대로 null을 다시 넘기면
    // _hashResult가 "reliefLoad:null"을 해시에 새로 포함시켜, 애초에
    // reliefLoad를 전혀 쓴 적 없는 Case인데도 workflow 전이 시점부터
    // hash가 달라지는 회귀가 생긴다 — null은 undefined로 되돌려
    // "reliefLoad를 실제로 쓴 적 있는 Case만" 해시에 포함되게 한다.
    const reliefLoadForAdvance = snapshot.reliefLoad === null ? undefined : snapshot.reliefLoad;
    const newSnap = createSnapshot({
      caseId:           caseData.id,
      valveTag:         caseData.valveTag,
      deviceType,
      inputs:           snapshot.inputs,
      engineResult:     snapshot.result,
      equipment,
      dischargeSystem,
      workflowDecision: { ...wfDec, state: nextState },
      reliefLoad:       reliefLoadForAdvance,
    });
    // lastComment는 hash 계산 대상 아님 (승인/반려 사유 메모, 결정 내용 아님)
    return comment ? Object.freeze({ ...newSnap, lastComment: comment }) : newSnap;
  };

  const _commitSnapshot = (snap) => {
    setSnapshot(snap);
    onSnapshotCreate(caseData.id, snap);
  };

  const handleWorkflowAdvance = (nextState, comment) => {
    _commitSnapshot(_buildAdvancedSnapshot(nextState, comment));
  };

  // ApprovalForm → 여기 하나만 거쳐서 처리한다.
  // 1) "승인 후 확정될 다음 버전(Snapshot)"을 먼저 만든다 (아직 커밋 안 함)
  // 2) 그 Snapshot의 hash에 서명한다 (submitApproval)
  // 3) 서명 성공한 경우에만 그 Snapshot을 실제로 커밋한다
  //    → case의 "현재/최종" Snapshot이 항상 서명 대상과 정확히 일치한다.
  const handleApprovalSubmit = async ({ decision, comment, signer, role }) => {
    if (!snapshot || snapshot.workflow !== "REVIEW") {
      alert("승인 대기(REVIEW) 상태에서만 서명할 수 있습니다.");
      return { ok: false, reason: "not in REVIEW state" };
    }
    const nextState = decision === "approve" ? "APPROVED" : "ACTION_REQUIRED";
    const nextSnap  = _buildAdvancedSnapshot(nextState, comment);

    const result = await submitApproval(
      { snapshot: nextSnap, decision, comment, signer, role },
      approvals
    );
    if (!result.ok) {
      alert(`승인 처리 실패 [${result.contract}]: ${result.reason}`);
      return result;
    }
    setApprovals(result.history);
    onApprovalUpdate(caseData.id, result.history);
    _commitSnapshot(nextSnap);
    return result;
  };

  const wfColor = WF_COLOR[snapshot?.workflow ?? caseData.workflow];
  const wfLabel = WF_LABEL[snapshot?.workflow ?? caseData.workflow];

  // Engine이 결정한 workflow 상태 — UI는 읽기만 함
  const wfDecision = computeWorkflowState(snapshot, equipment, dischargeSystem);

  // MOC 결과는 wfDecision.reasons에서 추출 (Engine 결과 projection)
  const mocResult = {
    changed: wfDecision.reasons.length > 0,
    diffs:   wfDecision.reasons,  // { field, from, to, unit, type }
  };

  // Snapshot workflow와 Engine 결정값이 다르면 Snapshot 갱신
  // (Engine이 상태를 결정하면 Snapshot이 그것을 반영 — UI는 트리거만)
  useEffect(() => {
    if (!snapshot) return;
    if (wfDecision.state === snapshot.workflow) return;
    const locked = ["APPROVED","CLOSED"];
    if (locked.includes(snapshot.workflow)) return;
    handleWorkflowAdvance(
      wfDecision.state,
      wfDecision.reasons.map(r=>`${r.type}: ${r.field} ${r.from}→${r.to}`).join(", ")
    );
  }, [wfDecision.state]);

  const tabs = [
    { id:"info",   label:"정보" },
    { id:"input",  label:"사양 결정" },
    ...(snapshot ? [{ id:"report", label:"검토 결과" }] : []),
  ];

  return (
    <div>
      {/* 헤더 */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={onBack}
          style={{padding:"8px 12px",background:T.bg,border:`1px solid ${T.border}`,
            borderRadius:9,fontSize:13,fontWeight:700,color:T.sub,
            fontFamily:font.mono,cursor:"pointer",flexShrink:0}}>←</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:900,color:T.navy,
            fontFamily:font.mono,overflow:"hidden",
            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {caseData.valveTag}
          </div>

// ── ArcSafe.jsx ──────────────────────────
//  ROOT — ArcSafe App (v0.2.0-asset-master)
// ════════════════════════════════════════════════════════════════
function ArcSafe() {
  // ASSET-HISTORY-001~004: Asset Repository는 append-only history만 저장하고,
  // "현재 상태" 목록(equipments/dischargeSystems)은 항상 파생값이다.
  // 저장하는 것: equipmentHistory / dischargeHistory
  // 계산하는 것: equipments / dischargeSystems (아래 useMemo)
  const [equipmentHistory, setEquipmentHistory] = useState(() =>
    Object.freeze(SAMPLE_EQUIPMENT.map(e => createEquipment(e)))
  );
  const [dischargeHistory, setDischargeHistory] = useState(() =>
    Object.freeze(SAMPLE_DISCHARGE_SYSTEMS.map(d => createDischargeSystem(d)))
  );
  const equipments = useMemo(
    () => getAllLatestRevisions(equipmentHistory), [equipmentHistory]
  );
  const dischargeSystems = useMemo(
    () => getAllLatestRevisions(dischargeHistory), [dischargeHistory]
  );
  const [cases,      setCases]      = useState([]);
  const [activeCase, setActiveCase] = useState(null);
  const [screen,     setScreen]     = useState("dashboard");

  // AUTH — auth.archsafe.co.kr SDK 연동 (AUTH_INTEGRATION_STANDARD.md 표준)
  // 절대 규칙: /auth/me 등을 직접 fetch하지 않고 AuthClient SDK만 통해 접근.
  // JWT 직접 decode 금지, 세션은 auth-worker의 HttpOnly 쿠키만 사용.
  // Engine 입력에는 identity를 절대 넘기지 않음 — 아래 authUser는 헤더 UI 표시 전용.
  const [authUser,  setAuthUser]  = useState(null);
  const [authState, setAuthState] = useState("loading"); // loading | authenticated | unauthenticated | unavailable
  useEffect(() => {
    if (typeof AuthClient === "undefined") { setAuthState("unavailable"); return; }
    const auth = new AuthClient({ baseUrl: "https://auth.archsafe.co.kr" });
    auth.onChange((state, user) => {
      setAuthState(state);
      setAuthUser(state === "authenticated" ? user : null);
    });
    auth.init();
    window.__archsafeAuth = auth; // logout 버튼에서 참조
  }, []);
  const handleLogin = () => {
    window.location.href = "https://auth.archsafe.co.kr/auth/login?return_to=" +
      encodeURIComponent(window.location.href);
  };
  const handleLogout = () => { if (window.__archsafeAuth) window.__archsafeAuth.logout(); };

  // B3 Impact Analysis용: 모든 Case의 snapshotHistory를 이어붙인 평탄화 배열.
  // 각 case.snapshotHistory는 append-only(순서 보존)이므로, 이를 그대로 이어붙이면
  // caseId별 마지막 등장 원소 = 그 Case의 최신 Snapshot이 된다 (analyzeRevisionImpact 전제).
  const allSnapshots = useMemo(
    () => cases.flatMap(c => c.snapshotHistory || []), [cases]
  );

  const handleOpenCase = (c) => setActiveCase(c);
  const handleBack = () => setActiveCase(null);

  // Equipment 선택 → Case 생성 → CaseView 진입
  const handleEquipmentSelect = (equipment) => {
    const ds = dischargeSystems.find(
      d => d.connectedTags.includes(equipment.tag)
    ) || null;
    const newCase = {
      id:               `C-${new Date().getFullYear()}-${String(cases.length+1).padStart(3,"0")}`,
      valveTag:         equipment.tag,
      equipment:        equipment,
      dischargeSystemId:ds?.id || null,
      fluid:            "CO₂ (고압)",
      reviewType:       "정기 PSM 검토",
      workflow:         "DRAFT",
      latestSnap:       null,   // pointer only — 검증에 사용 금지
      snapshotHistory:  [],     // source of truth (append-only)
      approvals:        [],     // ApprovalRecord[] (append-only, service.js를 통해서만 갱신)
    };
    setCases(prev => [...prev, newCase]);
    setActiveCase(newCase);
    setScreen("dashboard");
  };

  // ASSET-HISTORY-001: append만 허용, 기존 revision을 교체·삭제하지 않는다.
  const handleAddEquipment = (eq) =>
    setEquipmentHistory(prev => appendRevision(prev, eq));

  // EQUIPMENT-MOC + ASSET-HISTORY-001: id는 유지, revision은 append.
  // 이전 revision은 overwrite되지 않고 history에 그대로 남는다 —
  // 한 번도 Case에서 참조되지 않은 revision도 소실되지 않음.
  const handleReviseEquipment = (revisedEq) =>
    setEquipmentHistory(prev => appendRevision(prev, revisedEq));

  const handleAddDischargeSystem = (ds) =>
    setDischargeHistory(prev => appendRevision(prev, ds));

  // GEOMETRY-002 + ASSET-HISTORY-001: id는 그대로, revision은 append.
  // Asset도 Snapshot과 동일하게 append-only history로 관리하고,
  // "현재 상태"는 저장하지 않고 history로부터 파생시킨다(equipments/dischargeSystems useMemo).
  // MOC 감지는 이 append 이후 케이스 재진입 시 assetFingerprint 비교로 자동 발동.
  const handleReviseDischargeSystem = (revisedDs) =>
    setDischargeHistory(prev => appendRevision(prev, revisedDs));

  // HISTORY-001과 동일 원칙: overwrite 금지, service.js가 만든 새 배열만 반영
  const handleApprovalUpdate = (caseId, approvals) => {
    setCases(prev => prev.map(c =>
      c.id !== caseId ? c : { ...c, approvals }
    ));
    setActiveCase(prev =>
      prev && prev.id === caseId ? { ...prev, approvals } : prev
    );
  };

  // HISTORY-001: overwrite 금지 — 항상 appendSnapshot()으로 history에 추가
  const handleSnapshotCreate = (caseId, snap) => {
    setCases(prev => prev.map(c =>
      c.id !== caseId ? c : appendSnapshot(c, snap)
    ));
    setActiveCase(prev =>
      prev && prev.id === caseId ? appendSnapshot(prev, snap) : prev
    );
  };

  const curScreen = activeCase ? "case"
    : screen === "assets" ? "assets"
    : "dashboard";

  return (
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:font.sans}}>
      {/* 글로벌 헤더 */}
      <div style={{background:T.navy,padding:"11px 16px",display:"flex",
        alignItems:"center",justifyContent:"space-between",
        position:"sticky",top:0,zIndex:100}}>
        <div>
          <div style={{fontSize:16,fontWeight:900,color:T.white,
            fontFamily:font.mono,letterSpacing:1}}>ArcSafe</div>
          <div style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono}}>
            PSM 안전밸브 관리 시스템
          </div>
          <div style={{fontSize:8,color:"#4A6FA5",fontFamily:font.mono,marginTop:1}}>
            v0.2.0 · {typeof __BUILD_HASH__ !== "undefined" ? __BUILD_HASH__ : "dev"}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {activeCase && (
            <div style={{fontSize:11,color:"#7B9EC0",fontFamily:font.mono}}>
              {activeCase.valveTag}
            </div>
          )}
          {!activeCase && (
            <button
              onClick={()=>setScreen(screen==="assets"?"dashboard":"assets")}
              style={{padding:"6px 11px",
                background:screen==="assets"?T.blue:"none",
                border:`1px solid ${screen==="assets"?T.blue:"#4A6FA5"}`,
                borderRadius:8,fontSize:10,
                color:screen==="assets"?T.white:"#7B9EC0",
                fontFamily:font.mono,cursor:"pointer"}}>
              🔧 설비대장
            </button>
          )}
          {authState === "authenticated" && authUser && (
            <div
              onClick={handleLogout}
              title="클릭하여 로그아웃"
              style={{fontSize:10,color:"#7B9EC0",fontFamily:font.mono,
                cursor:"pointer",maxWidth:120,overflow:"hidden",
                textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {authUser.email}
            </div>
          )}
          {authState === "unauthenticated" && (
            <button
              onClick={handleLogin}
              style={{padding:"6px 11px",background:"none",
                border:"1px solid #4A6FA5",borderRadius:8,fontSize:10,
                color:"#7B9EC0",fontFamily:font.mono,cursor:"pointer"}}>
              로그인
            </button>
          )}
        </div>
      </div>

      {/* 컨텐츠 */}
      <div style={{padding:"14px 14px 40px",maxWidth:640,margin:"0 auto"}}>
        {curScreen === "case" && activeCase && (
          <CaseView
            caseData={activeCase}
            dischargeSystems={dischargeSystems}
            onBack={handleBack}
            onSnapshotCreate={handleSnapshotCreate}
            onApprovalUpdate={handleApprovalUpdate}
          />
        )}
        {curScreen === "assets" && (
          <AssetMaster
            equipments={equipments}
            dischargeSystems={dischargeSystems}
            equipmentHistory={equipmentHistory}
            dischargeHistory={dischargeHistory}
            allSnapshots={allSnapshots}
            onSelectEquipment={handleEquipmentSelect}
            onAddEquipment={handleAddEquipment}
            onReviseEquipment={handleReviseEquipment}
            onAddDischargeSystem={handleAddDischargeSystem}
            onReviseDischargeSystem={handleReviseDischargeSystem}
            onBack={()=>setScreen("dashboard")}
          />
        )}
        {curScreen === "dashboard" && (
          <Dashboard
            cases={cases}
            onOpenCase={handleOpenCase}
            onNewCase={()=>setScreen("assets")}
            onOpenAssetMaster={()=>setScreen("assets")}
          />
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ArcSafe />);
</script>
</body>
</html>
