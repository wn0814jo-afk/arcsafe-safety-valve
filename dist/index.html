};

// Review Trigger 판정 → engine/workflow_engine.js 로 이동
// WORKFLOW_TRIGGER_FIELDS + computeWorkflowState() 참조
// workflow/index.js는 상태 정의(레이블/색상/전환)만 담당


// ── approval/crypto.js ──────────────────────────
//  APPROVAL CRYPTO
//  전자서명 — Web Crypto API(SubtleCrypto) 기반 SHA-256.
//  이 파일은 순수 서명/검증 계산만 담당한다.
//  누가 승인할 수 있는지, 중복 승인인지 같은 정책은 service.js/validator.js가 처리.
//
//  계약:
//    CRYPTO-001: canonicalPayload()는 필드 순서·구분자가 고정된다.
//                순서가 바뀌면 내용이 같아도 다른 서명이 나온다.
//    CRYPTO-002: signApproval() / verifySignature()는 async다.
//                Web Crypto API(subtle.digest)는 Promise 기반이라 동기화 불가.
//    CRYPTO-003: 서명 대상은 snapshotHash + decision + comment + signer +
//                timestamp + workflowState 전부. comment도 서명 대상이다 —
//                승인/반려 사유는 의견이 아니라 판단 근거이며 PSM 감사에서
//                증거로 취급된다.
// ════════════════════════════════════════════════════════════════

// ── canonicalPayload ───────────────────────────────────────────
// 서명 생성과 검증 양쪽에서 반드시 이 함수만 사용해야 한다.
// NUL(\u0000) 구분자 사용 — 필드 값 안에 나타날 가능성이 사실상 없어
// "ab"+"c" 와 "a"+"bc" 같은 concatenation ambiguity를 막는다.
function canonicalPayload(record) {
  return [
    record.snapshotHash  || "",
    record.decision      || "",
    record.comment       || "",
    record.signer        || "",
    record.timestamp     || "",
    record.workflowState || "",
  ].join("\u0000");
}

// ── sha256Hex ──────────────────────────────────────────────────
async function sha256Hex(message) {
  const data   = new TextEncoder().encode(message);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

// ── signApproval ───────────────────────────────────────────────
// record: { snapshotHash, decision, comment, signer, timestamp, workflowState }
// 반환: signature (hex string, 64자)
async function signApproval(record) {
  return sha256Hex(canonicalPayload(record));
}

// ── verifySignature ────────────────────────────────────────────
// record.signature가 나머지 필드로부터 재계산한 값과 일치하는지 확인.
// 필드 하나라도 서명 이후 바뀌면 불일치 — 즉 위변조 탐지.
async function verifySignature(record) {
  if (!record || !record.signature) {
    return { valid: false, reason: "CRYPTO-002: signature missing" };
  }
  const recomputed = await signApproval(record);
  if (recomputed !== record.signature) {
    return {
      valid: false,
      reason: "CRYPTO-003: signature mismatch — record fields altered after signing",
      expected:   record.signature,
      recomputed,
    };
  }
  return { valid: true };
}


// ── approval/record.js ──────────────────────────
//  APPROVAL RECORD
//  Snapshot = 영구 불변 (서명 대상)
//  ApprovalRecord = Snapshot에 대한 별도 증명 (Snapshot을 수정하지 않음)
//
//  계약:
//    APPROVAL-001: snapshotHash 없으면 생성 불가
//    APPROVAL-002: 승인 후 Snapshot 변경 시 검증 실패
//    APPROVAL-003: 재승인은 이전 기록을 덮어쓰지 않고 별도 이력으로 남음
// ════════════════════════════════════════════════════════════════

const APPROVAL_ROLES = ["engineer", "senior_engineer", "safety_manager", "pss_manager"];

// ── validateApprovalInput ─────────────────────────────────────
function validateApprovalInput(input) {
  // APPROVAL-001: snapshotHash 필수
  if (!input.snapshotHash || !input.snapshotHash.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "snapshotHash is required — cannot approve without a snapshot hash" };
  }
  if (!input.snapshotId || !input.snapshotId.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "snapshotId is required" };
  }
  if (!input.approver || !input.approver.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "approver name is required" };
  }
  if (!APPROVAL_ROLES.includes(input.role)) {
    return { ok: false, contract: "APPROVAL-001",
             reason: `role must be one of: ${APPROVAL_ROLES.join(", ")}` };
  }
  return { ok: true };
}

// ── createApprovalRecord ──────────────────────────────────────
// Snapshot을 수정하지 않음 — snapshotHash로 참조만 함
// approvedAt: 선택적 주입. service.js가 서명 대상 timestamp와 동일한 값을
// 넘겨서 "record 저장 시각"과 "서명된 시각"이 어긋나지 않도록 한다.
// 넘기지 않으면(기존 호출 호환) 이 함수가 직접 생성한다.
function createApprovalRecord(input) {
  const valid = validateApprovalInput(input);
  if (!valid.ok) {
    throw new Error(`${valid.contract}: ${valid.reason}`);
  }

  return Object.freeze({
    approvalId:    `APPR-${input.snapshotId}-${Date.now()}`,
    snapshotId:    input.snapshotId,
    snapshotHash:  input.snapshotHash,   // 서명 대상 fingerprint
    approver:      input.approver.trim(),
    role:          input.role,
    approvedAt:    input.approvedAt || new Date().toISOString(),
    comment:       input.comment || "",
    // APPROVAL-003: 재승인은 별도 approvalId로 생성 (덮어쓰기 없음)
    // 호출자는 이 record를 기존 배열에 push — replace 금지
  });
}

// ── verifyApproval ────────────────────────────────────────────
// APPROVAL-002: Snapshot의 현재 snapshotHash와 ApprovalRecord의 snapshotHash 비교
// 일치하지 않으면 승인 이후 Snapshot이 변경된 것
function verifyApproval(approvalRecord, currentSnapshot) {
  if (!approvalRecord || !currentSnapshot) {
    return { valid: false, reason: "approvalRecord or snapshot is null" };
  }
  if (approvalRecord.snapshotId !== currentSnapshot.id) {
    return { valid: false, reason: "snapshotId mismatch — wrong snapshot" };
  }
  if (approvalRecord.snapshotHash !== currentSnapshot.snapshotHash) {
    return {
      valid:  false,
      reason: "APPROVAL-002: snapshotHash mismatch — Snapshot was modified after approval",
      approvedHash: approvalRecord.snapshotHash,
      currentHash:  currentSnapshot.snapshotHash,
    };
  }
  return { valid: true, approver: approvalRecord.approver, approvedAt: approvalRecord.approvedAt };
}

// ── ApprovalHistory ───────────────────────────────────────────
// APPROVAL-003: 재승인은 push — replace 금지
// 단순 배열 헬퍼. 상태 없음.
function addApprovalRecord(history, newRecord) {
  // history는 배열. 새 record를 추가한 새 배열 반환 (mutation 없음).
  return Object.freeze([...history, newRecord]);
}

function getLatestApproval(history) {
  if (!history || history.length === 0) return null;
  return history[history.length - 1];
}


// ── approval/service.js ──────────────────────────
//  APPROVAL SERVICE
//  ApprovalForm(추후 구현)이 호출하는 유일한 진입점.
//  UI는 hash 계산도, 서명 검증도, workflow 판단도 하지 않는다 — 여기서 전부 처리.
//
//  계약:
//    SERVICE-001: idempotencyKey = SHA256(snapshotHash + signer) 기준으로
//                 동일 (snapshot version, signer) 조합의 중복 서명을 차단한다.
//    SERVICE-002: submitApproval()은 서명까지 완료된 ApprovalRecord만
//                 history에 추가한다 — 미서명 record는 존재할 수 없다.
//    SERVICE-003: Snapshot은 이 파일에서 절대 생성/수정하지 않는다 (읽기 전용).
//                 timestamp는 이 함수가 1회만 생성해 approvedAt과 서명 대상
//                 timestamp 양쪽에 동일하게 사용한다 (두 번 호출 시 값이
//                 어긋날 수 있으므로 반드시 단일 지점에서 생성).
// ════════════════════════════════════════════════════════════════

// ── computeIdempotencyKey ───────────────────────────────────────
async function computeIdempotencyKey(snapshotHash, signer) {
  return sha256Hex(`${snapshotHash}\u0000${signer}`);
}

// ── isDuplicateApproval ──────────────────────────────────────────
// SERVICE-001: 같은 (snapshotHash, signer) 조합으로 이미 서명한 기록이 있는지
async function isDuplicateApproval(history, snapshotHash, signer) {
  const key = await computeIdempotencyKey(snapshotHash, signer);
  for (const rec of (history || [])) {
    if (rec.idempotencyKey === key) return true;
  }
  return false;
}

// ── submitApproval ─────────────────────────────────────────────
// input:   { snapshot, decision, comment, signer, role }
// history: 이 case에 쌓인 기존 ApprovalRecord[] (없으면 [])
// 반환:    성공 { ok:true, record, history }
//          실패 { ok:false, contract, reason }
async function submitApproval(input, history) {
  const { snapshot, decision, comment, signer, role } = input;

  if (!snapshot || !snapshot.snapshotHash) {
    return { ok: false, contract: "APPROVAL-001", reason: "snapshot(with snapshotHash) is required" };
  }

  // SERVICE-003: 단일 timestamp — approvedAt과 서명 대상에 동일하게 사용
  const now = new Date().toISOString();

  const dup = await isDuplicateApproval(history, snapshot.snapshotHash, signer);
  if (dup) {
    return {
      ok: false, contract: "SERVICE-001",
      reason: "duplicate approval — this signer already signed this snapshot version",
    };
  }

  let base;
  try {
    base = createApprovalRecord({
      snapshotId:   snapshot.id,
      snapshotHash: snapshot.snapshotHash,
      approver:     signer,
      role,
      comment,
      approvedAt:   now,
    });
  } catch (e) {
    return { ok: false, contract: "APPROVAL-001", reason: e.message };
  }

  const signPayload = {
    snapshotHash:  base.snapshotHash,
    decision,
    comment:       base.comment,
    signer:        base.approver,
    timestamp:     base.approvedAt,   // base와 동일 값 재사용 — 두 번째 Date() 없음
    workflowState: snapshot.workflow,
  };
  const signature      = await signApproval(signPayload);
  const idempotencyKey = await computeIdempotencyKey(base.snapshotHash, base.approver);

  const record = Object.freeze({
    ...base,
    decision,
    workflowState: snapshot.workflow,
    signature,
    idempotencyKey,
  });

  return { ok: true, record, history: addApprovalRecord(history || [], record) };
}


// ── sim/step.js ──────────────────────────
//  SIMULATION (시간 전용 — 계산 없음)
// ════════════════════════════════════════════════════════════════
function stepSim(prev, setPoint, mawp) {
  let { pressure, direction } = prev;
  const speed = pressure >= setPoint ? API_CONST.SIM_SPEED_RELIEF : API_CONST.SIM_SPEED_NORMAL;
  pressure += direction * speed;
  if (pressure >= mawp * API_CONST.SIM_MAWP_FACTOR) direction = -1;
  if (pressure <= 0.3) direction = 1;
  return {
    ...prev,
    pressure: Math.max(0, pressure),
    direction,
    valveOpen: pressure >= setPoint,
    ratio: Math.min(pressure / (mawp * API_CONST.SIM_MAWP_FACTOR), 1),
  };
}


// ── asset/schema.js ──────────────────────────
//  PSV ASSET SCHEMA v2
//  Equipment = 밸브 자체 (거의 불변, 교체/MOC 시 변경)
//  DischargeSystem = 배출계통 (배관 개조 MOC 시 변경, 복수 PSV 공유 가능)
// ════════════════════════════════════════════════════════════════

// ── PSVEquipment ─────────────────────────────────────────────
// INLET-LOSS-001: inletPiping은 Equipment revision 데이터의 일부다 —
// 별도 엔티티가 아니라 Equipment와 같은 (id, revision) 생명주기를 공유.
// 값이 바뀌면 reviseEquipment()로만 개정 가능(mocId 필수) — Asset
// Revision History/Diff/Impact Analysis가 그대로 적용된다.
function validateInletPiping(ip) {
  // 인입배관 데이터 자체가 없는 것은 허용(선택 항목) — 3% 판정을 아직
  // 안 하는 설비도 있을 수 있다. 있는데 형식이 틀린 것만 거부한다.
  if (ip === undefined || ip === null) return { ok:true };
  const fields = ["L", "D", "fittingsK"];
  for (const f of fields) {
    const v = Number(ip[f]);
    if (isNaN(v) || !isFinite(v)) return { ok:false, field:`inletPiping.${f}`, reason:"not_a_number" };
  }
  if (Number(ip.D) <= 0) return { ok:false, field:"inletPiping.D", reason:"must_be_positive" };
  if (Number(ip.L) <  0) return { ok:false, field:"inletPiping.L", reason:"must_be_non_negative" };
  if (Number(ip.fittingsK) < 0) return { ok:false, field:"inletPiping.fittingsK", reason:"must_be_non_negative" };
  return { ok:true };
}

function validateEquipment(eq) {
  if (!eq.tag || !eq.tag.trim())
    return { ok:false, field:"tag", reason:"required" };
  if (!eq.mawp || Number(eq.mawp) <= 0)
    return { ok:false, field:"mawp", reason:"must_be_positive" };
  if (!eq.setPressure || Number(eq.setPressure) <= 0)
    return { ok:false, field:"setPressure", reason:"must_be_positive" };
  if (Number(eq.setPressure) > Number(eq.mawp))
    return { ok:false, field:"setPressure", reason:"exceeds_mawp" };
  // PRESSURE-001: overpressure는 relieving pressure(절대압) 산정에 쓰이는
  // Design Basis — Case가 아니라 Asset(Equipment)이 소유. 계산 신뢰성
  // 계약이므로 누락/음수를 허용하지 않는다.
  if (eq.overpressure === undefined || eq.overpressure === null || isNaN(Number(eq.overpressure)))
    return { ok:false, field:"overpressure", reason:"required" };
  if (Number(eq.overpressure) < 0)
    return { ok:false, field:"overpressure", reason:"must_be_non_negative" };
  const ipValid = validateInletPiping(eq.inletPiping);
  if (!ipValid.ok) return ipValid;
  return { ok:true };
}

function createEquipment(fields) {
  const valid = validateEquipment(fields);
  if (!valid.ok) throw new Error(`EQUIPMENT_INVALID: ${valid.field} — ${valid.reason}`);
  return Object.freeze({
    id:           `EQ-${fields.tag.replace(/[^A-Z0-9]/gi,"").toUpperCase()}-${Date.now()}`,
    tag:          fields.tag.trim(),
    revision:     Number(fields.revision ?? 1),
    mocId:        fields.mocId || null,
    location:     fields.location || "",
    manufacturer: fields.manufacturer || "",
    model:        fields.model || "",
    serialNo:     fields.serialNo || "",
    deviceType:   fields.deviceType || "safetyValve",
    mawp:         Number(fields.mawp),
    setPressure:  Number(fields.setPressure),
    overpressure: Number(fields.overpressure),
    orifice:      fields.orifice || "",
    inletSize:    fields.inletSize || "",
    outletSize:   fields.outletSize || "",
    // INLET-LOSS-001: 명목 배관 크기(inletSize)를 자동 변환하지 않는다 —
    // 실제 L/D/fittingsK를 별도로 입력받은 경우에만 존재(선택 항목).
    // 중첩 객체이므로 별도로 freeze — Equipment를 Object.freeze({...})
    // 해도 내부 참조 객체는 얕은 freeze만 되므로 여기서 직접 고정한다.
    inletPiping:  fields.inletPiping ? Object.freeze({
      L:         Number(fields.inletPiping.L),
      D:         Number(fields.inletPiping.D),
      fittingsK: Number(fields.inletPiping.fittingsK),
    }) : null,
    installedAt:  fields.installedAt || "",
    registeredAt: new Date().toISOString(),
  });
}

// ── reviseEquipment ────────────────────────────────────────────
// EQUIPMENT-MOC-001/002: reviseDischargeSystem과 동일한 계약.
// mocId 없이는 개정 불가, id는 유지, revision만 증가.
function reviseEquipment(existing, fields) {
  if (!fields.mocId || !fields.mocId.trim()) {
    return { ok:false, field:"mocId", reason:"required_for_revision" };
  }
  const merged = { ...existing, ...fields, id: existing.id };
  const valid = validateEquipment(merged);
  if (!valid.ok) return valid;

  return {
    ok: true,
    equipment: Object.freeze({
      ...existing,
      ...fields,
      id:           existing.id,               // identity 유지
      revision:     Number(existing.revision) + 1,
      mocId:        fields.mocId.trim(),
      mawp:         Number(fields.mawp),
      setPressure:  Number(fields.setPressure),
      overpressure: Number(fields.overpressure),
      inletPiping:  fields.inletPiping ? Object.freeze({
        L:         Number(fields.inletPiping.L),
        D:         Number(fields.inletPiping.D),
        fittingsK: Number(fields.inletPiping.fittingsK),
      }) : (fields.inletPiping === null ? null : existing.inletPiping),
      registeredAt: existing.registeredAt,     // 최초 등록일 유지
      revisedAt:    new Date().toISOString(),
    }),
  };
}

// ── DischargeSystem ──────────────────────────────────────────
// 하나의 배출계통을 여러 PSV가 공유할 수 있음 (connectedTags)
function validateDischargeSystem(ds) {
  if (!ds.name || !ds.name.trim())
    return { ok:false, field:"name", reason:"required" };
  if (!ds.D || Number(ds.D) <= 0)
    return { ok:false, field:"D", reason:"must_be_positive" };
  if (Number(ds.L) < 0)
    return { ok:false, field:"L", reason:"must_be_non_negative" };
  const validDest = ["flare","atm","closed"];
  if (!validDest.includes(ds.destination))
    return { ok:false, field:"destination", reason:"must_be_flare_atm_closed" };
  return { ok:true };
}

function createDischargeSystem(fields) {
  const valid = validateDischargeSystem(fields);
  if (!valid.ok) throw new Error(`DISCHARGE_INVALID: ${valid.field} — ${valid.reason}`);
  return Object.freeze({
    id:              `DS-${fields.name.replace(/[^A-Z0-9]/gi,"").toUpperCase()}-${Date.now()}`,
    name:            fields.name.trim(),
    revision:        Number(fields.revision ?? 1),
    mocId:           fields.mocId || null,
    destination:     fields.destination,
    L:               Number(fields.L ?? 15),
    D:               Number(fields.D),
    fittingsK:       Number(fields.fittingsK ?? 3.0),
    headerPressure:  Number(fields.headerPressure ?? 0.3),
    connectedTags:   Array.isArray(fields.connectedTags) ? [...fields.connectedTags] : [],
    registeredAt:    new Date().toISOString(),
  });
}

// ── reviseDischargeSystem ─────────────────────────────────────
// GEOMETRY-002: 개정은 새 엔티티가 아니라 같은 id의 새 revision.
// mocId 없이는 개정 불가 — "배관을 왜 바꿨는지" 근거 없는 변경 차단.
function reviseDischargeSystem(existing, fields) {
  if (!fields.mocId || !fields.mocId.trim()) {
    return { ok:false, field:"mocId", reason:"required_for_revision" };
  }
  const merged = { ...existing, ...fields, id: existing.id };
  const valid = validateDischargeSystem(merged);
  if (!valid.ok) return valid;

  return {
    ok: true,
    dischargeSystem: Object.freeze({
      ...existing,
      ...fields,
      id:            existing.id,              // identity 유지 — case 연결 안 끊김
      revision:      Number(existing.revision) + 1,
      mocId:         fields.mocId.trim(),
      L:             Number(fields.L),
      D:             Number(fields.D),
      fittingsK:     Number(fields.fittingsK),
      headerPressure:Number(fields.headerPressure),
      connectedTags: Array.isArray(fields.connectedTags) ? [...fields.connectedTags] : existing.connectedTags,
      registeredAt:  existing.registeredAt,     // 최초 등록일 유지
      revisedAt:     new Date().toISOString(),
    }),
  };
}

// ── asset/history.js ──────────────────────────
// ════════════════════════════════════════════════════════════════
//  ASSET REVISION HISTORY
//  equipmentHistory[] / dischargeHistory[] = source of truth (append-only)
//  "latest"는 저장하지 않고 항상 revision 최댓값으로부터 파생시킨다.
//
//  case/history.js(HISTORY-001/002/003)와 동일한 원칙을 Asset Repository에
//  적용한다. Snapshot은 "그 시점의 상태"라 pointer(latestSnap)를 저장하는
//  것이 맞지만, Asset Repository는 history만 저장하고 latest는 계산값으로
//  둔다 — 저장된 pointer와 history가 어긋나는 상태 불일치 자체를 없앤다.
//
//  계약:
//    ASSET-HISTORY-001: appendRevision()은 항상 새 배열을 반환한다.
//                        기존 history 항목은 교체·삭제되지 않는다.
//                        (한 번도 Case에서 참조되지 않은 revision도 보존됨)
//    ASSET-HISTORY-002: resolveRevision(id, revision)은 history에서만 조회한다.
//                        별도로 저장된 "현재 상태" 필드를 신뢰 기준으로 삼지 않는다.
//    ASSET-HISTORY-003: getLatestRevision(id)은 history 중 해당 id의
//                        revision 최댓값을 반환한다 — latest는 저장하지 않고
//                        항상 파생시킨다.
//    ASSET-HISTORY-004: 같은 id 안에서 revision이 중복되면 안 된다.
//                        (중복 시 "최신"이 어느 것인지 특정할 수 없다.)
// ════════════════════════════════════════════════════════════════

// ── _revisionKey (내부 전용) ───────────────────────────────────
// 외부에 노출하는 API는 resolveRevision(history, id, revision)을 그대로 유지하되,
// 내부적으로는 `${id}@${revision}` 형태의 정규화된 키를 사용한다.
// 이 키는 이후 Impact Analysis / Report Package / Audit Evidence / PDF 등에서
// 공통 식별자로 재사용할 수 있도록 지금 통일해 둔다.
function _revisionKey(id, revision) {
  return `${id}@${revision}`;
}

// ── appendRevision ─────────────────────────────────────────────
// history를 직접 수정하지 않고 새 배열을 반환.
// rev는 이미 Object.freeze()된 EquipmentRevision/DischargeSystemRevision
// (createEquipment/reviseEquipment 또는 createDischargeSystem/reviseDischargeSystem의 결과)이어야 한다.
function appendRevision(history, rev) {
  const prev = history || [];
  return Object.freeze([...prev, rev]);
}

// ── resolveRevision ────────────────────────────────────────────
// id + revision 조합으로 특정 revision을 조회. history에서만 조회하며
// "현재 상태"를 별도로 참조하지 않는다. 내부적으로 _revisionKey로 정규화해서 비교한다.
function resolveRevision(history, id, revision) {
  if (!history || !id) return null;
  const key = _revisionKey(id, revision);
  return history.find(r => _revisionKey(r.id, r.revision) === key) || null;
}

// ── getLatestRevision ──────────────────────────────────────────
// 저장된 pointer가 아니라, history 중 해당 id의 revision 최댓값을 계산해서 반환.
function getLatestRevision(history, id) {
  if (!history || !id) return null;
  const list = history.filter(r => r.id === id);
  if (list.length === 0) return null;
  return list.reduce((a, b) => (Number(b.revision) > Number(a.revision) ? b : a));
}

// ── getAllLatestRevisions ────────────────────────────────────────
// history 전체에서 id별 최신 revision만 뽑아 "현재 목록"을 파생시킨다.
// AssetMaster 등 UI가 소비하는 리스트는 이 함수의 결과여야 하며,
// history 배열 자체를 그대로 렌더링해서는 안 된다.
function getAllLatestRevisions(history) {
  if (!history) return [];
  const ids = [...new Set(history.map(r => r.id))];
  return ids
    .map(id => getLatestRevision(history, id))
    .filter(Boolean);
}

// ── getRevisionsFor ───────────────────────────────────────────
// 특정 id의 전체 revision 이력을 revision 오름차순으로 반환 (Revision History View용).
function getRevisionsFor(history, id) {
  if (!history || !id) return [];
  return history
    .filter(r => r.id === id)
    .sort((a, b) => Number(a.revision) - Number(b.revision));
}

// ── hasDuplicateRevision ──────────────────────────────────────
// ASSET-HISTORY-004 검증용. 같은 id+revision 조합이 두 번 이상 나오면 true.
function hasDuplicateRevision(history) {
  const h = history || [];
  const keys = h.map(r => _revisionKey(r.id, r.revision));
  return new Set(keys).size !== keys.length;
}


// ── asset/diff.js ──────────────────────────
// ════════════════════════════════════════════════════════════════
//  ASSET REVISION DIFF ENGINE
//  "무엇이 달라졌는가"만 반환하는 순수 함수. 의미 해석(영향도/위험도/
//  MOC 필요 여부/워크플로우 변경)은 포함하지 않는다 — 그건 B3(Impact
//  Analysis)의 책임이다.
//
//    Revision A, Revision B
//          ↓
//    diffEquipmentRevision / diffDischargeSystemRevision   (여기까지만)
//          ↓
//    순수 Diff = [{ field, from, to, unit? }, ...]
//
//  계약:
//    ASSET-DIFF-001: 동일한 revision을 비교하면 빈 배열을 반환한다.
//    ASSET-DIFF-002: 입력 순서를 바꾸면 from/to만 반전되고, 대상 필드와
//                    출력 순서는 그대로다 (비교 자체는 대칭적이다).
//    ASSET-DIFF-003: 값이 바뀌지 않은 필드는 결과에 포함되지 않는다.
//    ASSET-DIFF-004: 입력 객체를 변경하지 않는다 (immutability) —
//                    oldRev/newRev 어느 쪽도 mutate하지 않고, 반환값도
//                    Object.freeze로 고정한다.
//    ASSET-DIFF-005: 출력 순서는 결정론적이다 — 스키마에 정의된 필드
//                    순서를 따르며, 어떤 필드가 "먼저 바뀌었는지"나 입력
//                    객체의 key 순서에 의존하지 않는다.
//
//  id / revision / mocId / registeredAt / revisedAt은 diff 대상에서
//  제외한다 — 이들은 revision마다 정의상 항상 달라지는 식별·감사 메타
//  데이터이고, "설비 사양이 무엇이 달라졌는가"에는 노이즈만 더한다.
//  (MOC 근거 자체는 이미 RevisionHistoryPanel의 MOC 배지로 노출됨)
// ════════════════════════════════════════════════════════════════

const EQUIPMENT_DIFF_FIELDS = [
  ["tag",          null],
  ["location",     null],
  ["deviceType",   null],
  ["manufacturer", null],
  ["model",        null],
  ["serialNo",     null],
  ["mawp",         "barg"],
  ["setPressure",  "barg"],
  ["overpressure", "%"],
  ["orifice",      null],
  ["inletSize",    null],
  ["outletSize",   null],
  ["installedAt",  null],
  // INLET-LOSS-001: inletPiping.* — dot-path 필드. DischargeSystem의
  // L/D/fittingsK와 이름이 겹치므로("L" vs "L") 반드시 접두사를 붙여
  // 구분한다 — 감사 로그에서 "무엇의 L이 바뀌었는지" 모호하면 안 된다.
  ["inletPiping.L",         "m"],
  ["inletPiping.D",         "m"],
  ["inletPiping.fittingsK", null],
];

const DISCHARGE_DIFF_FIELDS = [
  ["name",           null],
  ["destination",    null],
  ["L",              "m"],
  ["D",              "m"],
  ["fittingsK",      null],
  ["headerPressure", "barg"],
  ["connectedTags",  null],
];

// ── _valuesEqual ───────────────────────────────────────────────
// 배열(connectedTags)은 순서 포함 값 비교, 그 외는 단순 비교.
// undefined/null/""은 "값 없음"으로 취급해 동일하게 본다 (스키마 기본값 차이로
// 인한 허위 diff 방지).
function _emptyish(v) {
  return v === undefined || v === null || v === "";
}
function _valuesEqual(a, b) {
  if (_emptyish(a) && _emptyish(b)) return true;
  if (Array.isArray(a) || Array.isArray(b)) {
    return JSON.stringify(a || []) === JSON.stringify(b || []);
  }
  return a === b;
}

// ── _getPath (내부 전용) ──────────────────────────────────────
// "inletPiping.L" 같은 1-depth 점(.) 경로를 읽는다. 중간 객체가
// null/undefined면 undefined를 반환(값 없음 취급) — _emptyish와 호환.
function _getPath(obj, path) {
  if (!obj) return undefined;
  if (path.indexOf(".") === -1) return obj[path];
  return path.split(".").reduce((acc, key) => (acc == null ? acc : acc[key]), obj);
}

// ── _diffFields (내부 전용) ───────────────────────────────────
function _diffFields(oldRev, newRev, fieldSpec) {
  if (!oldRev || !newRev) return Object.freeze([]);
  const changes = [];
  for (const [field, unit] of fieldSpec) {
    const from = _getPath(oldRev, field);
    const to = _getPath(newRev, field);
    if (!_valuesEqual(from, to)) {
      changes.push(Object.freeze(
        unit ? { field, from, to, unit } : { field, from, to }
      ));
    }
  }
  return Object.freeze(changes);
}

// ── diffEquipmentRevision ────────────────────────────────────
function diffEquipmentRevision(oldRev, newRev) {
  return _diffFields(oldRev, newRev, EQUIPMENT_DIFF_FIELDS);
}

// ── diffDischargeSystemRevision ──────────────────────────────
function diffDischargeSystemRevision(oldRev, newRev) {
  return _diffFields(oldRev, newRev, DISCHARGE_DIFF_FIELDS);
}


// ── asset/impact.js ──────────────────────────
// ════════════════════════════════════════════════════════════════
//  ASSET REVISION IMPACT ANALYSIS ENGINE
//  "이 Asset Revision이 어디에 쓰였는가"만 계산하는 순수 함수.
//  위험도 판단이나 워크플로우 재평가는 하지 않는다 — Snapshot에 이미
//  박제된 workflowDecision을 그대로 읽어 보여줄 뿐, Engine 판정 로직을
//  여기서 다시 돌리지 않는다.
//
//    revisionKey (= `${id}@${revision}`, asset/history.js와 동일 키)
//          ↓
//    analyzeRevisionImpact(revisionKey, allSnapshots)
//          ↓
//    { affectedCases, affectedSnapshots, latestAffected, obsoleteSnapshots }
//
//  allSnapshots는 case.snapshotHistory[]를 모든 Case에 대해 이어붙인
//  평탄화 배열이다 (예: cases.flatMap(c => c.snapshotHistory || [])).
//  각 Snapshot이 이미 assetRefs.equipmentId/equipmentRevision,
//  dischargeSystemId/dischargeRevision을 갖고 있으므로 caseId만으로
//  역인덱스를 구성할 수 있다 — case/history.js에 대한 의존은 없다.
//
//  계약:
//    ASSET-IMPACT-001: 일치하는 Snapshot이 없으면 4개 필드 모두 빈 배열.
//    ASSET-IMPACT-002: affectedCases는 caseId 중복이 없다.
//    ASSET-IMPACT-003: affectedSnapshots의 모든 원소는 실제로 해당
//                       revisionKey를 참조한다 — 같은 Asset의 다른
//                       revision과 섞이지 않는다.
//    ASSET-IMPACT-004: latestAffected와 obsoleteSnapshots는 affectedSnapshots를
//                       정확히 둘로 나눈다 (합집합 = affectedSnapshots,
//                       교집합 = 공집합). "여전히 최신 검토로 쓰이는가"
//                       (latestAffected) vs "이미 새 Snapshot으로 대체됐는가"
//                       (obsoleteSnapshots).
//    ASSET-IMPACT-005: 입력 배열(allSnapshots)을 변경하지 않는다.
// ════════════════════════════════════════════════════════════════

// ── _parseRevisionKey (내부 전용) ────────────────────────────
// asset/history.js의 _revisionKey(id, revision)와 정확히 대칭.
function _parseRevisionKey(revisionKey) {
  if (!revisionKey || typeof revisionKey !== "string") return null;
  const idx = revisionKey.lastIndexOf("@");
  if (idx === -1) return null;
  return { id: revisionKey.slice(0, idx), revision: Number(revisionKey.slice(idx + 1)) };
}

// ── _matchesRevision (내부 전용) ─────────────────────────────
// Snapshot.assetRefs 중 어느 쪽(equipment/discharge)을 볼지는 id 접두어로 판별.
// (asset/schema.js의 createEquipment/createDischargeSystem이 각각
//  `EQ-...`/`DS-...`로 id를 부여하므로 접두어가 곧 kind다.)
function _matchesRevision(snap, id, revision) {
  const refs = snap && snap.assetRefs;
  if (!refs) return false;
  if (id.indexOf("EQ-") === 0) {
    return refs.equipmentId === id && Number(refs.equipmentRevision) === revision;
  }
  if (id.indexOf("DS-") === 0) {
    return refs.dischargeSystemId === id && Number(refs.dischargeRevision) === revision;
  }
  return false;
}

// ── _latestSnapshotByCase (내부 전용) ────────────────────────
// caseId별 마지막 등장 Snapshot = 그 Case의 최신 Snapshot.
// (allSnapshots는 각 case.snapshotHistory의 append 순서를 보존한 채
//  이어붙인 배열이라고 가정 — case 내부에서 뒤에 나올수록 최신.)
function _latestSnapshotByCase(allSnapshots) {
  const map = new Map();
  for (const s of allSnapshots) {
    if (s && s.caseId) map.set(s.caseId, s);
  }
  return map;
}

// ── analyzeRevisionImpact ────────────────────────────────────
function analyzeRevisionImpact(revisionKey, allSnapshots) {
  const empty = Object.freeze({
    affectedCases:     Object.freeze([]),
    affectedSnapshots: Object.freeze([]),
    latestAffected:    Object.freeze([]),
    obsoleteSnapshots: Object.freeze([]),
  });

  const parsed = _parseRevisionKey(revisionKey);
  if (!parsed || !allSnapshots || allSnapshots.length === 0) return empty;

  const { id, revision } = parsed;
  const affectedSnapshots = allSnapshots.filter(s => _matchesRevision(s, id, revision));
  if (affectedSnapshots.length === 0) return empty;

  const affectedCases = [...new Set(affectedSnapshots.map(s => s.caseId))];
  const latestByCase  = _latestSnapshotByCase(allSnapshots);

  const latestAffected    = affectedSnapshots.filter(s => latestByCase.get(s.caseId) === s);
  const obsoleteSnapshots = affectedSnapshots.filter(s => latestByCase.get(s.caseId) !== s);

  return Object.freeze({
    affectedCases:     Object.freeze(affectedCases),
    affectedSnapshots: Object.freeze(affectedSnapshots),
    latestAffected:    Object.freeze(latestAffected),
    obsoleteSnapshots: Object.freeze(obsoleteSnapshots),
  });
}


// ── case/history.js ──────────────────────────
//  CASE SNAPSHOT HISTORY
//  case.snapshotHistory[] = source of truth (append-only)
//  case.latestSnap        = UI 편의용 pointer (검증에 사용 금지)
//
//  계약:
//    HISTORY-001: appendSnapshot()은 항상 새 배열을 반환한다.
//                 기존 history 항목은 교체·삭제되지 않는다.
//    HISTORY-002: resolveSnapshot(hash)은 snapshotHistory에서만 조회한다.
//                 latestSnap을 신뢰 기준으로 사용하지 않는다.
//    HISTORY-003: 같은 case 안에서 snapshotHash가 중복되면 안 된다.
//                 (중복 시 Approval이 어떤 버전을 서명했는지 특정할 수 없다.)
// ════════════════════════════════════════════════════════════════

// ── appendSnapshot ─────────────────────────────────────────────
// caseObj를 직접 수정하지 않고 새 caseObj를 반환.
// snap은 이미 Object.freeze()된 Snapshot이어야 한다 (createSnapshot()의 결과).
function appendSnapshot(caseObj, snap) {
  const prevHistory = caseObj.snapshotHistory || [];
  const nextHistory = Object.freeze([...prevHistory, snap]);
  return {
    ...caseObj,
    snapshotHistory: nextHistory,
    latestSnap:      snap,        // pointer only — 표시 편의용
    workflow:        snap.workflow,
  };
}

// ── resolveSnapshot ────────────────────────────────────────────
// snapshotHash로 특정 Snapshot을 조회. latestSnap은 절대 참조하지 않음.
// Approval 검증은 반드시 이 함수를 통해서만 Snapshot을 가져와야 한다.
function resolveSnapshot(caseObj, snapshotHash) {
  if (!caseObj?.snapshotHistory || !snapshotHash) return null;
  return caseObj.snapshotHistory.find(s => s.snapshotHash === snapshotHash) || null;
}

// ── getLatestSnapshot ──────────────────────────────────────────
// latestSnap 포인터 대신 history의 마지막 항목을 기준으로 계산.
// pointer와 history가 어긋나는 경우(향후 버그) 이 함수가 진짜 값을 반환한다.
function getLatestSnapshot(caseObj) {
  const h = caseObj?.snapshotHistory;
  if (!h || h.length === 0) return null;
  return h[h.length - 1];
}

// ── hasDuplicateHash ───────────────────────────────────────────
// HISTORY-003 검증용. 같은 hash가 두 번 이상 나오면 true.
function hasDuplicateHash(caseObj) {
  const h = caseObj?.snapshotHistory || [];
  const hashes = h.map(s => s.snapshotHash);
  return new Set(hashes).size !== hashes.length;
}


// ── approval/validator.js ──────────────────────────
//  APPROVAL VALIDATOR
//  Report/승인 화면이 ApprovalRecord의 신뢰성을 확인할 때 호출하는 유일한 진입점.
//  서명 재계산은 crypto.js에, Snapshot 조회는 case/history.js에 위임한다 —
//  이 파일은 그 결과를 조합해 최종 valid/invalid만 판정한다.
//
//  계약:
//    VALIDATOR-001: record.signature가 record 필드로부터 재계산한 값과
//                   일치해야 한다 (위변조 탐지).
//    VALIDATOR-002: record.snapshotHash가 case.snapshotHistory에 실존해야
//                   한다. resolveSnapshot 실패 = 존재한 적 없는 버전에 대한
//                   서명 — 즉 승인 대상 자체가 위조되었다는 뜻.
//    VALIDATOR-003: 전체 승인 이력 안에 동일 idempotencyKey가 2회 이상
//                   나오면 invalid (SERVICE-001을 우회해 만들어진 기록).
// ════════════════════════════════════════════════════════════════

async function verifyApprovalRecord(record, caseObj, allApprovals) {
  if (!record) return { valid: false, reason: "record is null" };

  // VALIDATOR-001: 서명 재계산 (crypto.js에 위임)
  const sigCheck = await verifySignature({
    snapshotHash:  record.snapshotHash,
    decision:      record.decision,
    comment:       record.comment,
    signer:        record.approver,
    timestamp:     record.approvedAt,
    workflowState: record.workflowState,
    signature:     record.signature,
  });
  if (!sigCheck.valid) {
    return { valid: false, contract: "VALIDATOR-001", ...sigCheck };
  }

  // VALIDATOR-002: 서명 대상 Snapshot이 실제로 history에 존재하는지
  // (UI pointer가 아니라 resolveSnapshot으로만 조회 — HISTORY-002 준수)
  const targetSnap = resolveSnapshot(caseObj, record.snapshotHash);
  if (!targetSnap) {
    return {
      valid: false, contract: "VALIDATOR-002",
      reason: "snapshotHash not found in case.snapshotHistory",
    };
  }

  // 기존 APPROVAL-002 검증 재사용 (snapshotId 교차 확인)
  const baseCheck = verifyApproval(record, targetSnap);
  if (!baseCheck.valid) {
    return { valid: false, contract: "APPROVAL-002", ...baseCheck };
  }

  // VALIDATOR-003: idempotency 중복 검사
  const dupCount = (allApprovals || [])
    .filter(r => r.idempotencyKey === record.idempotencyKey).length;
  if (dupCount > 1) {
    return {
      valid: false, contract: "VALIDATOR-003",
      reason: "duplicate idempotencyKey found in approval history",
    };
  }

  return {
    valid: true,
    approver: record.approver,
    approvedAt: record.approvedAt,
    snapshotWorkflow: targetSnap.workflow,
  };
}


// ── report/schema.js ──────────────────────────
//  REPORT PACKAGE SCHEMA
//  Snapshot을 최종 출력(PDF/HTML/JSON)과 분리시키는 계약 레이어.
//  이 파일은 "형태가 맞는지"만 검증한다 — 계산도, Asset 재조회도, Approval
//  재판단도 하지 않는다. buildReportPackage()가 만든 결과를 사후 점검할 때만 쓴다.
//
//  계약:
//    REPORT-PKG-002: ReportPackage는 생성 이후 절대 수정되지 않는다(freeze).
// ════════════════════════════════════════════════════════════════

const REPORT_PACKAGE_VERSION = "1.0.0";

const REPORT_PACKAGE_REQUIRED_KEYS = [
  "meta", "identity", "asset", "calculation", "workflow", "approvals",
];

// ── validateReportPackage ──────────────────────────────────────
// 순수 형태 검증. true/false 판단 로직(계산)이 전혀 없다 — 키 존재 확인뿐.
function validateReportPackage(pkg) {
  if (!pkg || typeof pkg !== "object") {
    return { ok: false, reason: "package is not an object" };
  }
  // ENGINE-VERSION-LOCK-001: buildReportPackage가 이미 판정해 넘긴 실패
  // 사유를 그대로 통과시킨다 — "missing keys" 같은 일반 메시지로 뭉개지 않는다.
  if (pkg.ok === false && pkg.contract === "ENGINE-VERSION-LOCK-001") {
    return { ok: false, reason: pkg.detail || "INVALID_STATE: engine version mismatch", contract: pkg.contract };
  }
  const missing = REPORT_PACKAGE_REQUIRED_KEYS.filter(k => !(k in pkg));
  if (missing.length > 0) {
    return { ok: false, reason: `missing keys: ${missing.join(", ")}` };
  }
  if (pkg.meta.packageVersion !== REPORT_PACKAGE_VERSION) {
    return { ok: false, reason: `unsupported packageVersion: ${pkg.meta.packageVersion}` };
  }
  if (!pkg.identity.snapshotHash) {
    return { ok: false, reason: "identity.snapshotHash missing — package has no signable identity" };
  }
  return { ok: true };
}


// ── report/createPackage.js ──────────────────────────
//  REPORT PACKAGE — Snapshot → 불변 export 모델
//  PDF/HTML/JSON은 전부 이 결과물을 그대로 출력만 한다. 렌더러가 UI 구조에
//  결합되지 않도록 하는 게 이 파일의 유일한 목적.
//
//  계약:
//    REPORT-PKG-001: 같은 snapshot(+같은 generatedAt) → 항상 같은 package.
//                    (generatedAt은 "패키지를 만든 시각"이라 순수함수가 직접
//                    생성하면 결정론이 깨진다 — 호출자가 주입, 기본값은 폴백일 뿐)
//    REPORT-PKG-002: 결과는 Object.freeze — 이후 어떤 필드도 수정 불가.
//    REPORT-PKG-003: snapshot 하나만 받는다. currentEquipment/currentDischargeSystem/
//                    equipments/dischargeSystems 같은 "현재 Asset" 인자는 받지 않는다.
//                    Asset은 반드시 snapshot에 이미 박제된 값(assetRefs, snapshot.equipment,
//                    snapshot.dischargeSystem)에서만 읽는다.
//    REPORT-PKG-004: approvals는 snapshotHash가 일치하는 것만 포함한다.
//    REPORT-PKG-005: computeBackpressure/calculateKb/detectMOC 등 계산 함수를
//                    이 파일에서 호출하지 않는다 — snapshot.result를 그대로 옮길 뿐.
// ════════════════════════════════════════════════════════════════

// ── buildReportPackage ──────────────────────────────────────────
// snapshot:        createSnapshot()이 만든 frozen Snapshot (필수)
// opts.approvalRecords:          이 case의 ApprovalRecord[] (없으면 [])
// opts.approvalVerificationResults: { [approvalId]: {valid, ...} } —
//                  validator.js(verifyApprovalRecord)가 미리 계산해 넘긴 결과.
//                  이 함수는 절대 재검증하지 않는다.
// opts.generatedAt: 패키지 생성 시각 문자열(ISO). 안 주면 이 함수가 생성 —
//                  결정론 테스트에서는 반드시 명시적으로 넘겨야 한다.
function buildReportPackage(snapshot, opts) {
  if (!snapshot || !snapshot.snapshotHash) {
    return { ok: false, reason: "REPORT-PKG: snapshot(with snapshotHash) is required" };
  }
  // ENGINE-VERSION-LOCK-001: 이 Snapshot이 만들어진 엔진 버전과 지금
  // 돌고 있는 Engine의 버전이 다르면 ReportPackage를 만들지 않는다.
  // (예: 과거 엔진 버전으로 얼어붙은 Snapshot을 새 엔진 코드 위에서
  // 그대로 재출력하면 계산 근거와 화면/PDF 표시가 어긋날 수 있다.)
  // Snapshot 자체는 그 시점 값 그대로 유지되는 게 맞다 — 여기서 재계산하지
  // 않고, "지금 이 버전으로 새 ReportPackage를 만드는 것"만 차단한다.
  if (snapshot.engine_version !== ENGINE_VERSION) {
    return {
      ok: false,
      reason: "INVALID_STATE",
      contract: "ENGINE-VERSION-LOCK-001",
      detail: `snapshot.engine_version(${snapshot.engine_version}) !== ` +
              `현재 ENGINE_VERSION(${ENGINE_VERSION}) — 엔진 버전이 바뀐 뒤 ` +
              `이전 Snapshot으로 새 ReportPackage를 생성할 수 없다.`,
    };
  }
  const { approvalRecords, approvalVerificationResults, generatedAt } = opts || {};
  const genAt = generatedAt || new Date().toISOString();

  const matchedApprovals = (approvalRecords || [])
    .filter(a => a.snapshotHash === snapshot.snapshotHash)
    .map(a => Object.freeze({
      approvalId:  a.approvalId,
      signer:      a.approver,
      role:        a.role,
      approvedAt:  a.approvedAt,
      decision:    a.decision,
      comment:     a.comment,
      signature:   a.signature,
      verified:    (approvalVerificationResults || {})[a.approvalId]?.valid ?? null,
    }));

  const pkg = {
    meta: Object.freeze({
      packageVersion: REPORT_PACKAGE_VERSION,
      generatedAt:    genAt,
      engineVersion:  snapshot.engine_version,
    }),

    identity: Object.freeze({
      caseId:       snapshot.caseId,
      snapshotId:   snapshot.id,
      snapshotHash: snapshot.snapshotHash,
    }),

    asset: Object.freeze({
      equipment: Object.freeze({
        id:       snapshot.assetRefs.equipmentId,
        tag:      snapshot.assetRefs.equipmentTag,
        revision: snapshot.assetRefs.equipmentRevision,
        mocId:    snapshot.equipment?.mocId ?? null,
        // INLET-LOSS-001: PDF/Evidence의 인입배관 형상 표시(pkg.asset.
        // equipment.inletPiping)가 이 필드를 직접 읽는다 — 여기 없으면
        // 실제 데이터가 있어도 "미등록"으로 잘못 표시된다. 재계산 없이
        // snapshot에 이미 박제된 값을 그대로 복사(REPORT-PKG-005와 동일 원칙).
        inletPiping: snapshot.equipment?.inletPiping
          ? { L: snapshot.equipment.inletPiping.L, D: snapshot.equipment.inletPiping.D, fittingsK: snapshot.equipment.inletPiping.fittingsK }
          : null,
      }),
      dischargeSystem: Object.freeze({
        id:       snapshot.assetRefs.dischargeSystemId,
        name:     snapshot.assetRefs.dischargeSystemName,
        revision: snapshot.assetRefs.dischargeRevision,
        mocId:    snapshot.dischargeSystem?.mocId ?? null,
        // Backpressure Basis — 감사자가 "이 Kb가 어떤 배관 형상에서 나왔는지"를
        // 봐야 하므로 snapshot.dischargeSystem(당시 박제된 값)에서 그대로 복사.
        // 재계산 없음 — REPORT-PKG-005.
        L:              snapshot.dischargeSystem?.L ?? null,
        D:              snapshot.dischargeSystem?.D ?? null,
        fittingsK:      snapshot.dischargeSystem?.fittingsK ?? null,
        headerPressure: snapshot.dischargeSystem?.headerPressure ?? null,
        destination:    snapshot.dischargeSystem?.destination ?? null,
      }),
      assetFingerprint: snapshot.assetRefs.assetFingerprint,
    }),

    calculation: Object.freeze({
      engineVersion: snapshot.engine_version,
      inputs:        Object.freeze({ ...snapshot.inputs }),   // 재계산 없이 그대로 복사
      result:        Object.freeze({ ...snapshot.result }),   // 재계산 없이 그대로 복사
    }),

    workflow: Object.freeze({
      state: snapshot.workflow,
      decision: snapshot.workflowDecision ? Object.freeze({
        reasons:       Object.freeze([...(snapshot.workflowDecision.reasons || [])]),
        evaluatedAt:   snapshot.workflowDecision.evaluatedAt,
        engineVersion: snapshot.workflowDecision.engineVersion,
      }) : null,
    }),

    approvals: Object.freeze(matchedApprovals),
  };

  return Object.freeze(pkg);
}


// ── report/renderer/pdf/styles.js ──────────────────────────
//  PDF STYLES
//  renderPDF()가 만드는 인쇄용 HTML에 삽입되는 순수 CSS 문자열.
//  계산/로직 없음 — 스타일 상수만.

  }

  .pdf-row {
    display: flex; justify-content: space-between;

  }
  .pdf-row:last-child { border-bottom: none; }
  .pdf-row .k { color: #475569; font-family: 'Pretendard','Malgun Gothic',sans-serif; }
  .pdf-row .v { font-weight: 700; font-family: monospace; }
  .pdf-badge-ok    { color: #16a34a; font-weight: 700; }
  .pdf-badge-fail  { color: #dc2626; font-weight: 700; }

// ── report/renderer/pdf/template.js ──────────────────────────
//  PDF TEMPLATE
//  Presentation Dictionary(raw 값 → 사람이 읽는 라벨) + HTML 문서 조립.
//  Raw Evidence(ReportPackage) → Presentation Dictionary → HTML, 순서 고정.
//
//  계약:
//    PDF-002: buildPDFHtml(reportPackage) — reportPackage 하나만 받는다.
//             snapshot/equipment/caseData 등 다른 인자를 받지 않는다.
//    PDF-004: Asset/Calculation/Workflow/Approval/Integrity 5개 섹션 전부 출력.
//
//  이 파일은 renderer 전용 dictionary를 별도로 둔다 — components/report/*의
//  FLUID_CHOICES/WF_LABEL을 재사용하지 않는다. renderer는 UI 컴포넌트 트리와
//  완전히 독립적이어야(서버/CLI로 옮겨도 동작) 하기 때문에 의도적으로 중복시킨다.
// ════════════════════════════════════════════════════════════════

// ── Presentation Dictionary ────────────────────────────────────
const PDF_FLUID_LABELS = [
  { M:44, k:1.30, label:"CO₂ — 이산화탄소" },
  { M:28, k:1.40, label:"N₂ — 질소" },
  { M:18, k:1.33, label:"Steam — 수증기" },
  { M:29, k:1.40, label:"Air — 공기" },
  { M:16, k:1.31, label:"CH₄ — 메탄" },
];

const PDF_WF_STATE_LABELS = {
  DRAFT:           "초안",
  INSPECTION:      "점검 중",
  REVIEW:          "검토 대기",
  ACTION_REQUIRED: "조치 필요",
  APPROVED:        "승인 완료",
  CLOSED:          "종결",
};

function _pdfFluidLabel(inputs) {
  if (!inputs) return "커스텀";
  const m = PDF_FLUID_LABELS.find(f => f.M === inputs.M && f.k === inputs.k);
  return m ? m.label : "커스텀 유체 (직접 입력값)";
}

function _pdfWfLabel(state) {
  return PDF_WF_STATE_LABELS[state] || state || "—";
}

function _pdfRow(k, v) {
  return `<div class="pdf-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

function _pdfSection(title, bodyHtml) {
  return `<div class="pdf-section">
    <div class="pdf-section-title">${title}</div>
    <div class="pdf-section-body">${bodyHtml}</div>
  </div>`;
}

const PDF_CHECKLIST_ITEMS = [
  { key:"capacityOK",     label:"방출용량 충족",    detail:"선정 오리피스 면적이 필요 면적 이상인지 확인" },
  { key:"backPressureOK", label:"배압(背壓) 허용 범위 이내", detail:"배출 배관에 걸리는 반대 압력이 밸브 작동을 방해하지 않는 범위인지 확인" },
  { key:"mawpOK",         label:"설정압이 최고허용운전압력(MAWP) 이내",    detail:"설정압이 설비가 견딜 수 있는 최고압력을 넘지 않는지 확인" },
  { key:"kdOK",           label:"방출계수 Kd 충족",         detail:"밸브가 실제로 얼마나 잘 배출하는지 나타내는 보정값, 최소 권고 기준(0.9 이상) 충족 여부" },
  { key:"marginOK",       label:"여유율 충분",     detail:"필요량보다 여유있게 설계됐는지 — 선정 오리피스 면적의 여유 정도(1.0배 이상)" },
  { key:"accumulationOK", label:"축적압력 허용 범위 이내 (Overpressure Guardrail)",
    detail:"실제 축적압력(1+OP/100)이 밸브 개수·화재 시나리오에 따른 허용 한도를 넘지 않는지 확인 — 초과 시 자동 보정 없이 NO-GO" },
  { key:"inletLossOK",    label:"인입배관 압력손실 허용 범위 이내",
    detail:"안전밸브 인입배관 내 압력손실이 설정압력의 허용 비율을 넘지 않는지 확인 (KOSHA D-18-2020 §7.2(1))" },
];

function _pdfVerdictSection(checklist, backpress, accumulation, inletLoss, dataGaps, verdict) {
  if (!checklist) return "";
  // INLET-LOSS-001: verdict는 Engine의 computeAdequacyVerdict() 결과를
  // 그대로 받는다 — PDF가 checklist.every(Boolean)을 다시 계산하지 않는다
  // (dataGaps 있으면 GO가 아니어야 하는데, 재계산하면 이 규칙이 깨진다).
  const v = verdict || (Object.values(checklist).every(Boolean) ? "GO" : "NO_GO");
  const allOK = v === "GO";
  const insufficientInput = v === "INSUFFICIENT_INPUT";
  const vtLabel = backpress?.valveType==="BELLOWS" ? "벨로우즈형(밸런스형)" : "스프링식";
  const allowPct = backpress?.allowableRatio!=null ? (backpress.allowableRatio*100).toFixed(0) : "10";
  const accAllowPct = accumulation?.allowableRatio!=null ? (accumulation.allowableRatio*100).toFixed(0) : "110";
  const accScenarioLabel = accumulation
    ? (accumulation.fireScenario ? "화재 보호 목적" : `비화재, 밸브 ${accumulation.valveCount>=2?"2개 이상":"1개"} 설치`)
    : "";
  const accActualPct = accumulation?.actualRatio!=null ? (accumulation.actualRatio*100).toFixed(0) : null;
  const items = PDF_CHECKLIST_ITEMS
    // A안: inletLossOK는 계산 가능할 때만 checklist에 존재 — 없으면
    // 항목 자체를 판정 리스트에서 빼고, 대신 아래 dataGaps 안내로 대체.
    .filter(it => it.key !== "inletLossOK" || Object.prototype.hasOwnProperty.call(checklist, "inletLossOK"))
    .map(it => {
      if (it.key === "backPressureOK") {
        return { ...it, detail:`배출 배관에 걸리는 반대 압력이 밸브 작동을 방해하지 않는 범위인지 확인 — ${vtLabel} 기준 설정압력의 ${allowPct}% 이내 (KOSHA D-18 §7.2(4))` };
      }
      if (it.key === "accumulationOK") {
        return { ...it, detail:`현재 축적압력 ${accActualPct ?? "—"}% — ${accScenarioLabel} 기준 허용 한도 ${accAllowPct}% 이내인지 확인 (KOSHA D-18 §4.4). 초과 시 자동 보정 없이 NO-GO` };
      }
      if (it.key === "inletLossOK" && inletLoss?.pressureLossAvailable) {
        const pct = inletLoss.pressureLossRatio!=null ? (inletLoss.pressureLossRatio*100).toFixed(2) : "—";
        const allowPct = inletLoss.allowableRatio!=null ? (inletLoss.allowableRatio*100).toFixed(0) : "—";
        return { ...it, detail:`실제 압력손실비 ${pct}% — 설정압력의 ${allowPct}% 이내인지 확인 (KOSHA D-18-2020 §7.2(1))` };
      }
      return it;
    });
  const rows = items.map(({key,label,detail}) => {
    const ok = checklist[key];
    return `<div class="pdf-row" style="align-items:flex-start;">
      <span class="k" style="font-family:'Pretendard','Malgun Gothic',sans-serif;color:#1a2b3d;">
        <span style="font-weight:700;">${ok ? "✓" : "✗"} ${label}</span><br/>
        <span style="font-weight:400;color:#64748b;font-size:9px;">${detail}</span>
      </span>
      <span class="${ok ? "pdf-badge-ok" : "pdf-badge-fail"}" style="font-family:'Pretendard','Malgun Gothic',sans-serif;white-space:nowrap;">${ok ? "충족" : "미충족"}</span>
    </div>`;
  }).join("");
  const dataGapNote = (dataGaps && dataGaps.length > 0)
    ? `<div class="pdf-row" style="align-items:flex-start;background:#fff7e6;">
         <span class="k" style="font-family:'Pretendard','Malgun Gothic',sans-serif;color:#92400e;">
           <span style="font-weight:700;">! 판정 보류 — 입력 부족 (INSUFFICIENT INPUT)</span><br/>
           <span style="font-weight:400;color:#92400e;font-size:9px;">${dataGaps.join(", ")} 데이터가 없어 전체 판정을 확정할 수 없습니다 — 이 상태는 적정(GO)으로 취급하지 않습니다.</span>
         </span>
       </div>`
    : "";
  const verdictLabel = insufficientInput
    ? "판정 보류 — 입력 부족으로 적정성을 확정할 수 없습니다"
    : allOK ? "적정 — API 520/521 기준을 모두 충족합니다" : "부적정 — 기준 미충족 항목이 있어 조치가 필요합니다";
  const verdictColor = insufficientInput ? "#92400e" : allOK ? "#2e7d32" : "#c0392b";
  return `<div class="pdf-section">
    <div class="pdf-section-title">⓪ 최종 판정 — 이 검토의 결론</div>
    <div class="pdf-section-body">
      <div style="font-size:13px;font-weight:900;color:${verdictColor};margin-bottom:8px;">${verdictLabel}</div>
      ${dataGapNote}
      ${rows}
    </div>
  </div>`;
}

// ── buildPDFHtml ────────────────────────────────────────────────
// reportPackage 하나만 받는다. 계산/조회 없음 — package 필드를 그대로 문자열로 옮길 뿐.
function buildPDFHtml(reportPackage) {
  const pkg = reportPackage;

  const assetBody =
    _pdfRow("설비 (Tag No.)", `${pkg.asset.equipment.tag || "—"} · 개정 Rev.${pkg.asset.equipment.revision ?? "—"}`) +
    _pdfRow("설비 변경관리번호 (MOC)", pkg.asset.equipment.mocId || "—") +

    _pdfRow("배출계통 변경관리번호 (MOC)", pkg.asset.dischargeSystem.mocId || "—");

  const calcBody =
    _pdfRow("유체 종류", _pdfFluidLabel(pkg.calculation.inputs)) +

    _pdfRow("계산 방식 (계산 엔진 버전)", `API 520 방식 v${pkg.calculation.engineVersion}`) +
    _pdfRow("압축계수 Z (이상기체와의 차이 보정값)", pkg.calculation.inputs?.Z != null ? `${pkg.calculation.inputs.Z}${pkg.calculation.inputs.Z===1 ? " (기본값)" : ""}` : "—") +
    _pdfRow("분출압력 (절대압 기준)", pkg.calculation.result?.P1abs ? `${pkg.calculation.result.P1abs.toFixed(3)} bar(절대압)` : "—") +
    _pdfRow("선정 오리피스 (밸브 유량 구멍 규격)", pkg.calculation.result?.selected?.letter || "—") +
    _pdfRow("필요 유량 면적", pkg.calculation.result?.areaCm2 ? `${pkg.calculation.result.areaCm2.toFixed(2)} cm²` : "—") +
    `<div style="margin-top:6px;font-size:9px;font-weight:700;color:#64748b;letter-spacing:0.5px;">배압(背壓) 산정 근거 — 배출 배관이 밸브 작동을 방해하지 않는지 확인하는 값들</div>` +
    _pdfRow("배출 헤더 압력", pkg.asset.dischargeSystem.headerPressure != null ? `${pkg.asset.dischargeSystem.headerPressure} bar(게이지압)` : "—") +
    _pdfRow("배관 길이",     pkg.asset.dischargeSystem.L != null ? `${pkg.asset.dischargeSystem.L} m` : "—") +
    _pdfRow("배관 내경",        pkg.asset.dischargeSystem.D != null ? `${Math.round(pkg.asset.dischargeSystem.D*1000)} mm` : "—") +
    _pdfRow("배관 부속 저항계수 (ΣK)",      pkg.asset.dischargeSystem.fittingsK ?? "—") +
    `<div style="margin-top:6px;font-size:9px;font-weight:700;color:#64748b;letter-spacing:0.5px;">축적압력 산정 근거 — 이 Overpressure가 시나리오상 허용되는지 확인하는 값들 (KOSHA D-18 §4.4)</div>` +
    _pdfRow("밸브 설치 수량", pkg.calculation.inputs?.valveCount >= 2 ? "2개 이상" : "1개") +
    _pdfRow("설치 목적", pkg.calculation.inputs?.fireScenario === true ? "화재 보호 목적" : "화재 보호 목적 아님") +
    _pdfRow("초과압력 Overpressure (OP)", pkg.calculation.inputs?.OP != null ? `${pkg.calculation.inputs.OP}%` : "—") +
    _pdfRow("실제/허용 축적압력", pkg.calculation.result?.stepData?.accumulation
      ? `${(pkg.calculation.result.stepData.accumulation.actualRatio*100).toFixed(0)}% / ${(pkg.calculation.result.stepData.accumulation.allowableRatio*100).toFixed(0)}% 이하`
      : "—") +
    `<div style="margin-top:6px;font-size:9px;font-weight:700;color:#64748b;letter-spacing:0.5px;">인입배관 압력손실 산정 근거 — 설치대상 용기~안전밸브 인입 플랜지 사이 (KOSHA D-18-2020 §7.2(1))</div>` +
    _pdfRow("인입배관 길이/내경/저항계수(ΣK)", pkg.asset.equipment?.inletPiping

      : "미등록") +
    _pdfRow("인입배관 압력손실", pkg.calculation.result?.stepData?.inletLoss?.pressureLossAvailable
      ? `${pkg.calculation.result.stepData.inletLoss.pressureLoss.toFixed(4)} bar`
      : "계산 불가 (입력 부족)") +
    _pdfRow("허용 압력손실 (설정압력×허용비율)", pkg.calculation.result?.stepData?.inletLoss?.allowablePressureLoss != null
      ? `${pkg.calculation.result.stepData.inletLoss.allowablePressureLoss.toFixed(4)} bar (${(pkg.calculation.result.stepData.inletLoss.allowableRatio*100).toFixed(0)}%)`
      : "—") +
    _pdfRow("판정", (() => {
      const il = pkg.calculation.result?.stepData?.inletLoss;
      if (!il) return "—";
      if (!il.pressureLossAvailable) return "판정 보류 (INSUFFICIENT INPUT)";
      return il.pressureLossOK ? `GO (${(il.pressureLossRatio*100).toFixed(2)}%)` : `NO-GO (${(il.pressureLossRatio*100).toFixed(2)}%)`;
    })());

  const reasons = (pkg.workflow.decision?.reasons || [])
    .map(r => `<div class="pdf-reason-item">· ${r.field} ${r.from}${r.unit||""} → ${r.to}${r.unit||""}</div>`)
    .join("");
  const wfBody =
    _pdfRow("현재 상태", _pdfWfLabel(pkg.workflow.state)) +
    _pdfRow("판정 일시", (pkg.workflow.decision?.evaluatedAt || "—").slice(0,19).replace("T"," ")) +

  const approvalBody = pkg.approvals.length === 0
    ? `<div class="pdf-row"><span class="k">서명 상태</span><span class="pdf-badge-none">서명 없음</span></div>`
    : pkg.approvals.map(a => {
        const badgeClass = a.verified === true ? "pdf-badge-ok"

                          : a.verified === false ? "✗ 위변조 의심" : "검증 안 됨";

    _pdfRow("스냅샷 해시값 (위변조 확인용 고유값)", pkg.identity.snapshotHash) +
    _pdfRow("스냅샷 ID", pkg.identity.snapshotId) +
    _pdfRow("검토 건 번호 (Case ID)", pkg.identity.caseId) +
    _pdfRow("리포트 형식 버전", pkg.meta.packageVersion) +
    _pdfRow("생성 일시", (pkg.meta.generatedAt||"").slice(0,19).replace("T"," "));

  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>ArcSafe 검토 보고서 — ${pkg.identity.snapshotId}</title>
<style>${PDF_STYLES}</style>
</head><body>
  <div class="pdf-title">PSV 검토 감사 보고서</div>
  <div class="pdf-subtitle">${pkg.identity.caseId} · ${pkg.identity.snapshotId}</div>

  ${_pdfVerdictSection(pkg.calculation.result?.checklist, pkg.calculation.result?.stepData?.backpress, pkg.calculation.result?.stepData?.accumulation, pkg.calculation.result?.stepData?.inletLoss, pkg.calculation.result?.dataGaps, pkg.calculation.result?.verdict)}
  ${_pdfSection("① 설비 정보", assetBody)}
  ${_pdfSection("② 계산 근거", calcBody)}
  ${_pdfSection("③ 검토 진행 상태", wfBody)}
  ${_pdfSection("④ 승인 현황", approvalBody)}
  ${_pdfSection("⑤ 문서 무결성 (변조 확인용)", integrityBody)}

  <div class="pdf-footer">
    ArcSafe 리포트 패키지 v${pkg.meta.packageVersion} · 계산 엔진 v${pkg.meta.engineVersion} ·
    본 문서는 스냅샷 ${pkg.identity.snapshotHash}에서 생성되었으며 원본 데이터를 재계산하지 않습니다.
  </div>
</body></html>`;
}


// ── report/renderer/pdf/renderPDF.js ──────────────────────────
//  RENDER PDF
//  ReportPackage → HTML → 브라우저 인쇄(PDF 저장). React 화면을 print()하지 않는다 —
//  항상 buildPDFHtml(reportPackage)이 새로 만든 독립 문서를 인쇄한다.
//
//  계약:
//    PDF-001: 이 파일은 계산/재검증 함수를 호출하지 않는다
//             (computeBackpressure, calculateKb, detectMOC, verifyApprovalRecord 전부 금지).
//    PDF-002: renderPDF(reportPackage) — 단일 인자. snapshot/equipment/caseData 등
//             추가 데이터를 받지 않는다.
//    PDF-003: 유효하지 않은 Package는 절대 렌더링하지 않는다 —
//             validateReportPackage() 실패 시 즉시 중단.
// ════════════════════════════════════════════════════════════════
function renderPDF(reportPackage) {
  const check = validateReportPackage(reportPackage);
  if (!check.ok) {
    return { ok: false, reason: `INVALID_REPORT_PACKAGE: ${check.reason}` };
  }

  const html = buildPDFHtml(reportPackage);

  const win = window.open("", "_blank");
  if (!win) {
    return { ok: false, reason: "팝업이 차단되었습니다 — 브라우저에서 팝업을 허용해주세요" };
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();

  const doPrint = () => { try { win.print(); } catch (e) { /* noop */ } };
  win.onload = doPrint;
  setTimeout(doPrint, 300); // onload 타이밍을 놓치는 브라우저 대비 백업 트리거

  return { ok: true };
}

// PipeFlow — Snapshot.result 기준 렌더링
function PipeFlowRenderer({ snap, sim }) {
  const { valveOpen, ratio, pressure } = sim;
  const [offset, setOffset] = useState(0);
  const deviceType = snap.deviceType;
  const setPoint   = snap.inputs.P1;
  const mawp       = snap.inputs.mawp;

  useEffect(() => {
    const id = setInterval(() => setOffset(o => (o + 3) % 40), 50);
    return () => clearInterval(id);
  }, []);

  const pColor     = ratio < 0.65 ? T.green : ratio < 0.88 ? T.yellow : T.red;
  const orangeColor= T.orange;

  return (
    <svg viewBox="0 0 700 265" style={{ width:"100%", height:"auto" }}>
      <defs>
        <pattern id="fp2" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse" patternTransform={`translate(${offset},0)`}>
          <circle cx="10" cy="10" r="3" fill={T.blue} opacity="0.4"/>
          <circle cx="30" cy="10" r="3" fill={T.blue} opacity="0.4"/>
        </pattern>
        <pattern id="dp2" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse" patternTransform={`translate(${valveOpen?offset:0},0)`}>
          <circle cx="10" cy="10" r="3" fill={T.orange} opacity={valveOpen?0.5:0.08}/>
          <circle cx="30" cy="10" r="3" fill={T.orange} opacity={valveOpen?0.5:0.08}/>
        </pattern>
        <filter id="sh2"><feDropShadow dx="0" dy="3" stdDeviation="4" floodColor="#00000020"/></filter>
        <filter id="gl2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <rect width="700" height="265" fill="#EEF4FF" rx="16"/>

      {/* VESSEL */}
      <rect x="14" y="78" width="62" height="104" rx="10" fill={T.blueBg} stroke={T.blue} strokeWidth="2.5" filter="url(#sh2)"/>
      <rect x="14" y={78+104*(1-ratio)} width="62" height={104*ratio} rx="10" fill={pColor} opacity="0.3" style={{transition:"height 0.1s,y 0.1s"}}/>
      <text x="45" y="197" textAnchor="middle" fontSize="9" fontWeight="700" fill={T.sub} fontFamily="monospace">VESSEL</text>
      <text x="45" y="209" textAnchor="middle" fontSize="8" fill={pColor} fontFamily="monospace" fontWeight="700">{pressure.toFixed(1)}b</text>

      {/* 게이지 */}
      <circle cx="45" cy="58" r="23" fill={T.white} stroke={pColor} strokeWidth="3" filter="url(#sh2)"/>
      <path d={`M45 58 L${45+17*Math.cos((ratio*180-210)*Math.PI/180)} ${58+17*Math.sin((ratio*180-210)*Math.PI/180)}`} stroke={pColor} strokeWidth="3" strokeLinecap="round"/>
      <circle cx="45" cy="58" r="3" fill={pColor}/>
      <text x="45" y="87" textAnchor="middle" fontSize="8" fill={T.sub} fontFamily="monospace">PI-01</text>

      {/* 업스트림 */}
      <rect x="76" y="112" width="162" height="32" rx="7" fill={T.white} stroke={T.border} strokeWidth="2"/>
      <rect x="78" y="114" width="158" height="28" rx="6" fill="url(#fp2)" opacity={Math.min(ratio*1.3,1)}/>
      <text x="157" y="106" textAnchor="middle" fontSize="10" fontWeight="700" fill={T.blue} fontFamily="monospace">UPSTREAM</text>
      <text x="157" y="157" textAnchor="middle" fontSize="9" fill={T.sub} fontFamily="monospace">P1 = {pressure.toFixed(2)} barg</text>

      {/* 밸브 */}
      {deviceType === "safetyValve" ? (
        <g>
          <rect x="240" y="98" width="66" height="62" rx="10"
            fill={valveOpen?T.orangeBg:T.blueBg} stroke={valveOpen?T.orange:T.blue}
            strokeWidth="3" filter="url(#sh2)" style={{transition:"all 0.3s"}}/>
          {[0,1,2,3].map(i=>(
            <path key={i} d={`M${250+i*10} 108 Q${255+i*10} 119 ${260+i*10} 108`}
              fill="none" stroke={valveOpen?T.orange:T.blue} strokeWidth="1.5"/>
          ))}
          <rect x="254" y={valveOpen?148:155} width="25" height="7" rx="3"
            fill={valveOpen?T.orange:T.blue} filter={valveOpen?"url(#gl2)":"none"} style={{transition:"all 0.25s"}}/>
          {valveOpen && <>
            <line x1="273" y1="98" x2="273" y2="68" stroke={T.orange} strokeWidth="2.5" strokeDasharray="4,2"/>
            <polygon points="273,56 265,72 281,72" fill={T.orange}/>
          </>}
          <text x="273" y="173" textAnchor="middle" fontSize="9" fontWeight="700"
            fill={valveOpen?T.orange:T.blue} fontFamily="monospace">{valveOpen?"OPEN ▲":"S.V ✅"}</text>
          <text x="273" y="185" textAnchor="middle" fontSize="8" fill={T.yellow} fontFamily="monospace">Set: {setPoint}b</text>
        </g>
      ) : (
        <g>
          <rect x="240" y="103" width="66" height="52" rx="10"
            fill={valveOpen?"#FFDFE0":"#F1E0FF"} stroke={valveOpen?T.red:"#CE82FF"}
            strokeWidth="3" filter="url(#sh2)" style={{transition:"all 0.3s"}}/>
          {valveOpen ? <>
            <line x1="250" y1="113" x2="296" y2="145" stroke={T.red} strokeWidth="4" strokeLinecap="round"/>
            <line x1="296" y1="113" x2="250" y2="145" stroke={T.red} strokeWidth="4" strokeLinecap="round"/>
            <line x1="273" y1="103" x2="273" y2="68" stroke={T.red} strokeWidth="2.5" strokeDasharray="4,2"/>
            <polygon points="273,56 265,72 281,72" fill={T.red}/>
          </> : <ellipse cx="273" cy="129" rx="23" ry="13" fill="none" stroke="#CE82FF" strokeWidth="2.5"/>}
          <text x="273" y="168" textAnchor="middle" fontSize="9" fontWeight="700"
            fill={valveOpen?T.red:"#CE82FF"} fontFamily="monospace">{valveOpen?"BURST 💥":"R.D ✅"}</text>
          <text x="273" y="180" textAnchor="middle" fontSize="8" fill={T.yellow} fontFamily="monospace">Burst: {setPoint}b</text>
        </g>
      )}

      {/* 다운스트림 */}
      <rect x="307" y="112" width="162" height="32" rx="7" fill={T.white} stroke={T.border} strokeWidth="2"/>
      <rect x="309" y="114" width="158" height="28" rx="6" fill="url(#dp2)" opacity={valveOpen?1:0.3}/>
      <text x="388" y="106" textAnchor="middle" fontSize="10" fontWeight="700"
        fill={valveOpen?T.orange:T.gray} fontFamily="monospace">DOWNSTREAM</text>
      <text x="388" y="157" textAnchor="middle" fontSize="9" fill={T.sub} fontFamily="monospace">
        {valveOpen?"▶ 방출 중":"── 정상 운전"}
      </text>

      {/* 플레어 */}
      <rect x="472" y="88" width="52" height="72" rx="8" fill={T.yellowBg} stroke={T.yellow} strokeWidth="2" filter="url(#sh2)"/>
      <rect x="488" y="38" width="18" height="50" rx="4" fill={T.yellowBg} stroke={T.yellow} strokeWidth="2"/>
      {valveOpen && <>
        <ellipse cx="497" cy="28" rx="10" ry="14" fill={T.yellow} opacity="0.85" filter="url(#gl2)"/>
        <ellipse cx="497" cy="20" rx="6" ry="10" fill="#FFA500" opacity="0.9"/>
        <ellipse cx="497" cy="13" rx="4" ry="7" fill={T.red} opacity="0.7"/>
      </>}
      <text x="497" y="172" textAnchor="middle" fontSize="9" fontWeight="700" fill={T.yellow} fontFamily="monospace">FLARE</text>

      {/* 상태 패널 */}
      <rect x="540" y="86" width="144" height="114" rx="13" fill={T.white} stroke={T.border} strokeWidth="2" filter="url(#sh2)"/>
      <text x="612" y="104" textAnchor="middle" fontSize="9" fontWeight="700" fill={T.sub} fontFamily="monospace">PRESSURE STATUS</text>
      <rect x="555" y="112" width="114" height="13" rx="6" fill="#F0F4FA"/>
      <rect x="555" y="112" width={Math.min(ratio*114,114)} height="13" rx="6" fill={pColor} style={{transition:"width 0.1s"}}/>
      <text x="612" y="142" textAnchor="middle" fontSize="22" fontWeight="900" fill={pColor} fontFamily="monospace">{pressure.toFixed(1)}</text>
      <text x="612" y="156" textAnchor="middle" fontSize="9" fill={T.sub} fontFamily="monospace">barg</text>
      <rect x="557" y="164" width="110" height="24" rx="9"
        fill={valveOpen?T.orangeBg:T.greenBg} stroke={valveOpen?T.orange:T.green} strokeWidth="1.5"/>
      <text x="612" y="180" textAnchor="middle" fontSize="9" fontWeight="700"
        fill={valveOpen?T.orange:T.green} fontFamily="monospace">{valveOpen?"▲ RELIEVING":"● NORMAL"}</text>
    </svg>
  );
}

// PressChartRenderer — Snapshot.inputs 기준
function PressChartRenderer({ hist, snap }) {
  const setPoint = snap.inputs.P1;
  const mawp     = snap.inputs.mawp;
  const W=580, H=115;
  const mx = mawp * 1.3;
  const y  = p => H-20-((p/mx)*(H-30));
  const x  = (i,n) => 38+(i/Math.max(n-1,1))*(W-50);
  const pts= hist.map((p,i)=>({x:x(i,hist.length),y:y(p)}));
  const ln = pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const ar = pts.length>1?`${ln} L${pts[pts.length-1].x},${H-20} L${pts[0].x},${H-20} Z`:"";
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:115,borderRadius:10}}>
      <defs>
        <linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={T.blue} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={T.blue} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <rect width={W} height={H} fill="#F0F4FA" rx="10"/>
      {[.25,.5,.75,1].map(r=><line key={r} x1="38" y1={y(mx*r)} x2={W-10} y2={y(mx*r)} stroke={T.border} strokeWidth="1"/>)}
      <line x1="38" y1={y(mawp)} x2={W-10} y2={y(mawp)} stroke={T.red} strokeWidth="1.5" strokeDasharray="5,3"/>
      <text x={W-12} y={y(mawp)-3} fontSize="8" fill={T.red} textAnchor="end" fontFamily="monospace" fontWeight="700">MAWP {mawp}b</text>
      <line x1="38" y1={y(setPoint)} x2={W-10} y2={y(setPoint)} stroke={T.yellow} strokeWidth="1.5" strokeDasharray="5,3"/>
      <text x={W-12} y={y(setPoint)-3} fontSize="8" fill={T.yellow} textAnchor="end" fontFamily="monospace" fontWeight="700">SET {setPoint}b</text>
      {ar && <path d={ar} fill="url(#ag2)"/>}
      {pts.length>1 && <path d={ln} fill="none" stroke={T.blue} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
      <line x1="38" y1="5" x2="38" y2={H-20} stroke={T.border} strokeWidth="1.5"/>
      <line x1="38" y1={H-20} x2={W-10} y2={H-20} stroke={T.border} strokeWidth="1.5"/>
    </svg>
  );
}

// EvidenceCard — Snapshot.evidence 렌더링
function EvidenceCard({ step }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{border:`2px solid ${step.ok?T.green:T.red}`,borderRadius:12,overflow:"hidden",marginBottom:10,boxShadow:"0 2px 8px #0001"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 15px",cursor:"pointer",background:step.ok?T.greenBg:T.redBg}}>
        <div style={{width:28,height:28,borderRadius:"50%",background:step.ok?T.green:T.red,display:"flex",alignItems:"center",justifyContent:"center",color:T.white,fontWeight:900,fontSize:13,flexShrink:0}}>
          {step.ok?"✓":"✗"}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:T.text,fontFamily:font.mono}}>Step {step.id}: {step.title}</div>
          <div style={{fontSize:11,color:T.sub,marginTop:2,fontFamily:font.mono}}>{step.result}</div>
        </div>
        <span style={{fontSize:11,color:T.sub}}>{open?"▲":"▼"}</span>
      </div>
      {open && (
        <div style={{background:T.white,padding:"12px 15px",borderTop:`1px solid ${T.border}`}}>
          <div style={{background:"#F0F4FA",borderRadius:8,padding:"7px 12px",fontFamily:font.mono,fontSize:11,color:T.blue,marginBottom:8}}>{step.formula}</div>
          <p style={{fontSize:11,color:T.sub,margin:0,lineHeight:1.65}}>{step.detail}</p>
        </div>
      )}
    </div>
  );
}

// ChecklistRenderer — Snapshot.result.checklist 렌더링
function ChecklistRenderer({ checklist, backpress, accumulation, inletLoss, dataGaps }) {
  const vtLabel = backpress?.valveType==="BELLOWS" ? "벨로우즈형(밸런스형)" : "스프링식";
  const allowPct = backpress?.allowableRatio!=null ? (backpress.allowableRatio*100).toFixed(0) : "10";
  const accAllowPct = accumulation?.allowableRatio!=null ? (accumulation.allowableRatio*100).toFixed(0) : "110";
  const accScenarioLabel = accumulation
    ? (accumulation.fireScenario ? "화재 보호 목적" : `비화재, 밸브 ${accumulation.valveCount>=2?"2개 이상":"1개"} 설치`)
    : "";
  const items = [
    { key:"capacityOK",     label:"방출용량 충족",    detail:"선정 오리피스 면적 ≥ 필요 면적" },
    { key:"backPressureOK", label:"배압(背壓) 허용 범위 이내", detail:`P2/P1 < ${allowPct}% (${vtLabel} 기준, KOSHA D-18 §7.2(4)) — 배출 배관이 밸브 작동을 방해하지 않는지 확인` },
    { key:"mawpOK",         label:"설정압 ≤ 최고허용운전압력(MAWP)",    detail:"설정압이 설비가 견딜 수 있는 최고압력을 넘지 않는지 확인" },
    { key:"kdOK",           label:"방출계수 Kd 충족 (≥ 0.9)",         detail:"밸브가 실제로 얼마나 잘 배출하는지 나타내는 보정값, 최소 권고 기준 충족" },
    { key:"marginOK",       label:"여유율 충분 (≥ 1.0)",     detail:"필요량보다 여유있게 설계됐는지 — 선정 오리피스 면적의 여유 정도" },
    { key:"accumulationOK", label:"축적압력 허용 범위 이내 (Overpressure Guardrail)",
      detail:`1+OP/100 ≤ ${accAllowPct}% (${accScenarioLabel} 기준, KOSHA D-18 §4.4) — 초과 시 자동 보정 없이 NO-GO` },
    { key:"inletLossOK",    label:"인입배관 압력손실 허용 범위 이내",
      detail: inletLoss?.pressureLossAvailable
        ? `ΔP/Pset ≤ ${(inletLoss.allowableRatio*100).toFixed(0)}% (KOSHA D-18 §7.2(1)) — 인입배관 내 압력손실이 설정압력의 ${(inletLoss.allowableRatio*100).toFixed(0)}%를 넘지 않는지 확인`
        : "인입배관 형상(길이/내경/fittings) 데이터가 없어 판정 보류 — 입력 부족을 적정(GO)으로 취급하지 않음" },
  ];
  return (
    <div>
      {(dataGaps && dataGaps.length > 0) && (
        <div style={{display:"flex",gap:10,alignItems:"flex-start",padding:"10px 13px",borderRadius:10,marginBottom:8,background:T.amberBg||"#fff7e6",border:`1.5px solid ${T.amber||"#d97706"}`}}>
          <div style={{width:24,height:24,borderRadius:"50%",background:T.amber||"#d97706",display:"flex",alignItems:"center",justifyContent:"center",color:T.white,fontWeight:900,fontSize:12,flexShrink:0}}>!</div>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:font.mono}}>판정 보류 — 입력 부족 (INSUFFICIENT INPUT)</div>
            <div style={{fontSize:10,color:T.sub,marginTop:2}}>{dataGaps.join(", ")} 데이터가 없어 전체 판정을 확정할 수 없음 — 개별 항목이 전부 충족이어도 "적정(GO)"으로 표시하지 않음</div>
          </div>
        </div>
      )}
      {items.map(({ key, label, detail }) => {
        const hasKey = checklist && Object.prototype.hasOwnProperty.call(checklist, key);
        if (!hasKey) {
          return (
            <div key={key} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"10px 13px",borderRadius:10,marginBottom:8,background:T.bg,border:`1.5px dashed ${T.border}`}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:T.gray||"#9ca3af",display:"flex",alignItems:"center",justifyContent:"center",color:T.white,fontWeight:900,fontSize:12,flexShrink:0}}>—</div>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:T.sub,fontFamily:font.mono}}>{label}</div>
                <div style={{fontSize:10,color:T.gray||"#9ca3af",marginTop:2}}>{detail}</div>
              </div>
            </div>
          );
        }
        const ok = checklist[key];
        return (
          <div key={key} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"10px 13px",borderRadius:10,marginBottom:8,background:ok?T.greenBg:T.redBg,border:`1.5px solid ${ok?T.green:T.red}`}}>
            <div style={{width:24,height:24,borderRadius:"50%",background:ok?T.green:T.red,display:"flex",alignItems:"center",justifyContent:"center",color:T.white,fontWeight:900,fontSize:12,flexShrink:0}}>{ok?"✓":"✗"}</div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:font.mono}}>{label}</div>
              <div style={{fontSize:10,color:T.sub,marginTop:2}}>{detail}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}


// ── components/InputView.jsx ──────────────────────────
//  PARAMETER DECISION VIEW (구 InputView)
//  역할: "값 입력" → "사양 결정"
// ════════════════════════════════════════════════════════════════

// ── RELIEF LOAD — 숫자 입력 필드 (Engine 계약과 동일한 undefined/number만 전달) ──
// UI는 계산하지 않는다는 원칙에 따라, 여기서 하는 일은 "빈 문자열→undefined,
// 그 외→Number()"인 입력 마셜링뿐이다 — 검증/판정은 전부 relief_load.js의
// calculate*Scenario()가 한다. 0이 유효한 필드는 0을 그대로 통과시키고,
// 숫자가 아닌 값은 여기서 임의로 고치지 않고 그대로 Number()에 흘려보내
// (NaN이 되면) Engine이 스스로 거부하게 한다 — UI가 검증 로직을 복제하지 않음.
function ScenarioNumberField({ label, unit, value, onChange, placeholder }) {
  return (
    <div style={{marginBottom:8}}>
      <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginBottom:3}}>{label}{unit?` (${unit})`:""}</div>
      <input type="number"
        value={value === undefined ? "" : value}
        placeholder={placeholder || "값 입력"}
        onChange={e => {
          const v = e.target.value;
          onChange(v === "" ? undefined : +v);
        }}
        style={{width:"100%",padding:"9px 11px",borderRadius:9,border:`1.5px solid ${T.border}`,
          fontSize:13,fontFamily:font.mono,fontWeight:700,color:T.navy,background:T.white,boxSizing:"border-box"}}/>
    </div>
  );
}

// ── RELIEF LOAD — enum 토글(phase, failureMode 등) ──
function ScenarioEnumToggle({ label, options, value, onChange }) {
  return (
    <div style={{marginBottom:10}}>
      <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginBottom:5}}>{label}</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {options.map(({id,label:optLabel})=>(
          <div key={id} onClick={()=>onChange(id)}
            style={{flex:"1 1 auto",minWidth:90,padding:"9px 10px",borderRadius:9,cursor:"pointer",textAlign:"center",
              border:`2px solid ${value===id?T.navyLight:T.border}`,
              background:value===id?T.navy+"0D":T.white,
              fontSize:11,fontWeight:700,color:value===id?T.navy:T.text,fontFamily:font.sans}}>
            {optLabel}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── RELIEF LOAD — 시나리오별 원시 입력 폼 ──
// 각 시나리오는 조건부 필드만 보여준다(원문에 없는 필드를 요구하지 않음).
function ReliefLoadScenarioInputForm({ scenarioType, scenarioInput, onFieldChange }) {
  if (scenarioType === "OUTLET_BLOCKED") {
    return (
      <div>
        <ScenarioEnumToggle label="PHASE" value={scenarioInput.phase}
          onChange={v=>onFieldChange("phase",v)}
          options={[{id:"LIQUID",label:"액체(Liquid)"},{id:"VAPOR",label:"증기(Vapor)"}]}/>
        <ScenarioNumberField label="최대 유입량 (Inflow)" unit="kg/h"
          value={scenarioInput.inflow_kgh} onChange={v=>onFieldChange("inflow_kgh",v)}/>
        {scenarioInput.phase === "VAPOR" && (
          <ScenarioNumberField label="생성량 (Generation Rate)" unit="kg/h"
            value={scenarioInput.generationRate_kgh} onChange={v=>onFieldChange("generationRate_kgh",v)}/>
        )}
      </div>
    );
  }
  if (scenarioType === "OVERFILLING") {
    return (
      <ScenarioNumberField label="최대 유입량 (Inflow)" unit="kg/h"

          options={[

            {id:"OUTLET_VALVE", label:"출구 밸브 고장"},

          <div>
            <ScenarioNumberField label="유입량 (Inflow)" unit="kg/h"
              value={scenarioInput.inflow_kgh} onChange={v=>onFieldChange("inflow_kgh",v)}/>
            <ScenarioNumberField label="유출량 (Outflow)" unit="kg/h"

        )}

          <div>
            <ScenarioNumberField label="유입량 (Inflow)" unit="kg/h"
              value={scenarioInput.inflow_kgh} onChange={v=>onFieldChange("inflow_kgh",v)}/>
            <ScenarioNumberField label="개방 가정 유출량 (Open Outflow)" unit="kg/h"
              value={scenarioInput.openOutflow_kgh} onChange={v=>onFieldChange("openOutflow_kgh",v)}/>
            <ScenarioNumberField label="폐쇄 가정 유출량 (Closed Outflow)" unit="kg/h"
              value={scenarioInput.closedOutflow_kgh} onChange={v=>onFieldChange("closedOutflow_kgh",v)}/>
          </div>
        )}

    const mode = scenarioInput.failureMode;
    return (
      <div>
        <ScenarioEnumToggle label="FAILURE MODE" value={mode}
          onChange={v=>onFieldChange("failureMode",v)}
          options={[
            {id:"ABNORMAL_HEAT_INPUT",       label:"비정상 열 입력"},
            {id:"INADVERTENT_VALVE_OPENING", label:"부주의한 밸브 개방"},
            {id:"CHECK_VALVE_FAILURE",       label:"체크밸브 고장"},
          ]}/>

          <div>
            <ScenarioNumberField label="증기 발생량 (Vapor Generation)" unit="kg/h"
              value={scenarioInput.vaporGeneration_kgh} onChange={v=>onFieldChange("vaporGeneration_kgh",v)}/>
            <ScenarioNumberField label="정상 유출량 (Outflow)" unit="kg/h"
              value={scenarioInput.outflow_kgh} onChange={v=>onFieldChange("outflow_kgh",v)}/>
          </div>
        )}
        {mode === "INADVERTENT_VALVE_OPENING" && (
          <div>
            <ScenarioNumberField label="유입량 (Inflow)" unit="kg/h"
              value={scenarioInput.inflow_kgh} onChange={v=>onFieldChange("inflow_kgh",v)}/>
            <ScenarioNumberField label="유출량 (Outflow, 0 허용 — 차감 없음)" unit="kg/h"
              value={scenarioInput.outflow_kgh} onChange={v=>onFieldChange("outflow_kgh",v)}/>
          </div>
        )}
        {mode === "CHECK_VALVE_FAILURE" && (
          <div style={{background:T.orangeBg,border:`1.5px solid ${T.orange}`,borderRadius:10,
            padding:"10px 12px",fontSize:11,color:"#7A4F00",fontFamily:font.sans,lineHeight:1.6}}>
            KOSHA D-18-2020 §5.8(3): 역류 상황 및 역류량 추정 기법 선정은 사용자가 결정해야 합니다 —
            원문에 계산식이 없어 이 앱은 자동으로 산정하지 않습니다. 별도 공학적 판단이 필요합니다.
          </div>
        )}
      </div>
    );
  }
  return null;
}

// ── RELIEF LOAD — 시나리오 계산 결과 패널 ──
function ReliefLoadScenarioResultPanel({ result, adapter }) {
  if (!result) return null;
  if (result.status === "NEEDS_ENGINEERING_DECISION") {
    return (
      <div style={{background:T.orangeBg,border:`1.5px solid ${T.orange}`,borderRadius:10,
        padding:"10px 12px",marginTop:8,fontSize:11,color:"#7A4F00",fontFamily:font.sans,lineHeight:1.6}}>
        <div style={{fontWeight:900,marginBottom:3}}>NEEDS_ENGINEERING_DECISION</div>
        {result.reason}
      </div>
    );
  }
  if (result.status === "INSUFFICIENT_INPUT") {
    return (
      <div style={{background:T.bg,border:`1.5px dashed ${T.border}`,borderRadius:10,
        padding:"10px 12px",marginTop:8,fontSize:11,color:T.sub,fontFamily:font.sans}}>
        입력을 완료하면 결과가 표시됩니다{result.reason ? ` (${result.reason})` : ""}.
      </div>
    );
  }
  if (result.status === "OK") {
    const isGoverning = adapter?.valid === true;
    return (
      <div style={{background: isGoverning ? T.greenBg : T.bg,
        border:`1.5px solid ${isGoverning ? T.greenDk : T.border}`,borderRadius:12,
        padding:"12px 14px",marginTop:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,letterSpacing:0.5}}>SCENARIO RESULT</span>
          {isGoverning && (
            <span style={{fontSize:9,padding:"2px 8px",borderRadius:6,background:T.greenDk,color:T.white,
              fontFamily:font.mono,fontWeight:700}}>GOVERNING RELIEF LOAD</span>
          )}
        </div>
        <div style={{fontSize:22,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          {result.W.toLocaleString(undefined,{maximumFractionDigits:1})} <span style={{fontSize:13,color:T.sub}}>kg/h</span>
        </div>
        <div style={{fontSize:10,color:T.sub,fontFamily:font.sans,marginTop:6,lineHeight:1.6}}>{result.formula}</div>
      </div>
    );
  }
  return null;
}

// ── 결정 선택 카드 (선택지가 명확한 파라미터용) ───────────────
function DecisionChoice({ param, label, options, value, onChange }) {
  const selected = options.find(o => Math.abs(o.value - value) < 0.001) ?? null;
  return (
    <div style={{background:T.bg,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${selected?T.navyLight:T.border}`}}>
      <div style={{marginBottom:10}}>

        <div style={{fontSize:13,fontWeight:900,color:T.navy,fontFamily:font.sans,marginTop:1}}>{label}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {options.map(opt=>{
          const isSelected = Math.abs(opt.value - value) < 0.001;
          return (
            <div key={opt.id} onClick={()=>onChange(opt.value)}
              style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",
                border:`2px solid ${isSelected?T.navyLight:T.border}`,
                background:isSelected?T.navy+"0D":T.white,
                transition:"all 0.12s"}}>
              <div style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${isSelected?T.navyLight:T.border}`,background:isSelected?T.navyLight:T.white,flexShrink:0,marginTop:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {isSelected && <div style={{width:8,height:8,borderRadius:"50%",background:T.white}}/>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,fontWeight:700,color:isSelected?T.navy:T.text,fontFamily:font.sans}}>{opt.label}</span>
                  {opt.tag && <span style={{fontSize:9,padding:"2px 6px",borderRadius:5,background:isSelected?T.navyLight+"22":T.bg,color:isSelected?T.navyLight:T.sub,fontFamily:font.mono,fontWeight:700,border:`1px solid ${isSelected?T.navyLight:T.border}`}}>{opt.tag}</span>}
                  <span style={{fontSize:12,fontWeight:900,color:isSelected?T.navyLight:T.sub,fontFamily:font.mono,marginLeft:"auto"}}>{opt.value}</span>
                </div>
                <div style={{fontSize:10,color:T.sub,marginTop:3,fontFamily:font.sans,lineHeight:1.5}}>{opt.basis}</div>
              </div>
            </div>

        })}

    </div>
  );
}
