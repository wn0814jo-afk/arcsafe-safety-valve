// ── components/ApprovalForm.jsx ──────────────────────────
//  APPROVAL FORM — 전자서명 UI
//  hash 계산, 서명 검증, workflow 판단 전부 금지 — submitApproval()만 호출한다.
//  REVIEW 상태에서만 노출 (ReportView가 조건부 렌더링으로 보장).
// ════════════════════════════════════════════════════════════════
function ApprovalForm({ snap, onSubmit }) {
  const [signer,     setSigner]     = useState("");
  const [role,       setRole]       = useState(APPROVAL_ROLES[0]);
  const [decision,   setDecision]   = useState("approve");
  const [comment,    setComment]    = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error,      setError]      = useState(null);

  const canSubmit = signer.trim().length > 0 && !submitting;

  const handleSubmit = async () => {
    setSubmitting(true);
    setError(null);
    const result = await onSubmit({ decision, comment, signer: signer.trim(), role });
    setSubmitting(false);
    if (!result || !result.ok) {
      setError(result?.reason || "승인 처리에 실패했습니다.");
      return;
    }
    setComment("");
  };

  const accent = decision === "approve" ? T.green : T.red;

  return (
    <div style={{marginTop:14,background:T.cardBg,borderRadius:14,padding:14,border:`2px solid ${T.navyLight}`}}>
      <div style={{fontSize:10,fontWeight:700,color:T.navyLight,fontFamily:font.mono,marginBottom:2,letterSpacing:1}}>
        전자서명 · APPROVAL
      </div>
      <div style={{fontSize:10,color:T.gray,fontFamily:font.mono,marginBottom:10}}>
        서명 대상: {snap.id} · hash {(snap.snapshotHash || "").slice(0,12)}…
      </div>

      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <input
          value={signer}
          onChange={e=>setSigner(e.target.value)}
          placeholder="서명자 이름"
          style={{flex:1,padding:"8px 10px",borderRadius:9,border:`1px solid ${T.border}`,fontSize:12,fontFamily:font.sans,outline:"none",boxSizing:"border-box"}}
        />
        <select
          value={role}
          onChange={e=>setRole(e.target.value)}
          style={{padding:"8px 10px",borderRadius:9,border:`1px solid ${T.border}`,fontSize:11,fontFamily:font.mono,background:T.bg}}
        >
          {APPROVAL_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <button onClick={()=>setDecision("approve")} style={{flex:1,padding:"9px",borderRadius:9,
          border:`1.5px solid ${decision==="approve"?T.green:T.border}`,
          background:decision==="approve"?T.greenBg:T.bg,
          color:decision==="approve"?T.green:T.sub,
          fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>
          ✓ 승인
        </button>
        <button onClick={()=>setDecision("request_change")} style={{flex:1,padding:"9px",borderRadius:9,
          border:`1.5px solid ${decision==="request_change"?T.red:T.border}`,
          background:decision==="request_change"?T.redBg:T.bg,
          color:decision==="request_change"?T.red:T.sub,
          fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>
          ↺ 조치 요청
        </button>
      </div>

      <textarea
        value={comment}
        onChange={e=>setComment(e.target.value)}
        placeholder="승인/반려 사유 — 서명 대상에 포함되어 위변조 시 감지됩니다"
        rows={3}
        style={{width:"100%",borderRadius:9,border:`1px solid ${T.border}`,padding:"8px 10px",fontSize:11,fontFamily:font.sans,color:T.text,resize:"none",boxSizing:"border-box",background:T.bg,marginBottom:10,outline:"none"}}
      />

      {error && (
        <div style={{fontSize:11,color:T.red,fontFamily:font.mono,marginBottom:8}}>⚠ {error}</div>
      )}

      <button
        onClick={handleSubmit}
        disabled={!canSubmit}
        style={{width:"100%",padding:"11px",
          background: canSubmit ? accent : T.gray,
          color:T.white,border:"none",borderRadius:10,fontSize:12,fontWeight:700,fontFamily:font.mono,
          cursor:canSubmit?"pointer":"not-allowed",
          boxShadow:canSubmit?`0 3px 0 ${accent}88`:"none"}}
      >
        {submitting ? "서명 처리 중…" : `전자서명 후 ${decision==="approve"?"승인":"조치 요청"}`}
      </button>
    </div>
  );
}

//  APPROVAL HISTORY — 서명 검증 배지 타임라인
//  검증(verifyApprovalRecord)은 이 컴포넌트가 직접 하지 않는다.
//  ReportView가 1회 계산한 verifiedResults를 그대로 표시만 한다.
//  (AuditEvidence의 ApprovalEvidence와 동일한 결과를 공유 — 중복 검증 호출 방지)
// ════════════════════════════════════════════════════════════════
function ApprovalHistory({ approvals, verifiedResults }) {
  if (!approvals || approvals.length === 0) return null;

  return (
    <div style={{marginTop:14}}>
      <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>
        승인 이력 · APPROVAL TIMELINE
      </div>
      {approvals.slice().reverse().map(rec => {
        const v  = (verifiedResults || {})[rec.approvalId];
        const ok = v?.valid;
        const badgeColor = v === undefined ? T.gray : ok ? T.green : T.red;
        return (
          <div key={rec.approvalId} style={{background:T.cardBg,borderRadius:12,padding:"10px 12px",marginBottom:8,border:`1px solid ${T.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
              <div style={{fontSize:12,fontWeight:700,color:T.navy,fontFamily:font.mono}}>
                {rec.approver} <span style={{color:T.sub,fontWeight:400}}>({rec.role})</span>
              </div>
              <div style={{fontSize:10,fontWeight:700,fontFamily:font.mono,color:badgeColor}}>
                {v === undefined ? "검증 중…" : ok ? "✓ 서명 유효" : "✗ 위변조 의심"}
              </div>
            </div>
            <div style={{fontSize:11,color:T.sub,fontFamily:font.sans,marginTop:4}}>
              {rec.decision === "approve" ? "승인" : "조치 요청"} · {(rec.approvedAt || "").slice(0,19).replace("T"," ")}
            </div>
            {rec.comment && (
              <div style={{fontSize:11,color:T.text,fontFamily:font.sans,marginTop:6,background:T.bg,borderRadius:8,padding:"6px 8px"}}>
                “{rec.comment}”
              </div>
            )}
            {v && !ok && (
              <div style={{fontSize:10,color:T.red,fontFamily:font.mono,marginTop:6}}>
                [{v.contract}] {v.reason}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

const DEST_OPTIONS = [

  { id:"atm",    label:"대기 직방출",  note:"비독성·비가연만" },
  { id:"closed", label:"밀폐 시스템",  note:"회수·처리" },
];
const DEVICE_OPTIONS = [
  { id:"safetyValve", label:"🔧 안전밸브" },
  { id:"ruptureDisk",  label:"💥 럽처디스크" },
];

// ── 공통 스타일 헬퍼 ────────────────────────────────────────
const iS = (extra={}) => ({

const Lbl = ({txt, req}) => (

// ── EquipmentForm ─────────────────────────────────────────────
function EquipmentForm({ onSave, onCancel, editing }) {
  const isRevision = !!editing;
  const [f, setF] = useState(editing ? {
    tag: editing.tag, location: editing.location, deviceType: editing.deviceType,
    mawp: editing.mawp, setPressure: editing.setPressure,
    overpressure: editing.overpressure, orifice: editing.orifice,
    inletSize: editing.inletSize, outletSize: editing.outletSize,
    manufacturer: editing.manufacturer, model: editing.model,
    serialNo: editing.serialNo, installedAt: editing.installedAt,
    mocId: "",
  } : {
    tag:"", location:"", deviceType:"safetyValve",
    mawp:6.0, setPressure:5.5, overpressure:10,
    inletSize:"3\"", outletSize:"4\"", orifice:"",
    manufacturer:"", model:"", serialNo:"", installedAt:"",
    mocId:"",
  });
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const psetErr = f.setPressure > f.mawp;
  const valid = f.tag.trim() && f.mawp>0 && f.setPressure>0 && !psetErr &&
    f.overpressure !== "" && f.overpressure !== null && !isNaN(Number(f.overpressure)) && Number(f.overpressure) >= 0 &&
    (!isRevision || f.mocId.trim().length > 0);

  const handleSave = () => {
    if (!valid) return;
    if (isRevision) {
      const result = reviseEquipment(editing, f);
      if (!result.ok) { alert(`${result.field}: ${result.reason}`); return; }
      onSave(result.equipment);
      return;
    }
    try { onSave(createEquipment(f)); } catch(e) { alert(e.message); }
  };

  return (
    <div style={{background:T.cardBg,borderRadius:16,padding:18,
      border:`1.5px solid ${T.border}`,boxShadow:"0 4px 16px #0002"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          {isRevision ? `설비 개정 — ${editing.tag}` : "PSV 설비 등록"}
        </div>
        {isRevision && (
          <div style={{fontSize:10,fontWeight:700,color:T.orange,fontFamily:font.mono}}>
            Rev.{editing.revision} → Rev.{editing.revision + 1}
          </div>
        )}
      </div>

      {isRevision && (
        <Section title="MOC (변경 관리)">
          <Field label="MOC 번호" req>
            <input value={f.mocId}
              onChange={e=>upd("mocId",e.target.value)}
              placeholder="MOC-2026-0012"
              style={iS({border:`1.5px solid ${f.mocId.trim()?T.navyLight:T.red}`})}/>
            <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
              설비 사양 개정은 MOC 번호 없이 저장할 수 없습니다 — 근거 없는 변경 차단.
            </div>
          </Field>
        </Section>
      )}

      <Section title="기본 정보">
        <Row2
          a={<Field label="Tag No." req><input value={f.tag}
            onChange={e=>upd("tag",e.target.value)}
            onInput={e=>upd("tag",e.target.value)}
            placeholder="PSV-R201" autoComplete="off"
            style={iS({border:`1.5px solid ${f.tag.trim()?T.navyLight:T.border}`})}/></Field>}
          b={<Field label="설치 위치"><input value={f.location}
            onChange={e=>upd("location",e.target.value)}
            placeholder="반응기 R-201 상부"
            style={iS()}/></Field>}
        />
        <Field label="밸브 종류">
          <div style={{display:"flex",gap:8}}>
            {DEVICE_OPTIONS.map(d=>(
              <div key={d.id} onClick={()=>upd("deviceType",d.id)}
                style={{flex:1,padding:"8px 10px",borderRadius:9,cursor:"pointer",
                  textAlign:"center",
                  border:`2px solid ${f.deviceType===d.id?T.navyLight:T.border}`,
                  background:f.deviceType===d.id?T.navy+"0D":T.white,
                  fontSize:12,fontWeight:700,
                  color:f.deviceType===d.id?T.navy:T.text,
                  fontFamily:font.sans}}>
                {d.label}
              </div>
            ))}
          </div>
        </Field>
      </Section>

      <Section title="압력 및 오리피스">
        <Row2
          a={<Field label="MAWP (barg)" req>
            <input type="number" value={f.mawp} step={0.1} min={0.1}
              onChange={e=>upd("mawp",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="설정압 (barg)" req>
            <input type="number" value={f.setPressure} step={0.1} min={0.1}
              onChange={e=>upd("setPressure",+e.target.value)}
              style={iS({border:`1.5px solid ${psetErr?T.red:T.border}`})}/>
            {psetErr && <div style={{fontSize:9,color:T.red,marginTop:3}}>MAWP 초과</div>}
          </Field>}
        />
        <Row2
          a={<Field label="초과압력 Overpressure (%)" req>
            <input type="number" value={f.overpressure} step={1} min={0} max={50}

              relieving pressure 절대압 산정에 사용 (API 520): P1abs=Pset×(1+OP%)+대기압. 단일밸브 기본 10%.

                placeholder='4"' style={iS({width:"50%"})}/>

          </Field>}
        />

      <Section title="제조사 정보 (선택)">
        <Row2
          a={<Field label="제조사"><input value={f.manufacturer}
            onChange={e=>upd("manufacturer",e.target.value)}
            placeholder="Crosby" style={iS()}/></Field>}
          b={<Field label="모델"><input value={f.model}
            onChange={e=>upd("model",e.target.value)}
            placeholder="JOS-E" style={iS()}/></Field>}
        />
        <Row2
          a={<Field label="Serial No."><input value={f.serialNo}
            onChange={e=>upd("serialNo",e.target.value)}
            placeholder="SN-2024-001" style={iS()}/></Field>}
          b={<Field label="설치일"><input type="date" value={f.installedAt}
            onChange={e=>upd("installedAt",e.target.value)}
            style={iS()}/></Field>}
        />
      </Section>

      <div style={{display:"flex",gap:10}}>

// ── DischargeSystemForm ───────────────────────────────────────
// editing이 있으면 "개정" 모드: mocId 필수, revision은 자동 증가(읽기 전용 표시)
function DischargeSystemForm({ onSave, onCancel, editing }) {
  const isRevision = !!editing;
  const [f, setF] = useState(editing ? {
    name: editing.name, destination: editing.destination,
    L: editing.L, D: editing.D, fittingsK: editing.fittingsK,
    headerPressure: editing.headerPressure,
    connectedTags: (editing.connectedTags || []).join(", "),
    mocId: "",
  } : {
    name:"", destination:"flare",
    L:15, D:0.1, fittingsK:3.0, headerPressure:0.3, connectedTags:"",
    mocId:"",
  });
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const valid = f.name.trim() && f.D > 0 && f.L >= 0 &&
    (!isRevision || f.mocId.trim().length > 0);

  const handleSave = () => {
    if (!valid) return;
    const tags = f.connectedTags.split(",").map(t=>t.trim()).filter(Boolean);
    if (isRevision) {
      const result = reviseDischargeSystem(editing, { ...f, connectedTags: tags });
      if (!result.ok) { alert(`${result.field}: ${result.reason}`); return; }
      onSave(result.dischargeSystem);
      return;
    }
    try {
      onSave(createDischargeSystem({ ...f, connectedTags: tags }));
    } catch(e) { alert(e.message); }
  };

  return (
    <div style={{background:T.cardBg,borderRadius:16,padding:18,
      border:`1.5px solid ${T.border}`,boxShadow:"0 4px 16px #0002"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          {isRevision ? `배출계통 개정 — ${editing.name}` : "배출계통 등록"}
        </div>
        {isRevision && (
          <div style={{fontSize:10,fontWeight:700,color:T.orange,fontFamily:font.mono}}>
            Rev.{editing.revision} → Rev.{editing.revision + 1}
          </div>
        )}
      </div>

      {isRevision && (
        <Section title="MOC (변경 관리)">
          <Field label="MOC 번호" req>
            <input value={f.mocId}
              onChange={e=>upd("mocId",e.target.value)}
              placeholder="MOC-2026-0012"
              style={iS({border:`1.5px solid ${f.mocId.trim()?T.navyLight:T.red}`})}/>
            <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
              배관 개정은 MOC 번호 없이 저장할 수 없습니다 — 근거 없는 변경 차단.
            </div>
          </Field>
        </Section>
      )}

      <Section title="계통 정보">
        <Field label="계통 명칭" req>
          <input value={f.name}
            onChange={e=>upd("name",e.target.value)}
            onInput={e=>upd("name",e.target.value)}
            placeholder="LP-FLARE-01" autoComplete="off"
            style={iS({border:`1.5px solid ${f.name.trim()?T.navyLight:T.border}`})}/>
        </Field>
        <Field label="배출 목적지">
          <div style={{display:"flex",gap:6}}>
            {DEST_OPTIONS.map(d=>(
              <div key={d.id} onClick={()=>upd("destination",d.id)}
                style={{flex:1,padding:"8px",borderRadius:9,cursor:"pointer",
                  textAlign:"center",
                  border:`2px solid ${f.destination===d.id?T.navyLight:T.border}`,
                  background:f.destination===d.id?T.navy+"0D":T.white}}>
                <div style={{fontSize:11,fontWeight:700,
                  color:f.destination===d.id?T.navy:T.text,
                  fontFamily:font.sans}}>{d.label}</div>
                <div style={{fontSize:9,color:T.sub}}>{d.note}</div>
              </div>
            ))}
          </div>
        </Field>
      </Section>

      <Section title="배관 형상 (도면 기준)">
        <Row2
          a={<Field label="배관 길이 L (m)" req>
            <input type="number" value={f.L} step={0.5} min={0}
              onChange={e=>upd("L",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="배관 내경 D (m)" req>
            <input type="number" value={f.D} step={0.005} min={0.01}
              onChange={e=>upd("D",+e.target.value)}
              style={iS({border:`1.5px solid ${f.D>0?T.border:T.red}`})}/>
          </Field>}
        />
        <Row2
          a={<Field label="Fittings ΣK">
            <input type="number" value={f.fittingsK} step={0.1} min={0}
              onChange={e=>upd("fittingsK",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="Header 압력 (barg)">
            <input type="number" value={f.headerPressure} step={0.05} min={0}
              onChange={e=>upd("headerPressure",+e.target.value)} style={iS()}/>
          </Field>}
        />
        <Field label="연결 PSV Tag (쉼표 구분)">
          <input value={f.connectedTags}
            onChange={e=>upd("connectedTags",e.target.value)}
            placeholder="PSV-R201, PSV-R202" style={iS()}/>
          <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
            이 계통을 공유하는 PSV tag를 쉼표로 구분해 입력
          </div>
        </Field>
      </Section>

      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel}
          style={{flex:1,padding:"12px",background:T.bg,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:11,
            fontSize:12,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          취소
        </button>
        <button onClick={handleSave}
          style={{flex:2,padding:"12px",
            background:valid?T.navyLight:"#CBD5E1",
            color:T.white,border:"none",borderRadius:11,fontSize:13,
            fontWeight:900,fontFamily:font.sans,
            cursor:valid?"pointer":"not-allowed",
            boxShadow:valid?`0 4px 0 ${T.navy}`:"none"}}>
          {valid?(isRevision?"개정 저장 →":"배출계통 등록 →"):"필수 항목 입력 필요"}
        </button>
      </div>
    </div>
  );
}

// ── AssetMaster ───────────────────────────────────────────────
function AssetMaster({ equipments, dischargeSystems, onSelectEquipment,
                       onAddEquipment, onReviseEquipment,
                       onAddDischargeSystem,
                       onReviseDischargeSystem, onBack }) {
  const [tab,      setTab]      = useState("equipment"); // equipment | discharge
  const [showEqForm, setShowEqForm] = useState(false);
  const [showDsForm, setShowDsForm] = useState(false);
  const [editingEq,  setEditingEq]  = useState(null); // 개정 대상 Equipment
  const [editingDs,  setEditingDs]  = useState(null); // 개정 대상 DischargeSystem

  // Equipment에 매칭되는 DischargeSystem 찾기
  const findDs = (eq) => dischargeSystems.find(
    ds => ds.connectedTags.includes(eq.tag)

  const Tab = ({id, label}) => (
    <button onClick={()=>setTab(id)}
      style={{flex:1,padding:"9px",border:"none",borderRadius:9,cursor:"pointer",

            설비대장

          <div style={{fontSize:10,color:T.sub,fontFamily:font.sans}}>
            PSV 설비 선택 → 검토 시작

      </div>

        <Tab id="discharge" label={`⟶ 배출계통 (${dischargeSystems.length})`}/>

      {tab === "equipment" && (
        <>
          {!showEqForm && !editingEq && (
            <button onClick={()=>setShowEqForm(true)}
              style={{width:"100%",padding:"12px",background:T.navyLight,color:T.white,
                border:"none",borderRadius:12,fontSize:13,fontWeight:900,
                fontFamily:font.sans,cursor:"pointer",boxShadow:`0 4px 0 ${T.navy}`,

          {editingEq && (
            <div style={{marginBottom:12}}>
              <EquipmentForm
                editing={editingEq}
                onSave={eq=>{ onReviseEquipment(eq); setEditingEq(null); }}

          {equipments.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:T.gray}}>
              <div style={{fontSize:36,marginBottom:8}}>🔧</div>
              <div style={{fontSize:13,color:T.sub}}>등록된 설비가 없습니다</div>

      {/* DischargeSystem 탭 */}

                    {ds.name}
                    <span style={{marginLeft:6,fontSize:9,fontWeight:700,color:T.sub}}>
                      Rev.{ds.revision}
                    </span>
                  </div>
                  <span style={{fontSize:10,padding:"3px 9px",borderRadius:10,
                    background:T.blueBg,color:T.blue,border:`1px solid ${T.blue}`,
                    fontFamily:font.mono,fontWeight:700}}>

                  </span>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {[
                    ["L", `${ds.L}m`],
                    ["D", `Ø${Math.round(ds.D*1000)}mm`],
                    ["ΣK", ds.fittingsK],
                    ["P_hdr", `${ds.headerPressure}b`],
                  ].map(([k,v])=>(
                    <div key={k} style={{background:T.bg,borderRadius:6,
                      padding:"3px 8px",flex:1,textAlign:"center"}}>
                      <div style={{fontSize:8,color:T.gray,fontFamily:font.mono}}>{k}</div>
                      <div style={{fontSize:11,fontWeight:700,color:T.navyLight,
                        fontFamily:font.mono}}>{v}</div>
                    </div>
                  ))}
                </div>
                {ds.connectedTags.length > 0 && (
                  <div style={{marginTop:6,fontSize:10,color:T.sub,fontFamily:font.mono}}>
                    연결: {ds.connectedTags.join(", ")}
                  </div>
                )}
                <div style={{marginTop:8,textAlign:"right"}}>
                  <button onClick={()=>setEditingDs(ds)}
                    style={{padding:"5px 12px",background:T.bg,color:T.navyLight,

                      fontSize:10,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>

                </div>

            ))
          )}

      )}
    </div>
  );
}

// ── components/report/WorkflowEvidence.jsx ──────────────────────────
//  WORKFLOW EVIDENCE
//  Calculation Basis + Workflow Decision — snapshot 필드만 읽는 projection.
//  fluid 라벨은 FLUID_CHOICES 테이블 조회일 뿐 계산이 아님 (WF_LABEL과 동일한 성격).
// ════════════════════════════════════════════════════════════════
function _findFluidLabel(inputs) {
  if (!inputs) return "커스텀";
  const match = FLUID_CHOICES.find(f => f.M === inputs.M && f.k === inputs.k);
  return match ? match.label : "커스텀 유체 (직접 입력값)";
}

function WorkflowEvidence({ snapshot }) {
  const wd = snapshot.workflowDecision;
  return (
    <div>
      <div style={{fontSize:9,fontWeight:700,color:T.sub,fontFamily:font.mono,
        letterSpacing:1,marginBottom:6}}>CALCULATION BASIS</div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}>
        <span style={{color:T.sub,fontFamily:font.mono}}>Fluid</span>
        <span style={{color:T.text,fontWeight:700,fontFamily:font.mono}}>{_findFluidLabel(snapshot.inputs)}</span>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}>
        <span style={{color:T.sub,fontFamily:font.mono}}>Engine</span>
        <span style={{color:T.text,fontWeight:700,fontFamily:font.mono}}>API520 v{snapshot.engine_version}</span>
      </div>

      <div style={{fontSize:9,fontWeight:700,color:T.sub,fontFamily:font.mono,
        letterSpacing:1,margin:"12px 0 6px"}}>WORKFLOW DECISION</div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}>
        <span style={{color:T.sub,fontFamily:font.mono}}>State</span>
        <span style={{color:WF_COLOR[snapshot.workflow]||T.text,fontWeight:700,fontFamily:font.mono}}>
          {WF_LABEL[snapshot.workflow] || snapshot.workflow}
        </span>
      </div>
      {wd && wd.reasons && wd.reasons.length > 0 && (
        <div style={{marginTop:4}}>
          {wd.reasons.map((r,i) => (
            <div key={i} style={{fontSize:11,color:T.sub,fontFamily:font.mono,padding:"2px 0"}}>
              · {r.field} {r.from}{r.unit} → {r.to}{r.unit}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ── components/report/ApprovalEvidence.jsx ──────────────────────────
//  APPROVAL EVIDENCE
//  현재 보고 있는 snapshot(snapshotHash)에 실제로 서명된 Approval만 필터링해 보여준다.
//  검증(verifyApprovalRecord)은 여기서 호출하지 않는다 — ReportView가 1회 계산해
//  넘겨주는 verifiedResults를 그대로 표시만 (ApprovalHistory와 동일 결과 공유).
//  AUDIT-005: Evidence(Asset/Workflow)는 항상 존재하지만 Approval은 조건부 —
//  승인 전에는 빈 상태를 명확히 보여준다(감춤 없이).
// ════════════════════════════════════════════════════════════════
function ApprovalEvidence({ snapshot, approvals, verifiedResults }) {
  const matched = (approvals || []).filter(a => a.snapshotHash === snapshot.snapshotHash);
  const emptyMsg = snapshot.workflow === "REVIEW"
    ? "승인 대기 중 — 아래 전자서명 양식에서 진행하세요"
    : "이 버전에 대한 승인 없음";

  return (
    <div>
      <div style={{fontSize:9,fontWeight:700,color:T.sub,fontFamily:font.mono,
        letterSpacing:1,marginBottom:6}}>APPROVAL</div>
      {matched.length === 0 ? (
        <div style={{fontSize:12,color:T.gray,fontFamily:font.mono}}>{emptyMsg}</div>
      ) : (
        matched.map(rec => {
          const v  = (verifiedResults || {})[rec.approvalId];
          const ok = v?.valid;
          return (
            <div key={rec.approvalId} style={{display:"flex",justifyContent:"space-between",
              alignItems:"center",padding:"4px 0",fontSize:12}}>
              <span style={{color:T.text,fontWeight:700,fontFamily:font.mono}}>
                {v === undefined ? "· " : ok ? "✓ " : "✗ "}{rec.approver}
              </span>
              <span style={{color:T.sub,fontFamily:font.mono,fontSize:11}}>
                {(rec.approvedAt||"").slice(0,10)}
              </span>
            </div>
          );
        })
      )}
    </div>
  );
}


// ── components/report/AuditEvidence.jsx ──────────────────────────
//  AUDIT EVIDENCE
//  "왜 이 결과가 나왔는가"를 감사자가 한 화면에서 볼 수 있게 조립.
//  AUDIT-001: 여기서도 하위 컴포넌트에서도 Snapshot 외부 Asset을 조회하지 않는다.
//  AUDIT-004: snapshot/approvals 어떤 필드도 여기서 쓰거나(assign) 지우지 않는다 — 표시만.
//  AUDIT-005: Evidence는 workflow 단계와 무관하게 항상 렌더링된다(DRAFT부터).
//             Approval 파트만 승인 전엔 빈 상태로 보여준다 — "Evidence는 항상 존재,
//             Approval은 조건부 존재"를 분리. 헤더 라벨만 단계에 따라 다르게 표시
//             (승인 전: 검토 근거 / 승인 후: 승인 기록) — 승인자가 "무엇을 승인했는지"를
//             검토 시작 시점부터 추적 가능해야 하므로 숨기지 않는다.
// ════════════════════════════════════════════════════════════════
function AuditEvidence({ snapshot, approvals, verifiedResults }) {
  const [showPkg, setShowPkg] = useState(false);
  const approved = snapshot.workflow === "APPROVED" || snapshot.workflow === "CLOSED";
  const headerLabel = approved ? "✓ 승인 기록 · AUDIT EVIDENCE" : "검토 근거 · EVIDENCE CHAIN";

  // ReportView 화면에 보이는 것과 실제 export 대상(ReportPackage)이 같은 Snapshot에서
  // 파생됐는지 확인 — Package는 여기서 "만들기만" 하고 계산/재검증은 절대 안 함.
  const pkg = buildReportPackage(snapshot, {
    approvalRecords: approvals,
    approvalVerificationResults: verifiedResults,
  });
  const pkgValid = validateReportPackage(pkg);
  const identityMatch = pkg.identity?.snapshotHash === snapshot.snapshotHash;

  return (
    <div style={{background:T.cardBg,borderRadius:14,border:`1px solid ${T.border}`,
      overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"10px 14px",background:T.navy,color:T.white,
        fontSize:11,fontWeight:900,fontFamily:font.mono,letterSpacing:1}}>
        {headerLabel}
      </div>
      <div style={{padding:"12px 14px",borderBottom:`1px solid ${T.border}`}}>
        <AssetEvidence snapshot={snapshot} />
      </div>
      <div style={{padding:"12px 14px",borderBottom:`1px solid ${T.border}`}}>
        <WorkflowEvidence snapshot={snapshot} />
      </div>
      <div style={{padding:"12px 14px",borderBottom:`1px solid ${T.border}`}}>
        <ApprovalEvidence snapshot={snapshot} approvals={approvals} verifiedResults={verifiedResults} />
      </div>
      <div style={{padding:"10px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10,fontFamily:font.mono,
            color:(pkgValid.ok && identityMatch)?T.green:T.red}}>
            {(pkgValid.ok && identityMatch) ? "✓ ReportPackage 무결성 확인됨" : `✗ ${pkgValid.reason || "identity mismatch"}`}
          </span>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setShowPkg(s=>!s)}
              style={{fontSize:10,padding:"3px 8px",background:T.bg,color:T.navyLight,
                border:`1px solid ${T.navyLight}`,borderRadius:6,cursor:"pointer",fontFamily:font.mono}}>
              {showPkg?"JSON 닫기":"패키지 JSON 보기"}
            </button>
            <button onClick={()=>{
                const r = renderPDF(pkg);
                if (!r.ok) alert(`PDF 생성 실패: ${r.reason}`);
              }}
              disabled={!pkgValid.ok || !identityMatch}
              style={{fontSize:10,padding:"3px 8px",
                background:(pkgValid.ok&&identityMatch)?T.navyLight:T.gray,color:T.white,
                border:"none",borderRadius:6,
                cursor:(pkgValid.ok&&identityMatch)?"pointer":"not-allowed",fontFamily:font.mono}}>
              PDF 내보내기
            </button>
          </div>
        </div>
        {showPkg && (
          <pre style={{marginTop:8,padding:10,background:T.bg,borderRadius:8,
            fontSize:9,color:T.sub,fontFamily:font.mono,overflowX:"auto",maxHeight:240}}>
            {JSON.stringify(pkg, null, 2)}
          </pre>
        )}
      </div>
    </div>
  );
}


// ── components/ReportView.jsx ──────────────────────────
//  REPORT VIEW — Snapshot projection
// ════════════════════════════════════════════════════════════════
function ReportView({ snap, approvals, caseSnapshotHistory, onWorkflowAdvance, onApprovalSubmit }) {
  const [simMode, setSimMode] = useState("IDLE");
  const [sim, setSim] = useState({pressure:2.0,direction:1,valveOpen:false,ratio:0});
  const [hist, setHist] = useState([2.0]);
  const [reportTab, setReportTab] = useState("sim");
  const simRef = useRef(null);

  // 서명 검증은 여기서 1회만 계산 — ApprovalHistory와 AuditEvidence가 결과 공유
  // (두 곳에서 각자 verifyApprovalRecord를 부르면 중복 호출)
  const [verifiedResults, setVerifiedResults] = useState({});
  useEffect(() => {
    let cancelled = false;
    const caseObj = { snapshotHistory: caseSnapshotHistory || [] };
    (async () => {
      const entries = {};
      for (const rec of (approvals || [])) {
        entries[rec.approvalId] = await verifyApprovalRecord(rec, caseObj, approvals);
      }
      if (!cancelled) setVerifiedResults(entries);
    })();
    return () => { cancelled = true; };
  }, [approvals, caseSnapshotHistory]);

  const setPoint = snap.inputs.P1;
  const mawp     = snap.inputs.mawp;

  useEffect(() => {
    if (simMode !== "RUNNING") { clearInterval(simRef.current); return; }
    simRef.current = setInterval(() => {
      setSim(prev => {
        const next = stepSim(prev, setPoint, mawp);
        setHist(h => [...h.slice(-API_CONST.HISTORY_SIZE), next.pressure]);
        return next;
      });
    }, 50);
    return () => clearInterval(simRef.current);
  }, [simMode, setPoint, mawp]);

  const resetSim = () => {
    setSimMode("IDLE");
    setSim({pressure:1.0,direction:1,valveOpen:false,ratio:0});
    setHist([1.0]);
  };

  const r = snap.result;
  const allOK = r.checklist && Object.values(r.checklist).every(Boolean);
  const nextStates = WF_TRANSITIONS[snap.workflow] || [];

  const TAB = (id, label) => (
    <button key={id} onClick={()=>setReportTab(id)} style={{padding:"9px 14px",border:"none",cursor:"pointer",borderRadius:9,fontWeight:700,fontSize:11,fontFamily:font.mono,
      background:reportTab===id?T.navyLight:T.bg,color:reportTab===id?T.white:T.sub,
      boxShadow:reportTab===id?`0 3px 0 ${T.navy}`:"0 2px 0 #ccc",transition:"all 0.15s"}}>
      {label}
    </button>
  );

  return (
    <div>
      {/* Snapshot 헤더 */}
      <div style={{background:T.cardBg,borderRadius:14,padding:"14px 16px",marginBottom:12,border:`1.5px solid ${T.border}`,boxShadow:"0 2px 8px #0001"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontSize:17,fontWeight:900,color:T.navy,fontFamily:font.mono}}>{snap.valveTag}</div>
            <div style={{fontSize:11,color:T.sub,fontFamily:font.sans,marginTop:2}}>
              {snap.deviceType === "safetyValve" ? "안전밸브" : "럽처디스크"} · API 520/526 계산
            </div>
            <div style={{fontSize:10,color:T.gray,fontFamily:font.mono,marginTop:4}}>{snap.createdAt.slice(0,19).replace("T"," ")} · {snap.id}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{padding:"5px 12px",borderRadius:20,background:WF_COLOR[snap.workflow]+"22",border:`1.5px solid ${WF_COLOR[snap.workflow]}`,fontSize:11,fontWeight:700,color:WF_COLOR[snap.workflow],fontFamily:font.mono}}>
              {WF_LABEL[snap.workflow]}
            </div>
            <div style={{padding:"5px 12px",borderRadius:20,background:allOK?T.greenBg:T.redBg,border:`1.5px solid ${allOK?T.green:T.red}`,fontSize:11,fontWeight:700,color:allOK?T.green:T.red,fontFamily:font.mono}}>
              {allOK?"ALL PASS":"FAIL"}
            </div>
          </div>
        </div>

        {/* 결과 요약 */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:12}}>
          {[
            ["오리피스", r.selected?.letter ?? "-"],
            ["필요 면적", `${r.areaCm2?.toFixed(3)} cm²`],
            ["여유율", `${r.margin?.toFixed(3)}×`],
          ].map(([k,v])=>(
            <div key={k} style={{background:T.bg,borderRadius:9,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:9,color:T.sub,fontFamily:font.mono}}>{k}</div>
              <div style={{fontSize:16,fontWeight:900,color:T.navyLight,fontFamily:font.mono,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* 리포트 탭 */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {TAB("sim","📊 시뮬레이션")}
        {TAB("evidence","🧮 계산 근거")}
        {TAB("checklist","✅ PSM 체크")}
        {TAB("audit", (snap.workflow === "APPROVED" || snap.workflow === "CLOSED")
          ? "✓ 승인 기록" : "🔍 검토 근거")}
      </div>

      {reportTab === "sim" && (
        <div>
          <div style={{background:T.cardBg,borderRadius:14,padding:12,marginBottom:10,border:`1px solid ${T.border}`}}>
            <PipeFlowRenderer snap={snap} sim={sim}/>
          </div>
          <div style={{background:T.cardBg,borderRadius:14,padding:12,marginBottom:10,border:`1px solid ${T.border}`}}>
            <PressChartRenderer hist={hist} snap={snap}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            {simMode === "RUNNING"
              ? <button onClick={()=>setSimMode("IDLE")} style={{flex:1,padding:"11px",background:T.orange,color:T.white,border:"none",borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer",boxShadow:`0 4px 0 #CC7000`}}>⏸ 정지</button>
              : <button onClick={()=>setSimMode("RUNNING")} style={{flex:1,padding:"11px",background:T.blue,color:T.white,border:"none",borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer",boxShadow:`0 4px 0 ${T.blueDk}`}}>▶ 시뮬 시작</button>
            }
            <button onClick={resetSim} style={{padding:"11px 16px",background:T.bg,color:T.sub,border:`1px solid ${T.border}`,borderRadius:10,fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>↺ 초기화</button>
          </div>
        </div>
      )}

      {reportTab === "evidence" && (
        <div>
          {snap.evidence.map(step => <EvidenceCard key={step.id} step={step}/>)}
        </div>
      )}

      {reportTab === "checklist" && (
        <div style={{background:T.cardBg,borderRadius:14,padding:14,border:`1px solid ${T.border}`}}>
          <ChecklistRenderer checklist={snap.result.checklist}/>
        </div>
      )}

      {reportTab === "audit" && (
        <AuditEvidence snapshot={snap} approvals={approvals} verifiedResults={verifiedResults} />
      )}

      {/* Workflow 전환 — REVIEW는 전자서명(ApprovalForm)을 거쳐야 함 */}
      {snap.workflow === "REVIEW" ? (
        <ApprovalForm snap={snap} onSubmit={onApprovalSubmit} />
      ) : (
        nextStates.length > 0 && (
          <WorkflowTransition
            currentState={snap.workflow}
            nextStates={nextStates}
            onAdvance={onWorkflowAdvance}
          />
        )
      )}

      <ApprovalHistory approvals={approvals} verifiedResults={verifiedResults} />
    </div>
  );
}


// ── components/CaseView.jsx ──────────────────────────
//  CASE VIEW
// ════════════════════════════════════════════════════════════════
function CaseView({ caseData, dischargeSystems, onBack, onSnapshotCreate, onApprovalUpdate }) {
  const equipment = caseData.equipment || null;

  // 매칭 DischargeSystem — connectedTags 또는 명시적 지정
  const dischargeSystem = caseData.dischargeSystemId
    ? (dischargeSystems || []).find(ds => ds.id === caseData.dischargeSystemId) || null
    : equipment
    ? (dischargeSystems || []).find(ds => ds.connectedTags?.includes(equipment.tag)) || null
    : null;

  // Equipment 값으로 inputs 초기화
  const initialInputs = {
    ...R201_DEFAULTS,
    ...(equipment ? {
      P1:   equipment.setPressure,
      mawp: equipment.mawp,
      // PRESSURE-001: overpressure는 Case 입력값이 아니라 Asset(Equipment)
      // 데이터. Equipment에 없으면 계산을 막아야 하므로 여기서 임의
      // 기본값을 몰래 대입하지 않는다 (누락 시 validateInputs에서 거부).
      OP:   equipment.overpressure,
      P2:   dischargeSystem?.headerPressure ?? R201_DEFAULTS.P2,
    } : {}),
  };

  const startScreen = caseData.latestSnap ? "report" : "input";
  const [screen,     setScreen]     = useState(startScreen);
  const [inputs,     setInputs]     = useState(initialInputs);
  const [deviceType, setDeviceType] = useState(
    equipment?.deviceType ?? "safetyValve"
  );
  const [snapshot, setSnapshot] = useState(caseData.latestSnap || null);
  const [approvals, setApprovals] = useState(caseData.approvals || []);

  const handleInputChange = (key, val) => setInputs(p => ({ ...p, [key]: val }));

  const handleCalculate = () => {
    const engineResult = api520Engine(inputs, deviceType);
    if (!engineResult.valid) {
      alert(`입력 오류: ${engineResult.error.field} — ${engineResult.error.reason}`);
      return;
    }
    // Engine이 workflow 결정 — timestamp는 UI에서 주입 (Engine 순수성 유지)
    const wfDec = computeWorkflowState(null, equipment, dischargeSystem);
    const snap = createSnapshot({
      caseId:           caseData.id,
      valveTag:         caseData.valveTag,
      deviceType,
      inputs,
      engineResult,
      equipment,
      dischargeSystem,
      workflowDecision: { ...wfDec, state: "INSPECTION" },
    });
    setSnapshot(snap);
    onSnapshotCreate(caseData.id, snap);
    setScreen("report");
  };

  // workflow 변경 = 새 Snapshot 생성 (patch 금지)
  // snapshotHash가 workflow를 포함해 계산되므로, workflow가 바뀌면
  // 반드시 새로운 identity(새 hash)를 가진 Snapshot이어야 한다.
  // inputs/engineResult는 재사용 — Engine을 다시 돌리는 게 아니라
  // "동일 계산 결과 + 새 workflow 결정"을 새 버전으로 기록하는 것.
  //
  // build/commit을 분리한 이유(중요): Approval은 "지금 보고 있는(REVIEW) 버전"이
  // 아니라 "승인 결과로 확정될 다음 버전(APPROVED/ACTION_REQUIRED)"의 hash에
  // 서명해야 한다. 순서를 반대로 하면(서명 먼저 → 전이 나중) 서명 직후
  // Snapshot이 교체되면서 approval.snapshotHash가 가리키는 버전이 case에서
  // 사라져 "승인은 됐는데 최종 상태에는 승인 기록이 없는" 상태가 된다.
  const _buildAdvancedSnapshot = (nextState, comment) => {
    const wfDec = computeWorkflowState(snapshot, equipment, dischargeSystem);
    const newSnap = createSnapshot({
      caseId:           caseData.id,
      valveTag:         caseData.valveTag,
      deviceType,
      inputs:           snapshot.inputs,
      engineResult:     snapshot.result,
      equipment,
      dischargeSystem,
      workflowDecision: { ...wfDec, state: nextState },
    });
    // lastComment는 hash 계산 대상 아님 (승인/반려 사유 메모, 결정 내용 아님)
    return comment ? Object.freeze({ ...newSnap, lastComment: comment }) : newSnap;
  };

  const _commitSnapshot = (snap) => {
    setSnapshot(snap);
    onSnapshotCreate(caseData.id, snap);
  };

  const handleWorkflowAdvance = (nextState, comment) => {
    _commitSnapshot(_buildAdvancedSnapshot(nextState, comment));
  };

  // ApprovalForm → 여기 하나만 거쳐서 처리한다.
  // 1) "승인 후 확정될 다음 버전(Snapshot)"을 먼저 만든다 (아직 커밋 안 함)
  // 2) 그 Snapshot의 hash에 서명한다 (submitApproval)
  // 3) 서명 성공한 경우에만 그 Snapshot을 실제로 커밋한다
  //    → case의 "현재/최종" Snapshot이 항상 서명 대상과 정확히 일치한다.
  const handleApprovalSubmit = async ({ decision, comment, signer, role }) => {
    if (!snapshot || snapshot.workflow !== "REVIEW") {
      alert("승인 대기(REVIEW) 상태에서만 서명할 수 있습니다.");
      return { ok: false, reason: "not in REVIEW state" };
    }
    const nextState = decision === "approve" ? "APPROVED" : "ACTION_REQUIRED";
    const nextSnap  = _buildAdvancedSnapshot(nextState, comment);

    const result = await submitApproval(
      { snapshot: nextSnap, decision, comment, signer, role },
      approvals
    );
    if (!result.ok) {
      alert(`승인 처리 실패 [${result.contract}]: ${result.reason}`);
      return result;
    }
    setApprovals(result.history);
    onApprovalUpdate(caseData.id, result.history);
    _commitSnapshot(nextSnap);
    return result;
  };

  const wfColor = WF_COLOR[snapshot?.workflow ?? caseData.workflow];
  const wfLabel = WF_LABEL[snapshot?.workflow ?? caseData.workflow];

  // Engine이 결정한 workflow 상태 — UI는 읽기만 함
  const wfDecision = computeWorkflowState(snapshot, equipment, dischargeSystem);

  // MOC 결과는 wfDecision.reasons에서 추출 (Engine 결과 projection)
  const mocResult = {
    changed: wfDecision.reasons.length > 0,
    diffs:   wfDecision.reasons,  // { field, from, to, unit, type }
  };

  // Snapshot workflow와 Engine 결정값이 다르면 Snapshot 갱신
  // (Engine이 상태를 결정하면 Snapshot이 그것을 반영 — UI는 트리거만)
  useEffect(() => {
    if (!snapshot) return;
    if (wfDecision.state === snapshot.workflow) return;
    const locked = ["APPROVED","CLOSED"];
    if (locked.includes(snapshot.workflow)) return;
    handleWorkflowAdvance(
      wfDecision.state,
      wfDecision.reasons.map(r=>`${r.type}: ${r.field} ${r.from}→${r.to}`).join(", ")
    );
  }, [wfDecision.state]);

  const tabs = [
    { id:"info",   label:"정보" },
    { id:"input",  label:"사양 결정" },
    ...(snapshot ? [{ id:"report", label:"검토 결과" }] : []),
  ];

  return (
    <div>
      {/* 헤더 */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={onBack}
          style={{padding:"8px 12px",background:T.bg,border:`1px solid ${T.border}`,
            borderRadius:9,fontSize:13,fontWeight:700,color:T.sub,
            fontFamily:font.mono,cursor:"pointer",flexShrink:0}}>←</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:900,color:T.navy,
            fontFamily:font.mono,overflow:"hidden",
            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {caseData.valveTag}
          </div>
          <div style={{fontSize:10,color:T.sub,fontFamily:font.mono}}>
            {equipment?.location || caseData.location || ""}
            {dischargeSystem ? ` → ${dischargeSystem.name}` : ""}
          </div>
        </div>
        <div style={{padding:"5px 11px",borderRadius:20,
          background:wfColor+"18",border:`1.5px solid ${wfColor}`,
          fontSize:10,fontWeight:700,color:wfColor,fontFamily:font.mono,flexShrink:0}}>
          {wfLabel}
        </div>
      </div>

      {/* 탭 */}
      <div style={{display:"flex",gap:6,marginBottom:14,
        borderBottom:`1px solid ${T.border}`,paddingBottom:10}}>
        {tabs.map(({id,label})=>(
          <button key={id} onClick={()=>setScreen(id)}
            style={{padding:"8px 16px",border:"none",borderRadius:9,cursor:"pointer",
              fontSize:12,fontWeight:700,fontFamily:font.mono,
              background:screen===id?T.navyLight:T.bg,
              color:screen===id?T.white:T.sub,
              boxShadow:screen===id?`0 3px 0 ${T.navy}`:"0 2px 0 #ccc"}}>
            {label}
            {id==="report" && snapshot && (
              <span style={{marginLeft:4,fontSize:9,
                color:screen===id?"#AED6F1":
                  Object.values(snapshot.result?.checklist||{}).every(Boolean)
                  ?T.green:T.red}}>●</span>
            )}
          </button>
        ))}
      </div>

      {/* MOC 감지 배너 */}
      {mocResult.changed && (
        <div style={{background:"#FFF8E1",border:`2px solid ${T.orange}`,
          borderRadius:12,padding:"12px 14px",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:18}}>⚠</span>
            <div>
              <div style={{fontSize:12,fontWeight:900,color:"#7A4F00",fontFamily:font.sans}}>
                설비가 변경되었습니다 — 재검토 필요
              </div>
              <div style={{fontSize:10,color:"#7A4F00",fontFamily:font.sans,marginTop:1}}>
                이 검토는 아래 조건으로 수행됐습니다. 현재 설비 조건과 다릅니다.
              </div>
            </div>
          </div>

          {/* Revision 비교 */}
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            {[
              ["Equipment",
               snapshot?.assetRefs?.equipmentRevision,
               equipment?.revision,
               equipment?.mocId],
              ["Discharge Sys.",
               snapshot?.assetRefs?.dischargeRevision,
               dischargeSystem?.revision,
               dischargeSystem?.mocId],
            ].filter(([,sv]) => sv != null).map(([label, snapRev, curRev, mocId]) => (
              <div key={label} style={{flex:1,background:"#FFFDE7",borderRadius:9,
                padding:"8px 10px",border:`1px solid #FFD54F`}}>
                <div style={{fontSize:9,color:T.sub,fontFamily:font.mono,marginBottom:3}}>{label}</div>
                <div style={{fontSize:12,fontFamily:font.mono,color:"#7A4F00"}}>
                  Rev.{snapRev}
                  {snapRev !== curRev && (
                    <span style={{color:T.green,fontWeight:700}}> → Rev.{curRev}</span>
                  )}
                </div>
                {mocId && (
                  <div style={{fontSize:9,color:T.blue,fontFamily:font.mono,marginTop:2}}>
                    {mocId}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* 변경 필드 목록 */}
          {mocResult.diffs.map((d,i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,
              padding:"4px 0",borderTop:`1px solid #FFD54F`,
              fontSize:11,fontFamily:font.mono}}>
              <span style={{color:T.sub,minWidth:110}}>{d.field}</span>
              <span style={{color:T.red,textDecoration:"line-through"}}>
                {d.from}{d.unit}
              </span>
              <span style={{color:T.sub}}>→</span>
              <span style={{color:T.green,fontWeight:700}}>
                {d.to}{d.unit}
              </span>
            </div>
          ))}

          <button onClick={()=>setScreen("input")}
            style={{marginTop:10,width:"100%",padding:"10px",
              background:T.orange,color:T.white,border:"none",borderRadius:9,
              fontSize:12,fontWeight:700,fontFamily:font.sans,cursor:"pointer",
              boxShadow:`0 3px 0 #CC7000`}}>
            변경된 조건으로 재검토 →
          </button>
        </div>
      )}

      {/* 정보 탭 */}
      {screen === "info" && (
        <div>
          {/* Equipment */}
          {equipment && (
            <div style={{background:T.cardBg,borderRadius:14,padding:14,
              marginBottom:10,border:`1px solid ${T.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:T.sub,
                fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>EQUIPMENT</div>
              {[
                ["Tag", equipment.tag],
                ["위치", equipment.location],
                ["제조사/모델", `${equipment.manufacturer} ${equipment.model}`.trim()||"-"],
                ["MAWP / SET", `${equipment.mawp} / ${equipment.setPressure} barg`],
                ["오리피스", equipment.orifice||"-"],
                ["IN / OUT", `${equipment.inletSize} / ${equipment.outletSize}`],
              ].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",
                  padding:"6px 0",borderBottom:`1px solid ${T.border}`,fontSize:12}}>
                  <span style={{color:T.sub,fontFamily:font.mono}}>{k}</span>
                  <span style={{color:T.text,fontWeight:700,fontFamily:font.mono}}>{v}</span>
                </div>
              ))}
            </div>
          )}
          {/* DischargeSystem */}
          {dischargeSystem && (
            <div style={{background:T.cardBg,borderRadius:14,padding:14,
              marginBottom:10,border:`1px solid ${T.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:T.sub,
                fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>DISCHARGE SYSTEM</div>
              {[
                ["계통명", dischargeSystem.name],
                ["배출 목적지", DESTINATION_LABEL[dischargeSystem.destination]],
                ["L / D", `${dischargeSystem.L}m / Ø${Math.round(dischargeSystem.D*1000)}mm`],
                ["Fittings ΣK", dischargeSystem.fittingsK],
                ["Header 압력", `${dischargeSystem.headerPressure} barg`],
              ].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",
                  padding:"6px 0",borderBottom:`1px solid ${T.border}`,fontSize:12}}>
                  <span style={{color:T.sub,fontFamily:font.mono}}>{k}</span>
                  <span style={{color:T.text,fontWeight:700,fontFamily:font.mono}}>{v}</span>
                </div>
              ))}
            </div>
          )}
          <button onClick={()=>setScreen("input")}
            style={{width:"100%",padding:"14px",background:T.navyLight,color:T.white,
              border:"none",borderRadius:14,fontSize:14,fontWeight:900,
              fontFamily:font.sans,cursor:"pointer",boxShadow:`0 5px 0 ${T.navy}`}}>
            {snapshot?"사양 재결정 →":"사양 결정 시작 →"}
          </button>
        </div>
      )}

      {screen === "input" && (
        <InputView inputs={inputs} deviceType={deviceType}
          dischargeSystem={dischargeSystem}
          onChange={handleInputChange} onDeviceChange={setDeviceType}
          onSubmit={handleCalculate}/>
      )}

      {screen === "report" && snapshot && (
        <ReportView snap={snapshot} approvals={approvals}
                    caseSnapshotHistory={caseData.snapshotHistory}
                    onWorkflowAdvance={handleWorkflowAdvance}
                    onApprovalSubmit={handleApprovalSubmit}/>
      )}

      {screen === "report" && !snapshot && (
        <div style={{textAlign:"center",padding:"40px 20px",color:T.sub}}>
          <div style={{fontSize:32,marginBottom:12}}>📋</div>
          <div style={{fontSize:14,fontWeight:700,color:T.navy,marginBottom:8}}>
            아직 계산 결과가 없습니다
          </div>
          <button onClick={()=>setScreen("input")}
            style={{padding:"12px 24px",background:T.navyLight,color:T.white,
              border:"none",borderRadius:11,fontSize:13,fontWeight:700,
              fontFamily:font.sans,cursor:"pointer"}}>
            사양 결정 시작 →
          </button>
        </div>
      )}
    </div>
  );
}

const INITIAL_CASES = [];  // 설비대장에서 선택 후 생성

function CaseCard({ c, onOpen }) {
  const hasSnap = !!c.latestSnap;
  const allOK   = hasSnap && c.latestSnap.result?.checklist &&
                  Object.values(c.latestSnap.result.checklist).every(Boolean);
  return (
    <button onClick={()=>onOpen(c)}
      style={{display:"block",width:"100%",textAlign:"left",background:T.cardBg,
        borderRadius:14,padding:"14px 16px",marginBottom:10,
        border:`1.5px solid ${T.border}`,cursor:"pointer",
        boxShadow:"0 2px 8px #0001",
        WebkitTapHighlightColor:"rgba(26,63,111,0.15)",
        fontFamily:font.sans,appearance:"none",WebkitAppearance:"none"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div>
          <div style={{fontSize:15,fontWeight:900,color:T.navy,fontFamily:font.mono}}>{c.valveTag}</div>
          {c.asset && (
            <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginTop:1}}>
              {c.asset.location} · SET {c.asset.setPressure}b
            </div>
          )}
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {hasSnap && (
            <span style={{padding:"3px 9px",borderRadius:12,
              background:allOK?T.greenBg:T.redBg,
              border:`1px solid ${allOK?T.green:T.red}`,
              fontSize:10,fontWeight:700,color:allOK?T.green:T.red,fontFamily:font.mono}}>
              {allOK?"PASS":"FAIL"}
            </span>
          )}
          <span style={{padding:"3px 9px",borderRadius:12,
            background:WF_COLOR[c.workflow]+"18",
            border:`1px solid ${WF_COLOR[c.workflow]}`,
            fontSize:10,fontWeight:700,color:WF_COLOR[c.workflow],fontFamily:font.mono}}>
            {WF_LABEL[c.workflow]}
          </span>
        </div>
      </div>
      <div style={{display:"flex",gap:12,fontSize:11,color:T.sub,fontFamily:font.mono}}>
        <span>{c.fluid}</span><span>·</span><span>{c.reviewType}</span>
      </div>
      {hasSnap && (
        <div style={{marginTop:8,display:"flex",gap:8}}>
          {[
            ["오리피스", c.latestSnap.result.selected?.letter],
            ["여유율",   `${c.latestSnap.result.margin?.toFixed(2)}×`],
            ["면적",     `${c.latestSnap.result.areaCm2?.toFixed(1)} cm²`],
          ].map(([k,v])=>(
            <div key={k} style={{background:T.bg,borderRadius:7,padding:"4px 8px",flex:1,textAlign:"center"}}>
              <div style={{fontSize:8,color:T.gray,fontFamily:font.mono}}>{k}</div>
              <div style={{fontSize:12,fontWeight:900,color:T.navyLight,fontFamily:font.mono}}>{v}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{marginTop:8,textAlign:"right",fontSize:10,color:T.blue,fontFamily:font.mono,fontWeight:700}}>
        {hasSnap ? "결과 보기 →" : "검토 시작 →"}
      </div>
    </button>
  );
}

function Dashboard({ cases, onOpenCase, onNewCase, onOpenAssetMaster }) {
  const [reviewType, setReviewType] = useState("정기 PSM 검토");
  const REVIEW_OPTIONS = ["정기 PSM 검토","최초 설치 검토","변경 검토 (MOC)","사고 후 검토"];

  return (
    <div>
      {/* 메인 CTA — 설비대장에서 선택 */}
      <button onClick={onOpenAssetMaster}
        style={{width:"100%",padding:"16px",background:T.navyLight,color:T.white,
          border:"none",borderRadius:14,fontSize:15,fontWeight:900,
          fontFamily:font.sans,cursor:"pointer",
          boxShadow:`0 5px 0 ${T.navy}`,marginBottom:8,
          WebkitTapHighlightColor:"rgba(255,255,255,0.2)"}}>
        + 설비 선택 → 새 검토 시작
      </button>
      <div style={{fontSize:10,color:T.sub,fontFamily:font.sans,textAlign:"center",marginBottom:16}}>
        설비대장에서 PSV를 선택하면 사양이 자동으로 채워집니다
      </div>

      {/* 진행 중인 검토 */}
      {cases.length > 0 && (
        <>
          <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:10,letterSpacing:1}}>
            진행 중인 검토 ({cases.length})
          </div>
          {cases.map(c => <CaseCard key={c.id} c={c} onOpen={onOpenCase}/>)}
        </>
      )}

      {cases.length === 0 && (
        <div style={{textAlign:"center",padding:"40px 20px",color:T.gray,fontFamily:font.sans}}>
          <div style={{fontSize:40,marginBottom:10}}>📋</div>
          <div style={{fontSize:13,color:T.sub,fontWeight:700}}>진행 중인 검토가 없습니다</div>
          <div style={{fontSize:11,color:T.gray,marginTop:4}}>위 버튼으로 설비를 선택해 검토를 시작하세요</div>
        </div>
      )}
    </div>
  );
}


// ── ArcSafe.jsx ──────────────────────────
//  ROOT — ArcSafe App (v0.2.0-asset-master)
// ════════════════════════════════════════════════════════════════
function ArcSafe() {
  const [equipments, setEquipments] = useState(() =>
    SAMPLE_EQUIPMENT.map(e => createEquipment(e))
  );
  const [dischargeSystems, setDischargeSystems] = useState(() =>
    SAMPLE_DISCHARGE_SYSTEMS.map(d => createDischargeSystem(d))
  );
  const [cases,      setCases]      = useState([]);
  const [activeCase, setActiveCase] = useState(null);
  const [screen,     setScreen]     = useState("dashboard");

  const handleOpenCase = (c) => setActiveCase(c);
  const handleBack = () => setActiveCase(null);

  // Equipment 선택 → Case 생성 → CaseView 진입
  const handleEquipmentSelect = (equipment) => {
    const ds = dischargeSystems.find(
      d => d.connectedTags.includes(equipment.tag)
    ) || null;
    const newCase = {
      id:               `C-${new Date().getFullYear()}-${String(cases.length+1).padStart(3,"0")}`,
      valveTag:         equipment.tag,
      equipment:        equipment,
      dischargeSystemId:ds?.id || null,
      fluid:            "CO₂ (고압)",
      reviewType:       "정기 PSM 검토",
      workflow:         "DRAFT",
      latestSnap:       null,   // pointer only — 검증에 사용 금지
      snapshotHistory:  [],     // source of truth (append-only)
      approvals:        [],     // ApprovalRecord[] (append-only, service.js를 통해서만 갱신)
    };
    setCases(prev => [...prev, newCase]);
    setActiveCase(newCase);
    setScreen("dashboard");
  };

  const handleAddEquipment = (eq) =>
    setEquipments(prev => [...prev, eq]);

  // EQUIPMENT-MOC: DischargeSystem과 동일 계약 — id 유지, revision만 교체
  const handleReviseEquipment = (revisedEq) =>
    setEquipments(prev => prev.map(e => e.id === revisedEq.id ? revisedEq : e));

  const handleAddDischargeSystem = (ds) =>
    setDischargeSystems(prev => [...prev, ds]);

  // GEOMETRY-002: id는 그대로, revision만 올라간 새 객체로 교체.
  // Asset은 Snapshot이 아니라 "현재 상태" — 교체 자체는 허용(append-only 아님).
  // MOC 감지는 이 교체 이후 케이스 재진입 시 assetFingerprint 비교로 자동 발동.
  const handleReviseDischargeSystem = (revisedDs) =>
    setDischargeSystems(prev => prev.map(d => d.id === revisedDs.id ? revisedDs : d));

  // HISTORY-001과 동일 원칙: overwrite 금지, service.js가 만든 새 배열만 반영
  const handleApprovalUpdate = (caseId, approvals) => {
    setCases(prev => prev.map(c =>
      c.id !== caseId ? c : { ...c, approvals }
    ));
    setActiveCase(prev =>
      prev && prev.id === caseId ? { ...prev, approvals } : prev
    );
  };

  // HISTORY-001: overwrite 금지 — 항상 appendSnapshot()으로 history에 추가
  const handleSnapshotCreate = (caseId, snap) => {
    setCases(prev => prev.map(c =>
      c.id !== caseId ? c : appendSnapshot(c, snap)
    ));
    setActiveCase(prev =>
      prev && prev.id === caseId ? appendSnapshot(prev, snap) : prev
    );
  };

  const curScreen = activeCase ? "case"
    : screen === "assets" ? "assets"
    : "dashboard";

  return (
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:font.sans}}>
      {/* 글로벌 헤더 */}
      <div style={{background:T.navy,padding:"11px 16px",display:"flex",
        alignItems:"center",justifyContent:"space-between",
        position:"sticky",top:0,zIndex:100}}>
        <div>
          <div style={{fontSize:16,fontWeight:900,color:T.white,
            fontFamily:font.mono,letterSpacing:1}}>ArcSafe</div>
          <div style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono}}>
            PSM 안전밸브 관리 시스템
          </div>
          <div style={{fontSize:8,color:"#4A6FA5",fontFamily:font.mono,marginTop:1}}>
            v0.2.0 · {typeof __BUILD_HASH__ !== "undefined" ? __BUILD_HASH__ : "dev"}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {activeCase && (
            <div style={{fontSize:11,color:"#7B9EC0",fontFamily:font.mono}}>
              {activeCase.valveTag}
            </div>
          )}
          {!activeCase && (
            <button
              onClick={()=>setScreen(screen==="assets"?"dashboard":"assets")}
              style={{padding:"6px 11px",
                background:screen==="assets"?T.blue:"none",
                border:`1px solid ${screen==="assets"?T.blue:"#4A6FA5"}`,
                borderRadius:8,fontSize:10,
                color:screen==="assets"?T.white:"#7B9EC0",
                fontFamily:font.mono,cursor:"pointer"}}>
              🔧 설비대장
            </button>
          )}
        </div>
      </div>

      {/* 컨텐츠 */}
      <div style={{padding:"14px 14px 40px",maxWidth:640,margin:"0 auto"}}>
        {curScreen === "case" && activeCase && (
          <CaseView
            caseData={activeCase}
            dischargeSystems={dischargeSystems}
            onBack={handleBack}
            onSnapshotCreate={handleSnapshotCreate}
            onApprovalUpdate={handleApprovalUpdate}
          />
        )}
        {curScreen === "assets" && (
          <AssetMaster
            equipments={equipments}
            dischargeSystems={dischargeSystems}
            onSelectEquipment={handleEquipmentSelect}
            onAddEquipment={handleAddEquipment}
            onReviseEquipment={handleReviseEquipment}
            onAddDischargeSystem={handleAddDischargeSystem}
            onReviseDischargeSystem={handleReviseDischargeSystem}
            onBack={()=>setScreen("dashboard")}
          />
        )}
        {curScreen === "dashboard" && (
          <Dashboard
            cases={cases}
            onOpenCase={handleOpenCase}
            onNewCase={()=>setScreen("assets")}
            onOpenAssetMaster={()=>setScreen("assets")}
          />
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ArcSafe />);
</script>
</body>
