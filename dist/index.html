// ── TRACE-SCHEMA-001: Calculation Trace 스키마 고정 ────────────
// Trace는 단순 로그가 아니라 감사 증거(Report Evidence)다. 각 항목은
// 반드시 이 4개 필드를 갖는다: step(단계 식별자), value(산출값),
// unit(단위, 무차원이면 ""), formula(계산식 설명). inputs는 선택
// (그 단계가 어떤 값들로부터 나왔는지 — 없는 단계도 있을 수 있음).
// 이 스키마를 바꾸면 TRACE-SCHEMA-001 계약 테스트가 실패해야 한다.
const TRACE_REQUIRED_KEYS = ["step", "value", "unit", "formula"];
function validateTraceSchema(trace) {
  if (!Array.isArray(trace)) return { ok:false, reason:"trace_not_array" };
  for (let i = 0; i < trace.length; i++) {
    const entry = trace[i];
    if (!entry || typeof entry !== "object") {
      return { ok:false, reason:"entry_not_object", index:i };
    }
    for (const k of TRACE_REQUIRED_KEYS) {
      if (!(k in entry)) return { ok:false, reason:"missing_key", key:k, index:i, step:entry.step };
    }
    if (typeof entry.step !== "string" || entry.step.length === 0) {
      return { ok:false, reason:"invalid_step_id", index:i };
    }
  }
  return { ok:true };
}

// VALVE-TYPE-001: 밸브 형식 → 허용 배압비율. 미지정/미지원 값은 SPRING
// (더 엄격한 기준)으로 처리한다 — 안전측 기본값, 과거 Snapshot(valveType
// 필드 없음)과의 하위호환도 겸한다.
function getAllowableBackpressureRatio(valveType) {
  const vt = String(valveType || "SPRING").toUpperCase();
  return API_CONST.BACKPRESSURE_POLICY[vt] ?? API_CONST.BACKPRESSURE_POLICY.SPRING;
}

// ACCUMULATION-001: (화재여부, 밸브개수) → 허용 축적압력비.
// 미지정 fireScenario는 false(비화재, 더 엄격한 쪽)로, 미지정/미인식
// valveCount는 1(단일 밸브, 가장 엄격한 110%)로 처리한다 — 안전측 기본값,
// 과거 Snapshot과의 하위호환도 겸한다.
function getAllowableAccumulationRatio(fireScenario, valveCount) {
  if (fireScenario === true) return API_CONST.ACCUMULATION_POLICY.FIRE;
  const vc = Number(valveCount);
  return (Number.isFinite(vc) && vc >= 2)
    ? API_CONST.ACCUMULATION_POLICY.NON_FIRE_MULTI
    : API_CONST.ACCUMULATION_POLICY.NON_FIRE_SINGLE;
}

//     backpressure.js의 검증된 computeFrictionLoss()를 그대로 호출한다.
//     새로운 상관식을 여기서 발명하지 않는다. 입력이 부족/부정확하면
//     "계산 불가"를 반환할 뿐 추정하지 않는다(임의 기본값 금지).
//   Safety Acceptance Policy → evaluateInletPressureLossPolicy()
//     "3% 이하인가"만 판정한다. 물리 계산과 이 정책은 서로 다른 함수 —
//     계산식이 바뀌어도 정책 함수는 손대지 않고, 정책(3%)이 바뀌어도
//     계산 함수는 손대지 않는다.
function computeInletFrictionLoss({ W, T, M, Pset, inletPiping }) {
  if (!inletPiping || inletPiping.L == null || inletPiping.D == null || inletPiping.fittingsK == null) {
    return { available:false, reason:"missing_inlet_piping_data" };
  }
  const fric = computeFrictionLoss({ W, T, M, P_ref: Pset, L: inletPiping.L, D: inletPiping.D, fittingsK: inletPiping.fittingsK });
  if (!fric.valid) {
    return { available:false, reason:"invalid_inlet_piping_geometry", error: fric.error };
  }
  return {
    available: true,
    // KOSHA 3% 기준은 "인입배관 내 압력손실"만 다룬다 — exit loss(밸브
    // 출구 이후 개념)는 여기 해당하지 않으므로 마찰+fittings까지만 사용.
    pressureLoss_bar: fric.totalFrictionLoss_bar,
    rho_kgm3:    fric.rho_kgm3_r,
    velocity_ms: fric.velocity_ms_r,
    dP_pipe_bar: fric.dP_pipe_bar,
    dP_fit_bar:  fric.dP_fit_bar,
    L_over_D:    fric.L_over_D,
  };
}

function evaluateInletPressureLossPolicy(Pset, physCalc) {
  const allowablePressureLoss = Pset * API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO;
  if (!physCalc.available) {
    // ACCUMULATION-A안과 동일 원칙: 계산 불가 상태를 GO로 취급하지 않는다.
    // pressureLossOK를 false가 아니라 null로 둔다 — "부적정"이 아니라
    // "판정 불가"이며, 상위 checklist에는 아예 포함하지 않고 dataGaps로
    // 별도 표현한다(engine 본문에서 처리).
    return {
      pressureLossAvailable: false,
      pressureLoss: null,
      allowablePressureLoss,
      allowableRatio: API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO,
      pressureLossRatio: null,
      pressureLossOK: null,
      reason: physCalc.reason,
      source: API_CONST.INLET_PRESSURE_LOSS_POLICY_SOURCE,
    };
  }
  const pressureLossRatio = Pset > 0 ? physCalc.pressureLoss_bar / Pset : null;
  const pressureLossOK = pressureLossRatio != null
    ? pressureLossRatio <= API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO
    : null;
  return {
    pressureLossAvailable: true,
    pressureLoss: physCalc.pressureLoss_bar,
    allowablePressureLoss,
    allowableRatio: API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO,
    pressureLossRatio,
    pressureLossOK,
    source: API_CONST.INLET_PRESSURE_LOSS_POLICY_SOURCE,
  };
}

// ── computeAdequacyVerdict — 화면/PDF 공용 최종 판정 단일 출처 ──
// GO ≠ checklist.every(Boolean)만으로 결정하지 않는다. dataGaps가
// 있으면(판정에 필요한 입력이 부족하면) 아무리 checklist가 전부 true여도
// GO가 아니라 INSUFFICIENT_INPUT이다. Dashboard/ReportView/PDF는 각자
// allOK를 다시 계산하지 말고 반드시 이 함수를 호출한다.
function computeAdequacyVerdict(checklist, dataGaps) {
  if (dataGaps && dataGaps.length > 0) return "INSUFFICIENT_INPUT";
  const allOK = checklist && Object.values(checklist).every(Boolean);
  return allOK ? "GO" : "NO_GO";
}

const API526_ORIFICES = [
  { letter:"D", area:0.71 },{ letter:"E", area:1.27 },
  { letter:"F", area:1.98 },{ letter:"G", area:3.24 },
  { letter:"H", area:5.07 },{ letter:"J", area:8.30 },
  { letter:"K", area:11.05},{ letter:"L", area:15.32},
  { letter:"M", area:20.27},{ letter:"N", area:26.0 },
  { letter:"P", area:42.48},
];

function validateInputs(inp) {
  // OP(overpressure %)는 Equipment(Asset) 소유 필드 — Case가 임의 기본값을
  // 대입하지 않는다. 없으면 계산 자체를 막는다 (PRESSURE-001 계약).
  // Z(압축계수)는 반대로 Calculation Input(Case 소유) — 기본값 1.00은
  // UI가 명시적으로 대입하며, Engine은 몰래 채우지 않는다 (COMPRESSIBILITY-001).
  const fields = ["W","P1","P2","T","M","k","Kd","Kb","mawp","OP","Z"];
  for (const f of fields) {
    const v = Number(inp[f]);
    if (isNaN(v) || !isFinite(v)) return { ok: false, field: f, reason: "not_a_number" };
  }
  if (inp.P1 <= 0) return { ok: false, field:"P1", reason:"must_be_positive" };
  if (inp.T  <= 0) return { ok: false, field:"T",  reason:"must_be_positive" };
  if (inp.M  <= 0) return { ok: false, field:"M",  reason:"must_be_positive" };
  if (inp.k  <= 1) return { ok: false, field:"k",  reason:"must_be_gt_1" };
  if (inp.Kd <= 0) return { ok: false, field:"Kd", reason:"must_be_positive" };
  if (inp.Kb <= 0) return { ok: false, field:"Kb", reason:"must_be_positive" };
  if (inp.OP <  0) return { ok: false, field:"OP", reason:"must_be_non_negative" };
  if (inp.Z  <= 0) return { ok: false, field:"Z",  reason:"must_be_positive" };
  // VALVE-TYPE-001: valveType은 선택적 필드 — 없으면 SPRING(안전측)으로
  // 처리하되(하위호환), 값이 있는데 정책 테이블에 없는 값이면 오타/오입력
  // 가능성이 크므로 거부한다.
  if (inp.valveType !== undefined && inp.valveType !== null && inp.valveType !== "") {
    const vt = String(inp.valveType).toUpperCase();
    if (!(vt in API_CONST.BACKPRESSURE_POLICY)) {
      return { ok: false, field:"valveType", reason:"unsupported_valve_type" };
    }
  }
  // ACCUMULATION-001: valveCount/fireScenario도 선택적 — 없으면 안전측
  // 기본값(단일 밸브·비화재)으로 처리하되, 값이 있는데 형식이 틀리면 거부.
  if (inp.valveCount !== undefined && inp.valveCount !== null && inp.valveCount !== "") {
    const vc = Number(inp.valveCount);
    if (!Number.isFinite(vc) || !Number.isInteger(vc) || vc < 1) {
      return { ok: false, field:"valveCount", reason:"must_be_positive_integer" };
    }
  }
  if (inp.fireScenario !== undefined && inp.fireScenario !== null && typeof inp.fireScenario !== "boolean") {
    return { ok: false, field:"fireScenario", reason:"must_be_boolean" };
  }
  return { ok: true };
}

// Engine — 입력만 받고 출력만 반환. 외부 state 접근 금지.
// reliefLoadAdapter: buildReliefSizingInput()의 반환값(선택). 전달하지
// 않으면 기존 동작(수동 W)과 100% 동일 — 하위호환.
function api520Engine(inp, deviceType, inletPiping, reliefLoadAdapter) {
  const valid = validateInputs(inp);
  if (!valid.ok) return { valid: false, error: valid };

  // RELIEF-SIZING-ADAPTER-001: reliefLoadAdapter가 전달되면 그 값이
  // sizing에 쓰인다. adapter가 invalid면(governing 시나리오 없음/단위
  // 불일치/값 무효 등) 절대 조용히 inp.W로 대체하지 않고 즉시 에러를
  // 반환한다 — "계산 실패 → 수동값으로 자동 대체"는 금지된 패턴.
  const hasReliefLoadAdapter = reliefLoadAdapter !== undefined && reliefLoadAdapter !== null;
  if (hasReliefLoadAdapter && !reliefLoadAdapter.valid) {
    return {
      valid: false,
      error: { field: "reliefLoad", reason: reliefLoadAdapter.reason || "INVALID_RELIEF_LOAD_INPUT" },
    };
  }

  const { W: manualW, P1, P2, T, M, k, Kd, Kb, mawp, OP, Z } = Object.fromEntries(
    Object.entries(inp).map(([key, v]) => [key, Number(v)])
  );
  const wSource = hasReliefLoadAdapter ? "GOVERNING_RELIEF_LOAD" : "MANUAL_INPUT";
  const W = hasReliefLoadAdapter ? reliefLoadAdapter.W : manualW;
  // VALVE-TYPE-001: valveType은 문자열 Case 입력 — 위 숫자 변환 대상에서 제외.
  const valveType = String(inp.valveType || "SPRING").toUpperCase();
  const allowableBackpressureRatio = getAllowableBackpressureRatio(valveType);

  // ACCUMULATION-001: valveCount/fireScenario도 숫자 일괄변환 대상에서 제외
  // (fireScenario는 boolean, valveCount는 정수 개수 — 물리량이 아님).
  const valveCount   = (inp.valveCount !== undefined && inp.valveCount !== null && inp.valveCount !== "")
    ? Number(inp.valveCount) : 1;
  const fireScenario = inp.fireScenario === true;
  const allowableAccumulationRatio = getAllowableAccumulationRatio(fireScenario, valveCount);

  // ── COMPRESSIBILITY-001: Z는 Asset이 아니라 Calculation Input ──
  // 설비 속성이 아니라 유체·운전조건에 따라 케이스마다 달라지는 계산
  // 조건이므로 Equipment/DischargeSystem이 아닌 Case 입력값으로 취급한다.
  // 기본값 1.0(이상기체 가정)은 UI에서 명시적으로 노출하며, Engine은
  // 몰래 대입하지 않는다 — validateInputs에서 누락 시 계산을 막는다.

  // ── PRESSURE-001: relieving pressure(절대압) 산정 ──────────────
  // P1(입력) = 설정압력(barg, Equipment.setPressure). 이것 자체는
  // relieving pressure가 아니다. API 520 정의대로 overpressure(%)와
  // 대기압을 더해 절대압으로 환산한 뒤에만 sizing 식에 사용한다.
  const Pset  = P1;
  const P1abs = Pset * (1 + OP / 100) + API_CONST.ATM_PRESSURE_BAR; // bara
  const P1_kPa = P1abs * 100;

  const C     = API_CONST.C_BASE * Math.sqrt(k * Math.pow(2/(k+1), (k+1)/(k-1)));
  const KdEff = deviceType === "ruptureDisk" ? Kd * API_CONST.RD_KD_FACTOR : Kd;

  // ── API520-SI-001: SI 단위 필수 변환상수(13160) 적용 ───────────
  // A[mm²] = 13160·W[kg/h] / (C·Kd·P1[kPa]·Kb) · √(T·Z/M)
  const A_mm2   = (API_CONST.SI_AREA_CONST * W / (C * KdEff * P1_kPa * Kb)) * Math.sqrt((T * Z) / M);
  const areaCm2 = A_mm2 / 100;

  const selected = API526_ORIFICES.find(o => o.area >= areaCm2)
    ?? { letter:"P+", area: areaCm2, nonStandard: true };

  const margin            = selected.area / areaCm2;
  // 배압비(Kb 산정 기준)는 API 520 Fig.30/31 관례대로 게이지압 기준 유지 —
  // 절대압 환산과는 별개 개념 (relieving pressure 산정과 혼동 금지).
  const backPressureRatio = P2 / Pset;
  const criticalPressRatio= Math.pow(2/(k+1), k/(k-1));

  // ── ACCUMULATION-001: 축적압력 허용성 검증 (sizing과는 별개 관심사) ──
  // 위 RELIEVING_PRESSURE 단계의 OP는 P1abs(분출압력) 산정에 쓰인다 —
  // "이 압력에서 오리피스를 얼마나 크게 잡을지"의 입력값이다.
  // 여기서는 같은 OP 값을 다른 질문에 쓴다 — "이 축적압력(100+OP%)이
  // 이 시나리오(밸브개수·화재여부)에서 허용되는 상한을 넘는가?"라는
  // 별도의 정책 검증이며, sizing 결과(areaCm2/orifice)에는 영향을 주지
  // 않는다. 초과해도 자동으로 OP를 낮추지 않는다 — NO-GO만 표시한다.
  const actualAccumulationRatio = 1 + OP / 100;
  const accumulationOK = actualAccumulationRatio <= allowableAccumulationRatio;

  // ── INLET-LOSS-001: 인입배관 압력손실 (sizing과는 완전히 별개) ──
  // sizing 계산(P1abs/areaCm2/orifice 등)에는 이 결과를 절대 반영하지
  // 않는다 — Physical Calculation과 Safety Acceptance Policy를 명확히
  // 분리해서 호출한다.
  const inletFric = computeInletFrictionLoss({ W, T, M, Pset, inletPiping });
  const inletLoss = evaluateInletPressureLossPolicy(Pset, inletFric);

  const checklist = {
    capacityOK:     selected.area >= areaCm2,
    backPressureOK: backPressureRatio < allowableBackpressureRatio,
    mawpOK:         Pset <= mawp,
    kdOK:           Kd >= API_CONST.KD_MIN,
    marginOK:       margin >= API_CONST.MARGIN_MIN,
    accumulationOK,
  };
  // A안(C-3 확정): inletLossOK는 계산 가능할 때만 checklist에 포함한다.
  // 입력 부족은 checklist.every(Boolean)을 통과시키는 방식(생략)이 아니라
  // dataGaps로 명시하고, 최종 판정은 반드시 computeAdequacyVerdict()를
  // 거치게 해서 "checklist 전부 true + dataGap"이 GO로 오판되지 않게 한다.
  if (inletLoss.pressureLossAvailable) {
    checklist.inletLossOK = inletLoss.pressureLossOK;
  }
  const dataGaps = [];
  if (!inletLoss.pressureLossAvailable) dataGaps.push("inletPiping");

  // ── Calculation Trace — 감사/Report Evidence 전용, UI 표시용 아님 ──
  const trace = [
    { step: "COMPRESSIBILITY_Z", value: Z, unit: "",
      formula: Z === 1.0 ? "User Input (default 1.00)" : "User Input", inputs: { Z } },
    { step: "RELIEF_LOAD_W_SOURCE", value: W, unit: "kg/h",
      formula: wSource === "GOVERNING_RELIEF_LOAD"
        ? "W = buildReliefSizingInput(selector 결과: §5 scenarios → governing MASS_FLOW).W — 수동 입력 미사용"
        : "W = User Input (Case.W) — §5 관련 scenario 미연결",
      inputs: {
        source: wSource,
        manualW,
        governingW: hasReliefLoadAdapter ? reliefLoadAdapter.W : null,
        governingScenarioId: hasReliefLoadAdapter ? reliefLoadAdapter.governingScenarioId : null,
      } },
    { step: "SET_PRESSURE",     value: Pset,   unit: "barg", formula: "Equipment.setPressure" },
    { step: "RELIEVING_PRESSURE", value: P1abs, unit: "bara",
      formula: "P1abs = Pset×(1+OP/100) + Patm", inputs: { Pset, OP, Patm: API_CONST.ATM_PRESSURE_BAR } },
    { step: "C_COEFFICIENT",    value: C,      unit: "",     formula: "C = 520·√(k·(2/(k+1))^((k+1)/(k-1)))", inputs: { k } },
    { step: "MASS_FLUX_AREA",   value: A_mm2,  unit: "mm²",
      formula: "A = 13160·W/(C·Kd·P1[kPa]·Kb)·√(TZ/M)", inputs: { W, KdEff, P1_kPa, Kb, T, Z, M } },
    { step: "REQUIRED_AREA",    value: areaCm2, unit: "cm²", formula: "areaCm2 = A_mm2 / 100" },
    { step: "ORIFICE_SELECTION",value: selected.letter, unit: "", formula: "next API526 orifice ≥ areaCm2", inputs: { areaCm2, selectedArea: selected.area } },
    { step: "BACKPRESSURE_POLICY", value: allowableBackpressureRatio, unit: "",
      formula: "valveType → KOSHA GUIDE D-18-2020 §7.2(4) 허용비율",
      inputs: { valveType, allowableRatio: allowableBackpressureRatio, source: API_CONST.BACKPRESSURE_POLICY_SOURCE } },
    { step: "ACCUMULATION_POLICY", value: allowableAccumulationRatio, unit: "",
      formula: "fireScenario+valveCount → KOSHA D-18-2020 §4.4 <표1> 허용 축적압력",
      inputs: { fireScenario, valveCount, allowableRatio: allowableAccumulationRatio, source: API_CONST.ACCUMULATION_POLICY_SOURCE } },
    { step: "ACCUMULATION_GUARDRAIL", value: actualAccumulationRatio, unit: "",
      formula: "실제 축적압력비 = 1 + OP/100 (RELIEVING_PRESSURE의 OP와 동일 값, 다른 검증 목적)",
      inputs: { OP, actualRatio: actualAccumulationRatio, allowableRatio: allowableAccumulationRatio, ok: accumulationOK } },
    { step: "INLET_LOSS_POLICY", value: inletLoss.allowablePressureLoss, unit: "bar",
      formula: "allowablePressureLoss = Pset × INLET_PRESSURE_LOSS_POLICY.MAX_RATIO (KOSHA D-18-2020 §7.2(1))",
      inputs: { Pset, maxRatio: API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO, source: API_CONST.INLET_PRESSURE_LOSS_POLICY_SOURCE } },
    { step: "INLET_LOSS_CALCULATION", value: inletLoss.pressureLoss, unit: "bar",
      formula: inletLoss.pressureLossAvailable
        ? "computeFrictionLoss(inletPiping) — Darcy-Weisbach 마찰+fittings (backpressure.js와 공용 물리 계산부)"
        : `계산 불가 — ${inletLoss.reason}`,
      inputs: { available: inletLoss.pressureLossAvailable, inletPiping: inletPiping || null } },
    { step: "INLET_LOSS_GUARDRAIL", value: inletLoss.pressureLossRatio, unit: "",
      formula: "pressureLossRatio = pressureLoss / Pset ≤ MAX_RATIO — 계산 불가 시 자동 GO/NO-GO 아님(INSUFFICIENT_INPUT)",
      inputs: { pressureLoss: inletLoss.pressureLoss, Pset, allowableRatio: API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO, ok: inletLoss.pressureLossOK } },
  ];

  const stepData = {
    fluid:     { M, T, k, Z, criticalPressRatio },
    cCoeff:    { C, k },
    pressure:  { Pset, OP, P1abs, atm: API_CONST.ATM_PRESSURE_BAR },
    orifice:   { areaCm2, W, P1abs, KdEff, Kb, isRD: deviceType === "ruptureDisk" },
    selection: { selected, areaCm2, margin },
    backpress: { ratio: backPressureRatio, valveType, allowableRatio: allowableBackpressureRatio, source: API_CONST.BACKPRESSURE_POLICY_SOURCE },
    accumulation: { fireScenario, valveCount, allowableRatio: allowableAccumulationRatio,
      actualRatio: actualAccumulationRatio, ok: accumulationOK, OP, source: API_CONST.ACCUMULATION_POLICY_SOURCE },
    inletLoss,
    // RELIEF-SIZING-ADAPTER-001: sizing에 실제로 쓰인 W가 수동입력인지
    // governing relief load인지 — Report/PDF가 재계산 없이 이 값만 읽는다.
    reliefLoadSource: {
      source: wSource,
      manualW,
      governingW: hasReliefLoadAdapter ? reliefLoadAdapter.W : null,
      governingScenarioId: hasReliefLoadAdapter ? reliefLoadAdapter.governingScenarioId : null,
    },
  };

  const verdict = computeAdequacyVerdict(checklist, dataGaps);

  return { valid: true, areaCm2, selected, margin, C, P1abs, backPressureRatio, checklist, dataGaps, verdict, stepData, trace };
}


// ── engine/relief_load.js ──────────────────────────
// ════════════════════════════════════════════════════════════════
//  RELIEF LOAD ENGINE (pure, stateless) — C-4.0: 계약/데이터모델
//  KOSHA GUIDE D-18-2020 §5(소요분출량) / §6(안전밸브 선정) 대응.
// ════════════════════════════════════════════════════════════════
// RELIEF_LOAD_CONTRACT_VERSION 1.0.0 — SCENARIO-TAXONOMY-001
//   §5 원문 14개 절 전체를 대조한 결과, 정형화된 계산식이 있는 7개
//   절만 COMPUTABLE로 분류했다. 나머지는 원문 자체가 "인정된 방법
//   없음"/"압력방출장치 보호대상 아님"/"정성적 분석 영역" 등으로
//   계산 대상에서 제외한 것 — 이 앱이 임의로 축소한 것이 아니라
//   원문이 그은 경계를 그대로 데이터 모델에 반영한다.
//   이 파일은 taxonomy와 §6(governing load 선택) 순수 함수만
//   담는다. 개별 시나리오 계산식(calculateReliefLoadScenario)은
//   C-4.1~C-4.7에서 시나리오별로 하나씩 추가되며, api520Engine과의
//   실제 연결(sizing이 governing W를 사용하는 것)은 C-4.8에서

const RELIEF_LOAD_CONTRACT_VERSION = "1.0.0";

const RELIEF_LOAD_TAXONOMY_SOURCE = "KOSHA GUIDE D-18-2020 §5(소요분출량), <표2>";

// COMPUTABLE 시나리오 id만 추림 — §6 governing load 후보 목록.
function getComputableScenarioIds() {
  return RELIEF_LOAD_SCENARIO_TAXONOMY
    .filter(s => s.status === RELIEF_LOAD_STATUS.COMPUTABLE)
    .map(s => s.id);
}

// ════════════════════════════════════════════════════════════════
//  C-4.8A — Unit/Selector Contract
//  §5.11(m³/h)·§5.13(m²)이 §5.1/5.6/5.7/5.8/5.12(kg/h)와 같은
//  숫자축(max 비교)에 섞이면 안 된다는 원칙(원칙 3)을 selector
//  레벨에서 명시적으로 강제한다. 물성 변환(밀도 등)으로 단위를
//  맞추는 시도는 하지 않는다 — 그런 변환 자체가 여기 있으면 안 됨.
// ════════════════════════════════════════════════════════════════
const RELIEF_LOAD_QUANTITY = Object.freeze({
  MASS_FLOW:   "MASS_FLOW",    // kg/h — governing load 후보
  VOLUME_FLOW: "VOLUME_FLOW",  // m3/h — §5.11, governing 후보 아님(보존만)
  AREA:        "AREA",         // m2   — §5.13, governing 후보 아님(보존만)
});

// unit 문자열만으로 quantity를 분류한다 — scenarioId로 분류하지 않는
// 이유는 unit 필드 자체가 감사 가능한 단일 진실 소스여야 하기 때문
// (계산함수가 나중에 바뀌어도 selector가 unit을 직접 보고 판단하게).
// 인식하지 못하는 unit은 절대 MASS_FLOW로 암묵 처리하지 않는다.
function classifyReliefLoadQuantity(unit) {
  if (unit === "kg/h") return RELIEF_LOAD_QUANTITY.MASS_FLOW;
  if (unit === "m3/h") return RELIEF_LOAD_QUANTITY.VOLUME_FLOW;
  if (unit === "m2")   return RELIEF_LOAD_QUANTITY.AREA;
  return null; // UNRECOGNIZED_QUANTITY — 호출부에서 명시 처리
}

// ── §6: 여러 시나리오의 소요분출량 W 중 최댓값을 배출용량으로 선정 ──
// 원문: 배출용량은 §5에서 산출한 시나리오별 소요분출량 중 가장 큰
// 값으로 한다. 이 함수는 순수 함수이며 시나리오 계산 로직과 섞이지
// 않는다(calculateReliefLoadScenario는 C-4.1~C-4.7에서 개별 구현).
//
// scenarioResults 배열의 각 원소는 §5.1/5.6/5.7/5.8/5.12 계약
// (status:"OK", W, unit:"kg/h") 또는 §5.11/5.13 계약(status:
// "COMPUTABLE"/"NEEDS_ENGINEERING_DECISION"/"NOT_APPLICABLE",
// value 또는 requiredOrificeArea_m2, unit:"m3/h"|"m2")을 섞어서
// 받을 수 있다 — quantity가 MASS_FLOW가 아닌 결과는 governing 후보
// 에서 제외하되 allScenarios에는 원본 그대로 보존한다(감사 가능성
// 원칙). 제외 사실 자체도 quantityAudit 배열로 남긴다.
function selectGoverningReliefLoad(scenarioResults) {
  const results = Array.isArray(scenarioResults) ? scenarioResults : [];

  const quantityAudit = results.map(r => {
    const scenarioId = r && r.scenarioId != null ? r.scenarioId : null;
    const unit = r && r.unit;
    const quantity = classifyReliefLoadQuantity(unit);
    let includedInGoverningSelection = false;
    let exclusionReason = null;

    if (quantity === null) {
      exclusionReason = "UNRECOGNIZED_QUANTITY";
    } else if (quantity !== RELIEF_LOAD_QUANTITY.MASS_FLOW) {
      exclusionReason = "INCOMPATIBLE_QUANTITY";
    } else if (!(r && r.status === "OK" && typeof r.W === "number" && isFinite(r.W) && r.W > 0)) {
      exclusionReason = "NOT_A_VALID_MASS_FLOW_CANDIDATE";
    } else {
      includedInGoverningSelection = true;
    }

    return { scenarioId, quantity, includedInGoverningSelection, exclusionReason };
  });

  const valid = results.filter((r, i) => quantityAudit[i].includedInGoverningSelection);

  if (valid.length === 0) {
    return {
      verdict: "INSUFFICIENT_INPUT",
      governingScenarioId: null,
      governingW: null,
      unit: "kg/h",
      allScenarios: results,
      quantityAudit,
    };
  }

  // 동점(tie)일 경우 taxonomy 선언 순서상 먼저 나오는 시나리오를
  // governing으로 고정한다 — 입력 배열의 순서에 결과가 의존하지
  // 않도록 하는 결정론 보장.
  const taxonomyOrder = RELIEF_LOAD_SCENARIO_TAXONOMY.map(s => s.id);
  const governing = valid.reduce((best, cur) => {
    if (cur.W > best.W) return cur;
    if (cur.W === best.W) {
      const bi = taxonomyOrder.indexOf(best.scenarioId);
      const ci = taxonomyOrder.indexOf(cur.scenarioId);
      return (ci !== -1 && ci < bi) ? cur : best;
    }
    return best;
  }, valid[0]);

  return {
    verdict: "OK",
    governingScenarioId: governing.scenarioId,
    governingW: governing.W,
    unit: "kg/h",
    allScenarios: results,
    quantityAudit,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.8B — RELIEF-SIZING-ADAPTER-001
//  selectGoverningReliefLoad()의 결과를 api520Engine()이 받을 수 있는
//  형태({valid, W, unit})로 변환하는 단일 경계. 이 함수 밖에서 W를
//  임의로 생성/변환/추정하지 않는다. 실패 시 조용히 다른 값으로
//  대체하지 않고 명확한 사유와 함께 valid:false를 반환한다 — 호출부
//  (api520Engine)는 이 valid:false를 manual W로 조용히 fallback하는
//  용도로 쓰면 안 되고, 그대로 에러를 반환해야 한다(원칙: 자동 fallback 금지).
function buildReliefSizingInput(selectorResult) {
  if (!selectorResult || typeof selectorResult !== "object") {
    return { valid: false, reason: "NO_SELECTOR_RESULT" };
  }
  if (selectorResult.verdict !== "OK") {
    // INSUFFICIENT_INPUT 등 — governing MASS_FLOW 후보가 없는 상태.
    return { valid: false, reason: "NO_GOVERNING_SCENARIO", verdict: selectorResult.verdict };
  }
  if (selectorResult.unit !== "kg/h") {
    return { valid: false, reason: "INVALID_UNIT", unit: selectorResult.unit ?? null };
  }
  const w = selectorResult.governingW;
  if (typeof w !== "number" || !isFinite(w) || w <= 0) {
    return { valid: false, reason: "INVALID_VALUE", governingW: w ?? null };
  }
  return {
    valid: true,
    W: w,
    unit: "kg/h",
    governingScenarioId: selectorResult.governingScenarioId,
    // provenance — Snapshot.reliefLoad로 그대로 흘러갈 감사 근거.
    // selectorResult 원본은 참조만 하고 변형하지 않는다(불변성).
    provenance: {
      allScenarios: selectorResult.allScenarios,
      quantityAudit: selectorResult.quantityAudit,
    },
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.1 — §5.1 출구 차단(Closed outlets)
//  원문(KOSHA GUIDE D-18-2020 §5.1(1)): "소요분출량은 액체의 경우
//  최대 유입량, 스팀 또는 증기의 경우 최대 유입량과 분출 조건에서의
//  생성량을 합한 양이다." 원문이 제시하는 항은 이 두 개뿐이다 —
//  액체는 유입량만, 증기는 유입량+생성량만. 별도의 물성/열역학
//  변환식을 원문이 요구하지 않으므로 여기서 임의로 만들지 않는다.
//  입력 단위는 두 항 모두 원문이 명시하는 대로 kg/h — 이후 §5.6/
//  §5.7/§5.8도 "유입량"/"유출량"/"생성량" 항을 공유하므로 필드명
//  (inflow_kgh, generationRate_kgh)을 여기서 고정해 향후 시나리오와
//  충돌하지 않도록 한다. 순수 함수 — Date.now(), 전역 mutable state,
//  UI/Snapshot 접근 없음. selectGoverningReliefLoad()와는 독립적으로
//  동작하며, api520Engine()에는 아직 연결하지 않는다(별도 단계).
function calculateOutletBlockedScenario(input) {
  const SCENARIO_ID = "OUTLET_BLOCKED";
  const SECTION = "§5.1";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.1";
  const inputs = (input && typeof input === "object") ? { ...input } : {};
  const phase = inputs.phase;

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: (phase === "LIQUID" || phase === "VAPOR") ? phase : null,
      status: "INSUFFICIENT_INPUT", W: null, unit: "kg/h",
      inputs, components: null, formula: null, reason, source: SOURCE,
    };
  }

  // 원문이 액체/증기 두 경우만 다루므로 phase는 이 둘로 한정한다 —
  // 미지정/오탈자 값을 임의로 어느 한쪽으로 추정하지 않는다(fail-fast).
  if (phase !== "LIQUID" && phase !== "VAPOR") {
    return insufficient("invalid_or_missing_phase");
  }

  const inflow = Number(inputs.inflow_kgh);
  if (typeof inputs.inflow_kgh !== "number" || !isFinite(inflow) || inflow < 0) {
    return insufficient("invalid_inflow_kgh");
  }

  if (phase === "LIQUID") {
    // 원문(1): 액체 = 최대 유입량. 생성량 항 없음 — generationRate_kgh는
    // 계산에 관여하지 않는다(액체 분기 자체가 이 항을 갖지 않음).
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase, status: "OK",
      W: inflow, unit: "kg/h", inputs,
      components: { inflow_kgh: inflow },
      formula: "W = 최대 유입량 (액체) — KOSHA D-18-2020 §5.1(1)",
      source: SOURCE,
    };
  }

  // VAPOR: 원문(1) — 최대 유입량 + 분출 조건에서의 생성량.
  const generation = Number(inputs.generationRate_kgh);
  if (typeof inputs.generationRate_kgh !== "number" || !isFinite(generation) || generation < 0) {
    return insufficient("invalid_generationRate_kgh");
  }
  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase, status: "OK",
    W: inflow + generation, unit: "kg/h", inputs,
    components: { inflow_kgh: inflow, generationRate_kgh: generation },
    formula: "W = 최대 유입량 + 생성량 (증기) — KOSHA D-18-2020 §5.1(1)",
    source: SOURCE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.2 — §5.6 과충전(Overfilling)
//  원문(KOSHA GUIDE D-18-2020 §5.6(1)): "유입 유체 측 압력이 용기의
//  설계 압력을 초과할 수 있을 경우 최대 유입량을 소요분출량으로
//  삼는다." <표 2>에서도 §5.6은 "최대 유입량" 단일 항목뿐이며 §5.1과
//  달리 액체/증기 열이 나뉘어 있지 않다 — 즉 §5.6은 phase 구분이
//  원문에 없는 별개의 정책이다(§5.1의 LIQUID 분기를 재사용하는 것이
//  아니다). §5.1과 우연히 결과 형태가 같아 보이더라도(둘 다 단순
//  유입량 pass-through인 액체 케이스), scenarioId/section/provenance는
//  독립적으로 보존한다 — 이후 Trace/Evidence가 실제 governing 원인이
//  출구차단인지 과충전인지 구분해야 하기 때문이다. 순수 함수 — §5.1
//  구현은 수정하지 않았고, 검증 패턴(finite/non-negative)만 동일한
//  형태를 따랐다(공통 헬퍼로 추출해 §5.1을 건드리는 리팩터는 하지
//  않음 — C-4.1 결과에 불필요한 변경을 만들지 않기 위함).
function calculateOverfillingScenario(input) {
  const SCENARIO_ID = "OVERFILLING";
  const SECTION = "§5.6";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.6";
  const inputs = (input && typeof input === "object") ? { ...input } : {};

  const inflow = Number(inputs.inflow_kgh);
  if (typeof inputs.inflow_kgh !== "number" || !isFinite(inflow) || inflow < 0) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      status: "INSUFFICIENT_INPUT", W: null, unit: "kg/h",
      inputs, components: null, formula: null,
      reason: "invalid_inflow_kgh", source: SOURCE,
    };
  }

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, status: "OK",
    W: inflow, unit: "kg/h", inputs,
    components: { inflow_kgh: inflow },
    // 원문에 phase 구분이 없으므로 "액체"/"증기"를 명시하지 않는다 —
    // §5.1과 달리 이 시나리오는 phase에 무관하게 단일 공식이다.
    formula: "W = 최대 유입량 (과충전, phase 무관) — KOSHA D-18-2020 §5.6(1)",
    source: SOURCE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.3 — §5.7 자동제어밸브의 고장
//  원문(KOSHA GUIDE D-18-2020 §5.7, <표 2> 7번 항목)이 실제로 계산식을
//  제시하는 분기는 정확히 3개다:
//    1) 인입 제어밸브(§5.7(2)) — W = 최대 예상 유입량 − 정상 유출량
//    2) 출구 제어밸브(§5.7(3)) — W = 최대 유입량 − 정상 유출량
//       (전체 폐쇄 시 정상유출량=0이 되어 §5.1과 같은 형태로 수렴하는
//       특수 케이스일 뿐, 별도 공식이 아니다 — §5.7(3)(가))
//    3) Fail-stationary 밸브(§5.7(4)) — 원문은 별도 계산식을 주지 않고
//       "완전 개방 또는 완전 폐쇄를 가정하여 보수적으로(=더 큰 값)"라고만
//       규정한다. 이 함수는 그 절차를 위 1)/2)와 동일한 유입량−유출량
//       관계로 개방/폐쇄 두 가정에 각각 적용해 max를 취하는 것으로
//       구현했다 — 이는 원문에 없는 물성식을 추가한 것이 아니라 원문의
//       의사결정 절차(두 가정 중 보수적인 쪽 채택)를 그대로 코드화한
//       것이며, governingAssumption 필드로 감사 근거를 남긴다.
//  유입량−유출량이 음수가 되는 경우(유출량>유입량, 즉 이 메커니즘으로는
//  과압이 발생하지 않는 물리적으로 정상인 상황)는 W=0으로 클램프하되
//  clampedToZero 플래그로 남긴다 — 값을 숨기지 않는다.
//  순수 함수. §5.1/§5.6 코드는 수정하지 않았다.
function calculateControlValveFailureScenario(input) {
  const SCENARIO_ID = "CONTROL_VALVE_FAIL";
  const SECTION = "§5.7";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.7";
  const inputs = (input && typeof input === "object") ? { ...input } : {};
  const failureMode = inputs.failureMode;

  const VALID_MODES = ["INLET_VALVE", "OUTLET_VALVE", "FAIL_STATIONARY"];

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      failureMode: VALID_MODES.includes(failureMode) ? failureMode : null,
      status: "INSUFFICIENT_INPUT", W: null, unit: "kg/h",
      inputs, components: null, formula: null, reason, source: SOURCE,
    };
  }

  function isValidNonNegativeNumber(v) {
    return typeof v === "number" && isFinite(v) && v >= 0;
  }

  if (!VALID_MODES.includes(failureMode)) {
    return insufficient("invalid_or_missing_failureMode");
  }

  if (failureMode === "INLET_VALVE" || failureMode === "OUTLET_VALVE") {
    if (!isValidNonNegativeNumber(inputs.inflow_kgh)) return insufficient("invalid_inflow_kgh");
    if (!isValidNonNegativeNumber(inputs.outflow_kgh)) return insufficient("invalid_outflow_kgh");

    const inflow = inputs.inflow_kgh;
    const outflow = inputs.outflow_kgh;
    const rawDifference = inflow - outflow;
    const W = Math.max(0, rawDifference);
    const sourceClause = failureMode === "INLET_VALVE" ? "§5.7(2)" : "§5.7(3)";

    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, failureMode, status: "OK",
      W, unit: "kg/h", inputs,
      components: { inflow_kgh: inflow, outflow_kgh: outflow, rawDifference, clampedToZero: rawDifference < 0 },
      formula: `W = 최대 유입량 − 정상 유출량 (${failureMode === "INLET_VALVE" ? "인입" : "출구"} 제어밸브) — KOSHA D-18-2020 ${sourceClause}`,
      source: SOURCE,
    };
  }

  // FAIL_STATIONARY — 개방/폐쇄 두 가정 중 보수적인(더 큰 W) 쪽을 채택.
  if (!isValidNonNegativeNumber(inputs.inflow_kgh)) return insufficient("invalid_inflow_kgh");
  if (!isValidNonNegativeNumber(inputs.openOutflow_kgh)) return insufficient("invalid_openOutflow_kgh");
  if (!isValidNonNegativeNumber(inputs.closedOutflow_kgh)) return insufficient("invalid_closedOutflow_kgh");

  const inflow = inputs.inflow_kgh;
  const openOutflow = inputs.openOutflow_kgh;
  const closedOutflow = inputs.closedOutflow_kgh;
  const openW = Math.max(0, inflow - openOutflow);
  const closedW = Math.max(0, inflow - closedOutflow);
  const W = Math.max(openW, closedW);
  const governingAssumption = openW >= closedW ? "OPEN" : "CLOSED";

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, failureMode, status: "OK",
    W, unit: "kg/h", inputs,
    components: { inflow_kgh: inflow, openOutflow_kgh: openOutflow, closedOutflow_kgh: closedOutflow, openW, closedW },
    governingAssumption,
    formula: "W = max(최대유입량−개방가정유출량, 최대유입량−폐쇄가정유출량) (Fail-stationary, 보수적 가정 채택) — KOSHA D-18-2020 §5.7(4)",
    source: SOURCE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.4 — §5.8 비정상적인 열 또는 증기 유입
//  원문(KOSHA GUIDE D-18-2020 §5.8, <표 2> 8번 항목) 3분기 중 실제로
//  계산식이 있는 것은 2개뿐이다:
//    1) 비정상적 열 입력(§5.8(1)(가)) — W = 증기 발생량 − 정상 유출량
//    2) 부주의한 밸브 개방(§5.8(2)(가)(나)) — W = 유입량 − 유출량
//       (유출측 밸브가 열려있으면 그 유출량을 "차감할 수 있다"=선택적,
//       0도 유효한 입력)
//    3) 체크밸브 고장(§5.8(3)) — 원문이 "역류 상황 및 역류량 추정 기법
//       선정은 사용자가 결정해야 한다"고 명시, 계산식 자체가 없다.
//       이 함수는 이 분기를 status "NEEDS_ENGINEERING_DECISION"으로
//       명시적으로 반환하며 W를 산출하지 않는다 — 억지로 계산하지
//       않는다는 원칙(C-4 전체의 원칙)을 시나리오 함수 레벨에서도
//       그대로 지킨다.
//  주의: §5.8(1)(나)③의 "버너 등은 설계용량 대비 125%로 적용"이라는
//  문구는 W 산정식이 아니라 "증기 발생량"(vaporGeneration_kgh) 자체를
//  산정할 때 쓰는 상류(upstream) 가정이다 — 이 함수의 W 공식에 125%를
//  임의로 곱하지 않는다. vaporGeneration_kgh는 이미 그 가정이 반영되어
//  산정된 입력값으로 받는다(계산 책임을 이 함수로 가져오지 않음).
//  순수 함수. §5.1/§5.6/§5.7 코드는 수정하지 않았다.
function calculateAbnormalHeatVaporScenario(input) {
  const SCENARIO_ID = "ABNORMAL_HEAT_VAPOR";
  const SECTION = "§5.8";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.8";
  const inputs = (input && typeof input === "object") ? { ...input } : {};
  const failureMode = inputs.failureMode;

  const VALID_MODES = ["ABNORMAL_HEAT_INPUT", "INADVERTENT_VALVE_OPENING", "CHECK_VALVE_FAILURE"];

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      failureMode: VALID_MODES.includes(failureMode) ? failureMode : null,
      status: "INSUFFICIENT_INPUT", W: null, unit: "kg/h",
      inputs, components: null, formula: null, reason, source: SOURCE,
    };
  }

  function isValidNonNegativeNumber(v) {
    return typeof v === "number" && isFinite(v) && v >= 0;
  }

  if (!VALID_MODES.includes(failureMode)) {
    return insufficient("invalid_or_missing_failureMode");
  }

  if (failureMode === "CHECK_VALVE_FAILURE") {
    // 원문 §5.8(3): 계산식 없음 — 역류 상황/기법 선정은 사용자 결정 사항.
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, failureMode,
      status: "NEEDS_ENGINEERING_DECISION", W: null, unit: "kg/h",
      inputs, components: null, formula: null,
      reason: "KOSHA D-18-2020 §5.8(3): 역류 상황(완전고장/심한누설/정상누설) 및 역류량 추정 기법 선정은 사용자가 결정해야 함 — 원문에 계산식 없음",
      source: SOURCE,
    };
  }

  if (failureMode === "ABNORMAL_HEAT_INPUT") {
    if (!isValidNonNegativeNumber(inputs.vaporGeneration_kgh)) return insufficient("invalid_vaporGeneration_kgh");
    if (!isValidNonNegativeNumber(inputs.outflow_kgh)) return insufficient("invalid_outflow_kgh");

    const vaporGeneration = inputs.vaporGeneration_kgh;
    const outflow = inputs.outflow_kgh;
    const rawDifference = vaporGeneration - outflow;
    const W = Math.max(0, rawDifference);

    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, failureMode, status: "OK",
      W, unit: "kg/h", inputs,
      components: { vaporGeneration_kgh: vaporGeneration, outflow_kgh: outflow, rawDifference, clampedToZero: rawDifference < 0 },
      formula: "W = 증기 발생량 − 정상 유출량 (비정상 열 입력) — KOSHA D-18-2020 §5.8(1)(가)",
      source: SOURCE,
    };
  }

  // INADVERTENT_VALVE_OPENING — §5.8(2)(가)(나)
  if (!isValidNonNegativeNumber(inputs.inflow_kgh)) return insufficient("invalid_inflow_kgh");
  if (!isValidNonNegativeNumber(inputs.outflow_kgh)) return insufficient("invalid_outflow_kgh");

  const inflow = inputs.inflow_kgh;
  const outflow = inputs.outflow_kgh;
  const rawDifference = inflow - outflow;
  const W = Math.max(0, rawDifference);

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, failureMode, status: "OK",
    W, unit: "kg/h", inputs,
    components: { inflow_kgh: inflow, outflow_kgh: outflow, rawDifference, clampedToZero: rawDifference < 0 },
    formula: "W = 유입량 − 유출량 (부주의한 밸브 개방, 출구 유출량 차감은 선택적) — KOSHA D-18-2020 §5.8(2)(가)(나)",
    source: SOURCE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.5 — §5.11 액체부피 팽창(Hydraulic expansion)
//  원문(KOSHA GUIDE D-18-2020 §5.11(2)): 식(1) V = αQ/(500·SG·Cp).
//  이 시나리오는 §5.1~§5.8과 근본적으로 다른 점이 있다 — 결과가
//  질량유량 W(kg/hr)가 아니라 **부피유량 V(㎥/hr)**다. 밀도를 곱해
//  kg/hr로 변환하는 것은 원문에 없는 계산을 추가하는 것이므로 하지
//  않는다. 그래서 이 함수의 결과 객체는 다른 시나리오들과 달리 W
//  필드를 갖지 않고 대신 value/unit:"m3/h"를 쓴다 — 이는 실수로
//  selectGoverningReliefLoad()에 흘러들어가도(r.W가 undefined이므로)
//  자동으로 무효 처리되게 하는 의도된 설계이기도 하다. kg/h와 m³/h를
//  어떻게 통합할지는 §6 연결 시점(C-4.8)의 별도 아키텍처 결정 사항
//  으로 남겨둔다 — 지금 결정하지 않는다.
//
//  status: "COMPUTABLE"은 "이 함수가 V를 계산할 수 있다"는 뜻으로만
//  쓴다 — "전체 relief-load 체인에 편입 가능하다"는 뜻이 아니다.
//  실패 시에는 다른 시나리오와 동일하게 "INSUFFICIENT_INPUT"을 쓴다.
//
//  원문은 "유입열량(Q) 산정 등 세부내용은 열팽창 안전밸브의
//  기술지침(D-13)을 참조한다"고 명시한다 — 단, KOSHA 현행 목록
//  대조 결과 현재 "열팽창용 안전밸브의 기술지침"은 D-31-2012이고
//  D-13-2012는 "염소저장 설비에 관한 기술지침"이다(D-18-2020 원문에
//  남아있는 교차참조 번호가 갱신되지 않은 것으로 보임 — 이 불일치는
//  문서/provenance 기록용일 뿐 계산 로직과는 무관하다). 어느 번호든
//  그 외부지침은 Q(입력값) 산정에만 관여하고 V 산정식(식 1) 자체는
//  이 함수에 완결되어 있으므로 D-13/D-31의 내용을 이 함수의 계산에
//  끌어오지 않는다 — Q는 이미 산정되어 들어오는 입력으로만 받는다
//  (§5.8의 vaporGeneration_kgh와 동일한 패턴).
//
//  분모(500·SG·Cp)가 0이 되는 경우(SG=0 또는 Cp=0)는 계산하지 않고
//  fail-fast — SG/Cp는 물리적으로도 0일 수 없는 값이라 이 자체가
//  유효하지 않은 입력이다. 상수 500은 원문 그대로 유지, 재유도하지
//  않는다. 순수 함수. §5.1/§5.6/§5.7/§5.8 코드는 수정하지 않았다.
function calculateLiquidThermalExpansionScenario(input) {
  const SCENARIO_ID = "LIQUID_EXPANSION";
  const SECTION = "§5.11";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.11(2), 식(1)";
  const UPSTREAM_REFERENCE_NOTE = "유입열량(Q) 산정 세부내용은 원문상 \"열팽창 안전밸브의 기술지침(D-13)\" 참조 — " +
    "KOSHA 현행 목록상 열팽창용 안전밸브 지침은 D-31-2012(D-13-2012는 별개로 염소저장 설비 지침); " +
    "원문의 교차참조 번호 불일치이며 Q는 이미 산정된 입력으로만 사용, V 산정식 자체와는 무관";
  const inputs = (input && typeof input === "object") ? { ...input } : {};

  function isValidNonNegativeFiniteNumber(v) {
    return typeof v === "number" && isFinite(v) && v >= 0;
  }
  function isValidPositiveFiniteNumber(v) {
    return typeof v === "number" && isFinite(v) && v > 0;
  }

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      status: "INSUFFICIENT_INPUT", value: null, unit: "m3/h",
      inputs, components: null, formula: null, reason,
      source: SOURCE, upstreamReference: UPSTREAM_REFERENCE_NOTE,
    };
  }

  // α(부피팽창계수)와 Q(총 열전달 속도)는 0이 물리적으로 유효하다
  // (팽창이 없거나 열유입이 없는 경우) — 0을 거부하지 않는다.
  if (!isValidNonNegativeFiniteNumber(inputs.alpha_per_degC)) return insufficient("invalid_alpha_per_degC");
  if (!isValidNonNegativeFiniteNumber(inputs.Q_kcal_per_hr)) return insufficient("invalid_Q_kcal_per_hr");
  // SG(비중)와 Cp(비열)는 분모이며 물리적으로도 0이나 음수가 될 수
  // 없는 값이다 — 0을 포함해 명시적으로 거부한다(fail-fast, 나눗셈
  // 전에 차단).
  if (!isValidPositiveFiniteNumber(inputs.SG)) return insufficient("invalid_SG_must_be_positive");
  if (!isValidPositiveFiniteNumber(inputs.Cp_kcal_per_kgC)) return insufficient("invalid_Cp_must_be_positive");

  const alpha = inputs.alpha_per_degC;
  const Q = inputs.Q_kcal_per_hr;
  const SG = inputs.SG;
  const Cp = inputs.Cp_kcal_per_kgC;
  const value = (alpha * Q) / (500 * SG * Cp);

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, status: "COMPUTABLE",
    value, unit: "m3/h", inputs,
    components: { alpha_per_degC: alpha, Q_kcal_per_hr: Q, SG, Cp_kcal_per_kgC: Cp, denominatorConstant: 500 },
    formula: "V = α·Q / (500·SG·Cp) — KOSHA D-18-2020 §5.11(2) 식(1)",
    source: SOURCE, upstreamReference: UPSTREAM_REFERENCE_NOTE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.6 — §5.13 열교환기 고장
//  원문(KOSHA GUIDE D-18-2020 §5.13, <표 2> 13번 항목)은 §5.1~§5.11과
//  근본적으로 다르다 — **완결된 유량 산정식을 주지 않는다.** 원문이
//  실제로 정의하는 건 "오리피스 면적"뿐이다:
//    - 다관형(Shell-and-tube): 튜브 단면적의 2배 크기의 구멍
//    - 판형(Plate-and-frame): 다관형 튜브 단면적에 해당하는 구멍
//    - 이중관(Double-pipe): Schedule pipe면 보통 불필요(NOT_APPLICABLE),
//      Gauge tube면 사례별 공학적 판단 필요(NEEDS_ENGINEERING_DECISION)
//  그 면적을 실제 유량(kg/h)으로 바꾸는 흐름식은 원문 §5.13(1)(마)가
//  "액체는 비압축성 흐름식, 증기/가스는 압축성 흐름식, 플래싱 발생
//  시 균일평형모델(HEM) 2상 흐름식을 사용하라"고만 지시할 뿐 그 식
//  자체를 제시하지 않는다 — 즉 면적→유량 변환은 이 조항의 범위 밖
//  이다. 여기서 압축성/비압축성/2상 흐름식을 임의로 만들어 넣는 것은
//  §5.13에 없는 유체역학 모델을 추가하는 것이므로 하지 않는다.
//
//  그래서 이 함수는 **오리피스 면적 산정까지만** 구현한다. 결과는
//  W(kg/h)도 V(㎥/hr)도 아닌 면적(㎡)이므로 requiredOrificeArea_m2
//  필드를 쓴다 — 범용 필드에 다른 단위를 넣지 않는다는 원칙(C-4.5와
//  동일). status "COMPUTABLE"은 "오리피스 면적 산정이 가능하다"는
//  뜻으로만 쓴다 — "소요분출량(유량)까지 산정 가능하다"는 뜻이 아님을
//  명시한다. "튜브 단면적"은 원문 문구 그대로 입력값
//  (tubeCrossSectionArea_m2)으로 직접 받는다 — 지름으로부터 πD²/4로
//  역산하는 변환은 원문에 없으므로 추가하지 않는다.
//  순수 함수. §5.1/§5.6/§5.7/§5.8/§5.11 코드는 수정하지 않았다.
function calculateExchangerFailureScenario(input) {
  const SCENARIO_ID = "EXCHANGER_FAIL";
  const SECTION = "§5.13";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.13, <표 2> 13번";
  const FLOW_EQUATION_NOTE = "면적→유량 변환은 원문 §5.13(1)(마)가 \"액체=비압축성 흐름식, 증기/가스=압축성 흐름식, " +
    "플래싱 시 HEM 2상 흐름식\"이라고만 지시하고 식 자체를 제시하지 않음 — 이 함수는 오리피스 면적 산정까지만 " +
    "수행하며 면적→유량 변환은 별도 NEEDS_ENGINEERING_DECISION 사항";
  const inputs = (input && typeof input === "object") ? { ...input } : {};
  const exchangerType = inputs.exchangerType;

  const VALID_TYPES = ["SHELL_AND_TUBE", "PLATE_AND_FRAME", "DOUBLE_PIPE"];

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      exchangerType: VALID_TYPES.includes(exchangerType) ? exchangerType : null,
      status: "INSUFFICIENT_INPUT", requiredOrificeArea_m2: null, unit: "m2",
      inputs, components: null, formula: null, reason,
      source: SOURCE, flowEquationNote: FLOW_EQUATION_NOTE,
    };
  }

  function isValidPositiveFiniteNumber(v) {
    return typeof v === "number" && isFinite(v) && v > 0;
  }

  if (!VALID_TYPES.includes(exchangerType)) {
    return insufficient("invalid_or_missing_exchangerType");
  }

  if (exchangerType === "DOUBLE_PIPE") {
    const innerTubeType = inputs.innerTubeType;
    if (innerTubeType !== "SCHEDULE_PIPE" && innerTubeType !== "GAUGE_TUBE") {
      return insufficient("invalid_or_missing_innerTubeType");
    }
    if (innerTubeType === "SCHEDULE_PIPE") {
      // 원문 §5.13(2)(가): 다른 배관 이상의 파열 가능성 없음 — 압력방출장치 불요.
      return {
        scenarioId: SCENARIO_ID, section: SECTION, phase: null, exchangerType, innerTubeType,
        status: "NOT_APPLICABLE", requiredOrificeArea_m2: null, unit: "m2",
        inputs, components: null,
        formula: null,
        reason: "KOSHA D-18-2020 §5.13(2)(가): Schedule pipe는 다른 배관 이상의 파열 가능성이 없어 압력방출장치 설치 불요",
        source: SOURCE, flowEquationNote: FLOW_EQUATION_NOTE,
      };
    }
    // GAUGE_TUBE — 원문 §5.13(2)(나): 사례별 공학적 판단 필요, 계산식 없음.
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, exchangerType, innerTubeType,
      status: "NEEDS_ENGINEERING_DECISION", requiredOrificeArea_m2: null, unit: "m2",
      inputs, components: null, formula: null,
      reason: "KOSHA D-18-2020 §5.13(2)(나): Gauge tube는 용접 고장 등 사례별 공학적 판단이 필요 — 원문에 계산식 없음",
      source: SOURCE, flowEquationNote: FLOW_EQUATION_NOTE,
    };
  }

  // SHELL_AND_TUBE / PLATE_AND_FRAME — 튜브 단면적 기반 오리피스 면적 산정.
  if (!isValidPositiveFiniteNumber(inputs.tubeCrossSectionArea_m2)) {
    return insufficient("invalid_tubeCrossSectionArea_m2");
  }
  const tubeArea = inputs.tubeCrossSectionArea_m2;
  const multiplier = exchangerType === "SHELL_AND_TUBE" ? 2 : 1;
  const requiredOrificeArea_m2 = multiplier * tubeArea;

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, exchangerType, status: "COMPUTABLE",
    requiredOrificeArea_m2, unit: "m2", inputs,
    components: { tubeCrossSectionArea_m2: tubeArea, multiplier },
    formula: exchangerType === "SHELL_AND_TUBE"
      ? "요구 오리피스 면적 = 튜브 단면적 × 2 (다관형) — KOSHA D-18-2020 §5.13, <표 2> 13-1)"
      : "요구 오리피스 면적 = 튜브 단면적 × 1 (판형, 다관형 튜브단면적에 해당) — KOSHA D-18-2020 §5.13, <표 2> 13-3)",
    source: SOURCE, flowEquationNote: FLOW_EQUATION_NOTE,
  };
}

// ════════════════════════════════════════════════════════════════
//  C-4.7 — §5.12 외부 화재(External fire)
//  원문(KOSHA GUIDE D-18-2020 §5.12) 식(2)~(7)을 1차 출처(사용자 제공
//  원본 PDF, 페이지 이미지 직접 대조)로 확인해 그대로 구현했다.
//  계수는 전부 원문 그대로: 37,100 / 61,000 / 0.82 / 57,000 / 904 /
//  8.766 / 1.25 / 1.1506 — 재유도하거나 일반화하지 않는다.
//
//  원문은 개방 액면화재(Open pool fire)/제한공간화재(Confined pool
//  fire)/제트화재(Jet fire) 3가지 화재유형을 구분하는데, 실제로
//  계산식이 있는 건 개방 액면화재(액체/가스·증기 두 갈래)뿐이다:
//    - 액체 취급 용기: 식(2)(3)(4) — W=Q/λ, Q=계수·F·Aws^0.82
//    - 가스/증기/초임계유체 용기: 식(7) — W=8.766√(MP1)·[A(Tw-T1)^1.25/T1^1.1506]
//  제한공간화재는 원문 §5.12(3)(나)가 "소규모 연료지배형 화재는
//  식(2)~(4)에서 Aws 대신 Awi를 사용"이라고 명시 — 즉 새 공식이
//  아니라 액체 개방화재 공식을 면적 변수만 바꿔 재사용하는 것이므로
//  동일 계산 경로를 쓰되 provenance에 Awi임을 남긴다. 환기지배형과
//  대규모 연료지배형은 원문이 "더 엄밀한 방법 필요"라며 계산식을
//  주지 않아 NEEDS_ENGINEERING_DECISION. 제트화재는 원문이 "통상적인
//  압력방출장치는 효과적인 보호 수단이 될 수 없다"고 명시적으로
//  배제하므로 NEEDS_ENGINEERING_DECISION(계산 대상 자체가 아님).
//
//  F(환경인자)는 <표 3>에서 직접 읽은 값(0~1)을 그대로 받거나,
//  단열재 물성(k, δins, Tf)으로부터 식(5)/(6)을 통해 산정한다 —
//  식(5)는 식(6)에서 층 수 n=1인 특수case와 대수적으로 동일하므로
//  하나의 합산식으로 구현했다(원문을 일반화한 것이 아니라 n=1일 때
//  정확히 같은 식이 되는 것을 재사용한 것).
//
//  가스/증기 케이스의 T1은 원문이 "T1=(P1/Pn)×Tn"라는 식을 직접
//  제공하므로 Pn/Tn으로부터 여기서 산출한다(원문에 있는 식이라 별도
//  가정 아님) — 다만 이미 산정된 T1을 직접 입력해도 된다.
//
//  W(kg/hr) 계열(액체/가스·증기 화재)은 §5.1~§5.8과 동일한 W/unit
//  계약을 쓴다(다른 §5.12 하위계산과 달리 이번엔 결과가 실제로
//  kg/hr이므로 §5.11/§5.13처럼 별도 단위 필드를 만들 필요 없음).
//  순수 함수. §5.1/§5.6/§5.7/§5.8/§5.11/§5.13 코드는 수정하지 않았다.
//  아직 selectGoverningReliefLoad()/api520Engine()에 연결하지 않는다.
function calculateExternalFireScenario(input) {
  const SCENARIO_ID = "EXTERNAL_FIRE";
  const SECTION = "§5.12";
  const SOURCE = "KOSHA GUIDE D-18-2020 §5.12, 식(2)~(7)";
  const inputs = (input && typeof input === "object") ? { ...input } : {};
  const fireCase = inputs.fireCase;

  const VALID_CASES = [
    "OPEN_POOL_LIQUID", "OPEN_POOL_GAS_VAPOR",
    "CONFINED_POOL_FUEL_SMALL_MEDIUM",
    "CONFINED_POOL_VENTILATION_CONTROLLED", "CONFINED_POOL_LARGE_SCALE",
    "JET_FIRE",
  ];

  function insufficient(reason) {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null,
      fireCase: VALID_CASES.includes(fireCase) ? fireCase : null,
      status: "INSUFFICIENT_INPUT", W: null, unit: "kg/h",
      inputs, components: null, formula: null, reason, source: SOURCE,
    };
  }

  function isFiniteNumber(v) { return typeof v === "number" && isFinite(v); }
  function isPositiveFiniteNumber(v) { return isFiniteNumber(v) && v > 0; }

  if (!VALID_CASES.includes(fireCase)) {
    return insufficient("invalid_or_missing_fireCase");
  }

  // ── 계산식이 없는 하위케이스: 원문이 명시적으로 배제하거나 더 엄밀한 방법을 요구 ──
  if (fireCase === "JET_FIRE") {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, fireCase,
      status: "NEEDS_ENGINEERING_DECISION", W: null, unit: "kg/h",
      inputs, components: null, formula: null,
      reason: "KOSHA D-18-2020 §5.12(4): 제트화재는 통상적인 압력방출장치가 효과적인 보호수단이 될 수 없다고 명시 — 화재 누출원 격리/감압시스템/외부단열 등 관리적 대책 필요, 계산식 없음",
      source: SOURCE,
    };
  }
  if (fireCase === "CONFINED_POOL_VENTILATION_CONTROLLED") {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, fireCase,
      status: "NEEDS_ENGINEERING_DECISION", W: null, unit: "kg/h",
      inputs, components: null, formula: null,
      reason: "KOSHA D-18-2020 §5.12(3)(가)①: 환기지배형 제한공간화재는 화재 규모가 제한적이나 원문이 별도 계산식을 제시하지 않음",
      source: SOURCE,
    };
  }
  if (fireCase === "CONFINED_POOL_LARGE_SCALE") {
    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, fireCase,
      status: "NEEDS_ENGINEERING_DECISION", W: null, unit: "kg/h",
      inputs, components: null, formula: null,
      reason: "KOSHA D-18-2020 §5.12(3)(가)②㉯: 대규모 화재는 식(3)(4)가 열입력량을 과소평가하게 되어 더 엄밀한 방법이 필요하다고 명시 — 계산식 없음",
      source: SOURCE,
    };
  }

  // ── 개방 액면화재(액체) / 제한공간화재(소규모 연료지배형, 동일 공식 재사용) ──
  if (fireCase === "OPEN_POOL_LIQUID" || fireCase === "CONFINED_POOL_FUEL_SMALL_MEDIUM") {
    if (typeof inputs.adequateDrainage !== "boolean") return insufficient("invalid_or_missing_adequateDrainage");
    if (!isPositiveFiniteNumber(inputs.wettedArea_m2)) return insufficient("invalid_wettedArea_m2");
    if (!isPositiveFiniteNumber(inputs.latentHeat_kcal_per_kg)) return insufficient("invalid_latentHeat_kcal_per_kg");

    // F 산정: 표3 직접값(0~1) 또는 단열재 층 목록(k,δins)+Tf로 식(5)/(6) 산출.
    let F, fProvenance;
    if (isFiniteNumber(inputs.F) && inputs.F >= 0 && inputs.F <= 1 && inputs.insulationLayers === undefined) {
      F = inputs.F;
      fProvenance = "표3 직접값(또는 사용자 산정값)";
    } else if (Array.isArray(inputs.insulationLayers) && inputs.insulationLayers.length >= 1 && isFiniteNumber(inputs.Tf_degC)) {
      const layers = inputs.insulationLayers;
      let sum = 0;
      for (const layer of layers) {
        if (!layer || typeof layer !== "object") return insufficient("invalid_insulationLayers_entry");
        if (!isPositiveFiniteNumber(layer.k_kcal_mm_per_hr_m2_degC)) return insufficient("invalid_insulationLayer_k");
        if (!isPositiveFiniteNumber(layer.thickness_mm)) return insufficient("invalid_insulationLayer_thickness");
        sum += layer.thickness_mm / layer.k_kcal_mm_per_hr_m2_degC;
      }
      F = (904 - inputs.Tf_degC) / (57000 * sum);
      fProvenance = layers.length === 1
        ? "식(5) 단일 단열재로 산정 — KOSHA D-18-2020 §5.12(2)(가)②㉯"
        : "식(6) 복층 단열재로 산정 — KOSHA D-18-2020 §5.12(2)(가)②㉰";
    } else {
      return insufficient("invalid_or_missing_F_or_insulationLayers");
    }
    if (!isFiniteNumber(F) || F < 0) return insufficient("computed_F_out_of_range");

    const coefficient = inputs.adequateDrainage ? 37100 : 61000;
    const Q = coefficient * F * Math.pow(inputs.wettedArea_m2, 0.82);
    const W = Q / inputs.latentHeat_kcal_per_kg;
    const areaLabel = fireCase === "OPEN_POOL_LIQUID" ? "Aws(개방 액면화재)" : "Awi(제한공간화재 대체 면적, §5.12(3)(나))";

    return {
      scenarioId: SCENARIO_ID, section: SECTION, phase: null, fireCase, status: "OK",
      W, unit: "kg/h", inputs,
      components: {
        adequateDrainage: inputs.adequateDrainage, coefficient, F, fProvenance,
        wettedArea_m2: inputs.wettedArea_m2, areaLabel, Q_kcal_per_hr: Q,
        latentHeat_kcal_per_kg: inputs.latentHeat_kcal_per_kg,
      },
      formula: `W=Q/λ, Q=${coefficient}·F·${fireCase === "OPEN_POOL_LIQUID" ? "Aws" : "Awi"}^0.82 — KOSHA D-18-2020 식(2)(${inputs.adequateDrainage ? "3" : "4"})`,
      source: SOURCE,
    };
  }

  // ── OPEN_POOL_GAS_VAPOR — 식(7) ──
  if (!isPositiveFiniteNumber(inputs.M)) return insufficient("invalid_M");
  if (!isPositiveFiniteNumber(inputs.P1_MPa)) return insufficient("invalid_P1_MPa");
  if (!isPositiveFiniteNumber(inputs.A_m2)) return insufficient("invalid_A_m2");
  if (!isPositiveFiniteNumber(inputs.Tw_K)) return insufficient("invalid_Tw_K");

  let T1, t1Provenance;
  if (isPositiveFiniteNumber(inputs.T1_K) && inputs.Pn_MPa === undefined && inputs.Tn_K === undefined) {
    T1 = inputs.T1_K;
    t1Provenance = "직접 입력값";
  } else if (isPositiveFiniteNumber(inputs.Pn_MPa) && isPositiveFiniteNumber(inputs.Tn_K)) {
    T1 = (inputs.P1_MPa / inputs.Pn_MPa) * inputs.Tn_K;
    t1Provenance = "T1=(P1/Pn)×Tn 로 산정 — KOSHA D-18-2020 §5.12(2)(나), 식(7) 정의부";
  } else {
    return insufficient("invalid_or_missing_T1_or_Pn_Tn");
  }
  if (!isPositiveFiniteNumber(T1)) return insufficient("computed_T1_invalid");
  if (inputs.Tw_K <= T1) return insufficient("Tw_must_exceed_T1");

  const W = 8.766 * Math.sqrt(inputs.M * inputs.P1_MPa) *
    (inputs.A_m2 * Math.pow(inputs.Tw_K - T1, 1.25) / Math.pow(T1, 1.1506));

  return {
    scenarioId: SCENARIO_ID, section: SECTION, phase: null, fireCase, status: "OK",
    W, unit: "kg/h", inputs,
    components: { M: inputs.M, P1_MPa: inputs.P1_MPa, A_m2: inputs.A_m2, Tw_K: inputs.Tw_K, T1_K: T1, t1Provenance },
    formula: "W = 8.766·√(M·P1)·[A(Tw−T1)^1.25 / T1^1.1506] — KOSHA D-18-2020 식(7)",
    source: SOURCE,
  };
}


// ── engine/backpressure.js ──────────────────────────
//  BACKPRESSURE ENGINE (API 521 minimal model, pure, stateless)
//  Kb는 입력값이 아니라 배출 시스템 설계의 결과값이다.
// ════════════════════════════════════════════════════════════════
const BP_CONST = {
  G:              9.80665,   // m/s²
  EXIT_K:         0.5,       // exit loss coefficient
  CHOKED_RATIO:   0.528,     // 임계압력비 근사 (k≈1.3 평균) — 실제는 fluid k로 재계산
  DARCY_F_DEFAULT:0.02,      // 기본 마찰계수 (turbulent, commercial steel 근사)
};

// 배관 형상 입력 — InputView에서 사용자가 결정하는 "물리적 사실"
// (계산값이 아니라 실제 배관 도면 기준 입력)
// FRICTION-LOSS-001: L/D/fittingsK 3개는 배출측(DischargeSystem)과
// 인입측(Equipment.inletPiping) 모두가 공유하는 순수 배관형상 계약 —
// validatePipeGeometry()가 단일 출처. headerPressure는 배출측 전용
// (정적 배압, superimposed backpressure)이라 별도로 검증한다.
function validatePipeGeometry(geo) {
  const fields = ["L", "D", "fittingsK"];
  for (const f of fields) {
    const v = Number(geo?.[f]);
    if (isNaN(v) || !isFinite(v)) return { ok:false, field:f, reason:"not_a_number" };
  }
  if (geo.D <= 0) return { ok:false, field:"D", reason:"must_be_positive" };
  if (geo.L <  0) return { ok:false, field:"L", reason:"must_be_non_negative" };
  if (geo.fittingsK < 0) return { ok:false, field:"fittingsK", reason:"must_be_non_negative" };
  return { ok:true };
}

function validateGeometry(geo) {
  const pipeValid = validatePipeGeometry(geo);
  if (!pipeValid.ok) return pipeValid;
  const hp = Number(geo?.headerPressure);
  if (isNaN(hp) || !isFinite(hp)) return { ok:false, field:"headerPressure", reason:"not_a_number" };
  if (hp < 0) return { ok:false, field:"headerPressure", reason:"must_be_non_negative" };
  return { ok:true };
}

// 유체 밀도 근사 (ideal gas, P[bar]→Pa, T[K], M[g/mol])
// rho = P*M / (R*T) — R = 8314 J/(kmol·K)
function gasDensity(P_bar, T_K, M_gmol) {
  const P_Pa = P_bar * 1e5;
  const R = 8314; // J/(kmol·K), M은 g/mol = kg/kmol 이므로 그대로 사용
  return (P_Pa * M_gmol) / (R * T_K); // kg/m³
}

// ── computeFrictionLoss ─────────────────────────────────────────
// FRICTION-LOSS-001: 배관 "마찰+fittings" 압력손실의 유일한 물리 계산
// 코어 — Darcy-Weisbach(동압×f×L/D) + fittings(동압×ΣK). 배출측 전용
// 개념(exit loss, 정적 헤더압, Kb, choked flow)은 이 함수에 넣지 않는다
// — computeBackpressure()가 이 함수의 결과 위에 자신만의 정책을 얹는다.
// 인입측(inlet loss)도 동일하게 이 함수만 호출하고 자신만의 정책
// (KOSHA 3% 기준)을 별도로 얹는다 — 물리 계산 코드가 두 곳에 복제되지
// 않는다.
//
// 입력: W(kg/h), T(K), M(g/mol), P_ref(barg — 밀도 산정 기준압력,
//       배출측은 Pset, 인입측도 Pset 재사용), L(m), D(m), fittingsK(ΣK)
// 출력: rho(kg/m³), velocity(m/s), 동압/마찰/fittings 손실 — Pa(원값)와
//       bar(반올림 표시값) 둘 다 반환. Pa 원값은 상위 계산(exit loss 합산
//       등)에서 반올림 오차 누적 없이 그대로 이어 쓸 수 있게 하기 위함.
function computeFrictionLoss({ W, T, M, P_ref, L, D, fittingsK }) {
  const geoValid = validatePipeGeometry({ L, D, fittingsK });
  if (!geoValid.ok) {
    return { valid:false, error: geoValid };
  }
  const Wn = Number(W), Tn = Number(T), Mn = Number(M), Pn = Number(P_ref);
  if ([Wn,Tn,Mn,Pn].some(v => isNaN(v) || !isFinite(v))) {
    return { valid:false, error:{ field:"W|T|M|P_ref", reason:"not_a_number" } };
  }
  if (Pn <= 0) return { valid:false, error:{ field:"P_ref", reason:"must_be_positive" } };

  // UNIT-PRESSURE-002: 대기압 상수는 api520.js API_CONST.ATM_PRESSURE_BAR
  // 단일 출처. 여기서는 OP를 더하지 않는다 — sizing용 relieving pressure
  // (P1abs)와 별개의, 배관 유속/밀도 계산 전용 근사(의도적).
  const P_ref_abs = Pn + API_CONST.ATM_PRESSURE_BAR;
  const rho = gasDensity(P_ref_abs, Tn, Mn); // kg/m³

  const W_kgs = Wn / 3600;
  const A = Math.PI * (D * D) / 4;
  const v = A > 0 ? W_kgs / (rho * A) : 0;

  const dynHead_Pa = rho * v * v / 2;
  const dP_pipe_Pa = D > 0 ? BP_CONST.DARCY_F_DEFAULT * (L / D) * dynHead_Pa : 0;
  const dP_fit_Pa  = fittingsK * dynHead_Pa;
  const totalFrictionLoss_Pa = dP_pipe_Pa + dP_fit_Pa;

  return {
    valid: true,
    rho_kgm3:   rho,
    velocity_ms: v,
    frictionFactor: BP_CONST.DARCY_F_DEFAULT,
    L_over_D: D > 0 ? L / D : 0,
    // Pa 원값 — 상위 함수가 다른 손실항과 합산 후 한 번에 반올림할 때 사용
    dynamicHead_Pa: dynHead_Pa,
    dP_pipe_Pa,
    dP_fit_Pa,
    totalFrictionLoss_Pa,
    // bar 반올림 표시값 — 그대로 evidence/PDF에 노출해도 되는 값
    rho_kgm3_r:    Math.round(rho * 100) / 100,
    velocity_ms_r: Math.round(v * 100) / 100,
    dP_pipe_bar:   Math.round(dP_pipe_Pa / 1e5 * 10000) / 10000,
    dP_fit_bar:    Math.round(dP_fit_Pa  / 1e5 * 10000) / 10000,
    totalFrictionLoss_bar: Math.round(totalFrictionLoss_Pa / 1e5 * 10000) / 10000,
  };
}

// ── computeBackpressure ───────────────────────────────────────
// 입력:
//   W           방출량 kg/h
//   P1          설정압 barg (set pressure)
//   T           방출 온도 K
//   M           분자량 g/mol
//   k           비열비
//   geometry: { L, D, fittingsK, headerPressure }
//     L              배관 길이 m
//     D              배관 내경 m
//     fittingsK      fittings K-factor 합산 (elbow, tee, reducer 등)
//     headerPressure flare/header 정상 압력 barg (superimposed backpressure)
//
// 출력: { p_static, p_dynamic, p_total, kb, velocity, choked, status, basis }
function computeBackpressure(inp, geometry) {
  const geoValid = validateGeometry(geometry);
  if (!geoValid.ok) {
    return { valid:false, error: geoValid };
  }

  const W  = Number(inp.W);   // kg/h
  const P1 = Number(inp.P1);  // barg (set pressure)
  const T  = Number(inp.T);   // K
  const M  = Number(inp.M);   // g/mol
  const k  = Number(inp.k);

  if (!P1 || P1 <= 0) {
    return { valid:false, error:{ field:"P1", reason:"must_be_positive" } };
  }

  const { L, D, fittingsK, headerPressure } = geometry;

  // ── FRICTION-LOSS-001: 마찰+fittings 손실은 공용 계산부로 위임 ──
  // (P1_abs/rho 계산은 computeFrictionLoss 내부에서 동일하게 수행됨)
  const fric = computeFrictionLoss({ W, T, M, P_ref: P1, L, D, fittingsK });
  if (!fric.valid) {
    return { valid:false, error: fric.error };
  }
  const P1_abs = P1 + API_CONST.ATM_PRESSURE_BAR;
  const rho = fric.rho_kgm3;
  const v = fric.velocity_ms;

  // ── Choked flow 판정 (배출측 전용 정책 — 공용 계산부에 없음) ──
  // 임계압력비 = (2/(k+1))^(k/(k-1))
  const criticalRatio = Math.pow(2/(k+1), k/(k-1));
  const pressureRatio = headerPressure > 0 ? (headerPressure + API_CONST.ATM_PRESSURE_BAR) / P1_abs : 0;
  const choked = pressureRatio <= criticalRatio;

  // ── 동적 배압 = 공용 마찰손실(Pa 원값) + exit loss(배출측 전용) ──
  const dP_exit_Pa   = BP_CONST.EXIT_K * fric.dynamicHead_Pa;
  const p_dynamic_Pa = fric.dP_pipe_Pa + fric.dP_fit_Pa + dP_exit_Pa;
  const p_dynamic_bar = p_dynamic_Pa / 1e5;

  // ── 정적 배압 (header/flare 압력, 배출측 전용) ──
  const p_static = headerPressure;

  // ── 합산 + Kb ──
  const p_total = p_static + p_dynamic_bar;
  const kb = P1 > 0 ? Math.max(0, 1 - (p_total / P1) * 0.5) : 1.0;
  // 참고: 정밀 Kb 곡선은 API 520 Fig.31 실측 데이터 기반이며
  // 위 식은 P_total/P_set 비율에 대한 1차 근사. 정밀 설계는 제조사 곡선 사용 권장.

  const ratio = p_total / P1;
  let status, basis;
  if (ratio < 0.10) {
    status = "calculated";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 배압 영향 미미. 표준 스프링식 적용 가능.`;
  } else if (ratio < 0.30) {
    status = "calculated";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 동적+정적 배압 합산 결과. Kb 보정 적용됨 (Pipe ΔP=${(fric.dP_pipe_Pa/1e5).toFixed(3)}bar, Fittings ΔP=${(fric.dP_fit_Pa/1e5).toFixed(3)}bar, Exit ΔP=${(dP_exit_Pa/1e5).toFixed(3)}bar).`;
  } else {
    status = "out_of_range";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 스프링식 적용 범위(30%) 초과. 파일럿식 전환 또는 배관 재설계 검토 필요.`;
  }
  if (choked) {
    basis += ` [Choked flow 감지: 임계압력비 ${(criticalRatio*100).toFixed(1)}% 이하 — 음속 유동 구간]`;
  }

  return {
    valid: true,
    p_static:  Math.round(p_static  * 1000) / 1000,
    p_dynamic: Math.round(p_dynamic_bar * 1000) / 1000,
    p_total:   Math.round(p_total   * 1000) / 1000,
    kb:        Math.round(kb * 1000) / 1000,
    velocity:  Math.round(v * 100) / 100,
    choked,
    criticalRatio: Math.round(criticalRatio * 1000) / 1000,
    breakdown: {
      dP_pipe_bar:  Math.round(fric.dP_pipe_Pa/1e5 * 1000) / 1000,
      dP_fit_bar:   Math.round(fric.dP_fit_Pa /1e5 * 1000) / 1000,
      dP_exit_bar:  Math.round(dP_exit_Pa/1e5 * 1000) / 1000,
      rho_kgm3:     Math.round(rho * 100) / 100,
    },
    status,
    basis,
  };
}


// ── engine/evidence.js ──────────────────────────
//  EVIDENCE LAYER — Engine stepData → 근거 텍스트
// ════════════════════════════════════════════════════════════════
function buildEvidence(sd) {
  if (!sd) return [];
  const { fluid, cCoeff, pressure, orifice, selection, backpress, accumulation, inletLoss } = sd;
  return [
    {
      id:1, title:"유체 물성 확인",
      formula:"M, T, k, Z 입력값 확인",
      result:`M = ${fluid.M} g/mol | T = ${fluid.T} K | k = ${fluid.k} | Z = ${fluid.Z}`,
      detail:`비열비 k=${fluid.k} 기준 임계압력비 = (2/(k+1))^(k/(k-1)) = ${fluid.criticalPressRatio.toFixed(4)}. 압축계수 Z=${fluid.Z}${fluid.Z===1 ? " (기본값, 이상기체 가정)" : " (사용자 입력값)"} — Case 소유 계산 조건, Asset 속성 아님.`,
      ok:true,
    },
    {
      id:2, title:"Relieving Pressure(절대압) 산정",
      formula:"P1(abs) = Pset × (1 + OP/100) + P(atm)",
      result:`P1abs = ${pressure.P1abs.toFixed(4)} bara`,
      detail:`설정압 Pset=${pressure.Pset} barg, Overpressure OP=${pressure.OP}% (설비대장 값), 대기압=${pressure.atm} bar. Case 입력값이 아니라 Asset(Equipment) 소유 필드에서 산정.`,
      ok: pressure.P1abs > 0,
    },
    {
      id:3, title:"C 계수 계산 (API 520)",
      formula:`C = ${API_CONST.C_BASE} × √( k × (2/(k+1))^((k+1)/(k-1)) )`,
      result:`C = ${cCoeff.C.toFixed(2)}`,
      detail:`k=${cCoeff.k}일 때 API 520 기준 C계수 = ${cCoeff.C.toFixed(2)}. 이 값이 클수록 동일 면적에서 더 많은 유량 방출 가능.`,
      ok:true,
    },
    {
      id:4, title:"필요 오리피스 면적 (SI 단위)",
      formula:"A[mm²] = 13160 × W / (C × Kd_eff × P1abs[kPa] × Kb) × √(T×Z / M)",
      result:`A_required = ${orifice.areaCm2.toFixed(4)} cm²`,
      detail:`W=${orifice.W} kg/h, P1abs=${orifice.P1abs.toFixed(3)} bara, Kd_eff=${orifice.KdEff.toFixed(3)}, Kb=${orifice.Kb}${orifice.isRD ? ` (럽처디스크 보정계수 ×${API_CONST.RD_KD_FACTOR} 적용)` : ""}`,
      ok: orifice.areaCm2 > 0,
    },
    {
      id:5, title:"API 526 표준 오리피스 선정",
      formula:"A_selected ≥ A_required",
      result:`${selection.selected.letter} 오리피스 | ${selection.selected.area} cm² ≥ ${selection.areaCm2.toFixed(4)} cm²${selection.selected.nonStandard ? " ⚠ 비표준" : ""}`,
      detail:`여유율 = ${selection.margin.toFixed(3)}×${selection.selected.nonStandard ? " — 표준 규격 초과. 특수 제작 또는 병렬 설치 검토 필요." : ""}`,
      ok: !selection.selected.nonStandard && selection.selected.area >= selection.areaCm2,
    },
    {
      id:6, title:"Back Pressure 검증",
      formula:`P2/Pset < ${(backpress.allowableRatio*100).toFixed(0)}% (${backpress.valveType==="BELLOWS"?"벨로우즈형(밸런스형)":"스프링식"} 기준 — KOSHA GUIDE D-18-2020 §7.2(4))`,
      result:`P2/Pset = ${(backpress.ratio*100).toFixed(1)}% → ${backpress.ratio < backpress.allowableRatio ? "적합 ✓" : "초과 ✗ — 조치 필요"}`,
      detail:`선택된 밸브 형식: ${backpress.valveType==="BELLOWS"?"벨로우즈형(밸런스형)":"스프링식"}. 배압이 이 한도를 초과하면 밸브가 제대로 재폐되지 않거나 용량이 저하될 수 있음. 근거: ${backpress.source||"KOSHA GUIDE D-18-2020 §7.2(4)"}`,
      ok: backpress.ratio < backpress.allowableRatio,
    },
    {
      id:7, title:"축적압력 허용성 검증 (Overpressure Guardrail)",
      formula:accumulation
        ? `1 + OP/100 ≤ ${(accumulation.allowableRatio*100).toFixed(0)}% (${accumulation.fireScenario?"화재 보호 목적":`비화재, 밸브 ${accumulation.valveCount>=2?"2개 이상":"1개"} 설치`} 기준 — KOSHA GUIDE D-18-2020 §4.4)`
        : "",
      result:accumulation
        ? `실제 축적압력 = ${(accumulation.actualRatio*100).toFixed(0)}% → ${accumulation.ok ? "GO ✓" : "NO-GO ✗ — 조치 필요"}`
        : "",
      detail:accumulation
        ? `sizing(Relieving Pressure) 산정에 쓰인 것과 같은 Overpressure(OP=${accumulation.OP}%)를 여기서는 다른 질문에 사용 — "이 시나리오(밸브개수·화재여부)에서 허용되는 축적압력 상한을 넘는가?"를 검증한다. sizing 결과(오리피스/필요면적)에는 영향 없음. 초과 시 자동 보정하지 않고 NO-GO로 표시. 근거: ${accumulation.source}`
        : "",
      ok: accumulation ? accumulation.ok : true,
    },
    {
      id:8, title:"인입배관 압력손실 검증 (Inlet Pressure Loss)",
      formula:inletLoss
        ? `pressureLoss / Pset ≤ ${(API_CONST.INLET_PRESSURE_LOSS_POLICY.MAX_RATIO*100).toFixed(0)}% (KOSHA GUIDE D-18-2020 §7.2(1))`
        : "",
      result:!inletLoss ? ""
        : !inletLoss.pressureLossAvailable
          ? `계산 불가 — 인입배관 형상(길이/내경/fittings) 데이터 없음 → INSUFFICIENT INPUT`
          : `ΔP = ${inletLoss.pressureLoss.toFixed(4)} bar (${(inletLoss.pressureLossRatio*100).toFixed(2)}%) → ${inletLoss.pressureLossOK ? "GO ✓" : "NO-GO ✗ — 조치 필요"}`,
      detail:!inletLoss ? ""
        : !inletLoss.pressureLossAvailable
          ? `Equipment에 inletPiping(L/D/fittingsK)이 등록되어 있지 않아 실제 압력손실을 계산할 수 없다. 임의 추정값을 대입하지 않고 판정을 보류한다 — 이 상태는 "적정"으로 취급되지 않는다(GO 아님).`
          : `설치대상 용기에서 안전밸브 인입 플랜지까지의 배관 압력손실이 설정압력(Pset=${pressure.Pset} barg)의 ${(inletLoss.allowableRatio*100).toFixed(0)}%(=${inletLoss.allowablePressureLoss.toFixed(4)} bar) 이하인지 확인. 물리 계산은 backpressure.js와 동일한 검증된 Darcy-Weisbach 모델(computeFrictionLoss) 재사용 — sizing 결과(Required Area/Orifice)에는 영향 없음. 근거: ${inletLoss.source}`,
      ok: inletLoss ? (inletLoss.pressureLossAvailable ? inletLoss.pressureLossOK : false) : true,
    },
  ];
}


// ── snapshot/create.js ──────────────────────────
//  SNAPSHOT — Object.freeze, 불변
//  3-레이어 + assetRefs + workflowDecision trace
// ════════════════════════════════════════════════════════════════

function _hashResult(inputs, result, reliefLoad) {
  // RELIEF-SIZING-ADAPTER-001: reliefLoad(§5 시나리오/거버닝/근거)가
  // 존재하면 반드시 hash에 포함한다 — W 값이 같아도 근거 시나리오
  // 데이터가 바뀌면 다른 결과로 간주해야 한다(SSOT 원칙, provenance
  // 유실 방지). reliefLoad가 없으면(undefined) 기존 해시와 100% 동일
  // (하위호환 — 기존 골든 픽스처의 hash가 이 변경으로 달라지지 않음).
  const str = JSON.stringify({
    inputs, areaCm2: result.areaCm2, selected: result.selected?.letter,
    ...(reliefLoad !== undefined ? { reliefLoad } : {}),
  });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function _assetHash(equipment, dischargeSystem) {
  const eq = equipment ? {
    tag: equipment.tag, mawp: equipment.mawp,
    setPressure: equipment.setPressure, orifice: equipment.orifice,
    deviceType: equipment.deviceType,
    // INLET-LOSS-001: inletPiping이 바뀌면 assetFingerprint도 바뀌어야
    // MOC 감지(detectMOC)가 반응한다 — 누락하면 인입배관을 바꿔도
    // "변경 없음"으로 오판된다.
    inletPiping: equipment.inletPiping
      ? { L: equipment.inletPiping.L, D: equipment.inletPiping.D, fittingsK: equipment.inletPiping.fittingsK }
      : null,
  } : null;
  const ds = dischargeSystem ? {
    name: dischargeSystem.name, L: dischargeSystem.L,
    D: dischargeSystem.D, fittingsK: dischargeSystem.fittingsK,
    headerPressure: dischargeSystem.headerPressure,
    destination: dischargeSystem.destination,
  } : null;
  const str = JSON.stringify({ eq, ds });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

const SNAPSHOT_ENGINE_VERSION = "1.6.0";

// Snapshot이 기록하는 trigger fields — 감사 시 "어떤 규칙으로 판단했는지" 재현용
const WORKFLOW_TRIGGER_FIELDS_SNAPSHOT = [
  "headerPressure","L","D","fittingsK","destination",
  "setPressure","mawp","orifice","deviceType",
  "inletPiping.L","inletPiping.D","inletPiping.fittingsK", // INLET-LOSS-001
];

function createSnapshot({ caseId, valveTag, deviceType, inputs, engineResult,
                          equipment, dischargeSystem, workflowDecision, reliefLoad }) {
  if (ENGINE_VERSION !== SNAPSHOT_ENGINE_VERSION) {
    throw new Error(
      `INVALID_STATE: engine version mismatch. ` +
      `engine=${ENGINE_VERSION}, snapshot expects=${SNAPSHOT_ENGINE_VERSION}.`
    );
  }

  const resultHash       = _hashResult(inputs, engineResult, reliefLoad);
  const assetFingerprint = _assetHash(equipment, dischargeSystem);
  // evaluatedAt은 Snapshot 생성 시점에서 결정 — Engine이 아닌 증거 패키지의 책임
  const evaluatedAt      = new Date().toISOString();

  // snapshotHash — Approval 서명 대상. Snapshot 핵심 내용의 fingerprint.
  // 승인 후 Snapshot 내용이 바뀌면 이 값과 달라져 서명 검증 실패 감지 가능.
  function _snapHash(id, rHash, aFP, ev, wfState) {
    const str = JSON.stringify({ id, result_hash:rHash, assetFingerprint:aFP,
                                  evaluatedAt:ev, workflow:wfState });
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31,h)+str.charCodeAt(i))|0;
    return (h>>>0).toString(16).padStart(8,'0');
  }

  const snap = {  // eslint-disable-line prefer-const
    id:             `SNAP-${caseId}-${Date.now()}`,
    createdAt:      evaluatedAt,
    caseId,
    valveTag,
    deviceType,
    engine_version: ENGINE_VERSION,
    result_hash:    resultHash,

    // MOC 감지용 — 검토 시점 Asset 식별자 + Revision
    assetRefs: Object.freeze({
      equipmentId:         equipment?.id        || null,
      equipmentTag:        equipment?.tag        || null,
      equipmentRevision:   equipment?.revision   ?? null,
      dischargeSystemId:   dischargeSystem?.id   || null,
      dischargeSystemName: dischargeSystem?.name || null,
      dischargeRevision:   dischargeSystem?.revision ?? null,
      assetFingerprint,
    }),

    // Workflow 결정 trace — 감사 시 재현 가능한 불변 기록
    // Engine이 결정한 값 그대로. UI가 수정 불가.
    workflowDecision: workflowDecision ? Object.freeze({
      state:         workflowDecision.state,
      evaluatedAt,                             // Snapshot 생성 시점 — 증거 패키지 책임
      engineVersion: workflowDecision.engineVersion || ENGINE_VERSION,
      reasons:       Object.freeze([...(workflowDecision.reasons || [])]),
      triggerFields: Object.freeze([...WORKFLOW_TRIGGER_FIELDS_SNAPSHOT]),
    }) : null,

    // 3-레이어 불변 복사본
    equipment:       equipment       ? Object.freeze({ ...equipment })       : null,
    dischargeSystem: dischargeSystem ? Object.freeze({ ...dischargeSystem }) : null,
    inputs:          Object.freeze({ ...inputs }),
    result:          Object.freeze({ ...engineResult }),
    evidence:        Object.freeze(buildEvidence(engineResult.stepData)),
    workflow:        workflowDecision?.state || "INSPECTION",
    // RELIEF-SIZING-ADAPTER-001: §5 시나리오/거버닝/근거 — 제공되지
    // 않으면(현재 UI 미연결 상태) null. Report는 이 필드만 읽고 절대
    // 재계산하지 않는다(Engine → Snapshot.reliefLoad → Report 단방향).
    reliefLoad:      reliefLoad !== undefined ? Object.freeze(JSON.parse(JSON.stringify(reliefLoad))) : null,
  };
  // snapshotHash는 id/result_hash/assetFingerprint/evaluatedAt/workflow가 확정된 후 계산
  const snapshotHash = _snapHash(
    snap.id, snap.result_hash, snap.assetRefs.assetFingerprint,
    snap.evaluatedAt, snap.workflow
  );
  // Object.freeze 전에 snapshotHash 주입
  snap.snapshotHash = snapshotHash;
  return Object.freeze(snap);
}

// detectMOC → engine/workflow_engine.js 로 이동
// Snapshot은 데이터 저장만 담당. 상태 판정은 Engine 책임.


// ── engine/workflow_engine.js ──────────────────────────
//  WORKFLOW ENGINE (pure, stateless)
//  결정 계층:
//    detectMOC()          — Fact    : 무엇이 바뀌었나
//    evaluateSafetyImpact() — Analysis: 안전성에 영향을 주는가
//    computeWorkflowState() — Policy  : 최종 workflow 상태 결정
//
//  계약:
//    detectMOC()가 반환한 diff 객체는 이후 함수에서 재조립 금지.
//    { field, from, to, unit } 그대로 전달.
// ════════════════════════════════════════════════════════════════

// ── _wfAssetHash (내부 전용) ──────────────────────────────────
function _wfAssetHash(equipment, dischargeSystem) {
  const eq = equipment ? {
    tag: equipment.tag, mawp: equipment.mawp,
    setPressure: equipment.setPressure, overpressure: equipment.overpressure,
    orifice: equipment.orifice, deviceType: equipment.deviceType,
    inletPiping: equipment.inletPiping
      ? { L: equipment.inletPiping.L, D: equipment.inletPiping.D, fittingsK: equipment.inletPiping.fittingsK }
      : null,
  } : null;
  const ds = dischargeSystem ? {
    name: dischargeSystem.name, L: dischargeSystem.L,
    D: dischargeSystem.D, fittingsK: dischargeSystem.fittingsK,
    headerPressure: dischargeSystem.headerPressure,
    destination: dischargeSystem.destination,
  } : null;
  const str = JSON.stringify({ eq, ds });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

// ── LAYER 1: detectMOC — Fact ─────────────────────────────────
// 반환값 스키마 (불변 계약):
//   { changed: boolean, diffs: Array<{ field, from, to, unit }> }
// 이 스키마를 변경하면 MOC_SCHEMA_001 contract test가 실패한다.
function detectMOC(snap, currentEquipment, currentDischargeSystem) {
  if (!snap?.assetRefs) return { changed: false, diffs: [] };

  const currentFP = _wfAssetHash(currentEquipment, currentDischargeSystem);
  if (currentFP === snap.assetRefs.assetFingerprint) {
    return { changed: false, diffs: [] };
  }

  const diffs = [];
  const eq  = snap.equipment;
  const ds  = snap.dischargeSystem;
  const ceq = currentEquipment;
  const cds = currentDischargeSystem;

  if (eq && ceq) {
    if (eq.mawp        !== ceq.mawp)        diffs.push({ field:"mawp",        from:eq.mawp,        to:ceq.mawp,        unit:"barg" });
    if (eq.setPressure !== ceq.setPressure) diffs.push({ field:"setPressure", from:eq.setPressure, to:ceq.setPressure, unit:"barg" });
    if (eq.overpressure !== ceq.overpressure) diffs.push({ field:"overpressure", from:eq.overpressure, to:ceq.overpressure, unit:"%" });
    if (eq.orifice     !== ceq.orifice)     diffs.push({ field:"orifice",     from:eq.orifice,     to:ceq.orifice,     unit:"" });
    if (eq.deviceType  !== ceq.deviceType)  diffs.push({ field:"deviceType",  from:eq.deviceType,  to:ceq.deviceType,  unit:"" });
    // INLET-LOSS-001: DischargeSystem의 L/D/fittingsK와 이름이 겹치므로
    // "inletPiping." 접두사로 구분 — 감사 로그에서 어느 쪽 배관이 바뀐
    // 것인지 모호하지 않아야 한다.
    const eip = eq.inletPiping, cip = ceq.inletPiping;
    if ((eip?.L ?? null)         !== (cip?.L ?? null))         diffs.push({ field:"inletPiping.L",         from:eip?.L ?? null,         to:cip?.L ?? null,         unit:"m" });
    if ((eip?.D ?? null)         !== (cip?.D ?? null))         diffs.push({ field:"inletPiping.D",         from:eip?.D ?? null,         to:cip?.D ?? null,         unit:"m" });
    if ((eip?.fittingsK ?? null) !== (cip?.fittingsK ?? null)) diffs.push({ field:"inletPiping.fittingsK", from:eip?.fittingsK ?? null, to:cip?.fittingsK ?? null, unit:"" });
  }
  if (ds && cds) {
    if (ds.headerPressure !== cds.headerPressure) diffs.push({ field:"headerPressure", from:ds.headerPressure, to:cds.headerPressure, unit:"barg" });
    if (ds.L              !== cds.L)              diffs.push({ field:"L",              from:ds.L,              to:cds.L,              unit:"m" });
    if (ds.D              !== cds.D)              diffs.push({ field:"D",              from:ds.D,              to:cds.D,              unit:"m" });
    if (ds.fittingsK      !== cds.fittingsK)      diffs.push({ field:"fittingsK",      from:ds.fittingsK,      to:cds.fittingsK,      unit:"" });
    if (ds.destination    !== cds.destination)    diffs.push({ field:"destination",    from:ds.destination,    to:cds.destination,    unit:"" });
  }

  return { changed: diffs.length > 0, diffs };
}

// ── LAYER 2: evaluateSafetyImpact — Analysis ─────────────────
// detectMOC()의 diffs를 받아 안전성 영향 여부를 평가.
// diff 객체를 재조립하지 않고 그대로 사용.
// 반환값: { requiresReview: boolean, triggerDiffs: diff[] }
const WORKFLOW_TRIGGER_FIELDS = [
  "headerPressure", "L", "D", "fittingsK", "destination",
  "setPressure", "mawp", "overpressure", "orifice", "deviceType",
  "inletPiping.L", "inletPiping.D", "inletPiping.fittingsK", // INLET-LOSS-001
];

function evaluateSafetyImpact(diffs) {
  if (!diffs || diffs.length === 0) {
    return { requiresReview: false, triggerDiffs: [] };
  }
  // diff 객체 재조립 금지 — 원본 참조만 전달
  const triggerDiffs = diffs.filter(d => WORKFLOW_TRIGGER_FIELDS.includes(d.field));
  return {
    requiresReview: triggerDiffs.length > 0,
    triggerDiffs,   // detectMOC()가 만든 객체 그대로
  };
}

// ── LAYER 3: computeWorkflowState — Policy ───────────────────
// 최종 workflow 상태 결정. diff 객체를 생성하지 않음.
// detectMOC() → evaluateSafetyImpact() 결과만 사용.
//
// 반환값:
//   {
//     state: string,
//     reasons: diff[],      — detectMOC 원본 참조 (재조립 없음)
//     evaluatedAt: string,  — ISO timestamp
//     engineVersion: string,
//   }
// Engine은 결정만 반환. 시간(evaluatedAt)은 Snapshot 생성 시점에서 추가.
// 반환값에 evaluatedAt 없음 — createSnapshot()이 증거 패키지로 조립.
function computeWorkflowState(previousSnapshot, currentEquipment, currentDischargeSystem) {

  // Policy 1: 최초 검토
  if (!previousSnapshot) {
    return { state:"DRAFT", reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Policy 2: APPROVED / CLOSED — Engine이 바꾸지 않음
  if (["APPROVED","CLOSED"].includes(previousSnapshot.workflow)) {
    return { state:previousSnapshot.workflow, reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Fact: 무엇이 바뀌었나
  const mocResult = detectMOC(previousSnapshot, currentEquipment, currentDischargeSystem);

  if (!mocResult.changed) {
    return { state:previousSnapshot.workflow, reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Analysis: 안전성에 영향을 주는가
  const impact = evaluateSafetyImpact(mocResult.diffs);

  // Policy 3: 계산 영향 변경 → REVIEW_REQUIRED
  if (impact.requiresReview) {
    return {
      state:         "REVIEW_REQUIRED",
      reasons:       impact.triggerDiffs,
      engineVersion: ENGINE_VERSION,
    };
  }

  // Policy 4: 비계산 변경 → INSPECTION (재확인 필요)
  return {
    state:         "INSPECTION",
    reasons:       mocResult.diffs,
    engineVersion: ENGINE_VERSION,
  };
}


// ── workflow/index.js ──────────────────────────
//  WORKFLOW STATE MACHINE
//  DRAFT → INSPECTION → REVIEW → APPROVED → CLOSED
//  언제든 MOC 감지 시 → REVIEW_REQUIRED (자동 전환)
// ════════════════════════════════════════════════════════════════
const WF_TRANSITIONS = {

  REVIEW_REQUIRED:  ["INSPECTION"],

};

const WF_COLOR = {

  INSPECTION:       "#1CB0F6",
