// ── engine/api520.js ──────────────────────────
//  ENGINE (pure, stateless — UI 접근 금지)
// ════════════════════════════════════════════════════════════════
// ENGINE_VERSION 1.2.0 — API520-SI-001 / API520-PRESSURE-001 수정

//   기본값 1.00은 UI가 명시적으로 대입하며 Engine은 몰래 채우지 않는다.
//   validateInputs가 Z 누락을 거부하므로 이 필드는 계약 변경이다.
const ENGINE_VERSION = "1.3.0";

const API_CONST = {
  C_BASE:              520,
  SI_AREA_CONST:        13160,   // API 520 SI eq.: A[mm²]=13160·W[kg/h]/(C·Kd·P1[kPa]·Kb)·√(TZ/M)
  ATM_PRESSURE_BAR:     1.01325, // 표준 대기압 (relieving pressure 절대압 환산용)
  BACKPRESSURE_SPRING: 0.10,
  BACKPRESSURE_PILOT:  0.30,
  RD_KD_FACTOR:        0.9,
  KD_MIN:              0.9,
  MARGIN_MIN:          1.0,
  SIM_MAWP_FACTOR:     1.12,
  SIM_SPEED_NORMAL:    0.04,
  SIM_SPEED_RELIEF:    0.08,
  HISTORY_SIZE:        90,
};

const API526_ORIFICES = [
  { letter:"D", area:0.71 },{ letter:"E", area:1.27 },
  { letter:"F", area:1.98 },{ letter:"G", area:3.24 },
  { letter:"H", area:5.07 },{ letter:"J", area:8.30 },
  { letter:"K", area:11.05},{ letter:"L", area:15.32},
  { letter:"M", area:20.27},{ letter:"N", area:26.0 },
  { letter:"P", area:42.48},
];

function validateInputs(inp) {
  // OP(overpressure %)는 Equipment(Asset) 소유 필드 — Case가 임의 기본값을
  // 대입하지 않는다. 없으면 계산 자체를 막는다 (PRESSURE-001 계약).
  // Z(압축계수)는 반대로 Calculation Input(Case 소유) — 기본값 1.00은
  // UI가 명시적으로 대입하며, Engine은 몰래 채우지 않는다 (COMPRESSIBILITY-001).
  const fields = ["W","P1","P2","T","M","k","Kd","Kb","mawp","OP","Z"];
  for (const f of fields) {
    const v = Number(inp[f]);
    if (isNaN(v) || !isFinite(v)) return { ok: false, field: f, reason: "not_a_number" };
  }
  if (inp.P1 <= 0) return { ok: false, field:"P1", reason:"must_be_positive" };
  if (inp.T  <= 0) return { ok: false, field:"T",  reason:"must_be_positive" };
  if (inp.M  <= 0) return { ok: false, field:"M",  reason:"must_be_positive" };
  if (inp.k  <= 1) return { ok: false, field:"k",  reason:"must_be_gt_1" };
  if (inp.Kd <= 0) return { ok: false, field:"Kd", reason:"must_be_positive" };
  if (inp.Kb <= 0) return { ok: false, field:"Kb", reason:"must_be_positive" };
  if (inp.OP <  0) return { ok: false, field:"OP", reason:"must_be_non_negative" };
  if (inp.Z  <= 0) return { ok: false, field:"Z",  reason:"must_be_positive" };
  return { ok: true };
}

// Engine — 입력만 받고 출력만 반환. 외부 state 접근 금지.
function api520Engine(inp, deviceType) {
  const valid = validateInputs(inp);
  if (!valid.ok) return { valid: false, error: valid };

  const { W, P1, P2, T, M, k, Kd, Kb, mawp, OP, Z } = Object.fromEntries(
    Object.entries(inp).map(([key, v]) => [key, Number(v)])
  );

  // ── COMPRESSIBILITY-001: Z는 Asset이 아니라 Calculation Input ──
  // 설비 속성이 아니라 유체·운전조건에 따라 케이스마다 달라지는 계산
  // 조건이므로 Equipment/DischargeSystem이 아닌 Case 입력값으로 취급한다.
  // 기본값 1.0(이상기체 가정)은 UI에서 명시적으로 노출하며, Engine은
  // 몰래 대입하지 않는다 — validateInputs에서 누락 시 계산을 막는다.

  // ── PRESSURE-001: relieving pressure(절대압) 산정 ──────────────
  // P1(입력) = 설정압력(barg, Equipment.setPressure). 이것 자체는
  // relieving pressure가 아니다. API 520 정의대로 overpressure(%)와
  // 대기압을 더해 절대압으로 환산한 뒤에만 sizing 식에 사용한다.
  const Pset  = P1;
  const P1abs = Pset * (1 + OP / 100) + API_CONST.ATM_PRESSURE_BAR; // bara
  const P1_kPa = P1abs * 100;

  const C     = API_CONST.C_BASE * Math.sqrt(k * Math.pow(2/(k+1), (k+1)/(k-1)));
  const KdEff = deviceType === "ruptureDisk" ? Kd * API_CONST.RD_KD_FACTOR : Kd;

  // ── API520-SI-001: SI 단위 필수 변환상수(13160) 적용 ───────────
  // A[mm²] = 13160·W[kg/h] / (C·Kd·P1[kPa]·Kb) · √(T·Z/M)
  const A_mm2   = (API_CONST.SI_AREA_CONST * W / (C * KdEff * P1_kPa * Kb)) * Math.sqrt((T * Z) / M);
  const areaCm2 = A_mm2 / 100;

  const selected = API526_ORIFICES.find(o => o.area >= areaCm2)
    ?? { letter:"P+", area: areaCm2, nonStandard: true };

  const margin            = selected.area / areaCm2;
  // 배압비(Kb 산정 기준)는 API 520 Fig.30/31 관례대로 게이지압 기준 유지 —
  // 절대압 환산과는 별개 개념 (relieving pressure 산정과 혼동 금지).
  const backPressureRatio = P2 / Pset;
  const criticalPressRatio= Math.pow(2/(k+1), k/(k-1));

  const checklist = {
    capacityOK:     selected.area >= areaCm2,
    backPressureOK: backPressureRatio < API_CONST.BACKPRESSURE_SPRING,
    mawpOK:         Pset <= mawp,
    kdOK:           Kd >= API_CONST.KD_MIN,
    marginOK:       margin >= API_CONST.MARGIN_MIN,
  };

  // ── Calculation Trace — 감사/Report Evidence 전용, UI 표시용 아님 ──
  const trace = [
    { step: "COMPRESSIBILITY_Z", value: Z, unit: "",
      formula: Z === 1.0 ? "User Input (default 1.00)" : "User Input", inputs: { Z } },
    { step: "SET_PRESSURE",     value: Pset,   unit: "barg", formula: "Equipment.setPressure" },
    { step: "RELIEVING_PRESSURE", value: P1abs, unit: "bara",
      formula: "P1abs = Pset×(1+OP/100) + Patm", inputs: { Pset, OP, Patm: API_CONST.ATM_PRESSURE_BAR } },
    { step: "C_COEFFICIENT",    value: C,      unit: "",     formula: "C = 520·√(k·(2/(k+1))^((k+1)/(k-1)))", inputs: { k } },
    { step: "MASS_FLUX_AREA",   value: A_mm2,  unit: "mm²",
      formula: "A = 13160·W/(C·Kd·P1[kPa]·Kb)·√(TZ/M)", inputs: { W, KdEff, P1_kPa, Kb, T, Z, M } },
    { step: "REQUIRED_AREA",    value: areaCm2, unit: "cm²", formula: "areaCm2 = A_mm2 / 100" },
    { step: "ORIFICE_SELECTION",value: selected.letter, unit: "", formula: "next API526 orifice ≥ areaCm2", inputs: { areaCm2, selectedArea: selected.area } },
  ];

  const stepData = {
    fluid:     { M, T, k, Z, criticalPressRatio },
    cCoeff:    { C, k },
    pressure:  { Pset, OP, P1abs, atm: API_CONST.ATM_PRESSURE_BAR },
    orifice:   { areaCm2, W, P1abs, KdEff, Kb, isRD: deviceType === "ruptureDisk" },
    selection: { selected, areaCm2, margin },
    backpress: { ratio: backPressureRatio, limitSpring: API_CONST.BACKPRESSURE_SPRING, limitPilot: API_CONST.BACKPRESSURE_PILOT },
  };

  return { valid: true, areaCm2, selected, margin, C, P1abs, backPressureRatio, checklist, stepData, trace };
}


// ── engine/backpressure.js ──────────────────────────
//  BACKPRESSURE ENGINE (API 521 minimal model, pure, stateless)
//  Kb는 입력값이 아니라 배출 시스템 설계의 결과값이다.
// ════════════════════════════════════════════════════════════════
const BP_CONST = {
  G:              9.80665,   // m/s²
  EXIT_K:         0.5,       // exit loss coefficient
  CHOKED_RATIO:   0.528,     // 임계압력비 근사 (k≈1.3 평균) — 실제는 fluid k로 재계산
  DARCY_F_DEFAULT:0.02,      // 기본 마찰계수 (turbulent, commercial steel 근사)
};

// 배관 형상 입력 — InputView에서 사용자가 결정하는 "물리적 사실"
// (계산값이 아니라 실제 배관 도면 기준 입력)
function validateGeometry(geo) {
  const fields = ["L", "D", "fittingsK", "headerPressure"];
  for (const f of fields) {
    const v = Number(geo?.[f]);
    if (isNaN(v) || !isFinite(v)) return { ok:false, field:f, reason:"not_a_number" };
  }
  if (geo.D <= 0) return { ok:false, field:"D", reason:"must_be_positive" };
  if (geo.L <  0) return { ok:false, field:"L", reason:"must_be_non_negative" };
  if (geo.fittingsK < 0) return { ok:false, field:"fittingsK", reason:"must_be_non_negative" };
  if (geo.headerPressure < 0) return { ok:false, field:"headerPressure", reason:"must_be_non_negative" };
  return { ok:true };
}

// 유체 밀도 근사 (ideal gas, P[bar]→Pa, T[K], M[g/mol])
// rho = P*M / (R*T) — R = 8314 J/(kmol·K)
function gasDensity(P_bar, T_K, M_gmol) {
  const P_Pa = P_bar * 1e5;
  const R = 8314; // J/(kmol·K), M은 g/mol = kg/kmol 이므로 그대로 사용
  return (P_Pa * M_gmol) / (R * T_K); // kg/m³
}

// ── computeBackpressure ───────────────────────────────────────
// 입력:
//   W           방출량 kg/h
//   P1          설정압 barg (set pressure)
//   T           방출 온도 K
//   M           분자량 g/mol
//   k           비열비
//   geometry: { L, D, fittingsK, headerPressure }
//     L              배관 길이 m
//     D              배관 내경 m
//     fittingsK      fittings K-factor 합산 (elbow, tee, reducer 등)
//     headerPressure flare/header 정상 압력 barg (superimposed backpressure)
//
// 출력: { p_static, p_dynamic, p_total, kb, velocity, choked, status, basis }
function computeBackpressure(inp, geometry) {
  const geoValid = validateGeometry(geometry);
  if (!geoValid.ok) {
    return { valid:false, error: geoValid };
  }

  const W  = Number(inp.W);   // kg/h
  const P1 = Number(inp.P1);  // barg (set pressure)
  const T  = Number(inp.T);   // K
  const M  = Number(inp.M);   // g/mol
  const k  = Number(inp.k);

  if (!P1 || P1 <= 0) {
    return { valid:false, error:{ field:"P1", reason:"must_be_positive" } };
  }

  const { L, D, fittingsK, headerPressure } = geometry;

  // ── 1. 밀도 (방출 조건 기준, P1 절대압 근사) ──
  // UNIT-PRESSURE-002: 대기압 상수는 api520.js API_CONST.ATM_PRESSURE_BAR
  // 단일 출처 — 이 파일에서 값을 별도로 하드코딩하지 않는다. build.py
  // BUILD_ORDER상 api520.js가 이 파일보다 먼저 로드되어 전역에서 참조 가능.
  // 주의: 여기서는 OP(overpressure)를 더하지 않는다 — api520.js의 relieving
  // pressure(P1abs, sizing용)와는 다른 값이다. 배관 유속/밀도 계산은 밸브가
  // 막 열리는 시점(overpressure 이전) 기준 근사이므로 의도적으로 별개.
  const P1_abs = P1 + API_CONST.ATM_PRESSURE_BAR; // barg → bara 근사 (OP 미포함, 의도적)
  const rho = gasDensity(P1_abs, T, M); // kg/m³

  // ── 2. 유속 ──
  const W_kgs = W / 3600;               // kg/h → kg/s (이 파일 유일한 변환 지점)
  const A = Math.PI * (D * D) / 4;      // m²
  const v = A > 0 ? W_kgs / (rho * A) : 0; // m/s

  // ── 3. Choked flow 판정 ──
  // 임계압력비 = (2/(k+1))^(k/(k-1))
  const criticalRatio = Math.pow(2/(k+1), k/(k-1));
  const pressureRatio = headerPressure > 0 ? (headerPressure + API_CONST.ATM_PRESSURE_BAR) / P1_abs : 0;
  const choked = pressureRatio <= criticalRatio;

  // ── 4. 동적 배압 (Darcy-Weisbach + fittings + exit) ──
  const dynHead = rho * v * v / 2; // Pa 단위 동압
  const dP_pipe   = D > 0 ? BP_CONST.DARCY_F_DEFAULT * (L / D) * dynHead : 0;
  const dP_fit    = fittingsK * dynHead;
  const dP_exit   = BP_CONST.EXIT_K * dynHead;
  const p_dynamic_Pa = dP_pipe + dP_fit + dP_exit;
  const p_dynamic_bar = p_dynamic_Pa / 1e5;

  // ── 5. 정적 배압 (header/flare 압력) ──
  const p_static = headerPressure;

  // ── 6. 합산 + Kb ──
  const p_total = p_static + p_dynamic_bar;
  const kb = P1 > 0 ? Math.max(0, 1 - (p_total / P1) * 0.5) : 1.0;
  // 참고: 정밀 Kb 곡선은 API 520 Fig.31 실측 데이터 기반이며
  // 위 식은 P_total/P_set 비율에 대한 1차 근사. 정밀 설계는 제조사 곡선 사용 권장.

  const ratio = p_total / P1;
  let status, basis;
  if (ratio < 0.10) {
    status = "calculated";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 배압 영향 미미. 표준 스프링식 적용 가능.`;
  } else if (ratio < 0.30) {
    status = "calculated";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 동적+정적 배압 합산 결과. Kb 보정 적용됨 (Pipe ΔP=${(dP_pipe/1e5).toFixed(3)}bar, Fittings ΔP=${(dP_fit/1e5).toFixed(3)}bar, Exit ΔP=${(dP_exit/1e5).toFixed(3)}bar).`;
  } else {
    status = "out_of_range";
    basis = `P_total/P1 = ${(ratio*100).toFixed(1)}% — 스프링식 적용 범위(30%) 초과. 파일럿식 전환 또는 배관 재설계 검토 필요.`;
  }
  if (choked) {
    basis += ` [Choked flow 감지: 임계압력비 ${(criticalRatio*100).toFixed(1)}% 이하 — 음속 유동 구간]`;
  }

  return {
    valid: true,
    p_static:  Math.round(p_static  * 1000) / 1000,
    p_dynamic: Math.round(p_dynamic_bar * 1000) / 1000,
    p_total:   Math.round(p_total   * 1000) / 1000,
    kb:        Math.round(kb * 1000) / 1000,
    velocity:  Math.round(v * 100) / 100,
    choked,
    criticalRatio: Math.round(criticalRatio * 1000) / 1000,
    breakdown: {
      dP_pipe_bar:  Math.round(dP_pipe/1e5 * 1000) / 1000,
      dP_fit_bar:   Math.round(dP_fit/1e5  * 1000) / 1000,
      dP_exit_bar:  Math.round(dP_exit/1e5 * 1000) / 1000,
      rho_kgm3:     Math.round(rho * 100) / 100,
    },
    status,
    basis,
  };
}

function buildEvidence(sd) {

  return [
    {
      id:1, title:"유체 물성 확인",

      detail:`비열비 k=${fluid.k} 기준 임계압력비 = (2/(k+1))^(k/(k-1)) = ${fluid.criticalPressRatio.toFixed(4)}. 압축계수 Z=${fluid.Z}${fluid.Z===1 ? " (기본값, 이상기체 가정)" : " (사용자 입력값)"} — Case 소유 계산 조건, Asset 속성 아님.`,
      ok:true,
    },
    {
      id:2, title:"Relieving Pressure(절대압) 산정",
      formula:"P1(abs) = Pset × (1 + OP/100) + P(atm)",
      result:`P1abs = ${pressure.P1abs.toFixed(4)} bara`,
      detail:`설정압 Pset=${pressure.Pset} barg, Overpressure OP=${pressure.OP}% (설비대장 값), 대기압=${pressure.atm} bar. Case 입력값이 아니라 Asset(Equipment) 소유 필드에서 산정.`,

    },
    {
      id:3, title:"C 계수 계산 (API 520)",
      formula:`C = ${API_CONST.C_BASE} × √( k × (2/(k+1))^((k+1)/(k-1)) )`,
      result:`C = ${cCoeff.C.toFixed(2)}`,
      detail:`k=${cCoeff.k}일 때 API 520 기준 C계수 = ${cCoeff.C.toFixed(2)}. 이 값이 클수록 동일 면적에서 더 많은 유량 방출 가능.`,
      ok:true,
    },
    {
      id:4, title:"필요 오리피스 면적 (SI 단위)",

      result:`A_required = ${orifice.areaCm2.toFixed(4)} cm²`,
      detail:`W=${orifice.W} kg/h, P1abs=${orifice.P1abs.toFixed(3)} bara, Kd_eff=${orifice.KdEff.toFixed(3)}, Kb=${orifice.Kb}${orifice.isRD ? ` (럽처디스크 보정계수 ×${API_CONST.RD_KD_FACTOR} 적용)` : ""}`,

      detail:`여유율 = ${selection.margin.toFixed(3)}×${selection.selected.nonStandard ? " — 표준 규격 초과. 특수 제작 또는 병렬 설치 검토 필요." : ""}`,

      result:`P2/Pset = ${(backpress.ratio*100).toFixed(1)}% → ${backpress.ratio < backpress.limitSpring ? "스프링식 적합 ✓" : backpress.ratio < backpress.limitPilot ? "파일럿식 검토 필요 ⚠" : "초과 ✗"}`,

}


// ── snapshot/create.js ──────────────────────────
//  SNAPSHOT — Object.freeze, 불변
//  3-레이어 + assetRefs + workflowDecision trace
// ════════════════════════════════════════════════════════════════

function _hashResult(inputs, result) {
  const str = JSON.stringify({
    inputs, areaCm2: result.areaCm2, selected: result.selected?.letter
  });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function _assetHash(equipment, dischargeSystem) {
  const eq = equipment ? {
    tag: equipment.tag, mawp: equipment.mawp,
    setPressure: equipment.setPressure, orifice: equipment.orifice,
    deviceType: equipment.deviceType,
  } : null;
  const ds = dischargeSystem ? {
    name: dischargeSystem.name, L: dischargeSystem.L,
    D: dischargeSystem.D, fittingsK: dischargeSystem.fittingsK,
    headerPressure: dischargeSystem.headerPressure,
    destination: dischargeSystem.destination,
  } : null;
  const str = JSON.stringify({ eq, ds });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

const SNAPSHOT_ENGINE_VERSION = "1.3.0";

// Snapshot이 기록하는 trigger fields — 감사 시 "어떤 규칙으로 판단했는지" 재현용
const WORKFLOW_TRIGGER_FIELDS_SNAPSHOT = [
  "headerPressure","L","D","fittingsK","destination",
  "setPressure","mawp","orifice","deviceType",
];

function createSnapshot({ caseId, valveTag, deviceType, inputs, engineResult,
                          equipment, dischargeSystem, workflowDecision }) {
  if (ENGINE_VERSION !== SNAPSHOT_ENGINE_VERSION) {
    throw new Error(
      `INVALID_STATE: engine version mismatch. ` +
      `engine=${ENGINE_VERSION}, snapshot expects=${SNAPSHOT_ENGINE_VERSION}.`
    );
  }

  const resultHash       = _hashResult(inputs, engineResult);
  const assetFingerprint = _assetHash(equipment, dischargeSystem);
  // evaluatedAt은 Snapshot 생성 시점에서 결정 — Engine이 아닌 증거 패키지의 책임
  const evaluatedAt      = new Date().toISOString();

  // snapshotHash — Approval 서명 대상. Snapshot 핵심 내용의 fingerprint.
  // 승인 후 Snapshot 내용이 바뀌면 이 값과 달라져 서명 검증 실패 감지 가능.
  function _snapHash(id, rHash, aFP, ev, wfState) {
    const str = JSON.stringify({ id, result_hash:rHash, assetFingerprint:aFP,
                                  evaluatedAt:ev, workflow:wfState });
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31,h)+str.charCodeAt(i))|0;
    return (h>>>0).toString(16).padStart(8,'0');
  }

  const snap = {  // eslint-disable-line prefer-const
    id:             `SNAP-${caseId}-${Date.now()}`,
    createdAt:      evaluatedAt,
    caseId,
    valveTag,
    deviceType,
    engine_version: ENGINE_VERSION,
    result_hash:    resultHash,

    // MOC 감지용 — 검토 시점 Asset 식별자 + Revision
    assetRefs: Object.freeze({
      equipmentId:         equipment?.id        || null,
      equipmentTag:        equipment?.tag        || null,
      equipmentRevision:   equipment?.revision   ?? null,
      dischargeSystemId:   dischargeSystem?.id   || null,
      dischargeSystemName: dischargeSystem?.name || null,
      dischargeRevision:   dischargeSystem?.revision ?? null,
      assetFingerprint,
    }),

    // Workflow 결정 trace — 감사 시 재현 가능한 불변 기록
    // Engine이 결정한 값 그대로. UI가 수정 불가.
    workflowDecision: workflowDecision ? Object.freeze({
      state:         workflowDecision.state,
      evaluatedAt,                             // Snapshot 생성 시점 — 증거 패키지 책임
      engineVersion: workflowDecision.engineVersion || ENGINE_VERSION,
      reasons:       Object.freeze([...(workflowDecision.reasons || [])]),
      triggerFields: Object.freeze([...WORKFLOW_TRIGGER_FIELDS_SNAPSHOT]),
    }) : null,

    // 3-레이어 불변 복사본
    equipment:       equipment       ? Object.freeze({ ...equipment })       : null,
    dischargeSystem: dischargeSystem ? Object.freeze({ ...dischargeSystem }) : null,
    inputs:          Object.freeze({ ...inputs }),
    result:          Object.freeze({ ...engineResult }),
    evidence:        Object.freeze(buildEvidence(engineResult.stepData)),
    workflow:        workflowDecision?.state || "INSPECTION",
  };
  // snapshotHash는 id/result_hash/assetFingerprint/evaluatedAt/workflow가 확정된 후 계산
  const snapshotHash = _snapHash(
    snap.id, snap.result_hash, snap.assetRefs.assetFingerprint,
    snap.evaluatedAt, snap.workflow
  );
  // Object.freeze 전에 snapshotHash 주입
  snap.snapshotHash = snapshotHash;
  return Object.freeze(snap);
}

// detectMOC → engine/workflow_engine.js 로 이동
// Snapshot은 데이터 저장만 담당. 상태 판정은 Engine 책임.


// ── engine/workflow_engine.js ──────────────────────────
//  WORKFLOW ENGINE (pure, stateless)
//  결정 계층:
//    detectMOC()          — Fact    : 무엇이 바뀌었나
//    evaluateSafetyImpact() — Analysis: 안전성에 영향을 주는가
//    computeWorkflowState() — Policy  : 최종 workflow 상태 결정
//
//  계약:
//    detectMOC()가 반환한 diff 객체는 이후 함수에서 재조립 금지.
//    { field, from, to, unit } 그대로 전달.
// ════════════════════════════════════════════════════════════════

// ── _wfAssetHash (내부 전용) ──────────────────────────────────
function _wfAssetHash(equipment, dischargeSystem) {
  const eq = equipment ? {
    tag: equipment.tag, mawp: equipment.mawp,
    setPressure: equipment.setPressure, overpressure: equipment.overpressure,
    orifice: equipment.orifice, deviceType: equipment.deviceType,
  } : null;
  const ds = dischargeSystem ? {
    name: dischargeSystem.name, L: dischargeSystem.L,
    D: dischargeSystem.D, fittingsK: dischargeSystem.fittingsK,
    headerPressure: dischargeSystem.headerPressure,
    destination: dischargeSystem.destination,
  } : null;
  const str = JSON.stringify({ eq, ds });
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

// ── LAYER 1: detectMOC — Fact ─────────────────────────────────
// 반환값 스키마 (불변 계약):
//   { changed: boolean, diffs: Array<{ field, from, to, unit }> }
// 이 스키마를 변경하면 MOC_SCHEMA_001 contract test가 실패한다.
function detectMOC(snap, currentEquipment, currentDischargeSystem) {
  if (!snap?.assetRefs) return { changed: false, diffs: [] };

  const currentFP = _wfAssetHash(currentEquipment, currentDischargeSystem);
  if (currentFP === snap.assetRefs.assetFingerprint) {
    return { changed: false, diffs: [] };
  }

  const diffs = [];
  const eq  = snap.equipment;
  const ds  = snap.dischargeSystem;
  const ceq = currentEquipment;
  const cds = currentDischargeSystem;

  if (eq && ceq) {
    if (eq.mawp        !== ceq.mawp)        diffs.push({ field:"mawp",        from:eq.mawp,        to:ceq.mawp,        unit:"barg" });
    if (eq.setPressure !== ceq.setPressure) diffs.push({ field:"setPressure", from:eq.setPressure, to:ceq.setPressure, unit:"barg" });
    if (eq.overpressure !== ceq.overpressure) diffs.push({ field:"overpressure", from:eq.overpressure, to:ceq.overpressure, unit:"%" });
    if (eq.orifice     !== ceq.orifice)     diffs.push({ field:"orifice",     from:eq.orifice,     to:ceq.orifice,     unit:"" });
    if (eq.deviceType  !== ceq.deviceType)  diffs.push({ field:"deviceType",  from:eq.deviceType,  to:ceq.deviceType,  unit:"" });
  }
  if (ds && cds) {
    if (ds.headerPressure !== cds.headerPressure) diffs.push({ field:"headerPressure", from:ds.headerPressure, to:cds.headerPressure, unit:"barg" });
    if (ds.L              !== cds.L)              diffs.push({ field:"L",              from:ds.L,              to:cds.L,              unit:"m" });
    if (ds.D              !== cds.D)              diffs.push({ field:"D",              from:ds.D,              to:cds.D,              unit:"m" });
    if (ds.fittingsK      !== cds.fittingsK)      diffs.push({ field:"fittingsK",      from:ds.fittingsK,      to:cds.fittingsK,      unit:"" });
    if (ds.destination    !== cds.destination)    diffs.push({ field:"destination",    from:ds.destination,    to:cds.destination,    unit:"" });
  }

  return { changed: diffs.length > 0, diffs };
}

// ── LAYER 2: evaluateSafetyImpact — Analysis ─────────────────
// detectMOC()의 diffs를 받아 안전성 영향 여부를 평가.
// diff 객체를 재조립하지 않고 그대로 사용.
// 반환값: { requiresReview: boolean, triggerDiffs: diff[] }
const WORKFLOW_TRIGGER_FIELDS = [
  "headerPressure", "L", "D", "fittingsK", "destination",
  "setPressure", "mawp", "overpressure", "orifice", "deviceType",
];

function evaluateSafetyImpact(diffs) {
  if (!diffs || diffs.length === 0) {
    return { requiresReview: false, triggerDiffs: [] };
  }
  // diff 객체 재조립 금지 — 원본 참조만 전달
  const triggerDiffs = diffs.filter(d => WORKFLOW_TRIGGER_FIELDS.includes(d.field));
  return {
    requiresReview: triggerDiffs.length > 0,
    triggerDiffs,   // detectMOC()가 만든 객체 그대로
  };
}

// ── LAYER 3: computeWorkflowState — Policy ───────────────────
// 최종 workflow 상태 결정. diff 객체를 생성하지 않음.
// detectMOC() → evaluateSafetyImpact() 결과만 사용.
//
// 반환값:
//   {
//     state: string,
//     reasons: diff[],      — detectMOC 원본 참조 (재조립 없음)
//     evaluatedAt: string,  — ISO timestamp
//     engineVersion: string,
//   }
// Engine은 결정만 반환. 시간(evaluatedAt)은 Snapshot 생성 시점에서 추가.
// 반환값에 evaluatedAt 없음 — createSnapshot()이 증거 패키지로 조립.
function computeWorkflowState(previousSnapshot, currentEquipment, currentDischargeSystem) {

  // Policy 1: 최초 검토
  if (!previousSnapshot) {
    return { state:"DRAFT", reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Policy 2: APPROVED / CLOSED — Engine이 바꾸지 않음
  if (["APPROVED","CLOSED"].includes(previousSnapshot.workflow)) {
    return { state:previousSnapshot.workflow, reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Fact: 무엇이 바뀌었나
  const mocResult = detectMOC(previousSnapshot, currentEquipment, currentDischargeSystem);

  if (!mocResult.changed) {
    return { state:previousSnapshot.workflow, reasons:[], engineVersion:ENGINE_VERSION };
  }

  // Analysis: 안전성에 영향을 주는가
  const impact = evaluateSafetyImpact(mocResult.diffs);

  // Policy 3: 계산 영향 변경 → REVIEW_REQUIRED
  if (impact.requiresReview) {
    return {
      state:         "REVIEW_REQUIRED",
      reasons:       impact.triggerDiffs,
      engineVersion: ENGINE_VERSION,
    };
  }

  // Policy 4: 비계산 변경 → INSPECTION (재확인 필요)
  return {
    state:         "INSPECTION",
    reasons:       mocResult.diffs,
    engineVersion: ENGINE_VERSION,
  };
}

// Review Trigger 판정 → engine/workflow_engine.js 로 이동
// WORKFLOW_TRIGGER_FIELDS + computeWorkflowState() 참조
// workflow/index.js는 상태 정의(레이블/색상/전환)만 담당


// ── approval/crypto.js ──────────────────────────
//  APPROVAL CRYPTO
//  전자서명 — Web Crypto API(SubtleCrypto) 기반 SHA-256.
//  이 파일은 순수 서명/검증 계산만 담당한다.
//  누가 승인할 수 있는지, 중복 승인인지 같은 정책은 service.js/validator.js가 처리.
//
//  계약:
//    CRYPTO-001: canonicalPayload()는 필드 순서·구분자가 고정된다.
//                순서가 바뀌면 내용이 같아도 다른 서명이 나온다.
//    CRYPTO-002: signApproval() / verifySignature()는 async다.
//                Web Crypto API(subtle.digest)는 Promise 기반이라 동기화 불가.
//    CRYPTO-003: 서명 대상은 snapshotHash + decision + comment + signer +
//                timestamp + workflowState 전부. comment도 서명 대상이다 —
//                승인/반려 사유는 의견이 아니라 판단 근거이며 PSM 감사에서
//                증거로 취급된다.
// ════════════════════════════════════════════════════════════════

// ── canonicalPayload ───────────────────────────────────────────
// 서명 생성과 검증 양쪽에서 반드시 이 함수만 사용해야 한다.
// NUL(\u0000) 구분자 사용 — 필드 값 안에 나타날 가능성이 사실상 없어
// "ab"+"c" 와 "a"+"bc" 같은 concatenation ambiguity를 막는다.
function canonicalPayload(record) {
  return [
    record.snapshotHash  || "",
    record.decision      || "",
    record.comment       || "",
    record.signer        || "",
    record.timestamp     || "",
    record.workflowState || "",
  ].join("\u0000");
}

// ── sha256Hex ──────────────────────────────────────────────────
async function sha256Hex(message) {
  const data   = new TextEncoder().encode(message);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

// ── signApproval ───────────────────────────────────────────────
// record: { snapshotHash, decision, comment, signer, timestamp, workflowState }
// 반환: signature (hex string, 64자)
async function signApproval(record) {
  return sha256Hex(canonicalPayload(record));
}

// ── verifySignature ────────────────────────────────────────────
// record.signature가 나머지 필드로부터 재계산한 값과 일치하는지 확인.
// 필드 하나라도 서명 이후 바뀌면 불일치 — 즉 위변조 탐지.
async function verifySignature(record) {
  if (!record || !record.signature) {
    return { valid: false, reason: "CRYPTO-002: signature missing" };
  }
  const recomputed = await signApproval(record);
  if (recomputed !== record.signature) {
    return {
      valid: false,
      reason: "CRYPTO-003: signature mismatch — record fields altered after signing",
      expected:   record.signature,
      recomputed,
    };
  }
  return { valid: true };
}


// ── approval/record.js ──────────────────────────
//  APPROVAL RECORD
//  Snapshot = 영구 불변 (서명 대상)
//  ApprovalRecord = Snapshot에 대한 별도 증명 (Snapshot을 수정하지 않음)
//
//  계약:
//    APPROVAL-001: snapshotHash 없으면 생성 불가
//    APPROVAL-002: 승인 후 Snapshot 변경 시 검증 실패
//    APPROVAL-003: 재승인은 이전 기록을 덮어쓰지 않고 별도 이력으로 남음
// ════════════════════════════════════════════════════════════════

const APPROVAL_ROLES = ["engineer", "senior_engineer", "safety_manager", "pss_manager"];

// ── validateApprovalInput ─────────────────────────────────────
function validateApprovalInput(input) {
  // APPROVAL-001: snapshotHash 필수
  if (!input.snapshotHash || !input.snapshotHash.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "snapshotHash is required — cannot approve without a snapshot hash" };
  }
  if (!input.snapshotId || !input.snapshotId.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "snapshotId is required" };
  }
  if (!input.approver || !input.approver.trim()) {
    return { ok: false, contract: "APPROVAL-001",
             reason: "approver name is required" };
  }
  if (!APPROVAL_ROLES.includes(input.role)) {
    return { ok: false, contract: "APPROVAL-001",
             reason: `role must be one of: ${APPROVAL_ROLES.join(", ")}` };
  }
  return { ok: true };
}

// ── createApprovalRecord ──────────────────────────────────────
// Snapshot을 수정하지 않음 — snapshotHash로 참조만 함
// approvedAt: 선택적 주입. service.js가 서명 대상 timestamp와 동일한 값을
// 넘겨서 "record 저장 시각"과 "서명된 시각"이 어긋나지 않도록 한다.
// 넘기지 않으면(기존 호출 호환) 이 함수가 직접 생성한다.
function createApprovalRecord(input) {
  const valid = validateApprovalInput(input);
  if (!valid.ok) {
    throw new Error(`${valid.contract}: ${valid.reason}`);
  }

  return Object.freeze({
    approvalId:    `APPR-${input.snapshotId}-${Date.now()}`,
    snapshotId:    input.snapshotId,
    snapshotHash:  input.snapshotHash,   // 서명 대상 fingerprint
    approver:      input.approver.trim(),
    role:          input.role,
    approvedAt:    input.approvedAt || new Date().toISOString(),
    comment:       input.comment || "",
    // APPROVAL-003: 재승인은 별도 approvalId로 생성 (덮어쓰기 없음)
    // 호출자는 이 record를 기존 배열에 push — replace 금지
  });
}

// ── verifyApproval ────────────────────────────────────────────
// APPROVAL-002: Snapshot의 현재 snapshotHash와 ApprovalRecord의 snapshotHash 비교
// 일치하지 않으면 승인 이후 Snapshot이 변경된 것
function verifyApproval(approvalRecord, currentSnapshot) {
  if (!approvalRecord || !currentSnapshot) {
    return { valid: false, reason: "approvalRecord or snapshot is null" };
  }
  if (approvalRecord.snapshotId !== currentSnapshot.id) {
    return { valid: false, reason: "snapshotId mismatch — wrong snapshot" };
  }
  if (approvalRecord.snapshotHash !== currentSnapshot.snapshotHash) {
    return {
      valid:  false,
      reason: "APPROVAL-002: snapshotHash mismatch — Snapshot was modified after approval",
      approvedHash: approvalRecord.snapshotHash,
      currentHash:  currentSnapshot.snapshotHash,
    };
  }
  return { valid: true, approver: approvalRecord.approver, approvedAt: approvalRecord.approvedAt };
}

// ── ApprovalHistory ───────────────────────────────────────────
// APPROVAL-003: 재승인은 push — replace 금지
// 단순 배열 헬퍼. 상태 없음.
function addApprovalRecord(history, newRecord) {
  // history는 배열. 새 record를 추가한 새 배열 반환 (mutation 없음).
  return Object.freeze([...history, newRecord]);
}

function getLatestApproval(history) {
  if (!history || history.length === 0) return null;
  return history[history.length - 1];
}


// ── approval/service.js ──────────────────────────
//  APPROVAL SERVICE
//  ApprovalForm(추후 구현)이 호출하는 유일한 진입점.
//  UI는 hash 계산도, 서명 검증도, workflow 판단도 하지 않는다 — 여기서 전부 처리.
//
//  계약:
//    SERVICE-001: idempotencyKey = SHA256(snapshotHash + signer) 기준으로
//                 동일 (snapshot version, signer) 조합의 중복 서명을 차단한다.
//    SERVICE-002: submitApproval()은 서명까지 완료된 ApprovalRecord만
//                 history에 추가한다 — 미서명 record는 존재할 수 없다.
//    SERVICE-003: Snapshot은 이 파일에서 절대 생성/수정하지 않는다 (읽기 전용).
//                 timestamp는 이 함수가 1회만 생성해 approvedAt과 서명 대상
//                 timestamp 양쪽에 동일하게 사용한다 (두 번 호출 시 값이
//                 어긋날 수 있으므로 반드시 단일 지점에서 생성).
// ════════════════════════════════════════════════════════════════

// ── computeIdempotencyKey ───────────────────────────────────────
async function computeIdempotencyKey(snapshotHash, signer) {
  return sha256Hex(`${snapshotHash}\u0000${signer}`);
}

// ── isDuplicateApproval ──────────────────────────────────────────
// SERVICE-001: 같은 (snapshotHash, signer) 조합으로 이미 서명한 기록이 있는지
async function isDuplicateApproval(history, snapshotHash, signer) {
  const key = await computeIdempotencyKey(snapshotHash, signer);
  for (const rec of (history || [])) {
    if (rec.idempotencyKey === key) return true;
  }
  return false;
}

// ── submitApproval ─────────────────────────────────────────────
// input:   { snapshot, decision, comment, signer, role }
// history: 이 case에 쌓인 기존 ApprovalRecord[] (없으면 [])
// 반환:    성공 { ok:true, record, history }
//          실패 { ok:false, contract, reason }
async function submitApproval(input, history) {
  const { snapshot, decision, comment, signer, role } = input;

  if (!snapshot || !snapshot.snapshotHash) {
    return { ok: false, contract: "APPROVAL-001", reason: "snapshot(with snapshotHash) is required" };
  }

  // SERVICE-003: 단일 timestamp — approvedAt과 서명 대상에 동일하게 사용
  const now = new Date().toISOString();

  const dup = await isDuplicateApproval(history, snapshot.snapshotHash, signer);
  if (dup) {
    return {
      ok: false, contract: "SERVICE-001",
      reason: "duplicate approval — this signer already signed this snapshot version",
    };
  }

  let base;
  try {
    base = createApprovalRecord({
      snapshotId:   snapshot.id,
      snapshotHash: snapshot.snapshotHash,
      approver:     signer,
      role,
      comment,
      approvedAt:   now,
    });
  } catch (e) {
    return { ok: false, contract: "APPROVAL-001", reason: e.message };
  }

  const signPayload = {
    snapshotHash:  base.snapshotHash,
    decision,
    comment:       base.comment,
    signer:        base.approver,
    timestamp:     base.approvedAt,   // base와 동일 값 재사용 — 두 번째 Date() 없음
    workflowState: snapshot.workflow,
  };
  const signature      = await signApproval(signPayload);
  const idempotencyKey = await computeIdempotencyKey(base.snapshotHash, base.approver);

  const record = Object.freeze({
    ...base,
    decision,
    workflowState: snapshot.workflow,
    signature,
    idempotencyKey,
  });

  return { ok: true, record, history: addApprovalRecord(history || [], record) };
}


// ── sim/step.js ──────────────────────────
//  SIMULATION (시간 전용 — 계산 없음)
// ════════════════════════════════════════════════════════════════
function stepSim(prev, setPoint, mawp) {
  let { pressure, direction } = prev;
  const speed = pressure >= setPoint ? API_CONST.SIM_SPEED_RELIEF : API_CONST.SIM_SPEED_NORMAL;
  pressure += direction * speed;
  if (pressure >= mawp * API_CONST.SIM_MAWP_FACTOR) direction = -1;
  if (pressure <= 0.3) direction = 1;
  return {
    ...prev,
    pressure: Math.max(0, pressure),
    direction,
    valveOpen: pressure >= setPoint,
    ratio: Math.min(pressure / (mawp * API_CONST.SIM_MAWP_FACTOR), 1),
  };
}


// ── asset/schema.js ──────────────────────────
//  PSV ASSET SCHEMA v2
//  Equipment = 밸브 자체 (거의 불변, 교체/MOC 시 변경)
//  DischargeSystem = 배출계통 (배관 개조 MOC 시 변경, 복수 PSV 공유 가능)
// ════════════════════════════════════════════════════════════════

// ── PSVEquipment ─────────────────────────────────────────────
function validateEquipment(eq) {
  if (!eq.tag || !eq.tag.trim())
    return { ok:false, field:"tag", reason:"required" };
  if (!eq.mawp || Number(eq.mawp) <= 0)
    return { ok:false, field:"mawp", reason:"must_be_positive" };
  if (!eq.setPressure || Number(eq.setPressure) <= 0)
    return { ok:false, field:"setPressure", reason:"must_be_positive" };
  if (Number(eq.setPressure) > Number(eq.mawp))
    return { ok:false, field:"setPressure", reason:"exceeds_mawp" };
  // PRESSURE-001: overpressure는 relieving pressure(절대압) 산정에 쓰이는
  // Design Basis — Case가 아니라 Asset(Equipment)이 소유. 계산 신뢰성
  // 계약이므로 누락/음수를 허용하지 않는다.
  if (eq.overpressure === undefined || eq.overpressure === null || isNaN(Number(eq.overpressure)))
    return { ok:false, field:"overpressure", reason:"required" };
  if (Number(eq.overpressure) < 0)
    return { ok:false, field:"overpressure", reason:"must_be_non_negative" };
  return { ok:true };
}

function createEquipment(fields) {
  const valid = validateEquipment(fields);
  if (!valid.ok) throw new Error(`EQUIPMENT_INVALID: ${valid.field} — ${valid.reason}`);
  return Object.freeze({
    id:           `EQ-${fields.tag.replace(/[^A-Z0-9]/gi,"").toUpperCase()}-${Date.now()}`,
    tag:          fields.tag.trim(),
    revision:     Number(fields.revision ?? 1),
    mocId:        fields.mocId || null,
    location:     fields.location || "",
    manufacturer: fields.manufacturer || "",
    model:        fields.model || "",
    serialNo:     fields.serialNo || "",
    deviceType:   fields.deviceType || "safetyValve",
    mawp:         Number(fields.mawp),
    setPressure:  Number(fields.setPressure),
    overpressure: Number(fields.overpressure),
    orifice:      fields.orifice || "",
    inletSize:    fields.inletSize || "",
    outletSize:   fields.outletSize || "",
    installedAt:  fields.installedAt || "",
    registeredAt: new Date().toISOString(),
  });
}

// ── reviseEquipment ────────────────────────────────────────────
// EQUIPMENT-MOC-001/002: reviseDischargeSystem과 동일한 계약.
// mocId 없이는 개정 불가, id는 유지, revision만 증가.
function reviseEquipment(existing, fields) {
  if (!fields.mocId || !fields.mocId.trim()) {
    return { ok:false, field:"mocId", reason:"required_for_revision" };
  }
  const merged = { ...existing, ...fields, id: existing.id };
  const valid = validateEquipment(merged);
  if (!valid.ok) return valid;

  return {
    ok: true,
    equipment: Object.freeze({
      ...existing,
      ...fields,
      id:           existing.id,               // identity 유지
      revision:     Number(existing.revision) + 1,
      mocId:        fields.mocId.trim(),
      mawp:         Number(fields.mawp),
      setPressure:  Number(fields.setPressure),
      overpressure: Number(fields.overpressure),
      registeredAt: existing.registeredAt,     // 최초 등록일 유지
      revisedAt:    new Date().toISOString(),
    }),
  };
}

// ── DischargeSystem ──────────────────────────────────────────
// 하나의 배출계통을 여러 PSV가 공유할 수 있음 (connectedTags)
function validateDischargeSystem(ds) {
  if (!ds.name || !ds.name.trim())
    return { ok:false, field:"name", reason:"required" };
  if (!ds.D || Number(ds.D) <= 0)
    return { ok:false, field:"D", reason:"must_be_positive" };
  if (Number(ds.L) < 0)
    return { ok:false, field:"L", reason:"must_be_non_negative" };
  const validDest = ["flare","atm","closed"];
  if (!validDest.includes(ds.destination))
    return { ok:false, field:"destination", reason:"must_be_flare_atm_closed" };
  return { ok:true };
}

function createDischargeSystem(fields) {
  const valid = validateDischargeSystem(fields);
  if (!valid.ok) throw new Error(`DISCHARGE_INVALID: ${valid.field} — ${valid.reason}`);
  return Object.freeze({
    id:              `DS-${fields.name.replace(/[^A-Z0-9]/gi,"").toUpperCase()}-${Date.now()}`,
    name:            fields.name.trim(),
    revision:        Number(fields.revision ?? 1),
    mocId:           fields.mocId || null,
    destination:     fields.destination,
    L:               Number(fields.L ?? 15),
    D:               Number(fields.D),
    fittingsK:       Number(fields.fittingsK ?? 3.0),
    headerPressure:  Number(fields.headerPressure ?? 0.3),
    connectedTags:   Array.isArray(fields.connectedTags) ? [...fields.connectedTags] : [],
    registeredAt:    new Date().toISOString(),
  });
}

// ── reviseDischargeSystem ─────────────────────────────────────
// GEOMETRY-002: 개정은 새 엔티티가 아니라 같은 id의 새 revision.
// mocId 없이는 개정 불가 — "배관을 왜 바꿨는지" 근거 없는 변경 차단.
function reviseDischargeSystem(existing, fields) {
  if (!fields.mocId || !fields.mocId.trim()) {
    return { ok:false, field:"mocId", reason:"required_for_revision" };
  }
  const merged = { ...existing, ...fields, id: existing.id };
  const valid = validateDischargeSystem(merged);
  if (!valid.ok) return valid;

  return {
    ok: true,
    dischargeSystem: Object.freeze({
      ...existing,
      ...fields,
      id:            existing.id,              // identity 유지 — case 연결 안 끊김
      revision:      Number(existing.revision) + 1,
      mocId:         fields.mocId.trim(),
      L:             Number(fields.L),
      D:             Number(fields.D),
      fittingsK:     Number(fields.fittingsK),
      headerPressure:Number(fields.headerPressure),
      connectedTags: Array.isArray(fields.connectedTags) ? [...fields.connectedTags] : existing.connectedTags,
      registeredAt:  existing.registeredAt,     // 최초 등록일 유지
      revisedAt:     new Date().toISOString(),
    }),
  };
}

// ── case/history.js ──────────────────────────
//  CASE SNAPSHOT HISTORY
//  case.snapshotHistory[] = source of truth (append-only)
//  case.latestSnap        = UI 편의용 pointer (검증에 사용 금지)
//
//  계약:
//    HISTORY-001: appendSnapshot()은 항상 새 배열을 반환한다.
//                 기존 history 항목은 교체·삭제되지 않는다.
//    HISTORY-002: resolveSnapshot(hash)은 snapshotHistory에서만 조회한다.
//                 latestSnap을 신뢰 기준으로 사용하지 않는다.
//    HISTORY-003: 같은 case 안에서 snapshotHash가 중복되면 안 된다.
//                 (중복 시 Approval이 어떤 버전을 서명했는지 특정할 수 없다.)
// ════════════════════════════════════════════════════════════════

// ── appendSnapshot ─────────────────────────────────────────────
// caseObj를 직접 수정하지 않고 새 caseObj를 반환.
// snap은 이미 Object.freeze()된 Snapshot이어야 한다 (createSnapshot()의 결과).
function appendSnapshot(caseObj, snap) {
  const prevHistory = caseObj.snapshotHistory || [];
  const nextHistory = Object.freeze([...prevHistory, snap]);
  return {
    ...caseObj,
    snapshotHistory: nextHistory,
    latestSnap:      snap,        // pointer only — 표시 편의용
    workflow:        snap.workflow,
  };
}

// ── resolveSnapshot ────────────────────────────────────────────
// snapshotHash로 특정 Snapshot을 조회. latestSnap은 절대 참조하지 않음.
// Approval 검증은 반드시 이 함수를 통해서만 Snapshot을 가져와야 한다.
function resolveSnapshot(caseObj, snapshotHash) {
  if (!caseObj?.snapshotHistory || !snapshotHash) return null;
  return caseObj.snapshotHistory.find(s => s.snapshotHash === snapshotHash) || null;
}

// ── getLatestSnapshot ──────────────────────────────────────────
// latestSnap 포인터 대신 history의 마지막 항목을 기준으로 계산.
// pointer와 history가 어긋나는 경우(향후 버그) 이 함수가 진짜 값을 반환한다.
function getLatestSnapshot(caseObj) {
  const h = caseObj?.snapshotHistory;
  if (!h || h.length === 0) return null;
  return h[h.length - 1];
}

// ── hasDuplicateHash ───────────────────────────────────────────
// HISTORY-003 검증용. 같은 hash가 두 번 이상 나오면 true.
function hasDuplicateHash(caseObj) {
  const h = caseObj?.snapshotHistory || [];
  const hashes = h.map(s => s.snapshotHash);
  return new Set(hashes).size !== hashes.length;
}


// ── approval/validator.js ──────────────────────────
//  APPROVAL VALIDATOR
//  Report/승인 화면이 ApprovalRecord의 신뢰성을 확인할 때 호출하는 유일한 진입점.
//  서명 재계산은 crypto.js에, Snapshot 조회는 case/history.js에 위임한다 —
//  이 파일은 그 결과를 조합해 최종 valid/invalid만 판정한다.
//
//  계약:
//    VALIDATOR-001: record.signature가 record 필드로부터 재계산한 값과
//                   일치해야 한다 (위변조 탐지).
//    VALIDATOR-002: record.snapshotHash가 case.snapshotHistory에 실존해야
//                   한다. resolveSnapshot 실패 = 존재한 적 없는 버전에 대한
//                   서명 — 즉 승인 대상 자체가 위조되었다는 뜻.
//    VALIDATOR-003: 전체 승인 이력 안에 동일 idempotencyKey가 2회 이상
//                   나오면 invalid (SERVICE-001을 우회해 만들어진 기록).
// ════════════════════════════════════════════════════════════════

async function verifyApprovalRecord(record, caseObj, allApprovals) {
  if (!record) return { valid: false, reason: "record is null" };

  // VALIDATOR-001: 서명 재계산 (crypto.js에 위임)
  const sigCheck = await verifySignature({
    snapshotHash:  record.snapshotHash,
    decision:      record.decision,
    comment:       record.comment,
    signer:        record.approver,
    timestamp:     record.approvedAt,
    workflowState: record.workflowState,
    signature:     record.signature,
  });
  if (!sigCheck.valid) {
    return { valid: false, contract: "VALIDATOR-001", ...sigCheck };
  }

  // VALIDATOR-002: 서명 대상 Snapshot이 실제로 history에 존재하는지
  // (UI pointer가 아니라 resolveSnapshot으로만 조회 — HISTORY-002 준수)
  const targetSnap = resolveSnapshot(caseObj, record.snapshotHash);
  if (!targetSnap) {
    return {
      valid: false, contract: "VALIDATOR-002",
      reason: "snapshotHash not found in case.snapshotHistory",
    };
  }

  // 기존 APPROVAL-002 검증 재사용 (snapshotId 교차 확인)
  const baseCheck = verifyApproval(record, targetSnap);
  if (!baseCheck.valid) {
    return { valid: false, contract: "APPROVAL-002", ...baseCheck };
  }

  // VALIDATOR-003: idempotency 중복 검사
  const dupCount = (allApprovals || [])
    .filter(r => r.idempotencyKey === record.idempotencyKey).length;
  if (dupCount > 1) {
    return {
      valid: false, contract: "VALIDATOR-003",
      reason: "duplicate idempotencyKey found in approval history",
    };
  }

  return {
    valid: true,
    approver: record.approver,
    approvedAt: record.approvedAt,
    snapshotWorkflow: targetSnap.workflow,
  };
}


// ── report/schema.js ──────────────────────────
//  REPORT PACKAGE SCHEMA
//  Snapshot을 최종 출력(PDF/HTML/JSON)과 분리시키는 계약 레이어.
//  이 파일은 "형태가 맞는지"만 검증한다 — 계산도, Asset 재조회도, Approval
//  재판단도 하지 않는다. buildReportPackage()가 만든 결과를 사후 점검할 때만 쓴다.
//
//  계약:
//    REPORT-PKG-002: ReportPackage는 생성 이후 절대 수정되지 않는다(freeze).
// ════════════════════════════════════════════════════════════════

const REPORT_PACKAGE_VERSION = "1.0.0";

const REPORT_PACKAGE_REQUIRED_KEYS = [
  "meta", "identity", "asset", "calculation", "workflow", "approvals",
];

// ── validateReportPackage ──────────────────────────────────────
// 순수 형태 검증. true/false 판단 로직(계산)이 전혀 없다 — 키 존재 확인뿐.
function validateReportPackage(pkg) {
  if (!pkg || typeof pkg !== "object") {
    return { ok: false, reason: "package is not an object" };
  }
  const missing = REPORT_PACKAGE_REQUIRED_KEYS.filter(k => !(k in pkg));
  if (missing.length > 0) {
    return { ok: false, reason: `missing keys: ${missing.join(", ")}` };
  }
  if (pkg.meta.packageVersion !== REPORT_PACKAGE_VERSION) {
    return { ok: false, reason: `unsupported packageVersion: ${pkg.meta.packageVersion}` };
  }
  if (!pkg.identity.snapshotHash) {
    return { ok: false, reason: "identity.snapshotHash missing — package has no signable identity" };
  }
  return { ok: true };
}


// ── report/createPackage.js ──────────────────────────
//  REPORT PACKAGE — Snapshot → 불변 export 모델
//  PDF/HTML/JSON은 전부 이 결과물을 그대로 출력만 한다. 렌더러가 UI 구조에
//  결합되지 않도록 하는 게 이 파일의 유일한 목적.
//
//  계약:
//    REPORT-PKG-001: 같은 snapshot(+같은 generatedAt) → 항상 같은 package.
//                    (generatedAt은 "패키지를 만든 시각"이라 순수함수가 직접
//                    생성하면 결정론이 깨진다 — 호출자가 주입, 기본값은 폴백일 뿐)
//    REPORT-PKG-002: 결과는 Object.freeze — 이후 어떤 필드도 수정 불가.
//    REPORT-PKG-003: snapshot 하나만 받는다. currentEquipment/currentDischargeSystem/
//                    equipments/dischargeSystems 같은 "현재 Asset" 인자는 받지 않는다.
//                    Asset은 반드시 snapshot에 이미 박제된 값(assetRefs, snapshot.equipment,
//                    snapshot.dischargeSystem)에서만 읽는다.
//    REPORT-PKG-004: approvals는 snapshotHash가 일치하는 것만 포함한다.
//    REPORT-PKG-005: computeBackpressure/calculateKb/detectMOC 등 계산 함수를
//                    이 파일에서 호출하지 않는다 — snapshot.result를 그대로 옮길 뿐.
// ════════════════════════════════════════════════════════════════

// ── buildReportPackage ──────────────────────────────────────────
// snapshot:        createSnapshot()이 만든 frozen Snapshot (필수)
// opts.approvalRecords:          이 case의 ApprovalRecord[] (없으면 [])
// opts.approvalVerificationResults: { [approvalId]: {valid, ...} } —
//                  validator.js(verifyApprovalRecord)가 미리 계산해 넘긴 결과.
//                  이 함수는 절대 재검증하지 않는다.
// opts.generatedAt: 패키지 생성 시각 문자열(ISO). 안 주면 이 함수가 생성 —
//                  결정론 테스트에서는 반드시 명시적으로 넘겨야 한다.
function buildReportPackage(snapshot, opts) {
  if (!snapshot || !snapshot.snapshotHash) {
    return { ok: false, reason: "REPORT-PKG: snapshot(with snapshotHash) is required" };
  }
  const { approvalRecords, approvalVerificationResults, generatedAt } = opts || {};
  const genAt = generatedAt || new Date().toISOString();

  const matchedApprovals = (approvalRecords || [])
    .filter(a => a.snapshotHash === snapshot.snapshotHash)
    .map(a => Object.freeze({
      approvalId:  a.approvalId,
      signer:      a.approver,
      role:        a.role,
      approvedAt:  a.approvedAt,
      decision:    a.decision,
      comment:     a.comment,
      signature:   a.signature,
      verified:    (approvalVerificationResults || {})[a.approvalId]?.valid ?? null,
    }));

  const pkg = {
    meta: Object.freeze({
      packageVersion: REPORT_PACKAGE_VERSION,
      generatedAt:    genAt,
      engineVersion:  snapshot.engine_version,
    }),

    identity: Object.freeze({
      caseId:       snapshot.caseId,
      snapshotId:   snapshot.id,
      snapshotHash: snapshot.snapshotHash,
    }),

    asset: Object.freeze({
      equipment: Object.freeze({
        id:       snapshot.assetRefs.equipmentId,
        tag:      snapshot.assetRefs.equipmentTag,
        revision: snapshot.assetRefs.equipmentRevision,
        mocId:    snapshot.equipment?.mocId ?? null,
      }),
      dischargeSystem: Object.freeze({
        id:       snapshot.assetRefs.dischargeSystemId,
        name:     snapshot.assetRefs.dischargeSystemName,
        revision: snapshot.assetRefs.dischargeRevision,
        mocId:    snapshot.dischargeSystem?.mocId ?? null,
        // Backpressure Basis — 감사자가 "이 Kb가 어떤 배관 형상에서 나왔는지"를
        // 봐야 하므로 snapshot.dischargeSystem(당시 박제된 값)에서 그대로 복사.
        // 재계산 없음 — REPORT-PKG-005.
        L:              snapshot.dischargeSystem?.L ?? null,
        D:              snapshot.dischargeSystem?.D ?? null,
        fittingsK:      snapshot.dischargeSystem?.fittingsK ?? null,
        headerPressure: snapshot.dischargeSystem?.headerPressure ?? null,
        destination:    snapshot.dischargeSystem?.destination ?? null,
      }),
      assetFingerprint: snapshot.assetRefs.assetFingerprint,
    }),

    calculation: Object.freeze({
      engineVersion: snapshot.engine_version,
      inputs:        Object.freeze({ ...snapshot.inputs }),   // 재계산 없이 그대로 복사
      result:        Object.freeze({ ...snapshot.result }),   // 재계산 없이 그대로 복사
    }),

    workflow: Object.freeze({
      state: snapshot.workflow,
      decision: snapshot.workflowDecision ? Object.freeze({
        reasons:       Object.freeze([...(snapshot.workflowDecision.reasons || [])]),
        evaluatedAt:   snapshot.workflowDecision.evaluatedAt,
        engineVersion: snapshot.workflowDecision.engineVersion,
      }) : null,
    }),

    approvals: Object.freeze(matchedApprovals),
  };

  return Object.freeze(pkg);
}

// ── report/renderer/pdf/template.js ──────────────────────────
//  PDF TEMPLATE
//  Presentation Dictionary(raw 값 → 사람이 읽는 라벨) + HTML 문서 조립.
//  Raw Evidence(ReportPackage) → Presentation Dictionary → HTML, 순서 고정.
//
//  계약:
//    PDF-002: buildPDFHtml(reportPackage) — reportPackage 하나만 받는다.
//             snapshot/equipment/caseData 등 다른 인자를 받지 않는다.
//    PDF-004: Asset/Calculation/Workflow/Approval/Integrity 5개 섹션 전부 출력.
//
//  이 파일은 renderer 전용 dictionary를 별도로 둔다 — components/report/*의
//  FLUID_CHOICES/WF_LABEL을 재사용하지 않는다. renderer는 UI 컴포넌트 트리와
//  완전히 독립적이어야(서버/CLI로 옮겨도 동작) 하기 때문에 의도적으로 중복시킨다.
// ════════════════════════════════════════════════════════════════

// ── Presentation Dictionary ────────────────────────────────────
const PDF_FLUID_LABELS = [
  { M:44, k:1.30, label:"CO₂ — 이산화탄소" },
  { M:28, k:1.40, label:"N₂ — 질소" },
  { M:18, k:1.33, label:"Steam — 수증기" },
  { M:29, k:1.40, label:"Air — 공기" },
  { M:16, k:1.31, label:"CH₄ — 메탄" },
];

const PDF_WF_STATE_LABELS = {
  DRAFT:           "초안",
  INSPECTION:      "점검 중",
  REVIEW:          "검토 대기",
  ACTION_REQUIRED: "조치 필요",
  APPROVED:        "승인 완료",
  CLOSED:          "종결",
};

function _pdfFluidLabel(inputs) {
  if (!inputs) return "커스텀";
  const m = PDF_FLUID_LABELS.find(f => f.M === inputs.M && f.k === inputs.k);
  return m ? m.label : "커스텀 유체 (직접 입력값)";
}

function _pdfWfLabel(state) {
  return PDF_WF_STATE_LABELS[state] || state || "—";
}

function _pdfRow(k, v) {
  return `<div class="pdf-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

function _pdfSection(title, bodyHtml) {
  return `<div class="pdf-section">
    <div class="pdf-section-title">${title}</div>
    <div class="pdf-section-body">${bodyHtml}</div>
  </div>`;
}

// ── buildPDFHtml ────────────────────────────────────────────────
// reportPackage 하나만 받는다. 계산/조회 없음 — package 필드를 그대로 문자열로 옮길 뿐.
function buildPDFHtml(reportPackage) {
  const pkg = reportPackage;

  const assetBody =
    _pdfRow("Equipment", `${pkg.asset.equipment.tag || "—"} · Rev.${pkg.asset.equipment.revision ?? "—"}`) +
    _pdfRow("Equipment MOC", pkg.asset.equipment.mocId || "—") +
    _pdfRow("Discharge System", `${pkg.asset.dischargeSystem.name || "—"} · Rev.${pkg.asset.dischargeSystem.revision ?? "—"}`) +
    _pdfRow("Discharge MOC", pkg.asset.dischargeSystem.mocId || "—");

  const calcBody =
    _pdfRow("Fluid", _pdfFluidLabel(pkg.calculation.inputs)) +
    _pdfRow("Engine", `API520 v${pkg.calculation.engineVersion}`) +
    _pdfRow("Compressibility Z", pkg.calculation.inputs?.Z != null ? `${pkg.calculation.inputs.Z}${pkg.calculation.inputs.Z===1 ? " (default)" : ""}` : "—") +
    _pdfRow("Relieving Pressure (abs)", pkg.calculation.result?.P1abs ? `${pkg.calculation.result.P1abs.toFixed(3)} bara` : "—") +
    _pdfRow("Selected Orifice", pkg.calculation.result?.selected?.letter || "—") +
    _pdfRow("Required Area", pkg.calculation.result?.areaCm2 ? `${pkg.calculation.result.areaCm2.toFixed(2)} cm²` : "—") +
    `<div style="margin-top:6px;font-size:9px;font-weight:700;color:#64748b;letter-spacing:0.5px;">BACKPRESSURE BASIS</div>` +
    _pdfRow("Header Pressure", pkg.asset.dischargeSystem.headerPressure != null ? `${pkg.asset.dischargeSystem.headerPressure} barg` : "—") +
    _pdfRow("Pipe Length",     pkg.asset.dischargeSystem.L != null ? `${pkg.asset.dischargeSystem.L} m` : "—") +
    _pdfRow("Diameter",        pkg.asset.dischargeSystem.D != null ? `${Math.round(pkg.asset.dischargeSystem.D*1000)} mm` : "—") +
    _pdfRow("Fittings K",      pkg.asset.dischargeSystem.fittingsK ?? "—");

  const reasons = (pkg.workflow.decision?.reasons || [])
    .map(r => `<div class="pdf-reason-item">· ${r.field} ${r.from}${r.unit||""} → ${r.to}${r.unit||""}</div>`)
    .join("");
  const wfBody =
    _pdfRow("State", _pdfWfLabel(pkg.workflow.state)) +
    _pdfRow("Evaluated At", (pkg.workflow.decision?.evaluatedAt || "—").slice(0,19).replace("T"," ")) +
    reasons;

  const approvalBody = pkg.approvals.length === 0
    ? `<div class="pdf-row"><span class="k">Status</span><span class="pdf-badge-none">서명 없음</span></div>`
    : pkg.approvals.map(a => {
        const badgeClass = a.verified === true ? "pdf-badge-ok"
                          : a.verified === false ? "pdf-badge-fail" : "pdf-badge-none";
        const badgeText  = a.verified === true ? "✓ 서명 유효"
                          : a.verified === false ? "✗ 위변조 의심" : "검증 안 됨";
        return `<div class="pdf-row">
          <span class="k">${a.signer} (${a.role||"—"})</span>
          <span class="${badgeClass}">${badgeText}</span>
        </div>` + _pdfRow("승인일", (a.approvedAt||"").slice(0,10));
      }).join("");

  const integrityBody =
    _pdfRow("Snapshot Hash", pkg.identity.snapshotHash) +
    _pdfRow("Snapshot ID", pkg.identity.snapshotId) +
    _pdfRow("Case ID", pkg.identity.caseId) +
    _pdfRow("Report Package Version", pkg.meta.packageVersion) +
    _pdfRow("Generated At", (pkg.meta.generatedAt||"").slice(0,19).replace("T"," "));

  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>ArcSafe Audit Report — ${pkg.identity.snapshotId}</title>
<style>${PDF_STYLES}</style>
</head><body>
  <div class="pdf-title">PSV 검토 감사 보고서</div>
  <div class="pdf-subtitle">${pkg.identity.caseId} · ${pkg.identity.snapshotId}</div>

  ${_pdfSection("ASSET", assetBody)}
  ${_pdfSection("CALCULATION BASIS", calcBody)}
  ${_pdfSection("WORKFLOW DECISION", wfBody)}
  ${_pdfSection("APPROVAL", approvalBody)}
  ${_pdfSection("INTEGRITY", integrityBody)}

  <div class="pdf-footer">
    ArcSafe Report Package v${pkg.meta.packageVersion} · Engine v${pkg.meta.engineVersion} ·
    본 문서는 Snapshot ${pkg.identity.snapshotHash}에서 생성되었으며 원본 데이터를 재계산하지 않습니다.
  </div>
</body></html>`;
}


// ── report/renderer/pdf/renderPDF.js ──────────────────────────
//  RENDER PDF
//  ReportPackage → HTML → 브라우저 인쇄(PDF 저장). React 화면을 print()하지 않는다 —
//  항상 buildPDFHtml(reportPackage)이 새로 만든 독립 문서를 인쇄한다.
//
//  계약:
//    PDF-001: 이 파일은 계산/재검증 함수를 호출하지 않는다
//             (computeBackpressure, calculateKb, detectMOC, verifyApprovalRecord 전부 금지).
//    PDF-002: renderPDF(reportPackage) — 단일 인자. snapshot/equipment/caseData 등
//             추가 데이터를 받지 않는다.
//    PDF-003: 유효하지 않은 Package는 절대 렌더링하지 않는다 —
//             validateReportPackage() 실패 시 즉시 중단.
// ════════════════════════════════════════════════════════════════
function renderPDF(reportPackage) {
  const check = validateReportPackage(reportPackage);
  if (!check.ok) {
    return { ok: false, reason: `INVALID_REPORT_PACKAGE: ${check.reason}` };
  }

  const html = buildPDFHtml(reportPackage);

  const win = window.open("", "_blank");
  if (!win) {
    return { ok: false, reason: "팝업이 차단되었습니다 — 브라우저에서 팝업을 허용해주세요" };
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();

  const doPrint = () => { try { win.print(); } catch (e) { /* noop */ } };
  win.onload = doPrint;
  setTimeout(doPrint, 300); // onload 타이밍을 놓치는 브라우저 대비 백업 트리거

  return { ok: true };
}

// PressChartRenderer — Snapshot.inputs 기준
function PressChartRenderer({ hist, snap }) {
  const setPoint = snap.inputs.P1;
  const mawp     = snap.inputs.mawp;
  const W=580, H=115;
  const mx = mawp * 1.3;
  const y  = p => H-20-((p/mx)*(H-30));
  const x  = (i,n) => 38+(i/Math.max(n-1,1))*(W-50);
  const pts= hist.map((p,i)=>({x:x(i,hist.length),y:y(p)}));
  const ln = pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const ar = pts.length>1?`${ln} L${pts[pts.length-1].x},${H-20} L${pts[0].x},${H-20} Z`:"";
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:115,borderRadius:10}}>
      <defs>
        <linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={T.blue} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={T.blue} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <rect width={W} height={H} fill="#F0F4FA" rx="10"/>
      {[.25,.5,.75,1].map(r=><line key={r} x1="38" y1={y(mx*r)} x2={W-10} y2={y(mx*r)} stroke={T.border} strokeWidth="1"/>)}
      <line x1="38" y1={y(mawp)} x2={W-10} y2={y(mawp)} stroke={T.red} strokeWidth="1.5" strokeDasharray="5,3"/>
      <text x={W-12} y={y(mawp)-3} fontSize="8" fill={T.red} textAnchor="end" fontFamily="monospace" fontWeight="700">MAWP {mawp}b</text>
      <line x1="38" y1={y(setPoint)} x2={W-10} y2={y(setPoint)} stroke={T.yellow} strokeWidth="1.5" strokeDasharray="5,3"/>
      <text x={W-12} y={y(setPoint)-3} fontSize="8" fill={T.yellow} textAnchor="end" fontFamily="monospace" fontWeight="700">SET {setPoint}b</text>
      {ar && <path d={ar} fill="url(#ag2)"/>}
      {pts.length>1 && <path d={ln} fill="none" stroke={T.blue} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
      <line x1="38" y1="5" x2="38" y2={H-20} stroke={T.border} strokeWidth="1.5"/>
      <line x1="38" y1={H-20} x2={W-10} y2={H-20} stroke={T.border} strokeWidth="1.5"/>
    </svg>
  );
}

  const selected = options.find(o => Math.abs(o.value - value) < 0.001) ?? null;
  return (
    <div style={{background:T.bg,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${selected?T.navyLight:T.border}`}}>

      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {options.map(opt=>{
          const isSelected = Math.abs(opt.value - value) < 0.001;

            <div key={opt.id} onClick={()=>onChange(opt.value)}
              style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",

];

// Kb 참고 테이블 — 더 이상 사용자가 직접 선택하지 않음.
// engine/backpressure.js의 computeBackpressure()가 API 521 모델로 자동 계산.
// 여기 남겨두는 이유: override UI에서 구간 설명 참조용.
const KB_OPTIONS_SPRING = [
  { id:"low",  label:"배압 낮음 — 보정 없음",  value:1.00, tag:"P2/P1 < 10%",  basis:"P2/P1이 10% 미만이면 용량 감소 없음. Kb=1.0 적용. 일반 대기 방출 또는 저압 플레어." },
  { id:"mid",  label:"배압 보통 — 경미한 감소", value:0.96, tag:"10~15%",       basis:"P2/P1 10~15% 구간. API 520 Fig.31 기준 Kb≈0.96. 제조사 곡선 우선." },
  { id:"high", label:"배압 높음 — 감소 적용",   value:0.90, tag:"15~20%",       basis:"P2/P1 15~20% 구간. 스프링식 용량 10% 이상 감소. 파일럿식 전환 검토 필요." },
];

function InputView({ inputs, deviceType, onChange, onDeviceChange, onSubmit, dischargeSystem }) {
  const [fluidId, setFluidId]   = useState("co2");
  const [kdId,    setKdId]      = useState("sv_std");
  const [showCustomFluid, setShowCustomFluid] = useState(false);
  const [kbOverride, setKbOverride] = useState(false);
  const [kbOverrideReason, setKbOverrideReason] = useState("");

  // 유체 선택 → M, k, Kd 동시 결정
  const handleFluidSelect = (f) => {
    setFluidId(f.id);
    if (f.id === "other") { setShowCustomFluid(true); return; }
    setShowCustomFluid(false);
    onChange("M",  f.M);
    onChange("k",  f.k);
    onChange("Kd", f.Kd);
    // Kd 선택을 표준으로 초기화
    setKdId("sv_std");
  };

  // Kd 선택 → Kd 결정
  const handleKdSelect = (opt) => {
    setKdId(opt.id);
    onChange("Kd", opt.value);
  };

  // Kb — system 계산값 (engine의 computeBackpressure 순수함수, API 521 모델)
  // GEOMETRY-001: 배관 형상은 Case 입력값이 아니라 Asset(DischargeSystem) 데이터.
  // 임의 기본값을 몰래 대입하지 않는다 — 미연결이면 명시적으로 경고하고
  // Kb=1.0(보수적 가정)을 쓰되 그 사실을 화면에 그대로 노출한다.
  const bpResult = dischargeSystem
    ? computeBackpressure(inputs, {
        L: dischargeSystem.L, D: dischargeSystem.D,
        fittingsK: dischargeSystem.fittingsK,
        headerPressure: dischargeSystem.headerPressure,
      })
    : { valid: false, error: { field: "dischargeSystem", reason: "not_linked" } };
  const kbCalc = bpResult.valid
    ? { value: bpResult.kb, basis: bpResult.basis, status: bpResult.status }
    : dischargeSystem
    ? { value: 1.0, basis: "배관 형상 입력 오류 — 기본값 적용", status: "calculated" }
    : { value: 1.0, basis: "배출계통 미연결 — Kb=1.0 보수적 가정 (설비대장에서 연결 필요)", status: "calculated" };

  // P1/P2가 바뀌면 override 중이 아닌 한 시스템 계산값을 자동 반영
  useEffect(() => {
    if (!kbOverride) {
      onChange("Kb", kbCalc.value);
    }
  }, [inputs.P1, inputs.P2, kbOverride]);

  // 배압 비율 실시간 계산 (경고용)
  const bpRatio = inputs.P1 > 0 ? (inputs.P2 / inputs.P1 * 100).toFixed(1) : 0;
  const bpWarning = bpRatio > 30 ? "파일럿식 검토" : bpRatio > 10 ? "Kb 확인" : null;

  // 설정압 > MAWP 경고
  const mawpWarning = inputs.P1 > inputs.mawp ? "설정압 > MAWP!" : null;

  return (
    <div style={{padding:"0 2px"}}>

      {/* ── 1. 밸브 종류 결정 ── */}
      <SectionHeader step="1" title="밸브 종류" sub="설치된 밸브 또는 럽처디스크 선택"/>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[
          ["safetyValve","🔧 안전밸브","스프링식 또는 파일럿식. 설정압에서 개방, 이후 자동 재폐."],
          ["ruptureDisk","💥 럽처디스크","단일 작동. 파열 후 교체 필요. Kd ×0.9 보정 적용."],
        ].map(([v,l,sub])=>(
          <div key={v} onClick={()=>onDeviceChange(v)}
            style={{flex:1,padding:"12px",borderRadius:12,cursor:"pointer",
              border:`2px solid ${deviceType===v?T.navyLight:T.border}`,
              background:deviceType===v?T.navy+"0D":T.cardBg,
              transition:"all 0.15s"}}>
            <div style={{fontSize:13,fontWeight:900,color:deviceType===v?T.navy:T.text,fontFamily:font.sans}}>{l}</div>
            <div style={{fontSize:10,color:T.sub,marginTop:3,fontFamily:font.sans,lineHeight:1.4}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* ── 2. 방출 시나리오 ── */}
      <SectionHeader step="2" title="방출 시나리오" sub="어떤 상황에서 밸브가 열리는가 — API 521 시나리오"/>
      <DecisionSlider
        param="W" label="설계 방출량" unit="kg/h"
        value={inputs.W} min={500} max={10000} step={100}
        onChange={v=>onChange("W",v)}
        basis="HAZOP 또는 API 521 시나리오 계산서 기반. 화재, 반응 폭주, 냉각 상실 등 최대 방출 시나리오 중 지배 케이스 적용. 설계 여유 없이 계산된 최대값 사용."
      />

      {/* ── 3. 유체 사양 결정 ── */}
      <SectionHeader step="3" title="유체 사양" sub="M, k 값은 유체 선택 시 자동 결정됨"/>
      <div style={{background:T.cardBg,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${fluidId?T.navyLight:T.border}`}}>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {FLUID_CHOICES.map(f=>{
            const isSel = fluidId === f.id;
            return (
              <div key={f.id} onClick={()=>handleFluidSelect(f)}
                style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",borderRadius:9,cursor:"pointer",
                  border:`2px solid ${isSel?T.navyLight:T.border}`,
                  background:isSel?T.navy+"0D":T.bg,
                  transition:"all 0.12s"}}>
                <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${isSel?T.navyLight:T.border}`,background:isSel?T.navyLight:T.white,flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {isSel && <div style={{width:6,height:6,borderRadius:"50%",background:T.white}}/>}
                </div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:700,color:isSel?T.navy:T.text,fontFamily:font.sans}}>{f.label}</span>
                    <span style={{fontSize:9,padding:"1px 6px",borderRadius:4,background:isSel?T.navyLight+"22":T.bg,color:isSel?T.navyLight:T.sub,fontFamily:font.mono,border:`1px solid ${isSel?T.navyLight:T.border}`}}>{f.tag}</span>
                    {f.M && <span style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginLeft:"auto"}}>M={f.M} k={f.k}</span>}
                  </div>
                  {isSel && <div style={{fontSize:10,color:T.sub,marginTop:3,fontFamily:font.sans,lineHeight:1.5}}>{f.basis}</div>}
                </div>
              </div>
            );
          })}
        </div>
        {/* 커스텀 유체 직접 입력 */}
        {showCustomFluid && (
          <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[
              {key:"M",label:"분자량 M",unit:"g/mol",min:2,max:200,step:1},
              {key:"k",label:"비열비 k",unit:"",min:1.05,max:1.7,step:0.01},
            ].map(({key,label,unit,min,max,step})=>(
              <div key={key}>
                <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginBottom:3}}>{label}</div>
                <input type="number" value={inputs[key]} min={min} max={max} step={step}
                  onChange={e=>onChange(key,+e.target.value)}
                  style={{width:"100%",padding:"7px 9px",borderRadius:8,border:`1px solid ${T.border}`,fontSize:13,fontFamily:font.mono,fontWeight:700,color:T.navy,background:T.bg,boxSizing:"border-box"}}/>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginTop:2}}>{unit}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* 온도 */}
      <TempInput value={inputs.T} onChange={v=>onChange("T",v)}/>

      {/* ── 4. 압력 조건 결정 ── */}
      <SectionHeader step="4" title="압력 조건" sub="명판 및 공정 설계 문서 기준"/>
      <DecisionSlider
        param="MAWP" label="최고허용운전압력" unit="barg"
        value={inputs.mawp} min={0.5} max={25} step={0.1}
        onChange={v=>onChange("mawp",v)}
        basis="압력용기 명판(Nameplate) 또는 배관 설계 문서에서 확인. 이 값이 밸브 설정압의 상한을 결정함. 설정압 ≤ MAWP 조건 위반 시 PSM 부적합."
      />
      <DecisionSlider
        param="P1" label="설정압력 (Set Pressure)" unit="barg"
        value={inputs.P1} min={0.5} max={inputs.mawp || 20} step={0.1}
        onChange={v=>onChange("P1",v)}
        basis="밸브 명판의 설정압. MAWP의 100% 이하 유지 (단일 밸브 기준). 공정 최고운전압력 대비 최소 10% 여유 권고 (API 521)."
        warning={mawpWarning}
      />
      {/* PRESSURE-001: overpressure는 Case 입력값이 아니라 Asset(Equipment) 데이터.
          여기서 편집하지 않고, 설비대장 값으로 산정된 relieving pressure만 보여준다. */}
      <div style={{background:T.cardBg,borderRadius:10,padding:"10px 12px",marginBottom:10,
        border:`1.5px solid ${T.border}`}}>
        <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginBottom:3}}>
          RELIEVING PRESSURE (절대압) — 설비대장 Overpressure 기준 시스템 산정값
        </div>
        {typeof inputs.OP === "number" && !isNaN(inputs.OP) ? (
          <div style={{fontSize:13,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
            {(inputs.P1 * (1 + inputs.OP/100) + 1.01325).toFixed(3)} bara
            <span style={{fontSize:10,fontWeight:600,color:T.sub,marginLeft:8}}>
              = {inputs.P1}×(1+{inputs.OP}%) + 1.01325
            </span>
          </div>
        ) : (
          <div style={{fontSize:11,fontWeight:700,color:T.red,fontFamily:font.sans}}>
            ⚠ 설비대장에 Overpressure(%) 미설정 — 계산 불가. 설비대장에서 값을 먼저 입력하세요.
          </div>
        )}
      </div>
      <DecisionSlider
        param="P2" label="배압 (Back Pressure)" unit="barg"
        value={inputs.P2} min={0} max={5} step={0.05}
        onChange={v=>onChange("P2",v)}
        basis={`플레어 헤더 또는 방출 배관 압력. 현재 P2/P1 = ${bpRatio}%.${bpRatio>10?" 10% 초과 → Kb 1.0 미만 적용 필요.":""}${bpRatio>30?" 30% 초과 → 스프링식 부적합, 파일럿식 전환 검토.":""}`}
        warning={bpWarning}
      />
      {/* COMPRESSIBILITY-001: Z는 Asset이 아니라 Calculation Input —
          설비 속성이 아니라 유체·운전조건에 따라 케이스마다 달라지므로
          Case가 직접 소유하고 편집 가능해야 한다 (OP와는 반대). */}
      <DecisionSlider
        param="Z" label="압축계수 (Compressibility Z)" unit=""
        value={inputs.Z} min={0.5} max={1.2} step={0.01}
        onChange={v=>onChange("Z",v)}
        basis="실측 P-V-T 데이터 또는 상태방정식(SRK, PR 등)에서 산정. 기본값 1.00은 이상기체 가정 — 고압·저온 조건에서 실제 유체는 1.00과 벗어날 수 있으며, 벗어날수록 소요 면적 산정 오차가 커진다."
      />

      {/* ── 5. 방출계수 결정 ── */}
      <SectionHeader step="5" title="방출계수 Kd" sub="어떤 근거로 이 계수를 적용하는가"/>
      <DecisionChoice
        param="Kd" label="방출계수 선택"
        options={KD_OPTIONS}
        value={inputs.Kd}
        onChange={v=>{ const opt=KD_OPTIONS.find(o=>Math.abs(o.value-v)<0.001); if(opt) handleKdSelect(opt); }}
      />
      {/* Kd 커스텀 슬라이더 (미세 조정용, 접혀 있음) */}
      <details style={{marginBottom:10}}>
        <summary style={{fontSize:10,color:T.sub,fontFamily:font.mono,cursor:"pointer",padding:"4px 2px"}}>제조사 실측값 직접 입력</summary>
        <div style={{marginTop:6,padding:"10px 12px",background:T.bg,borderRadius:9,border:`1px solid ${T.border}`}}>
          <input type="range" min={0.5} max={1.0} step={0.005} value={inputs.Kd}
            onChange={e=>onChange("Kd",+e.target.value)}
            style={{width:"100%",accentColor:T.navyLight}}/>
          <div style={{textAlign:"center",fontSize:12,fontFamily:font.mono,fontWeight:700,color:T.navyLight,marginTop:4}}>{inputs.Kd.toFixed(3)}</div>
        </div>
      </details>

      {/* ── 6. 배압보정계수 — 시스템 계산값 (사용자 직접 선택 금지) ── */}
      <SectionHeader step="6" title="배압보정계수 Kb" sub="P1, P2로부터 시스템이 계산 — 직접 선택 불가"/>
      <div style={{
        background: kbCalc.status==="out_of_range" ? T.redBg : T.bg,
        borderRadius:12, padding:"14px 16px", marginBottom:10,
        border:`1.5px solid ${kbCalc.status==="out_of_range" ? T.red : T.border}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono}}>Kb</span>
            <span style={{fontSize:9,padding:"2px 7px",borderRadius:5,
              background: kbOverride ? T.orangeBg : T.greenBg,
              color: kbOverride ? "#946200" : T.greenDk,
              border:`1px solid ${kbOverride ? T.orange : T.green}`,
              fontFamily:font.mono,fontWeight:700}}>
              {kbOverride ? "ENGINEER OVERRIDE" : "SYSTEM CALCULATED"}
            </span>
          </div>
          <div style={{fontSize:22,fontWeight:900,color:T.navyLight,fontFamily:font.mono}}>
            {Number(inputs.Kb).toFixed(3)}
          </div>
        </div>
        <div style={{fontSize:11,color:T.sub,fontFamily:font.sans,lineHeight:1.6,marginBottom:10}}>
          {kbOverride
            ? "엔지니어 override 적용 중 — 아래 근거를 반드시 기록하세요."
            : kbCalc.basis}
        </div>
        {kbCalc.status==="out_of_range" && !kbOverride && (
          <div style={{fontSize:11,color:T.red,fontFamily:font.sans,fontWeight:700,marginBottom:10}}>
            ⚠ 표준 곡선 범위 초과 — 제조사 데이터 확인 후 override 필요
          </div>
        )}

        {!kbOverride ? (
          <button onClick={()=>setKbOverride(true)}
            style={{fontSize:10,color:T.sub,background:"none",border:`1px dashed ${T.border}`,
              borderRadius:7,padding:"6px 10px",cursor:"pointer",fontFamily:font.mono}}>
            제조사 곡선값으로 override (근거 기록 필요)
          </button>
        ) : (
          <div>
            <input type="range" min={0.5} max={1.0} step={0.005} value={inputs.Kb}
              onChange={e=>onChange("Kb",+e.target.value)}
              style={{width:"100%",accentColor:T.orange,marginBottom:8}}/>
            <textarea
              value={kbOverrideReason}
              onChange={e=>setKbOverrideReason(e.target.value)}
              placeholder="override 근거 필수 — 예: 제조사 Kb 곡선 Doc.No.XXX 기준 0.88 적용"
              rows={2}
              style={{width:"100%",borderRadius:8,border:`1.5px solid ${kbOverrideReason.trim()?T.orange:T.red}`,
                padding:"8px 10px",fontSize:11,fontFamily:font.sans,color:T.text,
                resize:"none",boxSizing:"border-box",background:T.white,outline:"none",marginBottom:8}}
            />
            <button onClick={()=>{ setKbOverride(false); setKbOverrideReason(""); }}
              style={{fontSize:10,color:T.sub,background:"none",border:`1px solid ${T.border}`,
                borderRadius:7,padding:"6px 10px",cursor:"pointer",fontFamily:font.mono}}>
              시스템 계산값으로 복귀
            </button>
          </div>
        )}
      </div>

      {/* ── 결정 요약 ── */}
      <div style={{background:T.navy,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:700,color:"#7B9EC0",fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>사양 결정 요약</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
          {[
            ["W", `${inputs.W} kg/h`],
            ["P1/MAWP", `${inputs.P1}/${inputs.mawp} b`],
            ["P2", `${inputs.P2} barg`],
            ["M / k", `${inputs.M} / ${inputs.k}`],
            ["Kd", inputs.Kd.toFixed(3)],
            ["Kb", inputs.Kb.toFixed(2)],
          ].map(([k,v])=>(
            <div key={k} style={{background:"#FFFFFF12",borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
              <div style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono}}>{k}</div>
              <div style={{fontSize:12,fontWeight:900,color:T.white,fontFamily:font.mono}}>{v}</div>
            </div>
          ))}
        </div>
        {mawpWarning && (
          <div style={{marginTop:10,background:T.redBg,border:`1px solid ${T.red}`,borderRadius:8,padding:"7px 10px",fontSize:11,color:T.red,fontFamily:font.sans,fontWeight:700}}>
            ⚠ 설정압력({inputs.P1} barg)이 MAWP({inputs.mawp} barg)를 초과합니다. 계산 전 수정 필요.
          </div>
        )}
      </div>

      {(() => {
        const blockReason = mawpWarning
          ? "⚠ 설정압 오류 — 수정 후 진행 가능"
          : (kbOverride && !kbOverrideReason.trim())
          ? "⚠ Kb override 근거를 입력해야 진행 가능"
          : null;
        return (
          <button onClick={onSubmit} disabled={!!blockReason}
            style={{width:"100%",padding:"16px",background:blockReason?T.border:T.navyLight,color:T.white,border:"none",borderRadius:14,fontSize:15,fontWeight:900,fontFamily:font.sans,cursor:blockReason?"not-allowed":"pointer",boxShadow:blockReason?"none":`0 5px 0 ${T.navy}`,transition:"all 0.15s",letterSpacing:0.5}}>
            {blockReason || "사양 확정 → 계산 실행"}
          </button>
        );
      })()}
    </div>
  );
}


// ── components/WorkflowTransition.jsx ──────────────────────────
//  WORKFLOW TRANSITION — 코멘트 포함 전환 UI
// ════════════════════════════════════════════════════════════════
function WorkflowTransition({ currentState, nextStates, onAdvance }) {
  const [comment, setComment] = useState("");
  const [selected, setSelected] = useState(nextStates[0]);

  return (
    <div style={{marginTop:14,background:T.cardBg,borderRadius:14,padding:14,border:`1px solid ${T.border}`}}>
      <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:10,letterSpacing:1}}>WORKFLOW 전환</div>
