function TempInput({ value, onChange }) {
  const [mode, setMode] = useState("K");
  const displayVal = mode === "K" ? value : Math.round((value - 273.15) * 10) / 10;
  const handleChange = (v) => onChange(mode === "K" ? v : Math.round((v + 273.15) * 10) / 10);
  return (
    <div style={{background:T.bg,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${T.border}`}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:8}}>

        <div style={{textAlign:"right",flexShrink:0}}>

          <div style={{display:"flex",gap:4,marginTop:3,justifyContent:"flex-end"}}>
            {["K","C"].map(m=>(
              <button key={m} onClick={()=>setMode(m)} style={{padding:"2px 7px",borderRadius:5,border:`1px solid ${mode===m?T.navyLight:T.border}`,background:mode===m?T.navyLight:T.white,color:mode===m?T.white:T.sub,fontSize:10,fontFamily:font.mono,fontWeight:700,cursor:"pointer"}}>°{m}</button>
            ))}
          </div>
        </div>
      </div>
      <input type="range" min={mode==="K"?200:-73} max={mode==="K"?700:427} step={5} value={displayVal}
        onChange={e=>handleChange(+e.target.value)}

      <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
        <span style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>{mode==="K"?"200 K":"-73 °C"}</span>

      </div>
      <div style={{fontSize:10,color:T.sub,fontFamily:font.sans,marginTop:4}}>
        ≈ {mode==="K" ? `${Math.round((value-273.15)*10)/10} °C` : `${value} K`}
      </div>
    </div>
  );
}

};

function InputView({ inputs, deviceType, onChange, onDeviceChange, onSubmit, dischargeSystem, equipment,
  reliefLoadScenarioType, reliefLoadScenarioInput, reliefLoadScenarioResult, reliefLoadAdapter,
  effectiveW, effectiveWSource, onReliefLoadScenarioTypeChange, onReliefLoadScenarioInputChange }) {
  const [fluidId, setFluidId]   = useState("co2");
  const [kdId,    setKdId]      = useState("sv_std");
  const [showCustomFluid, setShowCustomFluid] = useState(false);
  const [kbOverride, setKbOverride] = useState(false);
  const [kbOverrideReason, setKbOverrideReason] = useState("");

  // 유체 선택 → M, k, Kd 동시 결정
  const handleFluidSelect = (f) => {
    setFluidId(f.id);
    if (f.id === "other") { setShowCustomFluid(true); return; }
    setShowCustomFluid(false);
    onChange("M",  f.M);
    onChange("k",  f.k);
    onChange("Kd", f.Kd);
    // Kd 선택을 표준으로 초기화
    setKdId("sv_std");
  };

  // Kd 선택 → Kd 결정
  const handleKdSelect = (opt) => {
    setKdId(opt.id);
    onChange("Kd", opt.value);
  };

  // Kb — system 계산값 (engine의 computeBackpressure 순수함수, API 521 모델)
  // GEOMETRY-001: 배관 형상은 Case 입력값이 아니라 Asset(DischargeSystem) 데이터.
  // 임의 기본값을 몰래 대입하지 않는다 — 미연결이면 명시적으로 경고하고
  // Kb=1.0(보수적 가정)을 쓰되 그 사실을 화면에 그대로 노출한다.
  const bpResult = dischargeSystem
    ? computeBackpressure(inputs, {
        L: dischargeSystem.L, D: dischargeSystem.D,
        fittingsK: dischargeSystem.fittingsK,
        headerPressure: dischargeSystem.headerPressure,
      })
    : { valid: false, error: { field: "dischargeSystem", reason: "not_linked" } };
  const kbCalc = bpResult.valid
    ? { value: bpResult.kb, basis: bpResult.basis, status: bpResult.status }
    : dischargeSystem
    ? { value: 1.0, basis: "배관 형상 입력 오류 — 기본값 적용", status: "calculated" }
    : { value: 1.0, basis: "배출계통 미연결 — Kb=1.0 보수적 가정 (설비대장에서 연결 필요)", status: "calculated" };

  // P1/P2가 바뀌면 override 중이 아닌 한 시스템 계산값을 자동 반영
  useEffect(() => {
    if (!kbOverride) {
      onChange("Kb", kbCalc.value);
    }
  }, [inputs.P1, inputs.P2, kbOverride]);

  // 배압 비율 실시간 계산 (경고용)
  const bpRatio = inputs.P1 > 0 ? (inputs.P2 / inputs.P1 * 100).toFixed(1) : 0;
  const allowableBpPct = getAllowableBackpressureRatio(inputs.valveType) * 100;
  const bpWarning = bpRatio > allowableBpPct ? "배압 초과" : bpRatio > allowableBpPct/2 ? "Kb 확인" : null;

  // 설정압 > MAWP 경고
  const mawpWarning = inputs.P1 > inputs.mawp ? "설정압 > MAWP!" : null;

  return (
    <div style={{padding:"0 2px"}}>

      {/* ── 1. 밸브 종류 결정 ── */}
      <SectionHeader step="1" title="밸브 종류" sub="설치된 밸브 또는 럽처디스크 선택"/>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[
          ["safetyValve","🔧 안전밸브","스프링식 또는 파일럿식. 설정압에서 개방, 이후 자동 재폐."],
          ["ruptureDisk","💥 럽처디스크","단일 작동. 파열 후 교체 필요. Kd ×0.9 보정 적용."],
        ].map(([v,l,sub])=>(
          <div key={v} onClick={()=>onDeviceChange(v)}
            style={{flex:1,padding:"12px",borderRadius:12,cursor:"pointer",
              border:`2px solid ${deviceType===v?T.navyLight:T.border}`,
              background:deviceType===v?T.navy+"0D":T.cardBg,
              transition:"all 0.15s"}}>
            <div style={{fontSize:13,fontWeight:900,color:deviceType===v?T.navy:T.text,fontFamily:font.sans}}>{l}</div>
            <div style={{fontSize:10,color:T.sub,marginTop:3,fontFamily:font.sans,lineHeight:1.4}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* ── 1b. 밸브 형식 (배압 허용비율 결정) — 안전밸브인 경우에만 ── */}
      {deviceType === "safetyValve" && (
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,letterSpacing:0.5,marginBottom:6}}>
            VALVE TYPE — 배압 허용비율을 결정합니다
          </div>
          <div style={{display:"flex",gap:8}}>
            {[
              ["SPRING", "스프링식(일반형)", "배압 ≤ 설정압력의 10%"],
              ["BELLOWS","벨로우즈형(밸런스형)", "배압 ≤ 설정압력의 50%"],
            ].map(([v,l,sub])=>(
              <div key={v} onClick={()=>onChange("valveType",v)}
                style={{flex:1,padding:"10px 12px",borderRadius:10,cursor:"pointer",
                  border:`2px solid ${(inputs.valveType||"SPRING")===v?T.navyLight:T.border}`,
                  background:(inputs.valveType||"SPRING")===v?T.navy+"0D":T.cardBg,
                  transition:"all 0.15s"}}>
                <div style={{fontSize:12,fontWeight:900,color:(inputs.valveType||"SPRING")===v?T.navy:T.text,fontFamily:font.sans}}>{l}</div>
                <div style={{fontSize:9,color:T.sub,marginTop:2,fontFamily:font.mono}}>{sub}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:5,lineHeight:1.5}}>
            출처: KOSHA GUIDE D-18-2020 §7.2(4). 파일럿식은 원문에 수치 기준이 없어 이 앱에서 아직 지원하지 않습니다 — 실제 파일럿식 밸브는 제작사 데이터시트를 별도로 확인하세요.
          </div>
        </div>
      )}


      {/* ── 2. 방출 시나리오 ── */}
      <SectionHeader step="2" title="방출 시나리오" sub="어떤 상황에서 밸브가 열리는가 — API 521 시나리오"/>
      <div style={{position:"relative"}}>
        <div style={{position:"absolute",top:-6,right:0,zIndex:1,fontSize:9,padding:"2px 8px",borderRadius:6,
          fontFamily:font.mono,fontWeight:700,
          background: reliefLoadScenarioType !== null ? T.orangeBg : T.greenBg,
          color: reliefLoadScenarioType !== null ? "#946200" : T.greenDk,
          border:`1px solid ${reliefLoadScenarioType !== null ? T.orange : T.green}`}}>
          {reliefLoadScenarioType !== null ? "참고용 — 미사용" : "MANUAL INPUT 사용 중"}
        </div>
        <DecisionSlider
          param="W" label="설계 방출량 (Manual)" unit="kg/h"
          value={inputs.W} min={500} max={10000} step={100}
          onChange={v=>onChange("W",v)}
          basis="HAZOP 또는 API 521 시나리오 계산서 기반. 화재, 반응 폭주, 냉각 상실 등 최대 방출 시나리오 중 지배 케이스 적용. 설계 여유 없이 계산된 최대값 사용. 아래 Relief Load 시나리오를 선택하면 이 값 대신 시나리오 산정값이 사용됩니다."
        />
      </div>

      {/* ── 2b. Relief Load — §5 시나리오 기반 W 산정 (선택) ── */}
      <ReliefLoadScenarioSection
        scenarioType={reliefLoadScenarioType}
        scenarioInput={reliefLoadScenarioInput}
        scenarioResult={reliefLoadScenarioResult}
        adapter={reliefLoadAdapter}
        onScenarioTypeChange={onReliefLoadScenarioTypeChange}
        onFieldChange={onReliefLoadScenarioInputChange}
      />

      {/* ── 3. 유체 사양 결정 ── */}
      <SectionHeader step="3" title="유체 사양" sub="M, k 값은 유체 선택 시 자동 결정됨"/>
      <div style={{background:T.cardBg,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${fluidId?T.navyLight:T.border}`}}>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {FLUID_CHOICES.map(f=>{
            const isSel = fluidId === f.id;
            return (
              <div key={f.id} onClick={()=>handleFluidSelect(f)}
                style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",borderRadius:9,cursor:"pointer",
                  border:`2px solid ${isSel?T.navyLight:T.border}`,
                  background:isSel?T.navy+"0D":T.bg,
                  transition:"all 0.12s"}}>
                <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${isSel?T.navyLight:T.border}`,background:isSel?T.navyLight:T.white,flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {isSel && <div style={{width:6,height:6,borderRadius:"50%",background:T.white}}/>}
                </div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:700,color:isSel?T.navy:T.text,fontFamily:font.sans}}>{f.label}</span>
                    <span style={{fontSize:9,padding:"1px 6px",borderRadius:4,background:isSel?T.navyLight+"22":T.bg,color:isSel?T.navyLight:T.sub,fontFamily:font.mono,border:`1px solid ${isSel?T.navyLight:T.border}`}}>{f.tag}</span>
                    {f.M && <span style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginLeft:"auto"}}>M={f.M} k={f.k}</span>}
                  </div>
                  {isSel && <div style={{fontSize:10,color:T.sub,marginTop:3,fontFamily:font.sans,lineHeight:1.5}}>{f.basis}</div>}
                </div>
              </div>
            );
          })}
        </div>
        {/* 커스텀 유체 직접 입력 */}
        {showCustomFluid && (
          <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[
              {key:"M",label:"분자량 M",unit:"g/mol",min:2,max:200,step:1},
              {key:"k",label:"비열비 k",unit:"",min:1.05,max:1.7,step:0.01},
            ].map(({key,label,unit,min,max,step})=>(
              <div key={key}>
                <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginBottom:3}}>{label}</div>
                <input type="number" value={inputs[key]} min={min} max={max} step={step}
                  onChange={e=>onChange(key,+e.target.value)}
                  style={{width:"100%",padding:"7px 9px",borderRadius:8,border:`1px solid ${T.border}`,fontSize:13,fontFamily:font.mono,fontWeight:700,color:T.navy,background:T.bg,boxSizing:"border-box"}}/>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginTop:2}}>{unit}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* 온도 */}
      <TempInput value={inputs.T} onChange={v=>onChange("T",v)}/>

      {/* ── 4. 압력 조건 결정 ── */}
      <SectionHeader step="4" title="압력 조건" sub="명판 및 공정 설계 문서 기준"/>
      <DecisionSlider
        param="MAWP" label="최고허용운전압력" unit="barg"
        value={inputs.mawp} min={0.5} max={25} step={0.1}
        onChange={v=>onChange("mawp",v)}
        basis="압력용기 명판(Nameplate) 또는 배관 설계 문서에서 확인. 이 값이 밸브 설정압의 상한을 결정함. 설정압 ≤ MAWP 조건 위반 시 PSM 부적합."
      />
      <DecisionSlider
        param="P1" label="설정압력 (Set Pressure)" unit="barg"
        value={inputs.P1} min={0.5} max={inputs.mawp || 20} step={0.1}
        onChange={v=>onChange("P1",v)}
        basis="밸브 명판의 설정압. MAWP의 100% 이하 유지 (단일 밸브 기준). 공정 최고운전압력 대비 최소 10% 여유 권고 (API 521)."
        warning={mawpWarning}
      />
      {/* PRESSURE-001: overpressure는 Case 입력값이 아니라 Asset(Equipment) 데이터.
          여기서 편집하지 않고, 설비대장 값으로 산정된 relieving pressure만 보여준다. */}
      <div style={{background:T.cardBg,borderRadius:10,padding:"10px 12px",marginBottom:10,
        border:`1.5px solid ${T.border}`}}>
        <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginBottom:3}}>
          RELIEVING PRESSURE (절대압) — 설비대장 Overpressure 기준 시스템 산정값
        </div>
        {typeof inputs.OP === "number" && !isNaN(inputs.OP) ? (
          <div style={{fontSize:13,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
            {(inputs.P1 * (1 + inputs.OP/100) + 1.01325).toFixed(3)} bara
            <span style={{fontSize:10,fontWeight:600,color:T.sub,marginLeft:8}}>
              = {inputs.P1}×(1+{inputs.OP}%) + 1.01325
            </span>
          </div>
        ) : (
          <div style={{fontSize:11,fontWeight:700,color:T.red,fontFamily:font.sans}}>
            ⚠ 설비대장에 Overpressure(%) 미설정 — 계산 불가. 설비대장에서 값을 먼저 입력하세요.
          </div>
        )}
      </div>

      {/* ── ACCUMULATION-001: 축적압력 허용성 검증 — sizing과 별개 정책 ── */}
      <div style={{background:T.cardBg,borderRadius:10,padding:"10px 12px",marginBottom:10,
        border:`1.5px solid ${T.border}`}}>
        <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginBottom:6}}>
          ACCUMULATION GUARDRAIL — 이 Overpressure가 시나리오상 허용되는지 검증 (KOSHA D-18 §4.4)
        </div>
        <div style={{display:"flex",gap:8,marginBottom:6}}>
          {[[1,"밸브 1개 설치"],[2,"밸브 2개 이상 설치"]].map(([v,l])=>(
            <div key={v} onClick={()=>onChange("valveCount",v)}
              style={{flex:1,padding:"8px 10px",borderRadius:8,cursor:"pointer",
                border:`2px solid ${(inputs.valveCount||1)===v?T.navyLight:T.border}`,
                background:(inputs.valveCount||1)===v?T.navy+"0D":T.bg}}>
              <div style={{fontSize:11,fontWeight:900,color:(inputs.valveCount||1)===v?T.navy:T.text,fontFamily:font.sans}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          {[[false,"화재 보호 목적 아님"],[true,"화재 보호 목적"]].map(([v,l])=>(
            <div key={String(v)} onClick={()=>onChange("fireScenario",v)}
              style={{flex:1,padding:"8px 10px",borderRadius:8,cursor:"pointer",
                border:`2px solid ${!!inputs.fireScenario===v?T.navyLight:T.border}`,
                background:!!inputs.fireScenario===v?T.navy+"0D":T.bg}}>
              <div style={{fontSize:11,fontWeight:900,color:!!inputs.fireScenario===v?T.navy:T.text,fontFamily:font.sans}}>{l}</div>
            </div>
          ))}
        </div>
        {(() => {
          const allowRatio = getAllowableAccumulationRatio(!!inputs.fireScenario, inputs.valveCount || 1);
          const actualRatio = typeof inputs.OP === "number" && !isNaN(inputs.OP) ? 1 + inputs.OP/100 : null;
          const go = actualRatio != null && actualRatio <= allowRatio;
          return actualRatio == null ? null : (
            <div style={{fontSize:11,fontWeight:900,fontFamily:font.mono,
              color: go ? T.green : T.red}}>
              {go ? "✓ GO" : "✗ NO-GO"} — 현재 축적압력 {(actualRatio*100).toFixed(0)}%
              {" "}(허용 한도 {(allowRatio*100).toFixed(0)}%, KOSHA D-18 §4.4)
              {!go && <span style={{display:"block",fontWeight:600,color:T.sub,marginTop:2}}>
                입력 축적압력이 적용 기준을 초과합니다 — 밸브 수량/화재 시나리오를 재확인하거나
                설비대장에서 Overpressure 값을 낮춰야 합니다. 자동 보정하지 않습니다.
              </span>}
            </div>
          );
        })()}
      </div>

      {/* ── INLET-LOSS-001: 인입배관 압력손실 — read-only, Engine이 판정 소유 ── */}
      <div style={{background:T.cardBg,borderRadius:10,padding:"10px 12px",marginBottom:10,
        border:`1.5px solid ${T.border}`}}>
        <div style={{fontSize:9,color:T.gray,fontFamily:font.mono,marginBottom:6}}>
          INLET PRESSURE LOSS — 인입배관 압력손실 ≤ 설정압력 × {(getAllowableInletLossRatio()*100).toFixed(0)}% (KOSHA D-18-2020 §7.2(1))
        </div>
        {(() => {
          const ip = equipment?.inletPiping;
          if (!ip) {
            return (
              <div style={{fontSize:11,fontWeight:700,color:T.gray,fontFamily:font.mono}}>
                — 판정 보류 (INSUFFICIENT INPUT) — 설비대장에 인입배관(L/D/ΣK)이 등록되어 있지 않습니다.
                <div style={{fontSize:9,color:T.sub,fontWeight:400,marginTop:3,fontFamily:font.sans}}>
                  임의로 추정하지 않습니다 — 실제 판정이 필요하면 설비대장에서 등록하세요.
                </div>
              </div>
            );
          }
          const Pset = inputs.P1;
          const fric = computeInletFrictionLoss({ W:inputs.W, T:inputs.T, M:inputs.M, Pset, inletPiping: ip });
          const result = evaluateInletPressureLossPolicy(Pset, fric);
          if (!result.pressureLossAvailable) {
            return (
              <div style={{fontSize:11,fontWeight:700,color:T.gray,fontFamily:font.mono}}>
                — 판정 보류 (INSUFFICIENT INPUT) — {result.reason}
              </div>
            );
          }
          const go = result.pressureLossOK;
          return (
            <div>
              <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginBottom:4}}>
                L={ip.L}m · D={Math.round(ip.D*1000)}mm · ΣK={ip.fittingsK}
              </div>
              <div style={{fontSize:11,fontWeight:900,fontFamily:font.mono,color: go ? T.green : T.red}}>
                {go ? "✓ GO" : "✗ NO-GO"} — ΔP {result.pressureLoss.toFixed(4)} bar
                {" "}({(result.pressureLossRatio*100).toFixed(2)}%, 허용 {(result.allowablePressureLoss).toFixed(4)} bar = {(result.allowableRatio*100).toFixed(0)}%)
                {!go && <span style={{display:"block",fontWeight:600,color:T.sub,marginTop:2}}>
                  인입배관 압력손실이 기준을 초과합니다 — 배관 내경을 늘리거나 길이/부속을 줄이는 재설계가 필요합니다.
                  자동 보정하지 않습니다.
                </span>}
              </div>
            </div>
          );
        })()}
      </div>

      <DecisionSlider
        param="P2" label="배압 (Back Pressure)" unit="barg"
        value={inputs.P2} min={0} max={5} step={0.05}
        onChange={v=>onChange("P2",v)}
        basis={`플레어 헤더 또는 방출 배관 압력. 현재 P2/P1 = ${bpRatio}%. 허용 한도 = ${(inputs.valveType==="BELLOWS"?"벨로우즈형":"스프링식")} 기준 ${allowableBpPct.toFixed(0)}% (KOSHA D-18 §7.2(4)).${bpRatio>allowableBpPct?" 한도 초과 — 벨로우즈형 전환 또는 배관 재설계 검토.":""}`}
        warning={bpWarning}
      />
      {/* COMPRESSIBILITY-001: Z는 Asset이 아니라 Calculation Input —
          설비 속성이 아니라 유체·운전조건에 따라 케이스마다 달라지므로
          Case가 직접 소유하고 편집 가능해야 한다 (OP와는 반대). */}
      <DecisionSlider
        param="Z" label="압축계수 (Compressibility Z)" unit=""
        value={inputs.Z} min={0.5} max={1.2} step={0.01}
        onChange={v=>onChange("Z",v)}
        basis="실측 P-V-T 데이터 또는 상태방정식(SRK, PR 등)에서 산정. 기본값 1.00은 이상기체 가정 — 고압·저온 조건에서 실제 유체는 1.00과 벗어날 수 있으며, 벗어날수록 소요 면적 산정 오차가 커진다."
      />

      {/* ── 5. 방출계수 결정 ── */}
      <SectionHeader step="5" title="방출계수 Kd" sub="어떤 근거로 이 계수를 적용하는가"/>
      <DecisionChoice
        param="Kd" label="방출계수 선택"
        options={KD_OPTIONS}
        value={inputs.Kd}
        onChange={v=>{ const opt=KD_OPTIONS.find(o=>Math.abs(o.value-v)<0.001); if(opt) handleKdSelect(opt); }}
      />
      {/* Kd 커스텀 슬라이더 (미세 조정용, 접혀 있음) */}
      <details style={{marginBottom:10}}>
        <summary style={{fontSize:10,color:T.sub,fontFamily:font.mono,cursor:"pointer",padding:"4px 2px"}}>제조사 실측값 직접 입력</summary>
        <div style={{marginTop:6,padding:"10px 12px",background:T.bg,borderRadius:9,border:`1px solid ${T.border}`}}>
          <input type="range" min={0.5} max={1.0} step={0.005} value={inputs.Kd}
            onChange={e=>onChange("Kd",+e.target.value)}
            style={{width:"100%",accentColor:T.navyLight}}/>
          <div style={{textAlign:"center",fontSize:12,fontFamily:font.mono,fontWeight:700,color:T.navyLight,marginTop:4}}>{inputs.Kd.toFixed(3)}</div>
        </div>
      </details>

      {/* ── 6. 배압보정계수 — 시스템 계산값 (사용자 직접 선택 금지) ── */}
      <SectionHeader step="6" title="배압보정계수 Kb" sub="P1, P2로부터 시스템이 계산 — 직접 선택 불가"/>
      <div style={{
        background: kbCalc.status==="out_of_range" ? T.redBg : T.bg,
        borderRadius:12, padding:"14px 16px", marginBottom:10,
        border:`1.5px solid ${kbCalc.status==="out_of_range" ? T.red : T.border}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono}}>Kb</span>
            <span style={{fontSize:9,padding:"2px 7px",borderRadius:5,
              background: kbOverride ? T.orangeBg : T.greenBg,
              color: kbOverride ? "#946200" : T.greenDk,
              border:`1px solid ${kbOverride ? T.orange : T.green}`,
              fontFamily:font.mono,fontWeight:700}}>
              {kbOverride ? "ENGINEER OVERRIDE" : "SYSTEM CALCULATED"}
            </span>
          </div>
          <div style={{fontSize:22,fontWeight:900,color:T.navyLight,fontFamily:font.mono}}>
            {Number(inputs.Kb).toFixed(3)}
          </div>
        </div>
        <div style={{fontSize:11,color:T.sub,fontFamily:font.sans,lineHeight:1.6,marginBottom:10}}>
          {kbOverride
            ? "엔지니어 override 적용 중 — 아래 근거를 반드시 기록하세요."
            : kbCalc.basis}
        </div>
        {kbCalc.status==="out_of_range" && !kbOverride && (
          <div style={{fontSize:11,color:T.red,fontFamily:font.sans,fontWeight:700,marginBottom:10}}>
            ⚠ 표준 곡선 범위 초과 — 제조사 데이터 확인 후 override 필요
          </div>
        )}

        {!kbOverride ? (
          <button onClick={()=>setKbOverride(true)}
            style={{fontSize:10,color:T.sub,background:"none",border:`1px dashed ${T.border}`,
              borderRadius:7,padding:"6px 10px",cursor:"pointer",fontFamily:font.mono}}>
            제조사 곡선값으로 override (근거 기록 필요)
          </button>
        ) : (
          <div>
            <input type="range" min={0.5} max={1.0} step={0.005} value={inputs.Kb}
              onChange={e=>onChange("Kb",+e.target.value)}
              style={{width:"100%",accentColor:T.orange,marginBottom:8}}/>
            <textarea
              value={kbOverrideReason}
              onChange={e=>setKbOverrideReason(e.target.value)}
              placeholder="override 근거 필수 — 예: 제조사 Kb 곡선 Doc.No.XXX 기준 0.88 적용"
              rows={2}
              style={{width:"100%",borderRadius:8,border:`1.5px solid ${kbOverrideReason.trim()?T.orange:T.red}`,
                padding:"8px 10px",fontSize:11,fontFamily:font.sans,color:T.text,
                resize:"none",boxSizing:"border-box",background:T.white,outline:"none",marginBottom:8}}
            />
            <button onClick={()=>{ setKbOverride(false); setKbOverrideReason(""); }}
              style={{fontSize:10,color:T.sub,background:"none",border:`1px solid ${T.border}`,
                borderRadius:7,padding:"6px 10px",cursor:"pointer",fontFamily:font.mono}}>
              시스템 계산값으로 복귀
            </button>
          </div>
        )}
      </div>

      {/* ── 결정 요약 ── */}
      <div style={{background:T.navy,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:700,color:"#7B9EC0",fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>사양 결정 요약</div>

        {/* Governing Relief Load — 실제 sizing에 쓰이는 W와 그 근거를 명확히 표시.
            Manual/Scenario 두 값이 동시에 "사용 중"으로 보이지 않도록 하나만 강조. */}
        <div style={{background:"#FFFFFF12",borderRadius:10,padding:"10px 12px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono,letterSpacing:0.5}}>GOVERNING RELIEF LOAD</span>
            <span style={{fontSize:9,padding:"2px 7px",borderRadius:5,fontFamily:font.mono,fontWeight:700,
              background: effectiveWSource==="GOVERNING_RELIEF_LOAD" ? T.green : "#FFFFFF22",
              color: effectiveWSource==="GOVERNING_RELIEF_LOAD" ? T.navy : "#B8CBE0"}}>
              {effectiveWSource==="GOVERNING_RELIEF_LOAD" ? "SCENARIO 기반" : "MANUAL 기반"}
            </span>
          </div>
          <div style={{fontSize:20,fontWeight:900,color:T.white,fontFamily:font.mono}}>
            {Number(effectiveW).toLocaleString(undefined,{maximumFractionDigits:1})} <span style={{fontSize:12,color:"#7B9EC0"}}>kg/h</span>
          </div>
          {effectiveWSource==="GOVERNING_RELIEF_LOAD" && (
            <div style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono,marginTop:2}}>
              Basis: {RELIEF_LOAD_BASIS_LABEL[reliefLoadScenarioType]} — Manual W({inputs.W} kg/h)는 사용되지 않음
            </div>
          )}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
          {[
            ["P1/MAWP", `${inputs.P1}/${inputs.mawp} b`],
            ["P2", `${inputs.P2} barg`],
            ["M / k", `${inputs.M} / ${inputs.k}`],
            ["Kd", inputs.Kd.toFixed(3)],
            ["Kb", inputs.Kb.toFixed(2)],
          ].map(([k,v])=>(
            <div key={k} style={{background:"#FFFFFF12",borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
              <div style={{fontSize:9,color:"#7B9EC0",fontFamily:font.mono}}>{k}</div>
              <div style={{fontSize:12,fontWeight:900,color:T.white,fontFamily:font.mono}}>{v}</div>
            </div>
          ))}
        </div>
        {mawpWarning && (
          <div style={{marginTop:10,background:T.redBg,border:`1px solid ${T.red}`,borderRadius:8,padding:"7px 10px",fontSize:11,color:T.red,fontFamily:font.sans,fontWeight:700}}>
            ⚠ 설정압력({inputs.P1} barg)이 MAWP({inputs.mawp} barg)를 초과합니다. 계산 전 수정 필요.
          </div>
        )}
      </div>

      {(() => {
        const reliefLoadIncomplete = reliefLoadScenarioType !== null && reliefLoadAdapter?.valid !== true;
        const blockReason = mawpWarning
          ? "⚠ 설정압 오류 — 수정 후 진행 가능"
          : (kbOverride && !kbOverrideReason.trim())
          ? "⚠ Kb override 근거를 입력해야 진행 가능"
          : reliefLoadIncomplete
          ? "⚠ Relief Load 시나리오 입력을 완료해야 진행 가능"
          : null;
        return (
          <button onClick={onSubmit} disabled={!!blockReason}
            style={{width:"100%",padding:"16px",background:blockReason?T.border:T.navyLight,color:T.white,border:"none",borderRadius:14,fontSize:15,fontWeight:900,fontFamily:font.sans,cursor:blockReason?"not-allowed":"pointer",boxShadow:blockReason?"none":`0 5px 0 ${T.navy}`,transition:"all 0.15s",letterSpacing:0.5}}>
            {blockReason || "사양 확정 → 계산 실행"}
          </button>
        );
      })()}
    </div>
  );
}


// ── components/WorkflowTransition.jsx ──────────────────────────
//  WORKFLOW TRANSITION — 코멘트 포함 전환 UI
// ════════════════════════════════════════════════════════════════
function WorkflowTransition({ currentState, nextStates, onAdvance }) {
  const [comment, setComment] = useState("");
  const [selected, setSelected] = useState(nextStates[0]);

  return (
    <div style={{marginTop:14,background:T.cardBg,borderRadius:14,padding:14,border:`1px solid ${T.border}`}}>
      <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:10,letterSpacing:1}}>WORKFLOW 전환</div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        {nextStates.map(ns => (
          <button key={ns} onClick={()=>setSelected(ns)} style={{padding:"8px 14px",background:selected===ns?WF_COLOR[ns]+"22":T.bg,border:`1.5px solid ${selected===ns?WF_COLOR[ns]:T.border}`,borderRadius:10,fontSize:11,fontWeight:700,color:selected===ns?WF_COLOR[ns]:T.sub,fontFamily:font.mono,cursor:"pointer",transition:"all 0.12s"}}>
            {WF_LABEL[ns]}
          </button>
        ))}
      </div>
      <textarea
        value={comment}
        onChange={e=>setComment(e.target.value)}
        placeholder="전환 사유 또는 검토 의견 (선택)"
        rows={2}
        style={{width:"100%",borderRadius:9,border:`1px solid ${T.border}`,padding:"8px 10px",fontSize:11,fontFamily:font.sans,color:T.text,resize:"none",boxSizing:"border-box",background:T.bg,marginBottom:10,outline:"none"}}
      />
      <button onClick={()=>{ onAdvance(selected, comment); setComment(""); }} style={{width:"100%",padding:"11px",background:WF_COLOR[selected],color:T.white,border:"none",borderRadius:10,fontSize:12,fontWeight:700,fontFamily:font.mono,cursor:"pointer",boxShadow:`0 3px 0 ${WF_COLOR[selected]}88`}}>
        → {WF_LABEL[selected]}(으)로 전환
      </button>
    </div>
  );
}


// ── components/ApprovalForm.jsx ──────────────────────────
//  APPROVAL FORM — 전자서명 UI
//  hash 계산, 서명 검증, workflow 판단 전부 금지 — submitApproval()만 호출한다.
//  REVIEW 상태에서만 노출 (ReportView가 조건부 렌더링으로 보장).
// ════════════════════════════════════════════════════════════════
function ApprovalForm({ snap, onSubmit }) {
  const [signer,     setSigner]     = useState("");
  const [role,       setRole]       = useState(APPROVAL_ROLES[0]);
  const [decision,   setDecision]   = useState("approve");
  const [comment,    setComment]    = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error,      setError]      = useState(null);

  const canSubmit = signer.trim().length > 0 && !submitting;

  const handleSubmit = async () => {
    setSubmitting(true);
    setError(null);
    const result = await onSubmit({ decision, comment, signer: signer.trim(), role });
    setSubmitting(false);
    if (!result || !result.ok) {
      setError(result?.reason || "승인 처리에 실패했습니다.");
      return;
    }
    setComment("");
  };

  const accent = decision === "approve" ? T.green : T.red;

  return (
    <div style={{marginTop:14,background:T.cardBg,borderRadius:14,padding:14,border:`2px solid ${T.navyLight}`}}>
      <div style={{fontSize:10,fontWeight:700,color:T.navyLight,fontFamily:font.mono,marginBottom:2,letterSpacing:1}}>
        전자서명 · APPROVAL
      </div>
      <div style={{fontSize:10,color:T.gray,fontFamily:font.mono,marginBottom:10}}>
        서명 대상: {snap.id} · hash {(snap.snapshotHash || "").slice(0,12)}…
      </div>

      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <input
          value={signer}
          onChange={e=>setSigner(e.target.value)}
          placeholder="서명자 이름"
          style={{flex:1,padding:"8px 10px",borderRadius:9,border:`1px solid ${T.border}`,fontSize:12,fontFamily:font.sans,outline:"none",boxSizing:"border-box"}}
        />
        <select
          value={role}
          onChange={e=>setRole(e.target.value)}
          style={{padding:"8px 10px",borderRadius:9,border:`1px solid ${T.border}`,fontSize:11,fontFamily:font.mono,background:T.bg}}
        >
          {APPROVAL_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <button onClick={()=>setDecision("approve")} style={{flex:1,padding:"9px",borderRadius:9,
          border:`1.5px solid ${decision==="approve"?T.green:T.border}`,
          background:decision==="approve"?T.greenBg:T.bg,
          color:decision==="approve"?T.green:T.sub,
          fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>
          ✓ 승인
        </button>
        <button onClick={()=>setDecision("request_change")} style={{flex:1,padding:"9px",borderRadius:9,
          border:`1.5px solid ${decision==="request_change"?T.red:T.border}`,
          background:decision==="request_change"?T.redBg:T.bg,
          color:decision==="request_change"?T.red:T.sub,
          fontWeight:700,fontSize:12,fontFamily:font.mono,cursor:"pointer"}}>
          ↺ 조치 요청
        </button>
      </div>

      <textarea
        value={comment}
        onChange={e=>setComment(e.target.value)}
        placeholder="승인/반려 사유 — 서명 대상에 포함되어 위변조 시 감지됩니다"
        rows={3}
        style={{width:"100%",borderRadius:9,border:`1px solid ${T.border}`,padding:"8px 10px",fontSize:11,fontFamily:font.sans,color:T.text,resize:"none",boxSizing:"border-box",background:T.bg,marginBottom:10,outline:"none"}}
      />

      {error && (
        <div style={{fontSize:11,color:T.red,fontFamily:font.mono,marginBottom:8}}>⚠ {error}</div>
      )}

      <button
        onClick={handleSubmit}
        disabled={!canSubmit}
        style={{width:"100%",padding:"11px",
          background: canSubmit ? accent : T.gray,
          color:T.white,border:"none",borderRadius:10,fontSize:12,fontWeight:700,fontFamily:font.mono,
          cursor:canSubmit?"pointer":"not-allowed",
          boxShadow:canSubmit?`0 3px 0 ${accent}88`:"none"}}
      >
        {submitting ? "서명 처리 중…" : `전자서명 후 ${decision==="approve"?"승인":"조치 요청"}`}
      </button>
    </div>
  );
}

//  APPROVAL HISTORY — 서명 검증 배지 타임라인
//  검증(verifyApprovalRecord)은 이 컴포넌트가 직접 하지 않는다.
//  ReportView가 1회 계산한 verifiedResults를 그대로 표시만 한다.
//  (AuditEvidence의 ApprovalEvidence와 동일한 결과를 공유 — 중복 검증 호출 방지)
// ════════════════════════════════════════════════════════════════
function ApprovalHistory({ approvals, verifiedResults }) {
  if (!approvals || approvals.length === 0) return null;

  return (
    <div style={{marginTop:14}}>
      <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:8,letterSpacing:1}}>
        승인 이력 · APPROVAL TIMELINE
      </div>
      {approvals.slice().reverse().map(rec => {
        const v  = (verifiedResults || {})[rec.approvalId];
        const ok = v?.valid;
        const badgeColor = v === undefined ? T.gray : ok ? T.green : T.red;
        return (
          <div key={rec.approvalId} style={{background:T.cardBg,borderRadius:12,padding:"10px 12px",marginBottom:8,border:`1px solid ${T.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
              <div style={{fontSize:12,fontWeight:700,color:T.navy,fontFamily:font.mono}}>
                {rec.approver} <span style={{color:T.sub,fontWeight:400}}>({rec.role})</span>
              </div>
              <div style={{fontSize:10,fontWeight:700,fontFamily:font.mono,color:badgeColor}}>
                {v === undefined ? "검증 중…" : ok ? "✓ 서명 유효" : "✗ 위변조 의심"}
              </div>
            </div>
            <div style={{fontSize:11,color:T.sub,fontFamily:font.sans,marginTop:4}}>
              {rec.decision === "approve" ? "승인" : "조치 요청"} · {(rec.approvedAt || "").slice(0,19).replace("T"," ")}
            </div>
            {rec.comment && (
              <div style={{fontSize:11,color:T.text,fontFamily:font.sans,marginTop:6,background:T.bg,borderRadius:8,padding:"6px 8px"}}>
                “{rec.comment}”
              </div>
            )}
            {v && !ok && (
              <div style={{fontSize:10,color:T.red,fontFamily:font.mono,marginTop:6}}>
                [{v.contract}] {v.reason}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}


// ── components/NewCaseForm.jsx ──────────────────────────

        <input

        <input

          onChange={(e) => setLoc(e.target.value)}

          style={{...iStyle, border:`1.5px solid ${T.border}`}}

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:5}}>유체</div>

        <div style={{fontSize:11,fontWeight:700,color:T.sub,fontFamily:font.mono,marginBottom:5}}>검토 유형</div>
        <select value={review} onChange={(e) => setReview(e.target.value)}
          style={{...iStyle, border:`1.5px solid ${T.border}`, cursor:"pointer"}}>
          {REVIEW_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>

      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel}
          style={{flex:1,padding:"13px",background:T.bg,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:11,fontSize:13,
            fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          취소
        </button>
        <button
          onClick={()=>{ if(valid) onConfirm({tag:tag.trim(),loc,fluid,review}); }}
          style={{flex:2,padding:"13px",
            background:valid?T.navyLight:"#CBD5E1",
            color:T.white,border:"none",borderRadius:11,fontSize:13,
            fontWeight:900,fontFamily:font.sans,
            cursor:valid?"pointer":"not-allowed",
            boxShadow:valid?`0 4px 0 ${T.navy}`:"none",
            transition:"all 0.15s"}}>
          {valid ? "검토 등록 →" : "Tag 입력 후 등록"}
        </button>
      </div>
    </div>
  );
}


// ── components/AssetMaster.jsx ──────────────────────────
//  ASSET MASTER — Equipment + DischargeSystem 등록/조회/선택
// ════════════════════════════════════════════════════════════════

const DEST_OPTIONS = [

];

// ── 공통 스타일 헬퍼 ────────────────────────────────────────
const iS = (extra={}) => ({

});
const Lbl = ({txt, req}) => (

// ── EquipmentForm ─────────────────────────────────────────────
function EquipmentForm({ onSave, onCancel, editing }) {
  const isRevision = !!editing;
  const [f, setF] = useState(editing ? {
    tag: editing.tag, location: editing.location, deviceType: editing.deviceType,
    mawp: editing.mawp, setPressure: editing.setPressure,
    overpressure: editing.overpressure, orifice: editing.orifice,
    inletSize: editing.inletSize, outletSize: editing.outletSize,
    manufacturer: editing.manufacturer, model: editing.model,
    serialNo: editing.serialNo, installedAt: editing.installedAt,
    inletPiping: editing.inletPiping
      ? { L: String(editing.inletPiping.L), D: String(editing.inletPiping.D), fittingsK: String(editing.inletPiping.fittingsK) }
      : { L:"", D:"", fittingsK:"" },
    mocId: "",
  } : {
    tag:"", location:"", deviceType:"safetyValve",
    mawp:6.0, setPressure:5.5, overpressure:10,
    inletSize:"3\"", outletSize:"4\"", orifice:"",
    manufacturer:"", model:"", serialNo:"", installedAt:"",
    inletPiping: { L:"", D:"", fittingsK:"" },
    mocId:"",
  });
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const updInlet = (k,v) => setF(p=>({...p, inletPiping:{...p.inletPiping, [k]:v}}));
  const psetErr = f.setPressure > f.mawp;
  // INLET-LOSS-001: 인입배관은 선택 항목 — 3개 다 비어있으면 "미등록"으로
  // 저장(null). 일부만 채워진 상태는 부정확한 판정으로 이어지므로 저장을
  // 막는다(fail-fast) — 임의로 나머지를 기본값으로 채우지 않는다.
  const ipAllEmpty = f.inletPiping.L === "" && f.inletPiping.D === "" && f.inletPiping.fittingsK === "";
  const ipPartial = !ipAllEmpty && (f.inletPiping.L === "" || f.inletPiping.D === "" || f.inletPiping.fittingsK === "");
  const ipInvalid = !ipAllEmpty && !ipPartial && (
    isNaN(Number(f.inletPiping.L)) || isNaN(Number(f.inletPiping.D)) || isNaN(Number(f.inletPiping.fittingsK)) ||
    Number(f.inletPiping.D) <= 0 || Number(f.inletPiping.L) < 0 || Number(f.inletPiping.fittingsK) < 0
  );
  const valid = f.tag.trim() && f.mawp>0 && f.setPressure>0 && !psetErr &&
    f.overpressure !== "" && f.overpressure !== null && !isNaN(Number(f.overpressure)) && Number(f.overpressure) >= 0 &&
    !ipPartial && !ipInvalid &&
    (!isRevision || f.mocId.trim().length > 0);

  const handleSave = () => {
    if (!valid) return;
    const inletPipingPayload = ipAllEmpty ? null : {
      L: Number(f.inletPiping.L), D: Number(f.inletPiping.D), fittingsK: Number(f.inletPiping.fittingsK),
    };
    const payload = { ...f, inletPiping: inletPipingPayload };
    if (isRevision) {
      const result = reviseEquipment(editing, payload);
      if (!result.ok) { alert(`${result.field}: ${result.reason}`); return; }
      onSave(result.equipment);
      return;
    }
    try { onSave(createEquipment(payload)); } catch(e) { alert(e.message); }
  };

  return (
    <div style={{background:T.cardBg,borderRadius:16,padding:18,
      border:`1.5px solid ${T.border}`,boxShadow:"0 4px 16px #0002"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          {isRevision ? `설비 개정 — ${editing.tag}` : "PSV 설비 등록"}
        </div>
        {isRevision && (
          <div style={{fontSize:10,fontWeight:700,color:T.orange,fontFamily:font.mono}}>
            Rev.{editing.revision} → Rev.{editing.revision + 1}
          </div>
        )}
      </div>

      {isRevision && (
        <Section title="MOC (변경 관리)">
          <Field label="MOC 번호" req>
            <input value={f.mocId}
              onChange={e=>upd("mocId",e.target.value)}
              placeholder="MOC-2026-0012"
              style={iS({border:`1.5px solid ${f.mocId.trim()?T.navyLight:T.red}`})}/>
            <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
              설비 사양 개정은 MOC 번호 없이 저장할 수 없습니다 — 근거 없는 변경 차단.
            </div>
          </Field>
        </Section>
      )}

      <Section title="기본 정보">
        <Row2
          a={<Field label="Tag No." req><input value={f.tag}
            onChange={e=>upd("tag",e.target.value)}
            onInput={e=>upd("tag",e.target.value)}
            placeholder="PSV-R201" autoComplete="off"
            style={iS({border:`1.5px solid ${f.tag.trim()?T.navyLight:T.border}`})}/></Field>}
          b={<Field label="설치 위치"><input value={f.location}
            onChange={e=>upd("location",e.target.value)}
            placeholder="반응기 R-201 상부"
            style={iS()}/></Field>}
        />
        <Field label="밸브 종류">
          <div style={{display:"flex",gap:8}}>
            {DEVICE_OPTIONS.map(d=>(
              <div key={d.id} onClick={()=>upd("deviceType",d.id)}
                style={{flex:1,padding:"8px 10px",borderRadius:9,cursor:"pointer",
                  textAlign:"center",
                  border:`2px solid ${f.deviceType===d.id?T.navyLight:T.border}`,
                  background:f.deviceType===d.id?T.navy+"0D":T.white,
                  fontSize:12,fontWeight:700,
                  color:f.deviceType===d.id?T.navy:T.text,
                  fontFamily:font.sans}}>
                {d.label}
              </div>
            ))}
          </div>
        </Field>
      </Section>

      <Section title="압력 및 오리피스">
        <Row2
          a={<Field label="MAWP (barg)" req>
            <input type="number" value={f.mawp} step={0.1} min={0.1}
              onChange={e=>upd("mawp",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="설정압 (barg)" req>
            <input type="number" value={f.setPressure} step={0.1} min={0.1}
              onChange={e=>upd("setPressure",+e.target.value)}
              style={iS({border:`1.5px solid ${psetErr?T.red:T.border}`})}/>
            {psetErr && <div style={{fontSize:9,color:T.red,marginTop:3}}>MAWP 초과</div>}
          </Field>}
        />
        <Row2
          a={<Field label="초과압력 Overpressure (%)" req>
            <input type="number" value={f.overpressure} step={1} min={0} max={50}
              onChange={e=>upd("overpressure",+e.target.value)} style={iS()}/>
            <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
              relieving pressure 절대압 산정에 사용 (API 520): P1abs=Pset×(1+OP%)+대기압. 단일밸브 기본 10%.
            </div>
          </Field>}
          b={<div/>}
        />
        <Row2
          a={<Field label="오리피스">
            <input value={f.orifice}
              onChange={e=>upd("orifice",e.target.value.toUpperCase())}
              placeholder="P" style={iS()}/>
          </Field>}
          b={<Field label="입구/출구 Size">
            <div style={{display:"flex",gap:6}}>
              <input value={f.inletSize} onChange={e=>upd("inletSize",e.target.value)}
                placeholder='3"' style={iS({width:"50%"})}/>
              <input value={f.outletSize} onChange={e=>upd("outletSize",e.target.value)}
                placeholder='4"' style={iS({width:"50%"})}/>
            </div>
          </Field>}
        />
      </Section>

      <Section title="인입배관 (선택 — KOSHA D-18-2020 §7.2(1) 압력손실 3% 판정용)">
        <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginBottom:8,lineHeight:1.5}}>
          설치대상 용기에서 이 안전밸브 인입 플랜지까지의 실제 배관 형상.
          위 "입구 Size"({f.inletSize || "—"})는 명목 규격 표시일 뿐 — 여기 입력한
          값만 계산에 실제로 쓰입니다. 3개 다 비워두면 미등록(판정 보류) 처리됩니다.
        </div>
        <Row2
          a={<Field label="배관 길이 L (m)">
            <input type="number" value={f.inletPiping.L} step={0.1}
              onChange={e=>updInlet("L",e.target.value)}
              placeholder="예: 3.5" style={iS()}/>
          </Field>}
          b={<Field label="배관 내경 D (m)">
            <input type="number" value={f.inletPiping.D} step={0.001}
              onChange={e=>updInlet("D",e.target.value)}
              placeholder="예: 0.08" style={iS()}/>
          </Field>}
        />
        <Field label="배관 부속 저항계수 ΣK">
          <input type="number" value={f.inletPiping.fittingsK} step={0.1}
            onChange={e=>updInlet("fittingsK",e.target.value)}
            placeholder="예: 1.5" style={iS()}/>
        </Field>
        {ipPartial && (
          <div style={{fontSize:10,color:T.red,fontFamily:font.sans,marginTop:-6,marginBottom:10}}>
            L / D / ΣK 중 일부만 입력됐습니다 — 3개 모두 입력하거나 모두 비워두세요 (임의 기본값을 채우지 않습니다).
          </div>
        )}
        {ipInvalid && (
          <div style={{fontSize:10,color:T.red,fontFamily:font.sans,marginTop:-6,marginBottom:10}}>
            내경(D)은 0보다 커야 하고, 길이(L)·ΣK는 0 이상이어야 합니다.
          </div>
        )}
      </Section>

      <Section title="제조사 정보 (선택)">
        <Row2
          a={<Field label="제조사"><input value={f.manufacturer}
            onChange={e=>upd("manufacturer",e.target.value)}
            placeholder="Crosby" style={iS()}/></Field>}
          b={<Field label="모델"><input value={f.model}
            onChange={e=>upd("model",e.target.value)}
            placeholder="JOS-E" style={iS()}/></Field>}
        />
        <Row2
          a={<Field label="Serial No."><input value={f.serialNo}
            onChange={e=>upd("serialNo",e.target.value)}
            placeholder="SN-2024-001" style={iS()}/></Field>}
          b={<Field label="설치일"><input type="date" value={f.installedAt}
            onChange={e=>upd("installedAt",e.target.value)}
            style={iS()}/></Field>}
        />
      </Section>

      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel}
          style={{flex:1,padding:"12px",background:T.bg,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:11,
            fontSize:12,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          취소
        </button>
        <button onClick={handleSave}
          style={{flex:2,padding:"12px",
            background:valid?T.navyLight:"#CBD5E1",
            color:T.white,border:"none",borderRadius:11,fontSize:13,
            fontWeight:900,fontFamily:font.sans,
            cursor:valid?"pointer":"not-allowed",
            boxShadow:valid?`0 4px 0 ${T.navy}`:"none"}}>
          {valid?(isRevision?"개정 저장 →":"설비 등록 →"):"필수 항목 입력 필요"}
        </button>
      </div>
    </div>
  );
}

// ── DischargeSystemForm ───────────────────────────────────────
// editing이 있으면 "개정" 모드: mocId 필수, revision은 자동 증가(읽기 전용 표시)
function DischargeSystemForm({ onSave, onCancel, editing }) {
  const isRevision = !!editing;
  const [f, setF] = useState(editing ? {
    name: editing.name, destination: editing.destination,
    L: editing.L, D: editing.D, fittingsK: editing.fittingsK,
    headerPressure: editing.headerPressure,
    connectedTags: (editing.connectedTags || []).join(", "),
    mocId: "",
  } : {
    name:"", destination:"flare",
    L:15, D:0.1, fittingsK:3.0, headerPressure:0.3, connectedTags:"",
    mocId:"",
  });
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const valid = f.name.trim() && f.D > 0 && f.L >= 0 &&
    (!isRevision || f.mocId.trim().length > 0);

  const handleSave = () => {
    if (!valid) return;
    const tags = f.connectedTags.split(",").map(t=>t.trim()).filter(Boolean);
    if (isRevision) {
      const result = reviseDischargeSystem(editing, { ...f, connectedTags: tags });
      if (!result.ok) { alert(`${result.field}: ${result.reason}`); return; }
      onSave(result.dischargeSystem);
      return;
    }
    try {
      onSave(createDischargeSystem({ ...f, connectedTags: tags }));
    } catch(e) { alert(e.message); }
  };

  return (
    <div style={{background:T.cardBg,borderRadius:16,padding:18,
      border:`1.5px solid ${T.border}`,boxShadow:"0 4px 16px #0002"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          {isRevision ? `배출계통 개정 — ${editing.name}` : "배출계통 등록"}
        </div>
        {isRevision && (
          <div style={{fontSize:10,fontWeight:700,color:T.orange,fontFamily:font.mono}}>
            Rev.{editing.revision} → Rev.{editing.revision + 1}
          </div>
        )}
      </div>

      {isRevision && (
        <Section title="MOC (변경 관리)">
          <Field label="MOC 번호" req>
            <input value={f.mocId}
              onChange={e=>upd("mocId",e.target.value)}
              placeholder="MOC-2026-0012"
              style={iS({border:`1.5px solid ${f.mocId.trim()?T.navyLight:T.red}`})}/>
            <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
              배관 개정은 MOC 번호 없이 저장할 수 없습니다 — 근거 없는 변경 차단.
            </div>
          </Field>
        </Section>
      )}

      <Section title="계통 정보">
        <Field label="계통 명칭" req>
          <input value={f.name}
            onChange={e=>upd("name",e.target.value)}
            onInput={e=>upd("name",e.target.value)}
            placeholder="LP-FLARE-01" autoComplete="off"
            style={iS({border:`1.5px solid ${f.name.trim()?T.navyLight:T.border}`})}/>
        </Field>
        <Field label="배출 목적지">
          <div style={{display:"flex",gap:6}}>
            {DEST_OPTIONS.map(d=>(
              <div key={d.id} onClick={()=>upd("destination",d.id)}
                style={{flex:1,padding:"8px",borderRadius:9,cursor:"pointer",
                  textAlign:"center",
                  border:`2px solid ${f.destination===d.id?T.navyLight:T.border}`,
                  background:f.destination===d.id?T.navy+"0D":T.white}}>
                <div style={{fontSize:11,fontWeight:700,
                  color:f.destination===d.id?T.navy:T.text,
                  fontFamily:font.sans}}>{d.label}</div>
                <div style={{fontSize:9,color:T.sub}}>{d.note}</div>
              </div>
            ))}
          </div>
        </Field>
      </Section>

      <Section title="배관 형상 (도면 기준)">
        <Row2
          a={<Field label="배관 길이 L (m)" req>
            <input type="number" value={f.L} step={0.5} min={0}
              onChange={e=>upd("L",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="배관 내경 D (m)" req>
            <input type="number" value={f.D} step={0.005} min={0.01}
              onChange={e=>upd("D",+e.target.value)}
              style={iS({border:`1.5px solid ${f.D>0?T.border:T.red}`})}/>
          </Field>}
        />
        <Row2
          a={<Field label="Fittings ΣK">
            <input type="number" value={f.fittingsK} step={0.1} min={0}
              onChange={e=>upd("fittingsK",+e.target.value)} style={iS()}/>
          </Field>}
          b={<Field label="Header 압력 (barg)">
            <input type="number" value={f.headerPressure} step={0.05} min={0}
              onChange={e=>upd("headerPressure",+e.target.value)} style={iS()}/>
          </Field>}
        />
        <Field label="연결 PSV Tag (쉼표 구분)">
          <input value={f.connectedTags}
            onChange={e=>upd("connectedTags",e.target.value)}
            placeholder="PSV-R201, PSV-R202" style={iS()}/>
          <div style={{fontSize:9,color:T.gray,fontFamily:font.sans,marginTop:3}}>
            이 계통을 공유하는 PSV tag를 쉼표로 구분해 입력
          </div>
        </Field>
      </Section>

      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel}
          style={{flex:1,padding:"12px",background:T.bg,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:11,
            fontSize:12,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          취소
        </button>
        <button onClick={handleSave}
          style={{flex:2,padding:"12px",
            background:valid?T.navyLight:"#CBD5E1",
            color:T.white,border:"none",borderRadius:11,fontSize:13,
            fontWeight:900,fontFamily:font.sans,
            cursor:valid?"pointer":"not-allowed",
            boxShadow:valid?`0 4px 0 ${T.navy}`:"none"}}>
          {valid?(isRevision?"개정 저장 →":"배출계통 등록 →"):"필수 항목 입력 필요"}
        </button>
      </div>
    </div>
  );
}

// ── RevisionHistoryPanel ────────────────────────────────────────
// B1: Asset Revision History — 100% 읽기 전용(Read-only).
// 책임: Revision 목록 표시 / Rev·MOC ID 배지 / 현재(최신) 표시 / 선택 / 상세 표시.
// 의도적으로 하지 않는 것: Diff(B2), Impact Analysis(B3), 되돌리기, 수정.
// 이 컴포넌트는 onSave/onRevise류 콜백을 전혀 받지 않는다 — 구조적으로 쓰기 경로가 없다.
function RevisionHistoryPanel({ title, history, id, kind, allSnapshots, onClose }) {
  const revisions = getRevisionsFor(history, id);           // 오름차순
  const latest    = getLatestRevision(history, id);
  const [selected, setSelected] = useState(latest);
  // 비교 대상 revision — 기본값은 선택된 revision의 직전(N-1). 자동 계산이며 저장하지 않는다.
  const defaultCompareRev = selected
    ? revisions.find(r => r.revision === selected.revision - 1) || null
    : null;
  const [compareRevNum, setCompareRevNum] = useState(defaultCompareRev?.revision ?? "");

  if (revisions.length === 0) return null;

  const EQ_FIELDS = [
    ["tag","Tag No."], ["location","설치 위치"],
    ["mawp","MAWP (barg)"], ["setPressure","설정압 (barg)"],
    ["overpressure","Overpressure (%)"], ["orifice","오리피스"],
    ["inletSize","입구 Size"], ["outletSize","출구 Size"],
    // INLET-LOSS-001: dot-path 필드 — _getPath()로 읽어야 값이 나온다
    // (일반 selected[k] 방식은 중첩 객체라 undefined가 됨).
    ["inletPiping.L","인입배관 길이 L (m)"], ["inletPiping.D","인입배관 내경 D (m)"],
    ["inletPiping.fittingsK","인입배관 ΣK"],
    ["manufacturer","제조사"], ["model","모델"],
    ["serialNo","Serial No."], ["installedAt","설치일"],
  ];
  const DS_FIELDS = [
    ["name","계통 명칭"], ["destination","배출 목적지"],
    ["L","배관 길이 L (m)"], ["D","배관 내경 D (m)"],
    ["fittingsK","Fittings ΣK"], ["headerPressure","Header 압력 (barg)"],
    ["connectedTags","연결 PSV Tag"],
  ];
  const fields = kind === "equipment" ? EQ_FIELDS : DS_FIELDS;
  const fieldLabel = k => (fields.find(f => f[0] === k) || [k, k])[1];

  // ── B2: Diff — 선택된 revision을 compareRevNum(있으면)과 비교 ────
  const compareRev = compareRevNum === ""
    ? null
    : revisions.find(r => r.revision === Number(compareRevNum)) || null;
  const diff = (selected && compareRev)
    ? (kind === "equipment"
        ? diffEquipmentRevision(compareRev, selected)
        : diffDischargeSystemRevision(compareRev, selected))
    : [];

  // ── B3: Impact — 선택된 revision이 어디에 쓰였는지 (allSnapshots 필요) ──
  const revisionKey = selected ? `${selected.id}@${selected.revision}` : null;
  const impact = (revisionKey && allSnapshots)
    ? analyzeRevisionImpact(revisionKey, allSnapshots)
    : null;

  return (
    <div style={{background:T.cardBg,borderRadius:16,padding:16,
      border:`1.5px solid ${T.border}`,boxShadow:"0 4px 16px #0002",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
          Revision 이력 — {title}
        </div>
        <button onClick={onClose}
          style={{padding:"5px 12px",background:T.bg,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:8,
            fontSize:10,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          닫기
        </button>
      </div>

      {/* Revision 목록: 최신이 위로 오도록 내림차순 표시 */}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
        {[...revisions].reverse().map(rev => {
          const isLatest   = latest && rev.revision === latest.revision;
          const isSelected = selected && rev.revision === selected.revision;
          return (
            <div key={`${rev.id}@${rev.revision}`}
              onClick={()=>{
                setSelected(rev);
                const prev = revisions.find(r => r.revision === rev.revision - 1);
                setCompareRevNum(prev ? prev.revision : "");
              }}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"8px 12px",borderRadius:9,cursor:"pointer",
                border:`1.5px solid ${isSelected?T.navyLight:T.border}`,
                background:isSelected?T.navy+"0D":T.white}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
                  Rev.{rev.revision}
                </span>
                {isLatest && (
                  <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,
                    background:T.blueBg,color:T.blue,border:`1px solid ${T.blue}`,
                    fontFamily:font.mono,fontWeight:700}}>현재</span>
                )}
                {rev.mocId && (
                  <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,
                    background:T.bg,color:T.sub,border:`1px solid ${T.border}`,
                    fontFamily:font.mono}}>MOC {rev.mocId}</span>
                )}
              </div>
              <span style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>
                {rev.revision === 1 ? "최초 등록" : "개정"}
              </span>
            </div>
          );
        })}
      </div>

      {/* 선택된 Revision 상세 (읽기 전용) */}
      {selected && (
        <div style={{background:T.bg,borderRadius:12,padding:"12px 13px",
          border:`1px solid ${T.border}`,marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,
            marginBottom:10,letterSpacing:1}}>
            Rev.{selected.revision} 상세
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {fields.map(([k,label]) => (
              <div key={k}>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>{label}</div>
                <div style={{fontSize:11,fontWeight:700,color:T.navyLight,fontFamily:font.mono}}>
                  {Array.isArray(_getPath(selected,k)) ? (_getPath(selected,k).join(", ") || "—")
                    : (_getPath(selected,k) ?? "—") === "" ? "—" : String(_getPath(selected,k) ?? "—")}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* B2: 변경사항(Diff) — 읽기 전용. 쓰기 콜백 없음, diffEquipmentRevision/
          diffDischargeSystemRevision 결과를 그대로 표시만 한다. */}
      {selected && revisions.length > 1 && (
        <div style={{background:T.white,borderRadius:12,padding:"12px 13px",
          border:`1px solid ${T.border}`,marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
            marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,
              letterSpacing:1}}>변경사항 (Diff)</div>
            <select value={compareRevNum} onChange={e=>setCompareRevNum(e.target.value)}
              style={{fontSize:9,fontFamily:font.mono,padding:"3px 6px",
                borderRadius:6,border:`1px solid ${T.border}`,color:T.sub,background:T.bg}}>
              <option value="">비교 안 함</option>
              {revisions.filter(r=>r.revision!==selected.revision).map(r=>(
                <option key={r.revision} value={r.revision}>Rev.{r.revision}과 비교</option>
              ))}
            </select>
          </div>
          {!compareRev ? (
            <div style={{fontSize:10,color:T.gray,fontFamily:font.mono}}>
              비교 대상을 선택하세요.
            </div>
          ) : diff.length === 0 ? (
            <div style={{fontSize:10,color:T.gray,fontFamily:font.mono}}>
              Rev.{compareRev.revision} → Rev.{selected.revision}: 변경된 필드 없음
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {diff.map(c => (
                <div key={c.field} style={{display:"flex",alignItems:"center",
                  justifyContent:"space-between",fontSize:11,fontFamily:font.mono}}>
                  <span style={{color:T.sub}}>{fieldLabel(c.field)}</span>
                  <span style={{fontWeight:700,color:T.navyLight}}>
                    {String(c.from ?? "—")} → <span style={{color:T.orange}}>{String(c.to ?? "—")}</span>
                    {c.unit ? ` ${c.unit}` : ""}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* B3: 영향도(Impact) — 읽기 전용. analyzeRevisionImpact() 결과를 그대로 표시만 한다. */}
      {selected && impact && (
        <div style={{background:T.white,borderRadius:12,padding:"12px 13px",
          border:`1px solid ${T.border}`}}>
          <div style={{fontSize:10,fontWeight:700,color:T.sub,fontFamily:font.mono,
            marginBottom:10,letterSpacing:1}}>영향도 (Impact) — Rev.{selected.revision}</div>
          {impact.affectedSnapshots.length === 0 ? (
            <div style={{fontSize:10,color:T.gray,fontFamily:font.mono}}>
              이 Revision을 사용한 Case가 아직 없습니다.
            </div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>사용 중인 Case</div>
                <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
                  {impact.affectedCases.length}건
                </div>
              </div>
              <div>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>영향받는 Snapshot</div>
                <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
                  {impact.affectedSnapshots.length}건
                </div>
              </div>
              <div>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>현재도 최신으로 사용 중</div>
                <div style={{fontSize:14,fontWeight:900,color:T.blue,fontFamily:font.mono}}>
                  {impact.latestAffected.length}건
                </div>
              </div>
              <div>
                <div style={{fontSize:9,color:T.gray,fontFamily:font.mono}}>이미 대체됨(과거 이력)</div>
                <div style={{fontSize:14,fontWeight:900,color:T.gray,fontFamily:font.mono}}>
                  {impact.obsoleteSnapshots.length}건
                </div>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── EquipmentCard ─────────────────────────────────────────────
function EquipmentCard({ eq, dischargeSystem, onSelect, onEdit, onViewHistory }) {
  const ds = dischargeSystem;
  return (
    <div
      style={{display:"block",width:"100%",textAlign:"left",
        background:T.cardBg,borderRadius:14,padding:"13px 15px",
        marginBottom:10,border:`1.5px solid ${T.border}`,
        boxShadow:"0 2px 6px #0001",
        fontFamily:font.sans}}>
      <div style={{display:"flex",alignItems:"flex-start",
        justifyContent:"space-between",marginBottom:5}}>
        <div>
          <div style={{fontSize:15,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
            {eq.tag}
            <span style={{marginLeft:6,fontSize:9,fontWeight:700,color:T.sub}}>
              Rev.{eq.revision ?? 1}
            </span>
          </div>
          <div style={{fontSize:10,color:T.sub,fontFamily:font.mono,marginTop:1}}>
            {eq.location}
          </div>
        </div>
        <div style={{display:"flex",gap:5,flexShrink:0}}>
          <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,
            background:T.blueBg,color:T.blue,border:`1px solid ${T.blue}`,
            fontFamily:font.mono,fontWeight:700}}>
            {eq.orifice||"?"}
          </span>
          <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,
            background:T.bg,color:T.sub,border:`1px solid ${T.border}`,
            fontFamily:font.mono}}>
            {eq.deviceType==="safetyValve"?"S.V":"R.D"}
          </span>
        </div>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:ds?6:0}}>
        {[
          ["SET",  `${eq.setPressure}b`],
          ["OP",   `${eq.overpressure}%`],
          ["MAWP", `${eq.mawp}b`],
          ["IN/OUT",`${eq.inletSize}/${eq.outletSize}`],
        ].map(([k,v])=>(
          <div key={k} style={{background:T.bg,borderRadius:6,
            padding:"3px 8px",flex:1,textAlign:"center"}}>
            <div style={{fontSize:8,color:T.gray,fontFamily:font.mono}}>{k}</div>
            <div style={{fontSize:11,fontWeight:700,color:T.navyLight,
              fontFamily:font.mono}}>{v}</div>
          </div>
        ))}
      </div>

      {ds && (
        <div style={{background:T.blueBg,borderRadius:8,padding:"5px 10px",
          fontSize:10,color:T.navyLight,fontFamily:font.mono,display:"flex",
          alignItems:"center",justifyContent:"space-between"}}>
          <span>⟶ {ds.name}</span>
          <span>{ds.destination==="flare"?"플레어":ds.destination==="atm"?"대기":"밀폐"} · L={ds.L}m · Ø{Math.round(ds.D*1000)}mm</span>
        </div>
      )}

      <div style={{marginTop:8,display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>onViewHistory(eq)}
          style={{padding:"5px 12px",background:T.white,color:T.sub,
            border:`1px solid ${T.border}`,borderRadius:8,
            fontSize:10,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          이력 보기
        </button>
        <button onClick={()=>onEdit(eq)}
          style={{padding:"5px 12px",background:T.bg,color:T.navyLight,
            border:`1px solid ${T.navyLight}`,borderRadius:8,
            fontSize:10,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          설비 개정 (MOC) →
        </button>
        <button onClick={()=>onSelect(eq)}
          style={{padding:"5px 12px",background:T.navyLight,color:T.white,
            border:"none",borderRadius:8,
            fontSize:10,fontWeight:700,fontFamily:font.mono,cursor:"pointer"}}>
          이 설비로 검토 시작 →
        </button>
      </div>
    </div>
  );
}

// ── AssetMaster ───────────────────────────────────────────────
function AssetMaster({ equipments, dischargeSystems,
                       equipmentHistory, dischargeHistory, allSnapshots,
                       onSelectEquipment,
                       onAddEquipment, onReviseEquipment,
                       onAddDischargeSystem,
                       onReviseDischargeSystem, onBack }) {
  const [tab,      setTab]      = useState("equipment"); // equipment | discharge
  const [showEqForm, setShowEqForm] = useState(false);
  const [showDsForm, setShowDsForm] = useState(false);
  const [editingEq,  setEditingEq]  = useState(null); // 개정 대상 Equipment
  const [editingDs,  setEditingDs]  = useState(null); // 개정 대상 DischargeSystem
  const [viewingEqHistory, setViewingEqHistory] = useState(null); // B1: 이력 조회 대상 Equipment id
  const [viewingDsHistory, setViewingDsHistory] = useState(null); // B1: 이력 조회 대상 DischargeSystem id

  // Equipment에 매칭되는 DischargeSystem 찾기
  const findDs = (eq) => dischargeSystems.find(
    ds => ds.connectedTags.includes(eq.tag)
  ) || null;

  const Tab = ({id, label}) => (
    <button onClick={()=>setTab(id)}
      style={{flex:1,padding:"9px",border:"none",borderRadius:9,cursor:"pointer",
        fontSize:12,fontWeight:700,fontFamily:font.mono,
        background:tab===id?T.navyLight:T.bg,
        color:tab===id?T.white:T.sub,
        boxShadow:tab===id?`0 3px 0 ${T.navy}`:"0 2px 0 #ccc"}}>
      {label}
    </button>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <button onClick={onBack}
          style={{padding:"8px 12px",background:T.bg,border:`1px solid ${T.border}`,
            borderRadius:9,fontSize:13,fontWeight:700,color:T.sub,
            fontFamily:font.mono,cursor:"pointer"}}>←</button>
        <div>
          <div style={{fontSize:16,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
            설비대장
          </div>
          <div style={{fontSize:10,color:T.sub,fontFamily:font.sans}}>
            PSV 설비 선택 → 검토 시작
          </div>
        </div>
      </div>

      {/* 탭 */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        <Tab id="equipment" label={`🔧 설비 (${equipments.length})`}/>
        <Tab id="discharge" label={`⟶ 배출계통 (${dischargeSystems.length})`}/>
      </div>

      {/* Equipment 탭 */}
      {tab === "equipment" && (
        <>
          {!showEqForm && !editingEq && equipments.length > 0 && (
            <div style={{background:T.blueBg,border:`1px solid ${T.blue}`,borderRadius:10,
              padding:"10px 14px",marginBottom:12,fontSize:12,color:T.navyLight,
              fontFamily:font.sans,fontWeight:600}}>
              ↓ 아래 설비 카드에서 <b>"이 설비로 검토 시작"</b>을 누르면 그 설비 사양이 자동으로
              채워진 검토 화면으로 넘어갑니다.
            </div>
          )}
          {showEqForm && (
            <div style={{marginBottom:12}}>
              <EquipmentForm
                onSave={eq=>{ onAddEquipment(eq); setShowEqForm(false); }}
                onCancel={()=>setShowEqForm(false)}/>
            </div>
          )}
          {editingEq && (
            <div style={{marginBottom:12}}>
              <EquipmentForm
                editing={editingEq}
                onSave={eq=>{ onReviseEquipment(eq); setEditingEq(null); }}
                onCancel={()=>setEditingEq(null)}/>
            </div>
          )}
          {viewingEqHistory && (
            <RevisionHistoryPanel
              title={viewingEqHistory}
              history={equipmentHistory}
              id={viewingEqHistory}
              kind="equipment"
              allSnapshots={allSnapshots}
              onClose={()=>setViewingEqHistory(null)}/>
          )}
          {equipments.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:T.gray}}>
              <div style={{fontSize:36,marginBottom:8}}>🔧</div>
              <div style={{fontSize:13,color:T.sub}}>등록된 설비가 없습니다</div>
            </div>
          ) : (
            equipments.map(eq => (
              <EquipmentCard key={eq.id} eq={eq} dischargeSystem={findDs(eq)}
                onSelect={onSelectEquipment} onEdit={setEditingEq}
                onViewHistory={(e)=>setViewingEqHistory(e.id)}/>
            ))
          )}
          {!showEqForm && !editingEq && (
            <button onClick={()=>setShowEqForm(true)}
              style={{width:"100%",padding:"10px",background:"transparent",color:T.sub,
                border:`1px dashed ${T.border}`,borderRadius:12,fontSize:12,fontWeight:700,
                fontFamily:font.sans,cursor:"pointer",marginTop:equipments.length?12:0}}>
              + 새 설비 등록 (목록에 없는 신규 설비만)
            </button>
          )}
        </>
      )}

      {/* DischargeSystem 탭 */}
      {tab === "discharge" && (
        <>
          {!showDsForm && !editingDs && (
            <button onClick={()=>setShowDsForm(true)}
              style={{width:"100%",padding:"12px",background:T.navyLight,color:T.white,
                border:"none",borderRadius:12,fontSize:13,fontWeight:900,
                fontFamily:font.sans,cursor:"pointer",boxShadow:`0 4px 0 ${T.navy}`,
                marginBottom:12}}>
              + 배출계통 등록
            </button>
          )}
          {showDsForm && (
            <div style={{marginBottom:12}}>
              <DischargeSystemForm
                onSave={ds=>{ onAddDischargeSystem(ds); setShowDsForm(false); }}
                onCancel={()=>setShowDsForm(false)}/>
            </div>
          )}
          {editingDs && (
            <div style={{marginBottom:12}}>
              <DischargeSystemForm
                editing={editingDs}
                onSave={ds=>{ onReviseDischargeSystem(ds); setEditingDs(null); }}
                onCancel={()=>setEditingDs(null)}/>
            </div>
          )}
          {viewingDsHistory && (
            <RevisionHistoryPanel
              title={viewingDsHistory}
              history={dischargeHistory}
              id={viewingDsHistory}
              kind="discharge"
              allSnapshots={allSnapshots}
              onClose={()=>setViewingDsHistory(null)}/>
          )}
          {dischargeSystems.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:T.gray}}>
              <div style={{fontSize:36,marginBottom:8}}>⟶</div>
              <div style={{fontSize:13,color:T.sub}}>등록된 배출계통이 없습니다</div>
            </div>
          ) : (
            dischargeSystems.map(ds => (
              <div key={ds.id}
                style={{background:T.cardBg,borderRadius:14,padding:"13px 15px",
                  marginBottom:10,border:`1.5px solid ${T.border}`}}>
                <div style={{display:"flex",alignItems:"center",
                  justifyContent:"space-between",marginBottom:6}}>
                  <div style={{fontSize:14,fontWeight:900,color:T.navy,fontFamily:font.mono}}>
                    {ds.name}
                    <span style={{marginLeft:6,fontSize:9,fontWeight:700,color:T.sub}}>
                      Rev.{ds.revision}
                    </span>
                  </div>
                  <span style={{fontSize:10,padding:"3px 9px",borderRadius:10,
                    background:T.blueBg,color:T.blue,border:`1px solid ${T.blue}`,
                    fontFamily:font.mono,fontWeight:700}}>
                    {DESTINATION_LABEL[ds.destination]}
                  </span>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {[
                    ["L", `${ds.L}m`],
                    ["D", `Ø${Math.round(ds.D*1000)}mm`],
                    ["ΣK", ds.fittingsK],
                    ["P_hdr", `${ds.headerPressure}b`],
                  ].map(([k,v])=>(
                    <div key={k} style={{background:T.bg,borderRadius:6,
                      padding:"3px 8px",flex:1,textAlign:"center"}}>
                      <div style={{fontSize:8,color:T.gray,fontFamily:font.mono}}>{k}</div>
                      <div style={{fontSize:11,fontWeight:700,color:T.navyLight,
                        fontFamily:font.mono}}>{v}</div>
                    </div>
                  ))}
                </div>
                {ds.connectedTags.length > 0 && (

// ── components/ReportView.jsx ──────────────────────────
//  REPORT VIEW — Snapshot projection
// ════════════════════════════════════════════════════════════════
function ReportView({ snap, approvals, caseSnapshotHistory, onWorkflowAdvance, onApprovalSubmit }) {
  const [simMode, setSimMode] = useState("IDLE");
  const [sim, setSim] = useState({pressure:2.0,direction:1,valveOpen:false,ratio:0});
  const [hist, setHist] = useState([2.0]);
  const [reportTab, setReportTab] = useState("checklist");
  const simRef = useRef(null);

  // 서명 검증은 여기서 1회만 계산 — ApprovalHistory와 AuditEvidence가 결과 공유
  // (두 곳에서 각자 verifyApprovalRecord를 부르면 중복 호출)
  const [verifiedResults, setVerifiedResults] = useState({});
  useEffect(() => {
    let cancelled = false;
    const caseObj = { snapshotHistory: caseSnapshotHistory || [] };
    (async () => {
      const entries = {};
      for (const rec of (approvals || [])) {
        entries[rec.approvalId] = await verifyApprovalRecord(rec, caseObj, approvals);
      }
      if (!cancelled) setVerifiedResults(entries);
    })();
    return () => { cancelled = true; };
  }, [approvals, caseSnapshotHistory]);

  const setPoint = snap.inputs.P1;
  const mawp     = snap.inputs.mawp;

  useEffect(() => {
    if (simMode !== "RUNNING") { clearInterval(simRef.current); return; }
    simRef.current = setInterval(() => {
      setSim(prev => {
        const next = stepSim(prev, setPoint, mawp);
        setHist(h => [...h.slice(-API_CONST.HISTORY_SIZE), next.pressure]);
        return next;
      });
    }, 50);
    return () => clearInterval(simRef.current);
  }, [simMode, setPoint, mawp]);

  const resetSim = () => {
    setSimMode("IDLE");
    setSim({pressure:1.0,direction:1,valveOpen:false,ratio:0});
    setHist([1.0]);
  };

  const r = snap.result;
  // INLET-LOSS-001: allOK를 checklist.every(Boolean)로 직접 계산하지 않는다.
  // dataGaps(예: inletPiping 미등록)가 있으면 개별 항목이 전부 true여도
  // "적정"이 아니다 — Engine의 computeAdequacyVerdict() 단일 출처를 그대로
  // 쓴다. 구버전 Snapshot(verdict 필드 없음) 호환을 위해 폴백만 유지한다.
  const verdict = r.verdict || (r.checklist && Object.values(r.checklist).every(Boolean) ? "GO" : "NO_GO");
  const allOK = verdict === "GO";
  const insufficientInput = verdict === "INSUFFICIENT_INPUT";
  const failCount = r.checklist ? Object.values(r.checklist).filter(v=>!v).length : 0;
  const nextStates = WF_TRANSITIONS[snap.workflow] || [];

  // PDF 리포트 — AuditEvidence와 동일한 ReportPackage 사용 (계산 재실행 없음, 표시된 Snapshot과 동일 identity)
  const pkg = buildReportPackage(snap, {
    approvalRecords: approvals,
    approvalVerificationResults: verifiedResults,
  });
  const pkgValid = validateReportPackage(pkg);
  const pkgIdentityMatch = pkg.identity?.snapshotHash === snap.snapshotHash;

  // Pro 게이트(2026-08-14) — AUTH_INTEGRATION_STANDARD.md 6항("Engine 격리
  // 원칙")에 따라 plan 체크는 이 컴포넌트(UI/Adapter 레이어)에서만 수행하고,
  // renderPDF()/buildReportPackage() 등 Engine/Snapshot/Report 레이어에는
  // plan을 절대 넘기지 않는다 — renderPDF(pkg) 호출 자체는 기존과 완전히
  // 동일, 그 앞에 게이트만 하나 얹은 것.
  const [showUpgradeModal, setShowUpgradeModal] = useState(false);
  const [upgradeStatus, setUpgradeStatus] = useState("");
  const handleExportPDF = async () => {
    let plan = "free";
    try {
      const res = await fetch("https://policy.archsafe.co.kr/policy/me", { credentials: "include" });
      if (res.ok) {
        const data = await res.json();
        plan = data?.billing?.plan || "free";
      }

      // 정책 조회 실패 시 Free로 안전하게 취급 — Pro를 오인 부여하는 쪽이
      // Free를 오인 거부하는 쪽보다 위험하므로 fail-closed.
    }
    if (plan !== "pro") { setShowUpgradeModal(true); return; }

  const requestUpgrade = async () => {

      setUpgradeStatus("Pro 전환 신청이 접수되었습니다. 확인 후 안내드릴게요.");

    }

  const TAB = (id, label) => (

      {label}

    <div>
      {/* Snapshot 헤더 */}
      <div style={{background:T.cardBg,borderRadius:14,padding:"14px 16px",marginBottom:12,border:`1.5px solid ${T.border}`,boxShadow:"0 2px 8px #0001"}}>

              {snap.deviceType === "safetyValve" ? "안전밸브" : "럽처디스크"} · API 520/526 계산
            </div>
            <div style={{fontSize:10,color:T.gray,fontFamily:font.mono,marginTop:4}}>{snap.createdAt.slice(0,19).replace("T"," ")} · {snap.id}</div>
